<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HED · Story Reader</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reader-auth.js"></script>

<style>

/* =========================================================
   HED READER
========================================================= */

:root{
    --brown:#4a352b;
    --brown-dark:#382920;
    --cream:#f5efe6;
    --paper:#fbf8f3;
    --green:#68745d;
    --pink:#c58f91;
    --pink-dark:#a87578;
    --text:#342b26;
    --muted:#8b8178;
    --line:#ddd2c5;
    --soft:#eee6dc;
    --white:#ffffff;
    --shadow:0 12px 35px rgba(74,53,43,.08);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--cream);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{
    position:sticky;
    top:0;
    z-index:50;

    background:rgba(251,248,243,.96);
    border-bottom:1px solid var(--line);

    backdrop-filter:blur(8px);
}

.header-inner{
    max-width:1120px;
    min-height:64px;

    margin:0 auto;
    padding:11px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    color:var(--brown);
    text-decoration:none;

    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    font-weight:700;
    letter-spacing:.02em;
}

.brand span{
    color:var(--pink);
}

.back-link{
    color:var(--green);
    text-decoration:none;
    font-size:12px;
}

.back-link:hover{
    color:var(--pink-dark);
}


/* =========================================================
   PAGE
========================================================= */

.book-page{
    max-width:1120px;

    margin:0 auto;
    padding:42px 28px 70px;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.page-message{
    max-width:700px;

    margin:100px auto;

    text-align:center;
    color:var(--muted);
}

.page-message h2{
    margin:0 0 8px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
}

.page-message p{
    margin:0;
    line-height:1.6;
}


/* =========================================================
   STORY INTRO
========================================================= */

.book-intro{
    display:grid;
    grid-template-columns:210px minmax(0,1fr);
    gap:34px;
    align-items:start;

    margin-bottom:34px;
}

.cover-wrap{
    width:210px;
    aspect-ratio:2 / 3;

    overflow:hidden;

    border:1px solid var(--line);
    background:var(--soft);

    box-shadow:var(--shadow);
}

.cover-wrap img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

.cover-placeholder{
    width:100%;
    height:100%;

    display:grid;
    place-items:center;

    padding:25px;

    color:var(--brown);

    text-align:center;

    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    line-height:1.35;
}

.book-info{
    min-width:0;
    padding-top:4px;
}

.eyebrow{
    color:var(--pink-dark);

    font-size:9px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
}

.book-info h1{
    margin:7px 0 7px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(34px,5vw,56px);
    line-height:1.04;
}

.book-author{
    margin-bottom:17px;

    color:var(--muted);

    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
}

.book-description{
    max-width:720px;

    margin:0;

    color:#665c54;

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    line-height:1.65;
}

.book-meta{
    display:flex;
    flex-wrap:wrap;
    margin-top:16px;
}

.meta-pill{
    padding:6px 9px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--muted);

    font-size:9px;
    letter-spacing:.06em;
}


/* =========================================================
   READER
========================================================= */

.reader-shell{
    display:none;

    padding-top:18px;

    border-top:1px solid var(--line);
}

.reader-shell.open{
    display:block;
}


/* =========================================================
   READER BUTTONS
========================================================= */

.reader-controls{
    max-width:1120px;

    margin:0 auto 13px;

    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:7px;
}

.reader-control-button{
    padding:8px 12px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    font-size:11px;

    transition:.15s ease;
}

.reader-control-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.reader-position{
    margin-left:auto;
}


/* =========================================================
   READER LAYOUT
========================================================= */

.reader-layout{
    max-width:1120px;

    margin:0 auto;

    display:grid;
    grid-template-columns:235px minmax(0,1fr);

    gap:15px;
    align-items:start;
}

.reader-layout.chapter-closed{
    grid-template-columns:minmax(0,1fr);
}


/* =========================================================
   CHAPTER DRAWER
   CLOSED BY DEFAULT
========================================================= */

.chapter-drawer{
    position:sticky;
    top:82px;

    max-height:calc(100vh - 105px);

    overflow-y:auto;

    padding:13px;

    border:1px solid var(--line);

    background:rgba(251,248,243,.97);
}

.chapter-drawer:not(.open){
    display:none;
}

.chapter-drawer-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:10px;

    padding-bottom:9px;
    margin-bottom:7px;

    border-bottom:1px solid var(--line);
}

.chapter-drawer h2{
    margin:3px 0 0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
}

.drawer-close{
    width:28px;
    height:28px;

    padding:0;

    border:0;
    background:transparent;

    color:var(--muted);

    font-size:20px;
    line-height:1;
}

.drawer-close:hover{
    color:var(--pink);
}

.chapter-list{
    display:grid;
    gap:4px;
}

.chapter-button{
    width:100%;

    padding:10px 9px;

    display:flex;
    align-items:center;
    gap:10px;

    border:1px solid transparent;
    background:transparent;

    color:var(--text);

    text-align:left;
}

.chapter-button:hover{
    background:var(--soft);
    border-color:var(--line);
}

.chapter-button.active{
    background:#eee5dc;
    border-color:var(--line);
}

.chapter-number{
    min-width:28px;

    color:var(--pink-dark);

    font-size:9px;
    letter-spacing:.1em;
}

.chapter-title-small{
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    line-height:1.35;
}


/* =========================================================
   READER COLUMN
========================================================= */

.reader-column{
    min-width:0;
}


/* =========================================================
   READING PREFERENCES
   CLOSED BY DEFAULT
========================================================= */

.preferences{
    display:none;

    margin-bottom:11px;
    padding:12px 13px;

    border:1px solid var(--line);
    background:rgba(251,248,243,.97);
}

.preferences.open{
    display:block;
}

.preferences-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:9px;
}

.preferences-title{
    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
}

.preferences-grid{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 13px;
}

.preference-group{
    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:6px;

    min-height:30px;
}

.preference-label{
    color:var(--muted);

    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;

    white-space:nowrap;
}

.pref-select{
    padding:6px 8px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-size:11px;
}

.pref-select:focus{
    outline:none;
    border-color:var(--pink);
}

.pref-size-wrap{
    display:flex;
    align-items:center;
    gap:6px;
}

.pref-range{
    width:120px;

    accent-color:var(--pink);

    cursor:pointer;
}

.pref-size-value{
    min-width:38px;

    color:var(--brown);

    font-size:10px;
    text-align:right;
}

.pref-button{
    min-width:30px;
    height:30px;

    padding:0 7px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-size:11px;
}

.pref-button.active,
.pref-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}


/* =========================================================
   THEMES
========================================================= */

.theme-buttons,
.highlight-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.theme-button{
    min-width:30px;
    height:30px;

    padding:0 8px;

    border:1px solid var(--line);

    font-size:10px;
    font-weight:700;
}

.theme-cream{
    background:#fbf8f3;
    color:#342b26;
}

.theme-white{
    background:#fff;
    color:#111;
}

.theme-black{
    background:#000;
    color:#fff;
    border-color:#000;
}

.theme-dark{
    background:#20211f;
    color:#fff;
    border-color:#20211f;
}

.theme-sepia{
    background:#f1e4c9;
    color:#574936;
}

.theme-blue{
    background:#111827;
    color:#f8fafc;
    border-color:#111827;
}

.theme-button.active{
    outline:2px solid var(--pink);
    outline-offset:1px;
}


/* =========================================================
   READER PAPER
========================================================= */

.reader-paper{
    min-height:500px;

    padding:clamp(25px,5vw,58px);

    border:1px solid var(--line);

    background:var(--paper);

    box-shadow:var(--shadow);

    transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
}

.reader-paper.theme-black,
.reader-paper.theme-dark,
.reader-paper.theme-blue{
    border-color:#333;
}

.reader-story{
    --reader-font:Georgia,"Times New Roman",serif;
    --reader-line-height:1.65;

    max-width:760px;

    margin:0 auto;

    color:#342b26;

    font-family:var(--reader-font);
    font-size:15px;
    line-height:var(--reader-line-height);

    transition:
        color .2s ease,
        font-size .15s ease,
        line-height .15s ease;
}

.reader-story h1,
.reader-story h2,
.reader-story h3{
    color:inherit;

    font-family:var(--reader-font);

    line-height:1.2;
}

.reader-story h1{
    margin:0 0 28px;

    font-size:clamp(28px,4vw,40px);

    text-align:center;
}

.reader-story h2{
    margin:38px 0 14px;

    font-size:25px;
}

.reader-story h3{
    margin:30px 0 12px;

    font-size:20px;
}

.reader-story p{
    margin:0 0 1.15em;

    color:inherit;

    font-family:var(--reader-font);
    font-size:inherit;
    line-height:inherit;
}

.reader-story img{
    display:block;

    max-width:100%;
    height:auto;

    margin:24px auto;

    border:1px solid var(--line);
}

.reader-story blockquote{
    margin:25px 0;
    padding:14px 20px;

    border-left:3px solid var(--pink);

    color:inherit;

    font-style:italic;
}

.reader-story ul,
.reader-story ol{
    margin:0 0 1.15em;
    padding-left:25px;
}

.reader-story li{
    margin-bottom:.45em;
}

.reader-story a{
    color:var(--pink-dark);
}

.reader-story hr{
    margin:35px 0;

    border:0;
    border-top:1px solid var(--line);
}

.reader-story .highlight{
    border-radius:3px;
    padding:0 2px;
}

.highlight-yellow-mark{
    background:#f4e3a1;
}

.highlight-pink-mark{
    background:#e8b8bc;
}

.highlight-green-mark{
    background:#cbd8bd;
}

.highlight-blue-mark{
    background:#bfd3e8;
}


/* =========================================================
   COMMENTS
========================================================= */

.comments{
    max-width:760px;

    margin:30px auto 0;
}

.comments-title{
    margin:0 0 13px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
}

.comment-form{
    display:grid;
    gap:8px;

    margin-bottom:20px;
}

.comment-input,
.comment-textarea{
    width:100%;

    padding:10px 11px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    outline:none;
}

.comment-input:focus,
.comment-textarea:focus{
    border-color:var(--pink);
}

.comment-textarea{
    min-height:90px;

    resize:vertical;
}

.comment-submit{
    justify-self:start;

    padding:9px 14px;

    border:1px solid var(--brown);
    background:var(--brown);

    color:white;

    font-size:11px;
}

.comment-submit:hover{
    background:var(--brown-dark);
}

.comment-status{
    min-height:16px;

    color:var(--muted);

    font-size:10px;
}

.comment-list{
    display:grid;
    gap:10px;
}

.comment-card{
    padding:12px 13px;

    border:1px solid var(--line);
    background:var(--paper);
}

.comment-name{
    margin-bottom:4px;

    color:var(--brown);

    font-weight:700;
    font-size:12px;
}

.comment-date{
    margin-bottom:7px;

    color:var(--muted);

    font-size:9px;
}

.comment-content{
    color:#665c54;

    font-size:12px;
    line-height:1.6;
}


/* =========================================================
   SELECTION HIGHLIGHT MENU
========================================================= */

.selection-highlight-menu{
    position:fixed;

    z-index:100;

    display:none;

    align-items:center;

    gap:4px;

    padding:5px;

    border:1px solid var(--line);
    background:var(--paper);

    box-shadow:0 8px 25px rgba(74,53,43,.15);
}

.selection-highlight-menu.open{
    display:flex;
}

.selection-highlight-menu button{
    width:26px;
    height:26px;

    padding:0;

    border:1px solid var(--line);
}

.selection-highlight-menu button:hover{
    transform:translateY(-1px);
}

.highlight-menu-yellow{
    background:#f4e3a1;
}

.highlight-menu-pink{
    background:#e8b8bc;
}

.highlight-menu-green{
    background:#cbd8bd;
}

.highlight-menu-blue{
    background:#bfd3e8;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .header-inner{
        padding-left:18px;
        padding-right:18px;
    }

    .book-page{
        padding-left:18px;
        padding-right:18px;
    }

    .book-intro{
        grid-template-columns:130px minmax(0,1fr);
        gap:20px;
    }

    .cover-wrap{
        width:130px;
    }

    .reader-layout{
        grid-template-columns:minmax(0,1fr);
    }

    .chapter-drawer{
        position:relative;
        top:auto;

        max-height:none;
    }

    .reader-paper{
        padding:25px 20px;
    }

}

@media(max-width:560px){

    .book-intro{
        grid-template-columns:1fr;
    }

    .cover-wrap{
        width:150px;
    }

    .reader-controls{
        align-items:stretch;
    }

    .reader-position{
        width:100%;
        margin-left:0;
    }

    .preferences-grid{
        display:grid;
        grid-template-columns:1fr;
    }

    .preference-group{
        align-items:flex-start;
    }

}


/* =========================================================
   EMPTY / STATUS
========================================================= */

.empty-message{
    padding:30px 10px;

    color:var(--muted);

    text-align:center;

    font-size:12px;
}

.chapter-loading{
    padding:20px 0;

    color:var(--muted);

    font-size:12px;
}


/* =========================================================
   MOBILE DRAWER
========================================================= */

@media(max-width:800px){

    .reader-layout.chapter-open{
        grid-template-columns:1fr;
    }

    .chapter-drawer.open{
        display:block;
    }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

    .site-header,
    .reader-controls,
    .preferences,
    .chapter-drawer,
    .comments,
    .selection-highlight-menu{
        display:none !important;
    }

    .book-page{
        max-width:none;
        padding:0;
    }

    .book-intro{
        margin-bottom:20px;
    }

    .reader-shell{
        border:0;
    }

    .reader-paper{
        border:0;
        box-shadow:none;
        padding:0;
    }

}


/* =========================================================
   EXTRA READER STYLES
========================================================= */

.reader-top-line{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:15px;
}

.reader-chapter-label{
    color:var(--pink-dark);

    font-size:9px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
}

.reader-chapter-title{
    margin:3px 0 0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:24px;
}

.reader-nav{
    display:flex;
    gap:6px;
}

.reader-nav button{
    padding:7px 10px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    font-size:10px;
}

.reader-nav button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.reader-footer-nav{
    display:flex;
    justify-content:space-between;

    gap:10px;

    margin-top:30px;
    padding-top:17px;

    border-top:1px solid var(--line);
}

.reader-footer-nav button{
    max-width:48%;

    padding:9px 12px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    text-align:left;
}

.reader-footer-nav button:hover{
    border-color:var(--pink);
}

.reader-footer-nav .next{
    margin-left:auto;
    text-align:right;
}

</style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a
            href="index.html"
            class="brand"
        >
            HED<span>.</span>
        </a>

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to HED
        </a>

    </div>
</header>


<main class="book-page">

    <section
        id="loadingMessage"
        class="page-message"
    >
        <h2>Opening story…</h2>
        <p>Please wait while the story loads.</p>
    </section>


    <section
        id="errorMessage"
        class="page-message hidden"
    >
        <h2>Story unavailable</h2>
        <p id="errorText"></p>
    </section>


    <section
        id="bookContent"
        class="hidden"
    >

        <div class="book-intro">

            <div class="cover-wrap">

                <img
                    id="bookCover"
                    class="hidden"
                    alt=""
                >

                <div
                    id="coverPlaceholder"
                    class="cover-placeholder"
                >
                    Story
                </div>

            </div>


            <div class="book-info">

                <div
                    id="bookEyebrow"
                    class="eyebrow"
                >
                    STORY
                </div>

                <h1 id="bookTitle">Untitled Story</h1>

                <div
                    id="bookAuthor"
                    class="book-author"
                ></div>

                <p
                    id="bookDescription"
                    class="book-description"
                ></p>

                <div
                    id="bookMeta"
                    class="book-meta"
                ></div>

            </div>

        </div>


        <section
            id="readerShell"
            class="reader-shell"
        >

            <div class="reader-controls">

                <button
                    id="chapterToggle"
                    class="reader-control-button"
                    type="button"
                >
                    ☰ Chapters
                </button>

                <button
                    id="preferencesToggle"
                    class="reader-control-button"
                    type="button"
                >
                    ⚙ Reading Preferences
                </button>

                <button
                    id="previousChapterTop"
                    class="reader-control-button"
                    type="button"
                >
                    ← Previous
                </button>

                <button
                    id="nextChapterTop"
                    class="reader-control-button"
                    type="button"
                >
                    Next →
                </button>

                <div
                    id="readerPosition"
                    class="reader-position"
                ></div>

            </div>


            <div class="reader-layout">

                <aside
                    id="chapterDrawer"
                    class="chapter-drawer"
                >

                    <div class="chapter-drawer-head">

                        <div>

                            <div class="eyebrow">
                                CONTENTS
                            </div>

                            <h2>Chapters</h2>

                        </div>

                        <button
                            id="drawerClose"
                            class="drawer-close"
                            type="button"
                            aria-label="Close chapters"
                        >
                            ×
                        </button>

                    </div>

                    <div
                        id="chapterList"
                        class="chapter-list"
                    ></div>

                </aside>


                <div class="reader-column">

                    <section
                        id="preferences"
                        class="preferences"
                    >

                        <div class="preferences-head">

                            <div class="preferences-title">
                                Reading Preferences
                            </div>

>

        data-highlight="pink"
        aria-label="Pink highlight"
    ></button>

        class="highlight-menu-green"
        data-highlight="green"
        aria-label="Green highlight"

<script>

/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
    window.supabaseClient ||
    window.supabase?.createClient
        ? (
            window.supabaseClient ||
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_ANON_KEY
            )
        )
        : null;


/* =========================================================
   STORY ID
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    urlParams.get("id") ||
    urlParams.get("story") ||
    localStorage.getItem(
        "hed_selected_story_id"
    );


/* =========================================================
   STATE
========================================================= */

let story = null;

let chapters = [];

let selectedChapterIndex = -1;

let savedSelectionRange = null;


/* =========================================================
   READER DEFAULTS
========================================================= */

const defaultReaderPreferences = {

    fontFamily:"serif",

    fontSize:15,

    lineHeight:1.65,

    textColor:"#342b26",

    theme:"cream"

};


/* =========================================================
   LOAD STORY
========================================================= */

async function loadStory(){

    if(!storyId){

        showError(
            "No story was selected. Please return to HED and choose a story."
        );

        return;
    }


    const storyResult =
        await supabaseClient
            .from("stories")
            .select("*")
            .eq("id", storyId)
            .single();


    if(storyResult.error){

        console.error(
            "STORY ERROR:",
            storyResult.error
        );

        showError(
            "We could not load this story."
        );

        return;

    }


    story =
        storyResult.data;


    if(!story){

        showError(
            "This story could not be found."
        );

        return;

    }


    renderStory();


    await loadChapters();

}


/* =========================================================
   RENDER STORY
========================================================= */

function renderStory(){

    $("loadingMessage")
        .classList
        .add("hidden");


    $("bookContent")
        .classList
        .remove("hidden");


    $("readerShell")
        .classList
        .add("open");


    const title =
        story.title ||
        "Untitled Story";


    $("bookTitle")
        .textContent =
            title;


    $("bookEyebrow")
        .textContent =
            story.genre ||
            "STORY";


    $("bookAuthor")
        .textContent =
            story.author_name
                ? "by " + story.author_name
                : "";


    $("bookDescription")
        .textContent =
            story.description ||
            story.synopsis ||
            "";


    const cover =
        story.cover_url ||
        story.cover_image ||
        story.image_url;


    if(cover){

        $("bookCover")
            .src =
                cover;

        $("bookCover")
            .alt =
                title;

        $("bookCover")
            .classList
            .remove("hidden");

        $("coverPlaceholder")
            .classList
            .add("hidden");

    }


    const meta =
        $("bookMeta");


    meta.innerHTML =
        "";


    if(story.genre){

        const pill =
            document.createElement(
                "span"
            );

        pill.className =
            "meta-pill";

        pill.textContent =
            story.genre;

        meta.appendChild(
            pill
        );

    }


    if(story.status){

        const pill =
            document.createElement(
                "span"
            );

        pill.className =
            "meta-pill";

        pill.textContent =
            story.status;

        meta.appendChild(
            pill
        );

    }


    applySavedReaderPreferences();

}


/* =========================================================
   LOAD CHAPTERS
========================================================= */

async function loadChapters(){

    const chapterList =
        $("chapterList");


    chapterList.innerHTML =
        '<div class="chapter-loading">Loading chapters…</div>';


    const result =
        await supabaseClient
            .from("chapters")
            .select("*")
            .eq("story_id", storyId)
            .order("chapter_number", {
                ascending:true
            });


    if(result.error){

        console.error(
            "CHAPTER ERROR:",
            result.error
        );


        chapterList.innerHTML =
            '<div class="empty-message">Could not load chapters.</div>';

        return;

    }


    chapters =
        result.data || [];


    if(!chapters.length){

        chapterList.innerHTML =
            '<div class="empty-message">No chapters yet.</div>';

        return;

    }


    renderChapterList();


    openChapter(
        0
    );

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function renderChapterList(){

    const chapterList =
        $("chapterList");


    chapterList.innerHTML =
        "";


    chapters.forEach(
        function(chapter,index){

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";

            button.className =
                "chapter-button";


            button.innerHTML =
                `
                    <span class="chapter-number">
                        ${escapeHTML(
                            chapter.chapter_number ||
                            index + 1
                        )}
                    </span>

                    <span class="chapter-title-small">
                        ${escapeHTML(
                            chapter.title ||
                            "Untitled Chapter"
                        )}
                    </span>
                `;


            button.addEventListener(
                "click",
                function(){

                    openChapter(
                        index
                    );

                }
            );


            chapterList.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   OPEN CHAPTER
========================================================= */

async function openChapter(index){

    if(
        index < 0 ||
        index >= chapters.length
    ){

        return;

    }


    selectedChapterIndex =
        index;


    const chapter =
        chapters[index];


    $("readerChapterLabel")
        .textContent =
            "CHAPTER " +
            (
                chapter.chapter_number ||
                index + 1
            );


    $("readerChapterTitle")
        .textContent =
            chapter.title ||
            "Untitled Chapter";


    const storyElement =
        $("readerStory");


    storyElement.innerHTML =
        "";


    const content =
        chapter.content ||
        chapter.body ||
        chapter.text ||
        "";


    storyElement.innerHTML =
        content;


    loadHighlights();


    updateChapterButtons();


    updateChapterPosition();


    renderChapterList();


    window.scrollTo({
        top:
            document.querySelector(
                ".reader-paper"
            ).getBoundingClientRect().top +
            window.scrollY -
            90,

        behavior:"smooth"
    });


    await loadComments();

}


/* =========================================================
   CHAPTER BUTTON STATES
========================================================= */

function updateChapterButtons(){

    const first =
        selectedChapterIndex <= 0;


    const last =
        selectedChapterIndex >=
        chapters.length - 1;


    [
        "previousChapterTop",
        "previousChapter",
        "previousChapterBottom"
    ]
    .forEach(
        function(id){

            const button =
                $(id);

            if(button){

                button.disabled =
                    first;

            }

        }
    );


    [
        "nextChapterTop",
        "nextChapter",
        "nextChapterBottom"
    ]
    .forEach(
        function(id){

            const button =
                $(id);

            if(button){

                button.disabled =
                    last;

            }

        }
    );

}


/* =========================================================
   POSITION
========================================================= */

function updateChapterPosition(){

    if(
        selectedChapterIndex < 0
    ){

        $("readerPosition")
            .textContent =
                "";

        return;

    }


    $("readerPosition")
        .textContent =
            (
                selectedChapterIndex + 1
            ) +
            " / " +
            chapters.length;

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function goPreviousChapter(){

    if(
        selectedChapterIndex > 0
    ){

        openChapter(
            selectedChapterIndex - 1
        );

    }

}


function goNextChapter(){

    if(
        selectedChapterIndex <
        chapters.length - 1
    ){

        openChapter(
            selectedChapterIndex + 1
        );

    }

}


$("previousChapterTop")
    .addEventListener(
        "click",
        goPreviousChapter
    );

$("previousChapter")
    .addEventListener(
    "click",
    goPreviousChapter
);

$("previousChapterBottom")
    .addEventListener(
        "click",
        goPreviousChapter
    );


$("nextChapterTop")
    .addEventListener(
        "click",
        goNextChapter
    );

$("nextChapter")
    .addEventListener(
        "click",
        goNextChapter
    );

$("nextChapterBottom")
    .addEventListener(
        "click",
        goNextChapter
    );


/* =========================================================
   DRAWER
========================================================= */

function setDrawerOpen(open){

    const drawer =
        $("chapterDrawer");

    const layout =
        document.querySelector(
            ".reader-layout"
        );


    drawer.classList.toggle(
        "open",
        open
    );


    layout.classList.toggle(
        "chapter-open",
        open
    );


    layout.classList.toggle(
        "chapter-closed",
        !open
    );

}


$("chapterToggle")
    .addEventListener(
        "click",
        function(){

            const drawer =
                $("chapterDrawer");


            setDrawerOpen(
                !drawer.classList.contains(
                    "open"
                )
            );

        }
    );


$("drawerClose")
    .addEventListener(
        "click",
        function(){

            setDrawerOpen(
                false
            );

        }
    );


/* =========================================================
   PREFERENCES DRAWER
========================================================= */

function setPreferencesOpen(open){

    $("preferences")
        .classList
        .toggle(
            "open",
            open
        );

}


$("preferencesToggle")
    .addEventListener(
        "click",
        function(){

            const preferences =
                $("preferences");


            setPreferencesOpen(
                !preferences.classList.contains(
                    "open"
                )
            );

        }
    );


$("preferencesClose")
    .addEventListener(
        "click",
        function(){

            setPreferencesOpen(
                false
            );

        }
    );


/* =========================================================
   READER PREFERENCES
========================================================= */

function getReaderPreferences(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "hed_reader_preferences"
                )
            );


        return {
            ...defaultReaderPreferences,
            ...(saved || {})
        };

    }catch(error){

        return {
            ...defaultReaderPreferences
        };

    }

}


/*
   FIX:
   This function now accepts the preferences object that
   was actually changed instead of reading the old value
   again from localStorage.
*/

function saveReaderPreferences(preferences){

    localStorage.setItem(
        "hed_reader_preferences",
        JSON.stringify(
            preferences
        )
    );

}


function applySavedReaderPreferences(){

    const preferences =
        getReaderPreferences();


    applyFont(
        preferences.fontFamily
    );


    applyFontSize(
        preferences.fontSize
    );


    applyLineHeight(
        preferences.lineHeight
    );


    applyTextColor(
        preferences.textColor
    );


    applyTheme(
        preferences.theme
    );


    $("fontFamily")
        .value =
            preferences.fontFamily;


    $("fontSize")
        .value =
            preferences.fontSize;


    $("fontSizeValue")
        .textContent =
            preferences.fontSize +
            "px";


    updatePreferenceButtons();

}


/* =========================================================
   FONT
========================================================= */

function applyFont(font){

    const fonts = {

        serif:
            'Georgia,"Times New Roman",serif',

        sans:
            'Arial,Helvetica,sans-serif',

        clean:
            '"Trebuchet MS",Arial,sans-serif',

        mono:
            '"Courier New",monospace'

    };


    $("readerStory")
        .style
        .setProperty(
            "--reader-font",
            fonts[font] ||
            fonts.serif
        );

}


$("fontFamily").addEventListener(
    "change",
    function(){

        const preferences =
            getReaderPreferences();


        preferences.fontFamily =
            this.value;


        saveReaderPreferences(
            preferences
        );


        applyFont(
            this.value
        );

    }
);


/* =========================================================
   FONT SIZE
========================================================= */

function applyFontSize(size){

    $("readerStory")
        .style
        .fontSize =
            size + "px";


    $("fontSizeValue")
        .textContent =
            size + "px";

}


$("fontSize").addEventListener(
    "input",
    function(){

        const size =
            Number(this.value);


        const preferences =
            getReaderPreferences();


        preferences.fontSize =
            size;


        saveReaderPreferences(
            preferences
        );


        applyFontSize(
            size
        );

    }
);


/* =========================================================
   LINE HEIGHT
========================================================= */

function applyLineHeight(value){

    const numericValue =
        Number(value);


    $("readerStory")
        .style
        .setProperty(
            "--reader-line-height",
            numericValue
        );


    $("readerStory")
        .style
        .lineHeight =
            numericValue;

}


document
    .querySelectorAll(
        "[data-spacing]"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const value =
                        Number(
                            this.dataset.spacing
                        );


                    const preferences =
                        getReaderPreferences();


                    preferences.lineHeight =
                        value;


                    /*
                       FIX:
                       Save the newly changed
                       preferences instead of
                       saving the old preferences.
                    */
                    saveReaderPreferences(
                        preferences
                    );


                    applyLineHeight(
                        value
                    );


                    updatePreferenceButtons();

                }
            );

        }
    );


/* =========================================================
   TEXT COLOR
========================================================= */

function applyTextColor(color){

    $("readerStory")
        .style
        .color =
            color;


    /*
       Also update the CSS variable so that
       inherited reader text continues using
       the selected color.
    */
    $("readerStory")
        .style
        .setProperty(
            "--reader-text-color",
            color
        );

}


document
    .querySelectorAll(
        "[data-text-color]"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const color =
                        this.dataset.textColor;


                    const preferences =
                        getReaderPreferences();


                    preferences.textColor =
                        color;


                    /*
                       FIX:
                       Save the newly selected
                       text color.
                    */
                    saveReaderPreferences(
                        preferences
                    );


                    applyTextColor(
                        color
                    );


                    updatePreferenceButtons();

                }
            );

        }
    );


/* =========================================================
   PAGE THEMES
========================================================= */

function applyTheme(theme){

    const paper =
        $("readerPaper");


    const story =
        $("readerStory");


    const themes = {

        cream:{
            background:"#fbf8f3",
            color:"#342b26",
            border:"#ddd2c5"
        },

        white:{
            background:"#ffffff",
            color:"#222222",
            border:"#dddddd"
        },

        black:{
            background:"#000000",
            color:"#f5f5f5",
            border:"#333333"
        },

        dark:{
            background:"#20211f",
            color:"#f5f5f5",
            border:"#3b3c39"
        },

        sepia:{
            background:"#f1e4c9",
            color:"#574936",
            border:"#d7c39b"
        },

        blue:{
            background:"#111827",
            color:"#f8fafc",
            border:"#263247"
        }

    };


    const selected =
        themes[theme] ||
        themes.cream;


    paper.style.background =
        selected.background;


    paper.style.borderColor =
        selected.border;


    /*
       Theme controls the default text color,
       but a user-selected text color should be
       reapplied immediately afterward.
    */
    story.style.color =
        selected.color;


    document
        .querySelectorAll(
            "[data-theme]"
        )
        .forEach(
            function(button){

                button.classList.toggle(
                    "active",
                    button.dataset.theme ===
                    theme
                );

            }
        );


    /*
       Preserve the user's selected text color
       instead of allowing a theme change to
       permanently overwrite it.
    */
    const preferences =
        getReaderPreferences();


    if(
        preferences.textColor
    ){

        story.style.color =
            preferences.textColor;

    }

}


document
    .querySelectorAll(
        "[data-theme]"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const theme =
                        this.dataset.theme;


                    const preferences =
                        getReaderPreferences();


                    preferences.theme =
                        theme;


                    saveReaderPreferences(
                        preferences
                    );


                    applyTheme(
                        theme
                    );

                }
            );

        }
    );


/* =========================================================
   PREFERENCE BUTTON STATES
========================================================= */

function updatePreferenceButtons(){

    const preferences =
        getReaderPreferences();


    document
        .querySelectorAll(
            "[data-spacing]"
        )
        .forEach(
            function(button){

                button.classList.toggle(
                    "active",
                    Number(
                        button.dataset.spacing
                    ) ===
                    Number(
                        preferences.lineHeight
                    )
                );

            }
        );


    document
        .querySelectorAll(
            "[data-text-color]"
        )
        .forEach(
            function(button){

                button.classList.toggle(
                    "active",
                    button.dataset.textColor ===
                    preferences.textColor
                );

            }
        );


    document
        .querySelectorAll(
            "[data-theme]"
        )
        .forEach(
            function(button){

                button.classList.toggle(
                    "active",
                    button.dataset.theme ===
                    preferences.theme
                );

            }
        );

}


/* =========================================================
   COMMENTS
========================================================= */

async function loadComments(){

    const list =
        $("commentList");


    if(
        selectedChapterIndex < 0
    ){

        list.innerHTML =
            "";

        return;

    }


    const chapter =
        chapters[
            selectedChapterIndex
        ];


    if(
        !chapter ||
        !chapter.id
    ){

        return;

    }


    list.innerHTML =
        '<div class="empty-message">Loading comments…</div>';


    const result =
        await supabaseClient
            .from("comments")
            .select("*")
            .eq(
                "target_type",
                "chapter"
            )
            .eq(
                "target_id",
                chapter.id
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(result.error){

        console.error(
            "COMMENTS ERROR:",
            result.error
        );


        list.innerHTML =
            '<div class="empty-message">Could not load comments.</div>';

        return;

    }


    const comments =
        result.data || [];


    if(!comments.length){

        list.innerHTML =
            '<div class="empty-message">No comments yet.</div>';

        return;

    }


    list.innerHTML =
        "";


    comments.forEach(
        function(comment){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "comment-card";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "comment-name";

            name.textContent =
                comment.name ||
                "Anonymous";


            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "comment-date";


            if(comment.created_at){

                const dateValue =
                    new Date(
                        comment.created_at
                    );


                date.textContent =
                    dateValue.toLocaleString();

            }


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "comment-content";

            content.textContent =
                comment.content ||
                "";


            card.appendChild(
                name
            );

            card.appendChild(
                date
            );

            card.appendChild(
                content
            );


            list.appendChild(
                card
            );

        }
    );

}


$("commentForm").addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const status =
            $("commentStatus");

        const name =
            $("commentName")
                .value
                .trim();

        const content =
            $("commentContent")
                .value
                .trim();


        if(!name){

            status.textContent =
                "Your nickname is missing.";

            return;

        }


        if(!content){

            status.textContent =
                "Please write a comment.";

            return;

        }


        if(selectedChapterIndex < 0){

            status.textContent =
                "No chapter is selected.";

            return;

        }


        const chapter =
            chapters[
                selectedChapterIndex
            ];


        if(!chapter || !chapter.id){

            status.textContent =
                "The chapter could not be found.";

            return;

        }


        status.textContent =
            "Posting…";


        try{

            const result =
                await supabaseClient
                    .from("comments")
                    .insert({

                        target_type:
                            "chapter",

                        target_id:
                            chapter.id,

                        name:
                            name,

                        content:
                            content

                    });


            if(result.error){

                console.error(
                    "COMMENT ERROR:",
                    result.error
                );

                status.textContent =
                    "Could not post: " +
                    result.error.message;

                return;

            }


            $("commentContent")
                .value =
                    "";


            $("commentName")
                .value =
                    window.readerNickname ||
                    name;


            status.textContent =
                "Comment posted.";


            await loadComments();


        }catch(error){

            console.error(
                "COMMENT ERROR:",
                error
            );


            status.textContent =
                "Could not post: " +
                (
                    error.message ||
                    "Unknown error"
                );

        }

    }
);


/* =========================================================
   TEXT SELECTION / HIGHLIGHTING
========================================================= */

function selectionIsInsideReader(range){

    if(!range){

        return false;

    }


    return $("readerStory")
        .contains(
            range.commonAncestorContainer
        );

}


function hideSelectionHighlightMenu(){

    $("selectionHighlightMenu")
        .classList
        .remove("open");

}


function showSelectionHighlightMenu(){

    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0 ||
        selection.isCollapsed
    ){

        hideSelectionHighlightMenu();

        return;

    }


    const range =
        selection.getRangeAt(0);


    if(
        !selectionIsInsideReader(range)
    ){

        hideSelectionHighlightMenu();

        return;

    }


    savedSelectionRange =
        range.cloneRange();


    const rect =
        range.getBoundingClientRect();


    const menu =
        $("selectionHighlightMenu");


    menu.classList.add("open");


    const menuWidth =
        menu.offsetWidth || 250;


    const menuHeight =
        menu.offsetHeight || 40;


    const gap = 8;


    let left =
        rect.left +
        rect.width / 2 -
        menuWidth / 2;


    let top =
        rect.top -
        menuHeight -
        gap;


    left =
        Math.max(
            8,
            Math.min(
                left,
                window.innerWidth -
                menuWidth -
                8
            )
        );


    if(top < 8){

        top =
            Math.min(
                window.innerHeight -
                menuHeight -
                8,

                rect.bottom +
                gap
            );

    }


    menu.style.left =
        left + "px";


    menu.style.top =
        top + "px";

}


document.addEventListener(
    "selectionchange",
    function(){

        clearTimeout(
            window.hedSelectionTimer
        );


        window.hedSelectionTimer =
            setTimeout(
                showSelectionHighlightMenu,
                60
            );

    }
);


document.addEventListener(
    "scroll",
    function(){

        const menu =
            $("selectionHighlightMenu");


        if(
            menu.classList.contains(
                "open"
            )
        ){

            showSelectionHighlightMenu();

        }

    },
    true
);


document.addEventListener(
    "mousedown",
    function(event){

        const menu =
            $("selectionHighlightMenu");


        if(
            menu.contains(
                event.target
            )
        ){

            return;

        }


        if(
            !event.target.closest(
                "#readerStory"
            )
        ){

            hideSelectionHighlightMenu();

        }

    }
);


/* =========================================================
   HIGHLIGHT BUTTONS
========================================================= */

document
    .querySelectorAll(
        "[data-highlight]"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "mousedown",
                function(event){

                    event.preventDefault();

                }
            );


            button.addEventListener(
                "click",
                function(){

                    applyHighlight(
                        button.dataset.highlight
                    );


                    hideSelectionHighlightMenu();

                }
            );

        }
    );


function applyHighlight(color){

    if(!savedSelectionRange){

        const selection =
            window.getSelection();


        if(
            !selection ||
            selection.rangeCount === 0 ||
            selection.isCollapsed
        ){

            return;

        }


        savedSelectionRange =
            selection
                .getRangeAt(0)
                .cloneRange();

    }


    const range =
        savedSelectionRange;


    if(
        range.collapsed ||
        !selectionIsInsideReader(
            range
        )
    ){

        savedSelectionRange =
            null;

        return;

    }


    const span =
        document.createElement(
            "span"
        );


    span.className =
        "highlight highlight-" +
        color +
        "-mark";


    try{

        range.surroundContents(
            span
        );

    }catch(error){

        const fragment =
            range.extractContents();


        span.appendChild(
            fragment
        );


        range.insertNode(
            span
        );

    }


    savedSelectionRange =
        null;


    const selection =
        window.getSelection();


    if(selection){

        selection.removeAllRanges();

    }


    saveHighlights();

}


/* =========================================================
   SAVE HIGHLIGHTS
========================================================= */

function saveHighlights(){

    if(
        selectedChapterIndex < 0
    ){

        return;

    }


    const chapter =
        chapters[
            selectedChapterIndex
        ];


    localStorage.setItem(
        "hed_highlights_" +
        chapter.id,

        $("readerStory")
            .innerHTML
    );

}


/* =========================================================
   LOAD HIGHLIGHTS
========================================================= */

function loadHighlights(){

    if(
        selectedChapterIndex < 0
    ){

        return;

    }


    const chapter =
        chapters[
            selectedChapterIndex
        ];


    const saved =
        localStorage.getItem(
            "hed_highlights_" +
            chapter.id
        );


    if(saved){

        $("readerStory")
            .innerHTML =
                saved;

    }

}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


function escapeAttribute(value){

    return escapeHTML(value)
        .replace(
            /"/g,
            "&quot;"
        );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    $("loadingMessage")
        .classList
        .add("hidden");


    $("bookContent")
        .classList
        .add("hidden");


    $("errorMessage")
        .classList
        .remove("hidden");


    $("errorText")
        .textContent =
            message;

}


/* =========================================================
   START
========================================================= */

window.readerAuthReady.then(function () {

    const commentNameElement =
        document.getElementById("commentName");

    if (
        commentNameElement &&
        window.readerNickname
    ) {

        commentNameElement.value =
            window.readerNickname;

    }

    loadStory();

}).catch(function (error) {

    console.error(error);

    showError(
        "Something went wrong while opening this story."
    );

});
