<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HED · Story Reader</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reader-auth.js"></script>

<style>

/* =========================================================
   HED READER
========================================================= */

:root{
    --brown:#4a352b;
    --brown-dark:#382920;
    --cream:#f5efe6;
    --paper:#fbf8f3;
    --green:#68745d;
    --pink:#c58f91;
    --pink-dark:#a87578;
    --text:#342b26;
    --muted:#8b8178;
    --line:#ddd2c5;
    --soft:#eee6dc;
    --white:#ffffff;
    --shadow:0 12px 35px rgba(74,53,43,.08);

    --reader-width:780px;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--cream);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{
    position:sticky;
    top:0;
    z-index:50;

    background:rgba(251,248,243,.96);
    border-bottom:1px solid var(--line);

    backdrop-filter:blur(8px);
}

.header-inner{
    max-width:1120px;
    min-height:64px;

    margin:0 auto;
    padding:11px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    color:var(--brown);
    text-decoration:none;

    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    font-weight:700;
    letter-spacing:.02em;
}

.brand span{
    color:var(--pink);
}

.back-link{
    color:var(--green);
    text-decoration:none;
    font-size:12px;
}

.back-link:hover{
    color:var(--pink-dark);
}


/* =========================================================
   PAGE
========================================================= */

.book-page{
    max-width:1120px;

    margin:0 auto;
    padding:42px 28px 70px;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.page-message{
    max-width:700px;

    margin:100px auto;

    text-align:center;
    color:var(--muted);
}

.page-message h2{
    margin:0 0 8px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
}

.page-message p{
    margin:0;
    line-height:1.6;
}


/* =========================================================
   STORY INTRO
========================================================= */

.book-intro{
    display:grid;
    grid-template-columns:210px minmax(0,1fr);
    gap:34px;
    align-items:start;

    margin-bottom:34px;
}

.cover-wrap{
    width:210px;
    aspect-ratio:2 / 3;

    overflow:hidden;

    border:1px solid var(--line);
    background:var(--soft);

    box-shadow:var(--shadow);
}

.cover-wrap img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

.cover-placeholder{
    width:100%;
    height:100%;

    display:grid;
    place-items:center;

    padding:25px;

    color:var(--brown);

    text-align:center;

    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    line-height:1.35;
}

.book-info{
    min-width:0;
    padding-top:4px;
}

.eyebrow{
    color:var(--pink-dark);

    font-size:9px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
}

.book-info h1{
    margin:7px 0 7px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(34px,5vw,56px);
    line-height:1.04;
}

.book-author{
    margin-bottom:17px;

    color:var(--muted);

    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
}

.book-description{
    max-width:720px;

    margin:0;

    color:#665c54;

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    line-height:1.65;
}

.book-description-wrap{
    margin-top:10px;
}

.book-description-more{
    display:inline;

    margin-left:4px;
    padding:0;

    border:0;
    background:none;

    color:var(--pink-dark);

    font-family:inherit;
    font-size:inherit;
    font-weight:600;

    cursor:pointer;
}

.book-description-more:hover{
    text-decoration:underline;
}

.book-meta{
    display:flex;
    flex-wrap:wrap;
    margin-top:16px;
}

.meta-pill{
    padding:6px 9px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--muted);

    font-size:9px;
    letter-spacing:.06em;
}


/* =========================================================
   READER
========================================================= */

.reader-shell{
    display:none;

    padding-top:18px;

    border-top:1px solid var(--line);
}

.reader-shell.open{
    display:block;
}


/* =========================================================
   MINIMAL READER BAR
========================================================= */

.reader-topbar{
    max-width:var(--reader-width);

    margin:0 auto 12px;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    gap:6px;
}

.reader-mini-button{
    width:34px;
    height:34px;

    padding:0;

    border:1px solid var(--line);
    border-radius:50%;

    background:rgba(251,248,243,.9);

    color:var(--brown);

    font-size:12px;
    font-weight:700;

    transition:.15s ease;
}

.reader-mini-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.reader-mini-button.bookmarked{
    background:var(--pink);
    border-color:var(--pink);
    color:white;
}


/* =========================================================
   OLD CONTROLS
========================================================= */

.reader-controls{
    display:none;
}


/* =========================================================
   READER LAYOUT
========================================================= */

.reader-layout{
    max-width:1120px;

    margin:0 auto;

    display:grid;
    grid-template-columns:235px minmax(0,1fr);

    gap:15px;
    align-items:start;
}

.reader-layout.chapter-closed{
    grid-template-columns:minmax(0,1fr);
}


/* =========================================================
   CHAPTER DRAWER
========================================================= */

.chapter-drawer{
    position:sticky;
    top:82px;

    max-height:calc(100vh - 105px);

    overflow-y:auto;

    padding:13px;

    border:1px solid var(--line);

    background:rgba(251,248,243,.97);

    box-shadow:var(--shadow);
}

.chapter-drawer:not(.open){
    display:none;
}

.chapter-drawer-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:10px;

    padding-bottom:9px;
    margin-bottom:7px;

    border-bottom:1px solid var(--line);
}

.chapter-drawer h2{
    margin:3px 0 0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
}

.drawer-close{
    width:28px;
    height:28px;

    padding:0;

    border:0;
    background:transparent;

    color:var(--muted);

    font-size:20px;
    line-height:1;
}

.drawer-close:hover{
    color:var(--pink);
}

.chapter-list{
    display:grid;
    gap:4px;
}

.chapter-button{
    width:100%;

    padding:10px 9px;

    display:flex;
    align-items:center;
    gap:10px;

    border:1px solid transparent;
    background:transparent;

    color:var(--text);

    text-align:left;
}

.chapter-button:hover{
    background:var(--soft);
    border-color:var(--line);
}

.chapter-button.active{
    background:#eee5dc;
    border-color:var(--line);
}

.chapter-number{
    min-width:28px;

    color:var(--pink-dark);

    font-size:9px;
    letter-spacing:.1em;
}

.chapter-title-small{
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    line-height:1.35;
}


/* =========================================================
   READER COLUMN
========================================================= */

.reader-column{
    min-width:0;
}


/* =========================================================
   READING PREFERENCES
========================================================= */

.preferences{
    display:none;

    position:relative;

    margin:0 auto 12px;

    max-width:var(--reader-width);

    padding:15px;

    border:1px solid var(--line);
    background:rgba(251,248,243,.98);

    box-shadow:0 8px 25px rgba(74,53,43,.08);
}

.preferences.open{
    display:block;
}

.preferences-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.preferences-title{
    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
}

.preferences-grid{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 15px;
}

.preference-group{
    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:6px;

    min-height:30px;
}

.preference-label{
    color:var(--muted);

    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;

    white-space:nowrap;
}

.pref-select{
    padding:6px 8px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-size:11px;
}

.pref-select:focus{
    outline:none;
    border-color:var(--pink);
}

.pref-size-wrap{
    display:flex;
    align-items:center;
    gap:6px;
}

.pref-range{
    width:120px;

    accent-color:var(--pink);

    cursor:pointer;
}

.pref-size-value{
    min-width:38px;

    color:var(--brown);

    font-size:10px;
    text-align:right;
}

.pref-button{
    min-width:30px;
    min-height:30px;

    padding:0 8px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-size:10px;
}

.pref-button.active,
.pref-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.width-buttons{
    display:flex;
    gap:5px;
}

.width-button{
    min-height:30px;

    padding:0 9px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-size:10px;
}

.width-button.active,
.width-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}


/* =========================================================
   THEMES
========================================================= */

.theme-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.theme-button{
    min-width:30px;
    height:30px;

    padding:0 8px;

    border:1px solid var(--line);

    font-size:10px;
    font-weight:700;
}

.theme-cream{
    background:#fbf8f3;
    color:#342b26;
}

.theme-white{
    background:#fff;
    color:#111;
}

.theme-black{
    background:#000;
    color:#fff;
    border-color:#000;
}

.theme-dark{
    background:#20211f;
    color:#fff;
    border-color:#20211f;
}

.theme-sepia{
    background:#f1e4c9;
    color:#574936;
}

.theme-blue{
    background:#111827;
    color:#f8fafc;
    border-color:#111827;
}


/* =========================================================
   READER PAPER
========================================================= */

.reader-paper{
    max-width:var(--reader-width);

    margin:0 auto;

    padding:34px 36px 35px;

    border:1px solid var(--line);

    background:var(--paper);

    box-shadow:var(--shadow);

    transition:
        background .15s ease,
        color .15s ease,
        max-width .15s ease;
}


/* =========================================================
   CHAPTER TITLE
========================================================= */

.reader-chapter-label{
    margin:0 0 5px;

    color:var(--pink-dark);

    font-size:10px;
    font-weight:700;
    line-height:1.2;

    letter-spacing:.08em;
    text-transform:uppercase;
}

.reader-paper h1{
    margin:0 0 25px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    line-height:1.25;
    font-weight:600;
}


/* =========================================================
   STORY TEXT
========================================================= */

.reader-story{
    --reader-font:Georgia,"Times New Roman",serif;

    max-width:100%;

    margin:0 auto;

    color:var(--text);

    font-size:16px;
    line-height:1.7;

    transition:
        color .15s ease,
        font-size .15s ease,
        line-height .15s ease;
}

.reader-story,
.reader-story *{
    font-family:var(--reader-font) !important;
}

.reader-story p{
    margin:0 0 .95em;
}

.reader-story h1,
.reader-story h2,
.reader-story h3,
.reader-story h4{
    margin:1.2em 0 .5em;

    color:var(--brown);

    line-height:1.2;
}

.reader-story img{
    display:block;

    max-width:100%;
    height:auto;

    margin:25px auto;
}

.reader-story blockquote{
    margin:1.2em 0;
    padding:10px 18px;

    border-left:3px solid var(--pink);

    color:var(--brown);
}


/* =========================================================
   HIGHLIGHTS
========================================================= */

.reader-highlight{
    border-radius:2px;
    padding:0 .04em;
}

.highlight-yellow-mark{
    background:#fff0a6;
}

.highlight-pink-mark{
    background:#f7b4cf;
}

.highlight-green-mark{
    background:#b8dfb5;
}

.highlight-blue-mark{
    background:#b7d5ee;
}

.highlight-orange-mark{
    background:#f6c58b;
}

.highlight-purple-mark{
    background:#d7b9e8;
}

.highlight-coral-mark{
    background:#f5aaa0;
}

.highlight-lavender-mark{
    background:#c8c7f2;
}

.highlight-mint-mark{
    background:#aee1d2;
}

.highlight-gray-mark{
    background:#d6d6d1;
}


/* =========================================================
   UNDERLINE
========================================================= */

.reader-underline{
    text-decoration-line:underline;
    text-decoration-thickness:2px;
    text-decoration-color:var(--pink-dark);
    text-underline-offset:3px;
}


/* =========================================================
   SELECTION MENU
========================================================= */

.selection-highlight-menu{
    position:fixed;
    z-index:1000;

    display:none;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;

    max-width:calc(100vw - 16px);

    padding:7px;

    border:1px solid var(--line);
    border-radius:10px;

    background:#fbf8f3;

    box-shadow:0 8px 25px rgba(74,53,43,.18);
}

.selection-highlight-menu.open{
    display:flex;
}

.selection-action{
    min-height:28px;

    padding:0 9px;

    border:1px solid var(--line);
    border-radius:7px;

    background:var(--paper);

    color:var(--brown);

    font-size:10px;
}

.selection-action:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.highlight-button{
    width:24px;
    height:24px;

    flex:0 0 auto;

    padding:0;

    border:1px solid #bcb4aa;
    border-radius:50%;
}

.highlight-button:hover{
    transform:scale(1.08);
}

.highlight-yellow{
    background:#fff0a6;
}

.highlight-pink{
    background:#f7b4cf;
}

.highlight-green{
    background:#b8dfb5;
}

.highlight-blue{
    background:#b7d5ee;
}

.highlight-orange{
    background:#f6c58b;
}

.highlight-purple{
    background:#d7b9e8;
}

.highlight-coral{
    background:#f5aaa0;
}

.highlight-lavender{
    background:#c8c7f2;
}

.highlight-mint{
    background:#aee1d2;
}

.highlight-gray{
    background:#d6d6d1;
}


/* =========================================================
   NOTES PANEL
========================================================= */

.notes-panel{
    display:none;

    max-width:var(--reader-width);

    margin:12px auto 0;

    padding:15px;

    border:1px solid var(--line);

    background:var(--paper);

    box-shadow:var(--shadow);
}

.notes-panel.open{
    display:block;
}

.notes-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:12px;
}

.notes-title{
    margin:0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
}

.note-list{
    display:grid;
    gap:9px;
}

.note-card{
    padding:11px 12px;

    border:1px solid var(--line);

    background:#fffdfa;
}

.note-card-quote{
    margin:0 0 7px;

    color:var(--muted);

    font-family:Georgia,"Times New Roman",serif;
    font-size:11px;
    line-height:1.45;
}

.note-card-text{
    margin:0;

    color:var(--text);

    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    line-height:1.5;

    white-space:pre-wrap;
}

.note-card-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;

    margin-top:8px;
}

.note-card-actions button{
    padding:3px 0;

    border:0;
    background:none;

    color:var(--pink-dark);

    font-size:9px;
}

.note-card-actions button:hover{
    text-decoration:underline;
}


/* =========================================================
   CHAPTER NAVIGATION
========================================================= */

.chapter-navigation{
    max-width:100%;

    margin:35px auto 0;
    padding-top:16px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    border-top:1px solid var(--line);
}

.nav-button{
    padding:9px 12px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    font-size:11px;
}

.nav-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}


/* =========================================================
   COMMENTS
========================================================= */

.comments-section{
    max-width:100%;

    margin:30px auto 0;
    padding-top:20px;

    border-top:1px solid var(--line);
}

.comments-title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;

    gap:10px;

    margin-bottom:11px;
}

.comments-title{
    margin:0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
}

.comments-subtitle{
    color:var(--muted);

    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.comments-list{
    display:grid;
    gap:8px;

    margin-bottom:15px;
}

.comment-card{
    padding:10px 12px;

    border:1px solid var(--line);
    background:#fffdfa;
}

.comment-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:4px;
}

.comment-author{
    color:var(--brown);

    font-size:12px;
    font-weight:700;
}

.comment-date{
    color:var(--muted);

    font-size:9px;
}

.comment-text{
    margin:0;

    color:#5b544e;

    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;
    line-height:1.48;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.comment-actions{
    display:flex;
    justify-content:flex-end;

    margin-top:5px;
}

.comment-delete{
    padding:3px 0;

    border:0;
    background:transparent;

    color:#aa817f;

    font-size:9px;
}

.comment-delete:hover{
    color:var(--pink);
}

.comment-form{
    padding:13px;

    border:1px solid var(--line);
    background:rgba(251,248,243,.8);
}

.comment-form-grid{
    display:grid;
    grid-template-columns:170px minmax(0,1fr);

    gap:8px;
}

.comment-input,
.comment-textarea{
    width:100%;

    padding:9px 10px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    outline:none;

    font-size:12px;
}

.comment-input:focus,
.comment-textarea:focus{
    border-color:var(--pink);
}

.comment-textarea{
    min-height:72px;

    resize:vertical;

    font-family:Georgia,"Times New Roman",serif;
    line-height:1.5;
}

.comment-form-bottom{
    display:flex;
    justify-content:flex-end;

    margin-top:8px;
}

.comment-submit{
    padding:9px 14px;

    border:0;
    background:var(--pink);

    color:white;

    font-size:11px;
}

.comment-submit:hover{
    background:var(--pink-dark);
}

.comment-status{
    min-height:13px;

    margin-top:6px;

    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   EMPTY MESSAGE
========================================================= */

.empty-message{
    padding:15px;

    color:var(--muted);

    font-size:11px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

    .reader-layout{
        grid-template-columns:1fr;
    }

    .chapter-drawer{
        position:relative;
        top:auto;

        max-height:280px;
    }
}

@media(max-width:760px){

    .header-inner{
        padding:10px 17px;
    }

    .book-page{
        padding:28px 17px 50px;
    }

    .book-intro{
        grid-template-columns:1fr;
        gap:20px;
    }

    .cover-wrap{
        width:165px;
    }

    .book-info h1{
        font-size:38px;
    }

    .book-description{
        font-size:16px;
    }

    .reader-paper{
        padding:26px 18px 28px;
    }

    .reader-paper h1{
        font-size:25px;
    }

<script>

/* =========================================================
   BASIC HELPER
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   STORY ID
========================================================= */

const storyId =
    new URLSearchParams(
        window.location.search
    ).get("id");


/* =========================================================
   STATE
========================================================= */

let story = null;

let chapters = [];

let selectedChapterIndex = -1;

let savedSelectionRange = null;


/* =========================================================
   READER DEFAULTS
========================================================= */

const defaultReaderPreferences = {

    fontFamily:"serif",

    fontSize:16,

    lineHeight:1.7,

    width:"780px",

    theme:"cream"

};


/* =========================================================
   STORAGE HELPERS
========================================================= */

function getStorageKey(type,chapterId){

    return (
        "hed_" +
        type +
        "_" +
        chapterId
    );

}


function getChapterAnnotations(){

    if(selectedChapterIndex < 0){

        return [];

    }

    const chapter =
        chapters[selectedChapterIndex];

    if(!chapter){

        return [];

    }

    try{

        return JSON.parse(
            localStorage.getItem(
                getStorageKey(
                    "annotations",
                    chapter.id
                )
            )
        ) || [];

    }catch(error){

        return [];

    }

}


function saveChapterAnnotations(annotations){

    if(selectedChapterIndex < 0){

        return;

    }

    const chapter =
        chapters[selectedChapterIndex];

    if(!chapter){

        return;

    }

    localStorage.setItem(
        getStorageKey(
            "annotations",
            chapter.id
        ),
        JSON.stringify(
            annotations
        )
    );

}


/* =========================================================
   BOOKMARKS
========================================================= */

function getBookmarks(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "hed_bookmarks"
            )
        ) || [];

    }catch(error){

        return [];

    }

}


function saveBookmarks(bookmarks){

    localStorage.setItem(
        "hed_bookmarks",
        JSON.stringify(bookmarks)
    );

}


function isCurrentChapterBookmarked(){

    if(selectedChapterIndex < 0){

        return false;

    }

    const chapter =
        chapters[selectedChapterIndex];

    return getBookmarks().includes(
        chapter.id
    );

}


function updateBookmarkButton(){

    const button =
        $("bookmarkButton");

    const bookmarked =
        isCurrentChapterBookmarked();

    button.classList.toggle(
        "bookmarked",
        bookmarked
    );

    button.textContent =
        bookmarked
            ? "♥"
            : "♡";

    button.title =
        bookmarked
            ? "Remove bookmark"
            : "Bookmark chapter";

}


$("bookmarkButton").onclick =
    function(){

        if(selectedChapterIndex < 0){

            return;

        }

        const chapter =
            chapters[selectedChapterIndex];

        let bookmarks =
            getBookmarks();

        if(bookmarks.includes(chapter.id)){

            bookmarks =
                bookmarks.filter(
                    function(id){
                        return id !== chapter.id;
                    }
                );

        }else{

            bookmarks.push(
                chapter.id
            );

        }

        saveBookmarks(
            bookmarks
        );

        updateBookmarkButton();

    };


/* =========================================================
   LOAD STORY
========================================================= */

async function loadStory(){

    if(!storyId){

        showError(
            "No story was selected. Please return to HED and choose a story."
        );

        return;

    }


    const storyResult =
        await supabaseClient
            .from("stories")
            .select(
                "id,title,author,description,cover_url,created_at"
            )
            .eq(
                "id",
                storyId
            )
            .single();


    if(storyResult.error){

        console.error(
            storyResult.error
        );

        showError(
            "We couldn't find this story."
        );

        return;

    }


    story =
        storyResult.data;


    renderStoryInfo();


    const chapterResult =
        await supabaseClient
            .from("chapters")
            .select(
                "id,story_id,title,content,chapter_order,created_at"
            )
            .eq(
                "story_id",
                storyId
            )
            .order(
                "chapter_order",
                {
                    ascending:true
                }
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(chapterResult.error){

        console.error(
            chapterResult.error
        );

        showError(
            "The story opened, but its chapters could not be loaded."
        );

        return;

    }


    chapters =
        chapterResult.data || [];


    renderChapterList();


    $("chapterCountPill")
        .textContent =
            chapters.length +
            (
                chapters.length === 1
                    ? " chapter"
                    : " chapters"
            );


    $("loadingMessage")
        .classList
        .add("hidden");


    $("bookContent")
        .classList
        .remove("hidden");


    if(chapters.length){

        openChapter(0);

    }else{

        $("readerShell")
            .classList
            .add("open");

        $("readerChapterLabel")
            .textContent =
                "NO CHAPTERS";

        $("readerChapterTitle")
            .textContent =
                "This story has no chapters yet.";

        $("readerStory")
            .innerHTML =
                "<p>There is nothing to read here yet.</p>";

    }

}


/* =========================================================
   STORY INFO
========================================================= */

function renderStoryInfo(){

    $("storyTitle")
        .textContent =
            story.title ||
            "Untitled Story";


    $("storyAuthor")
        .textContent =
            story.author
                ? "by " + story.author
                : "";


    const description =
        story.description ||
        "No description yet.";

    const descriptionElement =
        $("storyDescription");

    const words =
        description.trim().split(/\s+/);

    const DESCRIPTION_LIMIT =
        118;


    if(words.length > DESCRIPTION_LIMIT){

        const shortDescription =
            words
                .slice(
                    0,
                    DESCRIPTION_LIMIT
                )
                .join(" ");


        descriptionElement.innerHTML =
            escapeHTML(
                shortDescription
            ) +
            "... " +
            '<button type="button" class="book-description-more">See more</button>';


        const seeMore =
            descriptionElement.querySelector(
                ".book-description-more"
            );


        seeMore.onclick =
            function(){

                descriptionElement.textContent =
                    description;

                const seeLess =
                    document.createElement(
                        "button"
                    );

                seeLess.type =
                    "button";

                seeLess.className =
                    "book-description-more";

                seeLess.textContent =
                    "See less";

                descriptionElement.appendChild(
                    document.createTextNode(" ")
                );

                descriptionElement.appendChild(
                    seeLess
                );


                seeLess.onclick =
                    function(){

                        descriptionElement.innerHTML =
                            escapeHTML(
                                shortDescription
                            ) +
                            "... ";


                        const newSeeMore =
                            document.createElement(
                                "button"
                            );

                        newSeeMore.type =
                            "button";

                        newSeeMore.className =
                            "book-description-more";

                        newSeeMore.textContent =
                            "See more";


                        descriptionElement.appendChild(
                            newSeeMore
                        );


                        newSeeMore.onclick =
                            seeMore.onclick;

                    };

            };

    }else{

        descriptionElement.textContent =
            description;

    }


    if(story.cover_url){

        const image =
            document.createElement(
                "img"
            );

        image.src =
            story.cover_url;

        image.alt =
            story.title ||
            "Story cover";


        image.onload =
            function(){

                $("coverPlaceholder")
                    .classList
                    .add("hidden");

                $("coverWrap")
                    .appendChild(
                        image
                    );

            };


        image.onerror =
            function(){

                image.remove();

            };

    }

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function renderChapterList(){

    const list =
        $("chapterList");

    list.innerHTML =
        "";


    if(!chapters.length){

        list.innerHTML =
            '<div class="empty-message">' +
            "This story doesn't have any chapters yet." +
            "</div>";

        return;

    }


    chapters.forEach(
        function(chapter,index){

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "chapter-button";


            button.innerHTML =
                '<span class="chapter-number">' +
                    String(
                        index + 1
                    ).padStart(
                        2,
                        "0"
                    ) +
                "</span>" +

                '<span class="chapter-title-small">' +
                    escapeHTML(
                        chapter.title ||
                        "Untitled Chapter"
                    ) +
                "</span>";


            button.onclick =
                function(){

                    openChapter(
                        index
                    );

                    setChapterDrawer(
                        false
                    );

                };


            list.appendChild(
                button
            );

        }
    );


    updateActiveChapterButton();

}


/* =========================================================
   ACTIVE CHAPTER
========================================================= */

function updateActiveChapterButton(){

    document
        .querySelectorAll(
            ".chapter-button"
        )
        .forEach(
            function(button,index){

                button.classList.toggle(
                    "active",
                    index ===
                    selectedChapterIndex
                );

            }
        );

}


/* =========================================================
   OPEN CHAPTER
========================================================= */

function openChapter(index){

    if(
        index < 0 ||
        index >= chapters.length
    ){

        return;

    }


    selectedChapterIndex =
        index;


    const chapter =
        chapters[index];


    $("readerChapterLabel")
        .textContent =
            "CHAPTER " +
            String(
                index + 1
            ).padStart(
                2,
                "0"
            );


    $("readerChapterTitle")
        .textContent =
            chapter.title ||
            "Untitled Chapter";


    const content =
        chapter.content ||
        "";


    if(
        /<\/?[a-z][\s\S]*>/i.test(
            content
        )
    ){

        $("readerStory")
            .innerHTML =
                content;

    }else{

        $("readerStory")
            .textContent =
                content;

    }


    applySavedReaderPreferences();

    loadAnnotations();

    updateChapterNavigation();

    updateActiveChapterButton();

    updateBookmarkButton();

    renderNotes();


    $("readerShell")
        .classList
        .add("open");


    loadComments();

}


/* =========================================================
   CHAPTER NAVIGATION
========================================================= */

function updateChapterNavigation(){

    $("previousChapterButton")
        .classList
        .toggle(
            "hidden",
            selectedChapterIndex <= 0
        );


    $("nextChapterButton")
        .classList
        .toggle(
            "hidden",
            selectedChapterIndex >=
            chapters.length - 1
        );

}


$("previousChapterButton").onclick =
    function(){

        if(
            selectedChapterIndex > 0
        ){

            openChapter(
                selectedChapterIndex - 1
            );

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    };


$("nextChapterButton").onclick =
    function(){

        if(
            selectedChapterIndex <
            chapters.length - 1
        ){

            openChapter(
                selectedChapterIndex + 1
            );

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    };


/* =========================================================
   CHAPTER DRAWER
========================================================= */

function setChapterDrawer(open){

    $("chapterDrawer")
        .classList
        .toggle(
            "open",
            open
        );


    $("readerLayout")
        .classList
        .toggle(
            "chapter-closed",
            !open
        );

}


$("chapterToggleButton").onclick =
    function(){

        const open =
            !$("chapterDrawer")
                .classList
                .contains(
                    "open"
                );

        setChapterDrawer(
            open
        );

    };


$("closeChapterDrawer").onclick =
    function(){

        setChapterDrawer(
            false
        );

    };


/* =========================================================

/* =========================================================
   READER PREFERENCES
========================================================= */

function getReaderPreferences(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "hed_reader_preferences"
                )
            );


        return {
            ...defaultReaderPreferences,
            ...(saved || {})
        };

    }catch(error){

        return {
            ...defaultReaderPreferences
        };

    }

}


function saveReaderPreferences(
    preferences
){

    localStorage.setItem(
        "hed_reader_preferences",
        JSON.stringify(
            preferences
        )
    );

}


function applySavedReaderPreferences(){

    const preferences =
        getReaderPreferences();


    applyFont(
        preferences.fontFamily
    );


    applyFontSize(
        preferences.fontSize
    );


    applyLineHeight(
        preferences.lineHeight
    );


    applyReaderWidth(
        preferences.width
    );


    applyTheme(
        preferences.theme
    );


    $("fontFamily")
        .value =
            preferences.fontFamily;


    $("fontSize")
        .value =
            preferences.fontSize;


    $("fontSizeValue")
        .textContent =
            preferences.fontSize +
            "px";


    updatePreferenceButtons();

}

/* =========================================================
   TEXT POSITION HELPERS
========================================================= */

function getTextOffset(
    root,
    targetNode,
    targetOffset
){

    let offset = 0;

    const walker =
        document.createTreeWalker(
            root,
            NodeFilter.SHOW_TEXT
        );


    let node;


    while(
        node =
        walker.nextNode()
    ){

        if(node === targetNode){

            return (
                offset +
                targetOffset
            );

        }


        offset +=
            node.nodeValue.length;

    }


    return offset;

}


function getRangeOffsets(range){

    const root =
        $("readerStory");


    return {

        start:
            getTextOffset(
                root,
                range.startContainer,
                range.startOffset
            ),

        end:
            getTextOffset(
                root,
                range.endContainer,
                range.endOffset
            )

    };

}


/* =========================================================
   RANGE FROM TEXT OFFSETS
========================================================= */

function createRangeFromOffsets(
    start,
    end
){

    const root =
        $("readerStory");


    const walker =
        document.createTreeWalker(
            root,
            NodeFilter.SHOW_TEXT
        );


    let node;

    let position = 0;

    let startNode = null;
    let endNode = null;

    let startOffset = 0;
    let endOffset = 0;


    while(
        node =
        walker.nextNode()
    ){

        const nextPosition =
            position +
            node.nodeValue.length;


        if(
            startNode === null &&
            start >= position &&
            start <= nextPosition
        ){

            startNode =
                node;

            startOffset =
                start - position;

        }


        if(
            endNode === null &&
            end >= position &&
            end <= nextPosition
        ){

            endNode =
                node;

            endOffset =
                end - position;

            break;

        }


        position =
            nextPosition;

    }


    if(
        !startNode ||
        !endNode
    ){

        return null;

    }


    const range =
        document.createRange();


    try{

        range.setStart(
            startNode,
            startOffset
        );

        range.setEnd(
            endNode,
            endOffset
        );

        return range;

    }catch(error){

        return null;

    }

}


/* =========================================================
   WRAP RANGE
========================================================= */

function wrapRange(
    range,
    className
){

    if(
        !range ||
        range.collapsed
    ){

        return false;

    }


    const element =
        document.createElement(
            "span"
        );


    element.className =
        className;


    try{

        range.surroundContents(
            element
        );

        return true;

    }catch(error){

        try{

            const fragment =
                range.extractContents();


            if(
                !fragment.textContent.trim()
            ){

                return false;

            }


            element.appendChild(
                fragment
            );


            range.insertNode(
                element
            );


            return true;

        }catch(innerError){

            console.error(
                innerError
            );

            return false;

        }

    }

}


/* =========================================================
   LOAD ANNOTATIONS
========================================================= */

function loadAnnotations(){

    const annotations =
        getChapterAnnotations();


    if(!annotations.length){

        return;

    }


    /*
       Work from the end of the text toward
       the beginning so earlier offsets
       remain stable while spans are added.
    */

    const sorted =
        [...annotations].sort(
            function(a,b){

                return (
                    b.start -
                    a.start
                );

            }
        );


    sorted.forEach(
        function(annotation){

            const range =
                createRangeFromOffsets(
                    annotation.start,
                    annotation.end
                );


            if(!range){

                return;

            }


            let className =
                "";


            if(
                annotation.type ===
                "highlight"
            ){

                className =
                    "reader-highlight highlight-" +
                    annotation.color +
                    "-mark";

            }


            if(
                annotation.type ===
                "underline"
            ){

                className =
                    "reader-underline";

            }


            if(!className){

                return;

            }


            wrapRange(
                range,
                className
            );

        }
    );

}


/* =========================================================
   SAVE ANNOTATION
========================================================= */

function saveAnnotation(
    type,
    color,
    note
){

    if(
        !savedSelectionRange ||
        savedSelectionRange.collapsed
    ){

        return;

    }


    const range =
        savedSelectionRange;


    if(
        !selectionIsInsideReader(
            range
        )
    ){

        savedSelectionRange =
            null;

        return;

    }


    const offsets =
        getRangeOffsets(
            range
        );


    const selectedText =
        range.toString();


    if(
        !selectedText.trim()
    ){

        savedSelectionRange =
            null;

        return;

    }


    const annotation = {

        id:
            "annotation_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2),

        type:
            type,

        color:
            color || null,

        note:
            note || "",

        text:
            selectedText,

        start:
            offsets.start,

        end:
            offsets.end,

        createdAt:
            new Date().toISOString()

    };


    const annotations =
        getChapterAnnotations();


    annotations.push(
        annotation
    );


    saveChapterAnnotations(
        annotations
    );


    return annotation;

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function applyHighlight(
    color
){

    if(!savedSelectionRange){

        return;

    }


    const annotation =
        saveAnnotation(
            "highlight",
            color,
            ""
        );


    if(!annotation){

        return;

    }


    const range =
        createRangeFromOffsets(
            annotation.start,
            annotation.end
        );


    if(range){

        wrapRange(
            range,
            "reader-highlight highlight-" +
            color +
            "-mark"
        );

    }


    clearSelection();

    renderNotes();

}

/* =========================================================
   SELECTION MENU
========================================================= */

function selectionIsInsideReader(
    range
){

    if(!range){

        return false;

    }


    return $("readerStory")
        .contains(
            range.commonAncestorContainer
        );

}


function clearSelection(){

    const selection =
        window.getSelection();


    if(selection){

        selection.removeAllRanges();

    }


    savedSelectionRange =
        null;


    $("selectionHighlightMenu")
        .classList
        .remove(
            "open"
        );

}


function hideSelectionMenu(){

    $("selectionHighlightMenu")
        .classList
        .remove(
            "open"
        );

}


function showSelectionHighlightMenu(){

    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0 ||
        selection.isCollapsed
    ){

        hideSelectionMenu();

        return;

    }


    const range =
        selection.getRangeAt(0);


    if(
        !selectionIsInsideReader(
            range
        )
    ){

        hideSelectionMenu();

        return;

    }


    const text =
        selection
            .toString()
            .trim();


    if(!text){

        hideSelectionMenu();

        return;

    }


    savedSelectionRange =
        range.cloneRange();


    const menu =
        $("selectionHighlightMenu");


    menu.classList.add(
        "open"
    );


    const rect =
        range.getBoundingClientRect();


    const menuWidth =
        menu.offsetWidth || 330;


    const menuHeight =
        menu.offsetHeight || 45;


    let left =
        rect.left +
        rect.width / 2 -
        menuWidth / 2;


    let top =
        rect.top -
        menuHeight -
        8;


    left =
        Math.max(
            8,
            Math.min(
                left,
                window.innerWidth -
                menuWidth -
                8
            )
        );


    if(top < 8){

        top =
            Math.min(
                window.innerHeight -
                menuHeight -
                8,

                rect.bottom +
                8
            );

    }


    menu.style.left =
        left + "px";

    menu.style.top =
        top + "px";

}


document.addEventListener(
    "selectionchange",
    function(){

        clearTimeout(
            window.hedSelectionTimer
        );


        window.hedSelectionTimer =
            setTimeout(
                showSelectionHighlightMenu,
                80
            );

    }
);

/* =========================================================
   NOTES
========================================================= */

function renderNotes(){

    const list =
        $("noteList");


    list.innerHTML =
        "";


    const annotations =
        getChapterAnnotations()
            .filter(
                function(annotation){

                    return (
                        annotation.type ===
                        "note"
                    );

                }
            );


    if(!annotations.length){

        list.innerHTML =
            '<div class="empty-message">' +
            "No notes in this chapter yet." +
            "</div>";

        return;

    }


    annotations.forEach(
        function(annotation){

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "note-card";


            card.innerHTML =

                '<p class="note-card-quote">' +
                    "“" +
                    escapeHTML(
                        annotation.text
                    ) +
                    "”" +
                "</p>" +

                '<p class="note-card-text">' +
                    escapeHTML(
                        annotation.note
                    ) +
                "</p>" +

                '<div class="note-card-actions">' +

                    '<button type="button" data-note-edit="' +
                        escapeAttribute(
                            annotation.id
                        ) +
                    '">' +
                        "Edit" +
                    "</button>" +

                    '<button type="button" data-note-delete="' +
                        escapeAttribute(
                            annotation.id
                        ) +
                    '">' +
                        "Delete" +
                    "</button>" +

                "</div>";


            list.appendChild(
                card
            );

        }
    );


    list
        .querySelectorAll(
            "[data-note-edit]"
        )
        .forEach(
            function(button){

                button.onclick =
                    function(){

                        editNote(
                            this.dataset.noteEdit
                        );

                    };

            }
        );


    list
        .querySelectorAll(
            "[data-note-delete]"
        )
        .forEach(
            function(button){

                button.onclick =
                    function(){

                        deleteNote(
                            this.dataset.noteDelete
                        );

                    };

            }
        );

}


function editNote(id){

    const annotations =
        getChapterAnnotations();


    const annotation =
        annotations.find(
            function(item){

                return item.id === id;

            }
        );


    if(!annotation){

        return;

    }


    const newNote =
        prompt(
            "Edit your note:",
            annotation.note
        );


    if(
        newNote === null
    ){

        return;

    }


    if(
        !newNote.trim()
    ){

        return;

    }


    annotation.note =
        newNote.trim();


    saveChapterAnnotations(
        annotations
    );


    renderNotes();

}


function deleteNote(id){

    if(
        !confirm(
            "Delete this note?"
        )
    ){

        return;

    }


    let annotations =
        getChapterAnnotations();


    annotations =
        annotations.filter(
            function(annotation){

                return annotation.id !== id;

            }
        );


    saveChapterAnnotations(
        annotations
    );


    /*
       Rebuild the chapter so the
       saved annotation state is clean.
    */

    const chapter =
        chapters[
            selectedChapterIndex
        ];


    const content =
        chapter.content ||
        "";


    if(
        /<\/?[a-z][\s\S]*>/i.test(
            content
        )
    ){

        $("readerStory")
            .innerHTML =
                content;

    }else{

        $("readerStory")
            .textContent =
                content;

    }


    loadAnnotations();

    renderNotes();

}


/* =========================================================
   COMMENTS
========================================================= */

async function loadComments(){

    if(
        selectedChapterIndex < 0
    ){

        return;

    }


    const chapter =
        chapters[
            selectedChapterIndex
        ];


    const result =
        await supabaseClient
            .from("comments")
            .select(
                "id,name,content,created_at"
            )
            .eq(
                "target_type",
                "chapter"
            )
            .eq(
                "target_id",
                chapter.id
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(result.error){

        console.error(
            result.error
        );


        $("commentsList")
            .innerHTML =
                '<div class="empty-message">' +
                "Comments could not be loaded." +
                "</div>";

        return;

    }


    renderComments(
        result.data || []
    );

}


function renderComments(
    comments
){

    const list =
        $("commentsList");


    list.innerHTML =
        "";


    if(!comments.length){

        list.innerHTML =
            '<div class="empty-message">' +
            "No comments yet. Be the first." +
            "</div>";

        return;

    }


    comments.forEach(
        function(comment){

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "comment-card";


            const date =
                comment.created_at
                    ? new Date(
                        comment.created_at
                    ).toLocaleDateString(
                        undefined,
                        {
                            year:"numeric",
                            month:"short",
                            day:"numeric"
                        }
                    )
                    : "";


            card.innerHTML =

                '<div class="comment-head">' +

                    '<div class="comment-author">' +
                        escapeHTML(
                            comment.name ||
                            "Reader"
                        ) +
                    "</div>" +

                    '<div class="comment-date">' +
                        escapeHTML(
                            date
                        ) +
                    "</div>" +

                "</div>" +

                '<p class="comment-text">' +
                    escapeHTML(
                        comment.content ||
                        ""
                    ) +
                "</p>" +

                '<div class="comment-actions">' +

                    '<button ' +
                        'class="comment-delete" ' +
                        'type="button" ' +
                        'data-comment-id="' +
                            escapeAttribute(
                                comment.id
                            ) +
                        '"' +
                    '>' +
                        "Delete" +
                    "</button>" +

                "</div>";


            list.appendChild(
                card
            );

        }
    );


    document
        .querySelectorAll(
            ".comment-delete"
        )
        .forEach(
            function(button){

                button.onclick =
                    async function(){

                        const id =
                            this.dataset.commentId;


                        if(
                            !confirm(
                                "Delete this comment?"
                            )
                        ){

                            return;

                        }


                        const result =
                            await supabaseClient
                                .from("comments")
                                .delete()
                                .eq(
                                    "id",
                                    id
                                );


                        if(result.error){

                            console.error(
                                result.error
                            );

                            alert(
                                "The comment could not be deleted."
                            );

                            return;

                        }


                        loadComments();

                    };

            }
        );

}


/* =========================================================
   COMMENT FORM
========================================================= */

$("commentForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const status =
                $("commentStatus");


            const name =
                $("commentName")
                    .value
                    .trim();


            const content =
                $("commentContent")
                    .value
                    .trim();


            if(!name){

                status.textContent =
                    "Your nickname is missing.";

                return;

            }


            if(!content){

                status.textContent =
                    "Please write a comment.";

                return;

            }


            if(
                selectedChapterIndex < 0
            ){

                status.textContent =
                    "No chapter is selected.";

                return;

            }


            const chapter =
                chapters[
                    selectedChapterIndex
                ];


            if(
                !chapter ||
                !chapter.id
            ){

                status.textContent =
                    "The chapter could not be found.";

                return;

            }


            status.textContent =
                "Posting…";


            try{

                const result =
                    await supabaseClient
                        .from("comments")
                        .insert({

                            target_type:
                                "chapter",

                            target_id:
                                chapter.id,

                            name:
                                name,

                            content:
                                content

                        });


                if(result.error){

                    console.error(
                        "COMMENT ERROR:",
                        result.error
                    );

                    status.textContent =
                        "Could not post: " +
                        result.error.message;

                    return;

                }


                $("commentContent")
                    .value =
                        "";


                $("commentName")
                    .value =
                        window.readerNickname ||
                        name;


                status.textContent =
                    "Comment posted.";


                await loadComments();


            }catch(error){

                console.error(
                    "COMMENT ERROR:",
                    error
                );


                status.textContent =
                    "Could not post: " +
                    (
                        error.message ||
                        "Unknown error"
                    );

            }

        }
    );


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


function escapeAttribute(value){

    return escapeHTML(
        value
    ).replace(
        /"/g,
        "&quot;"
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    $("loadingMessage")
        .classList
        .add("hidden");


    $("bookContent")
        .classList
        .add("hidden");


    $("errorMessage")
        .classList
        .remove("hidden");


    $("errorText")
        .textContent =
            message;

}


/* =========================================================
   START
========================================================= */

window.readerAuthReady
    .then(
        function(){

            const commentNameElement =
                document.getElementById(
                    "commentName"
                );


            if(
                commentNameElement &&
                window.readerNickname
            ){

                commentNameElement.value =
                    window.readerNickname;

            }


            loadStory();

        }
    )
    .catch(
        function(error){

            console.error(
                error
            );


            showError(
                "Something went wrong while opening this story."
            );

        }
    );

</script>
