<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HED · Story Reader</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="reader-auth.js"></script>

<style>

/* =========================================================
   HED READER
========================================================= */

:root{
    --brown:#4a352b;
    --brown-dark:#382920;
    --cream:#f5efe6;
    --paper:#fbf8f3;
    --green:#68745d;
    --pink:#c58f91;
    --pink-dark:#a87578;
    --text:#342b26;
    --muted:#8b8178;
    --line:#ddd2c5;
    --soft:#eee6dc;
    --white:#ffffff;
    --shadow:0 12px 35px rgba(74,53,43,.08);

    --reader-width:780px;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--cream);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{
    position:sticky;
    top:0;
    z-index:50;

    background:rgba(251,248,243,.96);
    border-bottom:1px solid var(--line);

    backdrop-filter:blur(8px);
}

.header-inner{
    max-width:1120px;
    min-height:64px;

    margin:0 auto;
    padding:11px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    color:var(--brown);
    text-decoration:none;

    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    font-weight:700;
    letter-spacing:.02em;
}

.brand span{
    color:var(--pink);
}

.back-link{
    color:var(--green);
    text-decoration:none;
    font-size:12px;
}

.back-link:hover{
    color:var(--pink-dark);
}


/* =========================================================
   PAGE
========================================================= */

.book-page{
    max-width:1120px;

    margin:0 auto;
    padding:42px 28px 70px;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.page-message{
    max-width:700px;

    margin:100px auto;

    text-align:center;
    color:var(--muted);
}

.page-message h2{
    margin:0 0 8px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
}

.page-message p{
    margin:0;
    line-height:1.6;
}


/* =========================================================
   STORY INTRO
========================================================= */

.book-intro{
    display:grid;
    grid-template-columns:210px minmax(0,1fr);
    gap:34px;
    align-items:start;

    margin-bottom:34px;
}

.cover-wrap{
    width:210px;
    height:270px;

    overflow:hidden;

    border:1px solid var(--line);
    background:var(--soft);

    box-shadow:var(--shadow);
}

.cover-wrap img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

.cover-placeholder{
    width:100%;
    height:100%;

    display:grid;
    place-items:center;

    padding:25px;

    color:var(--brown);

    text-align:center;

    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    line-height:1.35;
}

.book-info{
    min-width:0;
    padding-top:4px;
}

.eyebrow{
    color:var(--pink-dark);

    font-size:9px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
}

.book-info h1{
    margin:7px 0 7px;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(34px,5vw,56px);
    line-height:1.04;
}

.book-author{
    margin-bottom:17px;

    color:var(--muted);

    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
}

.book-description{
    max-width:720px;

    margin:0;

    color:#665c54;

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    line-height:1.65;
}

.book-description-wrap{
    margin-top:10px;
}

.book-description-more{
    display:inline;

    margin-left:4px;
    padding:0;

    border:0;
    background:none;

    color:var(--pink-dark);

    font-family:inherit;
    font-size:inherit;
    font-weight:600;

    cursor:pointer;
}

.book-description-more:hover{
    text-decoration:underline;
}

.book-meta{
    display:flex;
    flex-wrap:wrap;
    margin-top:16px;
}

.meta-pill{
    padding:6px 9px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--muted);

    font-size:9px;
    letter-spacing:.06em;
}


/* =========================================================
   READER
========================================================= */

.reader-shell{
    display:none;

    padding-top:18px;

    border-top:1px solid var(--line);
}

.reader-shell.open{
    display:block;
}


/* =========================================================
   MINIMAL READER BAR
========================================================= */

.reader-topbar{
    max-width:var(--reader-width);

    margin:0 auto 12px;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    gap:6px;
}

.reader-mini-button{
    width:34px;
    height:34px;

    padding:0;

    border:1px solid var(--line);
    border-radius:50%;

    background:rgba(251,248,243,.9);

    color:var(--brown);

    font-size:12px;
    font-weight:700;

    transition:.15s ease;
}

.reader-mini-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.reader-mini-button.bookmarked{
    background:var(--pink);
    border-color:var(--pink);
    color:white;
}


/* =========================================================
   OLD CONTROLS
========================================================= */

.reader-controls{
    display:none;
}


/* =========================================================
   READER LAYOUT
========================================================= */

.reader-layout{
    max-width:1120px;

    margin:0 auto;

    display:grid;
    grid-template-columns:235px minmax(0,1fr);

    gap:15px;
    align-items:start;
}

.reader-layout.chapter-closed{
    grid-template-columns:minmax(0,1fr);
}


/* =========================================================
   CHAPTER DRAWER
========================================================= */

.chapter-drawer{
    position:sticky;
    top:82px;

    max-height:calc(100vh - 105px);

    overflow-y:auto;

    padding:13px;

    border:1px solid var(--line);

    background:rgba(251,248,243,.97);

    box-shadow:var(--shadow);
}

.chapter-drawer:not(.open){
    display:none;
}

.chapter-drawer-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:10px;

    padding-bottom:9px;
    margin-bottom:7px;

    border-bottom:1px solid var(--line);
}

.chapter-drawer h2{
    margin:3px 0 0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
}

.drawer-close{
    width:28px;
    height:28px;

    padding:0;

    border:0;
    background:transparent;

    color:var(--muted);

    font-size:20px;
    line-height:1;
}

.drawer-close:hover{
    color:var(--pink);
}

.chapter-list{
    display:grid;
    gap:4px;
}

.chapter-button{
    width:100%;

    padding:10px 9px;

    display:flex;
    align-items:center;
    gap:10px;

    border:1px solid transparent;
    background:transparent;

    color:var(--text);

    text-align:left;
}

.chapter-button:hover{
    background:var(--soft);
    border-color:var(--line);
}

.chapter-button.active{
    background:#eee5dc;
    border-color:var(--line);
}

.chapter-number{
    min-width:28px;

    color:var(--pink-dark);

    font-size:9px;
    letter-spacing:.1em;
}

.chapter-title-small{
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    line-height:1.35;
}


/* =========================================================
   READER COLUMN
========================================================= */

.reader-column{
    min-width:0;
}


/* =========================================================
   READING PREFERENCES
========================================================= */

.preferences{
    display:none;

    position:relative;

    margin:0 auto 12px;

    max-width:var(--reader-width);

    padding:15px;

    border:1px solid var(--line);
    background:rgba(251,248,243,.98);

    box-shadow:0 8px 25px rgba(74,53,43,.08);
}

.preferences.open{
    display:block;
}

.preferences-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.preferences-title{
    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
}

.preferences-grid{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px 15px;
}

.preference-group{
    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:6px;

    min-height:30px;
}

.preference-label{
    color:var(--muted);

    font-size:9px;
    letter-spacing:.1em;
    text-transform:uppercase;

    white-space:nowrap;
}

.pref-select{
    padding:6px 8px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-size:11px;
}

.pref-select:focus{
    outline:none;
    border-color:var(--pink);
}

.pref-size-wrap{
    display:flex;
    align-items:center;
    gap:6px;
}

.pref-range{
    width:120px;

    accent-color:var(--pink);

    cursor:pointer;
}

.pref-size-value{
    min-width:38px;

    color:var(--brown);

    font-size:10px;
    text-align:right;
}

.pref-button{
    min-width:30px;
    min-height:30px;

    padding:0 8px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    font-size:11px;
}

.pref-button:hover{
    border-color:var(--pink);
}

.pref-button.active{
    border-color:var(--pink);
    background:var(--pink);
    color:white;
}


/* =========================================================
   READER PAPER
========================================================= */

.reader-paper{
    max-width:var(--reader-width);

    margin:0 auto;

    padding:42px 48px 48px;

    border:1px solid var(--line);

    background:var(--paper);

    box-shadow:var(--shadow);
}

.reader-paper-head{
    padding-bottom:18px;
    margin-bottom:24px;

    border-bottom:1px solid var(--line);
}

.reader-chapter-label{
    color:var(--pink-dark);

    font-size:9px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
}

.reader-paper h1{
    margin:7px 0 0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:31px;
    line-height:1.15;
}

.reader-story{
    color:var(--text);

    font-family:var(--reader-font,Georgia,"Times New Roman",serif);
    font-size:16px;
    line-height:1.7;

    white-space:normal;
}

.reader-story p{
    margin:0 0 1.1em;
}

.reader-story p:last-child{
    margin-bottom:0;
}

.reader-story mark{
    padding:1px 2px;

    background:#f5df9b;
    color:inherit;
}

.reader-story u{
    text-decoration-thickness:1px;
    text-decoration-color:var(--pink-dark);
    text-underline-offset:3px;
}


/* =========================================================
   READER FOOTER
========================================================= */

.reader-footer{
    max-width:var(--reader-width);

    margin:12px auto 0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;
}

.reader-nav-button{
    padding:8px 11px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    font-size:10px;
}

.reader-nav-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.reader-nav-button:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================================================
   NOTES
========================================================= */

.notes-panel{
    display:none;

    max-width:var(--reader-width);

    margin:12px auto 0;

    padding:15px;

    border:1px solid var(--line);

    background:rgba(251,248,243,.98);

    box-shadow:0 8px 25px rgba(74,53,43,.08);
}

.notes-panel.open{
    display:block;
}

.notes-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:10px;
}

.notes-title{
    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
}

.notes-textarea{
    width:100%;
    min-height:110px;

    padding:10px;

    resize:vertical;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;
    line-height:1.5;

    outline:none;
}

.notes-textarea:focus{
    border-color:var(--pink);
}

.notes-actions{
    display:flex;
    justify-content:flex-end;

    margin-top:8px;
}

.notes-save{
    padding:8px 12px;

    border:0;
    background:var(--pink);

    color:white;

    font-size:10px;
}

.notes-save:hover{
    background:var(--pink-dark);
}

.notes-status{
    min-height:13px;

    margin-top:6px;

    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   SELECTION HIGHLIGHT MENU
========================================================= */

.selection-highlight-menu{
    position:fixed;

    z-index:100;

    display:none;

    padding:5px;

    border:1px solid var(--line);

    background:var(--paper);

    box-shadow:0 8px 25px rgba(74,53,43,.15);
}

.selection-highlight-menu.open{
    display:flex;
    gap:4px;
}

.selection-highlight-menu button{
    padding:6px 8px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--brown);

    font-size:10px;
}

.selection-highlight-menu button:hover{
    border-color:var(--pink);
}


/* =========================================================
   COMMENTS
========================================================= */

.comments-section{
    max-width:var(--reader-width);

    margin:25px auto 0;

    padding-top:20px;

    border-top:1px solid var(--line);
}

.comments-title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.comments-title{
    margin:0;

    color:var(--brown);

    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
}

.comments-subtitle{
    color:var(--muted);

    font-size:10px;
}

.comments-list{
    display:grid;
    gap:8px;
}

.comment-card{
    padding:12px;

    border:1px solid var(--line);

    background:rgba(251,248,243,.8);
}

.comment-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;

    gap:10px;

    margin-bottom:5px;
}

.comment-author{
    color:var(--brown);

    font-size:11px;
    font-weight:700;
}

.comment-date{
    color:var(--muted);

    font-size:9px;
}

.comment-text{
    margin:0;

    color:var(--text);

    font-family:Georgia,"Times New Roman",serif;
    font-size:12px;
    line-height:1.5;
}

.comment-actions{
    display:flex;
    justify-content:flex-end;

    margin-top:7px;
}

.comment-delete{
    padding:0;

    border:0;
    background:none;

    color:var(--muted);

    font-size:9px;
}

.comment-delete:hover{
    color:var(--pink-dark);
}

.comment-form{
    margin-top:12px;

    padding:12px;

    border:1px solid var(--line);
    background:rgba(251,248,243,.8);
}

.comment-form-grid{
    display:grid;
    grid-template-columns:170px minmax(0,1fr);

    gap:8px;
}

.comment-input,
.comment-textarea{
    width:100%;

    padding:9px 10px;

    border:1px solid var(--line);
    background:var(--paper);

    color:var(--text);

    outline:none;

    font-size:12px;
}

.comment-input:focus,
.comment-textarea:focus{
    border-color:var(--pink);
}

.comment-textarea{
    min-height:72px;

    resize:vertical;

    font-family:Georgia,"Times New Roman",serif;
    line-height:1.5;
}

.comment-form-bottom{
    display:flex;
    justify-content:flex-end;

    margin-top:8px;
}

.comment-submit{
    padding:9px 14px;

    border:0;
    background:var(--pink);

    color:white;

    font-size:11px;
}

.comment-submit:hover{
    background:var(--pink-dark);
}

.comment-status{
    min-height:13px;

    margin-top:6px;

    color:var(--muted);

    font-size:10px;
}


/* =========================================================
   EMPTY MESSAGE
========================================================= */

.empty-message{
    padding:15px;

    color:var(--muted);

    font-size:11px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

    .reader-layout{
        grid-template-columns:1fr;
    }

    .chapter-drawer{
        position:relative;
        top:auto;

        max-height:280px;
    }
}

@media(max-width:760px){

    .header-inner{
        padding:10px 17px;
    }

    .book-page{
        padding:28px 17px 50px;
    }

    .book-intro{
        grid-template-columns:1fr;
        gap:20px;
    }

    .cover-wrap{
        width:165px;
        height:215px;
    }

    .book-info h1{
        font-size:38px;
    }

    .book-description{
        font-size:16px;
    }

    .reader-paper{
        padding:26px 18px 28px;
    }

    .reader-paper h1{
        font-size:25px;
    }

    .reader-story{
        font-size:16px;
    }

    .preferences{
        padding:12px;
    }

    .pref-range{
        width:105px;
    }

    .comment-form-grid{
        grid-template-columns:1fr;
    }

    .comments-title-row{
        align-items:flex-start;
        flex-direction:column;
        gap:3px;
    }

    .selection-highlight-menu{
        max-width:calc(100vw - 20px);
    }
}

.favorite-button{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
    padding:7px 11px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--brown);
    font-size:11px;
    cursor:pointer;
}

.favorite-button:hover{
    border-color:var(--pink);
    color:var(--pink-dark);
}

.favorite-button.active{
    border-color:var(--pink);
    color:var(--pink-dark);
    background:#fff4f4;
}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

    <div class="header-inner">

        <a
            class="brand"
            href="hed.html"
        >
            HED
        </a>

        <a
            href="stories.html"
            class="back-link"
        >
            ← Back to Stories
        </a>

    </div>

</header>



<main class="book-page">


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        id="loadingMessage"
        class="page-message"
    >
        Loading story…
    </div>



    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        id="errorMessage"
        class="page-message hidden"
    >

        <h2>Story unavailable</h2>

        <p id="errorText">
            Something went wrong while opening this story.
        </p>

    </div>



    <!-- =====================================================
         STORY CONTENT
    ====================================================== -->

    <section
        id="bookContent"
        class="hidden"
    >


        <!-- =================================================
             STORY INTRO
        ================================================== -->

        <section class="book-intro">

            <div
                class="cover-wrap"
                id="coverWrap"
            >

                <div
                    id="coverPlaceholder"
                    class="cover-placeholder"
                >
                    Your story cover
                </div>

            </div>


            <div class="book-info">

                <div class="eyebrow">
                    HED STORY
                </div>

                <h1 id="storyTitle"></h1>

               <div id="storyAuthor" class="book-author"></div>

<button
    id="favoriteButton"
    class="favorite-button"
    type="button"
    aria-pressed="false"
>
    ♡ Favorite
</button>

<div id="storyDescription" class="book-description"></div>

                <div class="book-meta">

                    <span
                        id="chapterCountPill"
                        class="meta-pill"
                    >
                        0 chapters
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             READER
        ================================================== -->

        <section
            id="readerShell"
            class="reader-shell"
        >


            <!-- =================================================
                 MINIMAL READER CONTROLS
            ================================================== -->

            <div class="reader-topbar">

                <button
                    id="chapterToggleButton"
                    class="reader-mini-button"
                    type="button"
                    aria-label="Open chapters"
                    title="Chapters"
                >
                    ☰
                </button>

                <button
                    id="notesToggleButton"
                    class="reader-mini-button"
                    type="button"
                    aria-label="Open notes"
                    title="Notes"
                >
                    📝
                </button>

                <button
                    id="bookmarkButton"
                    class="reader-mini-button"
                    type="button"
                    aria-label="Bookmark chapter"
                    title="Bookmark chapter"
                >
                    🔖
                </button>

                <button
                    id="preferencesToggleButton"
                    class="reader-mini-button"
                    type="button"
                    aria-label="Reading preferences"
                    title="Reading preferences"
                >
                    Aa
                </button>

            </div>



            <div
                class="reader-layout chapter-closed"
                id="readerLayout"
            >

<script>

/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
    window.supabaseClient ||
    supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
    );


/* =========================================================
   HELPERS
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   STORY ID
========================================================= */

const storyId =
    new URLSearchParams(
        window.location.search
    ).get("id");


/* =========================================================
   STATE
========================================================= */

let story = null;

let chapters = [];

let selectedChapterIndex = -1;

let savedSelectionRange = null;


/* =========================================================
   READER DEFAULTS
========================================================= */

const defaultReaderPreferences = {

    fontFamily:"serif",

    fontSize:16,

    lineHeight:1.7,

    width:"780px",

    theme:"cream"

};


/* =========================================================
   STORAGE HELPERS
========================================================= */

function getStorageKey(type,chapterId){

    return (
        "hed_" +
        type +
        "_" +
        chapterId
    );

}


function getChapterAnnotations(){

    if(selectedChapterIndex < 0){

        return [];

    }

    const chapter =
        chapters[selectedChapterIndex];

    if(!chapter){

        return [];

    }

    try{

        return JSON.parse(
            localStorage.getItem(
                getStorageKey(
                    "annotations",
                    chapter.id
                )
            )
        ) || [];

    }catch(error){

        return [];

    }

}


function saveChapterAnnotations(annotations){

    if(selectedChapterIndex < 0){

        return;

    }

    const chapter =
        chapters[selectedChapterIndex];

    if(!chapter){

        return;

    }

    localStorage.setItem(
        getStorageKey(
            "annotations",
            chapter.id
        ),
        JSON.stringify(
            annotations
        )
    );

}


/* =========================================================
   BOOKMARKS
========================================================= */

function getBookmarks(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "hed_bookmarks"
            )
        ) || [];

    }catch(error){

        return [];

    }

}


function saveBookmarks(bookmarks){

    localStorage.setItem(
        "hed_bookmarks",
        JSON.stringify(
            bookmarks
        )
    );

}


function isCurrentChapterBookmarked(){

    if(selectedChapterIndex < 0){

        return false;

    }

    const chapter =
        chapters[selectedChapterIndex];

    return getBookmarks().includes(
        chapter.id
    );

}


function updateBookmarkButton(){

    const button =
        $("bookmarkButton");

    const bookmarked =
        isCurrentChapterBookmarked();

    button.classList.toggle(
        "bookmarked",
        bookmarked
    );

    button.textContent =
        "🔖";

    button.title =
        bookmarked
            ? "Remove bookmark"
            : "Bookmark chapter";

}


$("bookmarkButton").onclick =
    function(){

        if(selectedChapterIndex < 0){

            return;

        }

        const chapter =
            chapters[selectedChapterIndex];

        let bookmarks =
            getBookmarks();

        if(bookmarks.includes(chapter.id)){

            bookmarks =
                bookmarks.filter(
                    function(id){
                        return id !== chapter.id;
                    }
                );

        }else{

            bookmarks.push(
                chapter.id
            );

        }

        saveBookmarks(
            bookmarks
        );

        updateBookmarkButton();

    };


/* =========================================================
   LOAD STORY
========================================================= */

async function loadStory(){

    if(!storyId){

        showError(
            "No story was selected. Please return to HED and choose a story."
        );

        return;

    }


    const storyResult =
        await supabaseClient
            .from("stories")
            .select(
                "id,title,author,description,cover_url,created_at"
            )
            .eq(
                "id",
                storyId
            )
            .single();


    if(storyResult.error){

        console.error(
            storyResult.error
        );

        showError(
            "We couldn't find this story."
        );

        return;

    }


    story =
        storyResult.data;


    renderStoryInfo();


    const chapterResult =
        await supabaseClient
            .from("chapters")
            .select(
                "id,story_id,title,content,chapter_order,created_at"
            )
            .eq(
                "story_id",
                storyId
            )
            .order(
                "chapter_order",
                {
                    ascending:true
                }
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(chapterResult.error){

        console.error(
            chapterResult.error
        );

        showError(
            "The story opened, but its chapters could not be loaded."
        );

        return;

    }


    chapters =
        chapterResult.data || [];


    renderChapterList();


    $("chapterCountPill")
        .textContent =
            chapters.length +
            (
                chapters.length === 1
                    ? " chapter"
                    : " chapters"
            );


    $("loadingMessage")
        .classList
        .add("hidden");


    $("bookContent")
        .classList
        .remove("hidden");


    if(chapters.length){

        openChapter(0);

    }else{

        $("readerShell")
            .classList
            .add("open");

        $("readerChapterLabel")
            .textContent =
                "NO CHAPTERS";

        $("readerChapterTitle")
            .textContent =
                "There are no chapters yet.";

        $("readerStory")
            .innerHTML =
                "<p>This story does not have any chapters yet.</p>";

    }


    applySavedReaderPreferences();

}


/* =========================================================
   STORY INFO
========================================================= */

function renderStoryInfo(){

    $("storyTitle")
        .textContent =
            story.title || "Untitled Story";


    $("storyAuthor")
        .textContent =
            story.author
                ? "by " + story.author
                : "";


    const description =
        story.description ||
        "";


    $("storyDescription")
        .textContent =
            description;


    if(story.cover_url){

        const image =
            document.createElement(
                "img"
            );

        image.src =
            story.cover_url;

        image.alt =
            story.title
                ? story.title + " cover"
                : "Story cover";

        $("coverWrap")
            .innerHTML =
                "";

        $("coverWrap")
            .appendChild(
                image
            );

    }

}


/* =========================================================
   CHAPTER LIST
========================================================= */

function renderChapterList(){

    const list =
        $("chapterList");

    list.innerHTML =
        "";


    chapters.forEach(
        function(chapter,index){

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "chapter-button";

            button.innerHTML =

                '<span class="chapter-number">' +
                    String(index + 1).padStart(2,"0") +
                "</span>" +

                '<span class="chapter-title-small">' +
                    escapeHTML(
                        chapter.title ||
                        "Untitled Chapter"
                    ) +
                "</span>";


            button.onclick =
                function(){

                    openChapter(
                        index
                    );

                    setChapterDrawerOpen(
                        false
                    );

                };


            list.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHAPTER DRAWER
========================================================= */

function setChapterDrawerOpen(open){

    $("chapterDrawer")
        .classList
        .toggle(
            "open",
            open
        );

    $("readerLayout")
        .classList
        .toggle(
            "chapter-closed",
            !open
        );

}


$("chapterToggleButton").onclick =
    function(){

        const open =
            !$("chapterDrawer")
                .classList
                .contains(
                    "open"
                );

        setChapterDrawerOpen(
            open
        );

    };


$("closeChapterDrawer").onclick =
    function(){

        setChapterDrawerOpen(
            false
        );

    };


/* =========================================================
   OPEN CHAPTER
========================================================= */

function openChapter(index){

    if(
        index < 0 ||
        index >= chapters.length
    ){

        return;

    }


    selectedChapterIndex =
        index;


    const chapter =
        chapters[index];


    $("readerShell")
        .classList
        .add("open");


    $("readerChapterLabel")
        .textContent =
            "CHAPTER " +
            String(index + 1).padStart(2,"0");


    $("readerChapterTitle")
        .textContent =
            chapter.title ||
            "Untitled Chapter";


    renderChapterContent(
        chapter.content || ""
    );


    updateChapterButtons();


    updateBookmarkButton();


    loadChapterNotes();


    loadComments();


    window.scrollTo({
        top:$("readerShell").offsetTop - 80,
        behavior:"smooth"
    });

}


/* =========================================================
   CHAPTER BUTTON STATES
========================================================= */

function updateChapterButtons(){

    document
        .querySelectorAll(
            ".chapter-button"
        )
        .forEach(
            function(button,index){

                button.classList.toggle(
                    "active",
                    index === selectedChapterIndex
                );

            }
        );


    $("previousChapterButton")
        .disabled =
            selectedChapterIndex <= 0;


    $("nextChapterButton")
        .disabled =
            selectedChapterIndex >=
            chapters.length - 1;

}


$("previousChapterButton").onclick =
    function(){

        if(selectedChapterIndex > 0){

            openChapter(
                selectedChapterIndex - 1
            );

        }

    };


$("nextChapterButton").onclick =
    function(){

        if(
            selectedChapterIndex <
            chapters.length - 1
        ){

            openChapter(
                selectedChapterIndex + 1
            );

        }

    };


/* =========================================================
   CHAPTER CONTENT
========================================================= */

function renderChapterContent(content){

    const reader =
        $("readerStory");


    reader.innerHTML =
        "";


    const lines =
        String(content)
            .split(/\r?\n/);


    let paragraph = [];


    function flushParagraph(){

        if(!paragraph.length){

            return;

        }

        const p =
            document.createElement(
                "p"
            );

        p.innerHTML =
            formatStoryText(
                paragraph.join("\n")
            );

        reader.appendChild(
            p
        );

        paragraph = [];

    }


    lines.forEach(
        function(line){

            if(line.trim() === ""){

                flushParagraph();

            }else{

                paragraph.push(
                    line
                );

            }

        }
    );


    flushParagraph();


    applyChapterAnnotations();

}


/* =========================================================
   STORY TEXT FORMATTING
========================================================= */

function formatStoryText(text){

    return escapeHTML(
        text
    )
    .replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    )
    .replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    )
    .replace(
        /\n/g,
        "<br>"
    );

}


/* =========================================================
   ANNOTATIONS
========================================================= */

function applyChapterAnnotations(){

    const annotations =
        getChapterAnnotations();


    if(!annotations.length){

        return;

    }


    const reader =
        $("readerStory");


    annotations.forEach(
        function(annotation){

            if(
                !annotation ||
                !annotation.text
            ){

                return;

            }


            const walker =
                document.createTreeWalker(
                    reader,
                    NodeFilter.SHOW_TEXT
                );


            let node;


            while(
                node =
                    walker.nextNode()
            ){

                const value =
                    node.nodeValue;


                const index =
                    value.indexOf(
                        annotation.text
                    );


                if(index === -1){

                    continue;

                }


                const before =
                    document.createTextNode(
                        value.slice(
                            0,
                            index
                        )
                    );


                const after =
                    document.createTextNode(
                        value.slice(
                            index +
                            annotation.text.length
                        )
                    );


                let replacement;


                if(
                    annotation.type ===
                    "underline"
                ){

                    replacement =
                        document.createElement(
                            "u"
                        );

                }else{

                    replacement =
                        document.createElement(
                            "mark"
                        );

                }


                replacement.textContent =
                    annotation.text;


                node.parentNode
                    .insertBefore(
                        before,
                        node
                    );


                node.parentNode
                    .insertBefore(
                        replacement,
                        node
                    );


                node.parentNode
                    .insertBefore(
                        after,
                        node
                    );


                node.parentNode
                    .removeChild(
                        node
                    );


                break;

            }

        }
    );

}


/* =========================================================
   NOTES PANEL
========================================================= */

function setNotesOpen(open){

    $("notesPanel")
        .classList
        .toggle(
            "open",
            open
        );

}


$("notesToggleButton").onclick =
    function(){

        const open =
            !$("notesPanel")
                .classList
                .contains(
                    "open"
                );

        setNotesOpen(
            open
        );

    };


$("closeNotes").onclick =
    function(){

        setNotesOpen(
            false
        );

    };


function getNotesKey(){

    if(selectedChapterIndex < 0){

        return null;

    }


    const chapter =
        chapters[selectedChapterIndex];


    if(!chapter){

        return null;

    }


    return getStorageKey(
        "notes",
        chapter.id
    );

}


function loadChapterNotes(){

    const key =
        getNotesKey();


    if(!key){

        $("notesTextarea")
            .value =
                "";

        return;

    }


    $("notesTextarea")
        .value =
            localStorage.getItem(
                key
            ) || "";

    $("notesStatus")
        .textContent =
            "";

}


$("saveNotes").onclick =
    function(){

        const key =
            getNotesKey();


        if(!key){

            return;

        }


        localStorage.setItem(
            key,
            $("notesTextarea")
                .value
        );


        $("notesStatus")
            .textContent =
                "Notes saved.";

    };


/* =========================================================
   READER PREFERENCES
========================================================= */

function getReaderPreferences(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "hed_reader_preferences"
                )
            );


        return {
            ...defaultReaderPreferences,
            ...(saved || {})
        };

    }catch(error){

        return {
            ...defaultReaderPreferences
        };

    }

}


function saveReaderPreferences(
    preferences
){

    localStorage.setItem(
        "hed_reader_preferences",
        JSON.stringify(
            preferences
        )
    );

}


function applySavedReaderPreferences(){

    const preferences =
        getReaderPreferences();


    applyFont(
        preferences.fontFamily
    );


    applyFontSize(
        preferences.fontSize
    );


    applyLineHeight(
        preferences.lineHeight
    );


    applyReaderWidth(
        preferences.width
    );


    applyTheme(
        preferences.theme
    );


    $("fontFamily")
        .value =
            preferences.fontFamily;


    $("fontSize")
        .value =
            preferences.fontSize;


    $("fontSizeValue")
        .textContent =
            preferences.fontSize +
            "px";


    $("lineHeight")
        .value =
            preferences.lineHeight;


    updatePreferenceButtons();

}


/* =========================================================
   FONT
========================================================= */

function applyFont(font){

    const fonts = {

        serif:
            'Georgia,"Times New Roman",serif',

        sans:
            'Arial,Helvetica,sans-serif',

        clean:
            '"Trebuchet MS",Arial,sans-serif',

        mono:
            '"Courier New",monospace'

    };


    $("readerStory")
        .style
        .setProperty(
            "--reader-font",
            fonts[font] ||
            fonts.serif
        );

}


$("fontFamily")
    .addEventListener(
        "change",
        function(){

            const preferences =
                getReaderPreferences();


            preferences.fontFamily =
                this.value;


            saveReaderPreferences(
                preferences
            );


            applyFont(
                this.value
            );

        }
    );


/* =========================================================
   FONT SIZE
========================================================= */

function applyFontSize(size){

    $("readerStory")
        .style
        .fontSize =
            size + "px";


    $("fontSizeValue")
        .textContent =
            size + "px";

}


$("fontSize")
    .addEventListener(
        "input",
        function(){

            const size =
                Number(
                    this.value
                );


            const preferences =
                getReaderPreferences();


            preferences.fontSize =
                size;


            saveReaderPreferences(
                preferences
            );


            applyFontSize(
                size
            );

        }
    );


/* =========================================================
   LINE HEIGHT
========================================================= */

function applyLineHeight(lineHeight){

    $("readerStory")
        .style
        .lineHeight =
            lineHeight;

}


$("lineHeight")
    .addEventListener(
        "change",
        function(){

            const preferences =
                getReaderPreferences();


            preferences.lineHeight =
                Number(
                    this.value
                );


            saveReaderPreferences(
                preferences
            );


            applyLineHeight(
                Number(
                    this.value
                )
            );

        }
    );


/* =========================================================
   READER WIDTH
========================================================= */

function applyReaderWidth(width){

    document.documentElement
        .style
        .setProperty(
            "--reader-width",
            width
        );

}


function updatePreferenceButtons(){

    const preferences =
        getReaderPreferences();


    document
        .querySelectorAll(
            "[id^='width']"
        )
        .forEach(
            function(button){

                button.classList.remove(
                    "active"
                );

            }
        );


    if(
        preferences.width ===
        "680px"
    ){

        $("widthNarrow")
            .classList
            .add("active");

    }else if(
        preferences.width ===
        "880px"
    ){

        $("widthWide")
            .classList
            .add("active");

    }else{

        $("widthNormal")
            .classList
            .add("active");

    }


    document
        .querySelectorAll(
            "[id^='theme']"
        )
        .forEach(
            function(button){

                button.classList.remove(
                    "active"
                );

            }
        );


    if(
        preferences.theme ===
        "white"
    ){

        $("themeWhite")
            .classList
            .add("active");

    }else if(
        preferences.theme ===
        "dark"
    ){

        $("themeDark")
            .classList
            .add("active");

    }else{

        $("themeCream")
            .classList
            .add("active");

    }

}


$("widthNarrow").onclick =
    function(){

        setReaderWidth(
            "680px"
        );

    };


$("widthNormal").onclick =
    function(){

        setReaderWidth(
            "780px"
        );

    };


$("widthWide").onclick =
    function(){

        setReaderWidth(
            "880px"
        );

    };


function setReaderWidth(width){

    const preferences =
        getReaderPreferences();


    preferences.width =
        width;


    saveReaderPreferences(
        preferences
    );


    applyReaderWidth(
        width
    );


    updatePreferenceButtons();

}


/* =========================================================
   THEME
========================================================= */

function applyTheme(theme){

    const paper =
        $("readerPaper");


    if(theme === "dark"){

        paper.style.background =
            "#302b28";

        paper.style.color =
            "#eee8df";

        $("readerStory")
            .style
            .color =
                "#eee8df";

        $("readerChapterTitle")
            .style
            .color =
                "#f5eee5";

    }else if(theme === "white"){

        paper.style.background =
            "#ffffff";

        paper.style.color =
            "#342b26";

        $("readerStory")
            .style
            .color =
                "#342b26";

        $("readerChapterTitle")
            .style
            .color =
                "var(--brown)";

    }else{

        paper.style.background =
            "var(--paper)";

        paper.style.color =
            "var(--text)";

        $("readerStory")
            .style
            .color =
                "var(--text)";

        $("readerChapterTitle")
            .style
            .color =
                "var(--brown)";

    }

}


$("themeCream").onclick =
    function(){

        setReaderTheme(
            "cream"
        );

    };


$("themeWhite").onclick =
    function(){

        setReaderTheme(
            "white"
        );

    };


$("themeDark").onclick =
    function(){

        setReaderTheme(
            "dark"
        );

    };


function setReaderTheme(theme){

    const preferences =
        getReaderPreferences();


    preferences.theme =
        theme;


    saveReaderPreferences(
        preferences
    );


    applyTheme(
        theme
    );

/* =========================================================
   SELECTION
========================================================= */

function getSelectionText(){

    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0
    ){

        return "";

    }


    const text =
        selection
            .toString()
            .trim();


    return text;

}


function showSelectionMenu(){

    const text =
        getSelectionText();


    if(!text){

        hideSelectionMenu();

        return;

    }


    const selection =
        window.getSelection();


    const range =
        selection.getRangeAt(
            0
        );


    const rect =
        range.getBoundingClientRect();


    const menu =
        $("selectionHighlightMenu");


    menu.style.left =
        Math.max(
            10,
            Math.min(
                rect.left,
                window.innerWidth - 220
            )
        ) + "px";


    menu.style.top =
        Math.max(
            10,
            rect.top - 48
        ) + "px";


    menu.classList
        .add("open");


    savedSelectionRange =
        range.cloneRange();

}


function hideSelectionMenu(){

    $("selectionHighlightMenu")
        .classList
        .remove("open");

}


document.addEventListener(
    "mouseup",
    function(event){

        if(
            event.target.closest(
                "#selectionHighlightMenu"
            )
        ){

            return;

        }


        setTimeout(
            showSelectionMenu,
            10
        );

    }
);


document.addEventListener(
    "mousedown",
    function(event){

        if(
            !event.target.closest(
                "#selectionHighlightMenu"
            )
        ){

            hideSelectionMenu();

        }

    }
);


/* =========================================================
   ADD ANNOTATION
========================================================= */

function addAnnotation(
    type
){

    if(!savedSelectionRange){

        return;

    }


    const text =
        savedSelectionRange
            .toString()
            .trim();


    if(!text){

        return;

    }


    const annotations =
        getChapterAnnotations();


    annotations.push({

        id:
            Date.now().toString(),

        text:
            text,

        type:
            type

    });


    saveChapterAnnotations(
        annotations
    );


    hideSelectionMenu();


    const chapter =
        chapters[selectedChapterIndex];


    renderChapterContent(
        chapter.content || ""
    );

}


$("highlightSelectionButton").onclick =
    function(){

        addAnnotation(
            "highlight"
        );

    };


$("underlineSelectionButton").onclick =
    function(){

        addAnnotation(
            "underline"
        );

    };


$("noteSelectionButton").onclick =
    function(){

        addAnnotation(
            "note"
        );

        setNotesOpen(
            true
        );

    };


/* =========================================================
   COMMENTS
========================================================= */

async function loadComments(){

    if(selectedChapterIndex < 0){

        return;

    }


    const chapter =
        chapters[
            selectedChapterIndex
        ];


    if(
        !chapter ||
        !chapter.id
    ){

        return;

    }


    const result =
        await supabaseClient
            .from("comments")
            .select(
                "id,name,content,created_at,target_id,target_type"
            )
            .eq(
                "target_type",
                "chapter"
            )
            .eq(
                "target_id",
                chapter.id
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(result.error){

        console.error(
            result.error
        );


        $("commentsList")
            .innerHTML =
                '<div class="empty-message">' +
                "Comments could not be loaded." +
                "</div>";

        return;

    }


    renderComments(
        result.data || []
    );

}


function renderComments(
    comments
){

    const list =
        $("commentsList");


    list.innerHTML =
        "";


    if(!comments.length){

        list.innerHTML =
            '<div class="empty-message">' +
            "No comments yet. Be the first." +
            "</div>";

        return;

    }


    comments.forEach(
        function(comment){

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "comment-card";


            const date =
                comment.created_at
                    ? new Date(
                        comment.created_at
                    ).toLocaleDateString(
                        undefined,
                        {
                            year:"numeric",
                            month:"short",
                            day:"numeric"
                        }
                    )
                    : "";


            card.innerHTML =

                '<div class="comment-head">' +

                    '<div class="comment-author">' +
                        escapeHTML(
                            comment.name ||
                            "Reader"
                        ) +
                    "</div>" +

                    '<div class="comment-date">' +
                        escapeHTML(
                            date
                        ) +
                    "</div>" +

                "</div>" +

                '<p class="comment-text">' +
                    escapeHTML(
                        comment.content ||
                        ""
                    ) +
                "</p>" +

                '<div class="comment-actions">' +

                    '<button ' +
                        'class="comment-delete" ' +
                        'type="button" ' +
                        'data-comment-id="' +
                            escapeAttribute(
                                comment.id
                            ) +
                        '"' +
                    '>' +
                        "Delete" +
                    "</button>" +

                "</div>";


            list.appendChild(
                card
            );

        }
    );


    document
        .querySelectorAll(
            ".comment-delete"
        )
        .forEach(
            function(button){

                button.onclick =
                    async function(){

                        const id =
                            this.dataset.commentId;


                        if(
                            !confirm(
                                "Delete this comment?"
                            )
                        ){

                            return;

                        }


                        const result =
                            await supabaseClient
                                .from("comments")
                                .delete()
                                .eq(
                                    "id",
                                    id
                                );


                        if(result.error){

                            console.error(
                                result.error
                            );

                            alert(
                                "The comment could not be deleted."
                            );

                            return;

                        }


                        loadComments();

                    };

            }
        );

}


/* =========================================================
   COMMENT FORM
========================================================= */

$("commentForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const status =
                $("commentStatus");


            const name =
                $("commentName")
                    .value
                    .trim();


            const content =
                $("commentContent")
                    .value
                    .trim();


            if(!name){

                status.textContent =
                    "Your nickname is missing.";

                return;

            }


            if(!content){

                status.textContent =
                    "Please write a comment.";

                return;

            }


            if(
                selectedChapterIndex < 0
            ){

                status.textContent =
                    "No chapter is selected.";

                return;

            }


            const chapter =
                chapters[
                    selectedChapterIndex
                ];


            if(
                !chapter ||
                !chapter.id
            ){

                status.textContent =
                    "The chapter could not be found.";

                return;

            }


            status.textContent =
                "Posting…";


            try{

                const result =
                    await supabaseClient
                        .from("comments")
                        .insert({

                            target_type:
                                "chapter",

                            target_id:
                                chapter.id,

                            name:
                                name,

                            content:
                                content

                        });


                if(result.error){

                    console.error(
                        "COMMENT ERROR:",
                        result.error
                    );

                    status.textContent =
                        "Could not post: " +
                        result.error.message;

                    return;

                }


                $("commentContent")
                    .value =
                        "";


                $("commentName")
                    .value =
                        window.readerNickname ||
                        name;


                status.textContent =
                    "Comment posted.";


                await loadComments();


            }catch(error){

                console.error(
                    "COMMENT ERROR:",
                    error
                );


                status.textContent =
                    "Could not post: " +
                    (
                        error.message ||
                        "Unknown error"
                    );

            }

        }
    );


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


function escapeAttribute(value){

    return escapeHTML(
        value
    ).replace(
        /"/g,
        "&quot;"
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    $("loadingMessage")
        .classList
        .add("hidden");


    $("bookContent")
        .classList
        .add("hidden");


    $("errorMessage")
        .classList
        .remove("hidden");


    $("errorText")
        .textContent =
            message;

}

/* =========================================================
   FAVORITE
========================================================= */

function getFavoriteKey(){

    return "hed_favorite_" + storyId;

}


function applyFavoriteState(){

    const button =
        document.getElementById(
            "favoriteButton"
        );


    if(!button){

        return;

    }


    const saved =
        localStorage.getItem(
            getFavoriteKey()
        ) === "true";


    button.classList.toggle(
        "active",
        saved
    );


    button.setAttribute(
        "aria-pressed",
        String(saved)
    );


    button.innerHTML =
        saved
            ? "♥ Favorited"
            : "♡ Favorite";

}


const favoriteButton =
    document.getElementById(
        "favoriteButton"
    );


if(favoriteButton){

    favoriteButton.onclick =
        function(){

            const saved =
                localStorage.getItem(
                    getFavoriteKey()
                ) === "true";


            localStorage.setItem(
                getFavoriteKey(),
                String(!saved)
            );


            applyFavoriteState();

        };


    applyFavoriteState();

}
