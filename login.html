<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reader Login | HED</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #f5efe6;
            color: #342b26;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .login-box {
            width: 100%;
            max-width: 420px;

            padding: 40px;

            background: #fbf8f3;

            border:
                1px solid
                #d8cec2;

            box-shadow:
                0 12px 35px
                rgba(60, 45, 35, 0.08);
        }


        h1 {
            margin: 0 0 8px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 42px;
            font-weight: 400;
        }


        .subtitle {
            margin: 0 0 30px;

            color: #85786e;

            line-height: 1.6;
        }


        .field-label {
            display: block;

            margin:
                0 0 7px;

            font-size: 12px;

            color: #756960;

            letter-spacing: 0.05em;

            text-transform: uppercase;
        }


        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 16px;

            border:
                1px solid
                #d8cec2;

            background: white;

            color: #342b26;

            font-size: 14px;

            outline: none;
        }


        input:focus {
            border-color: #9b897d;
        }


        button {
            width: 100%;

            padding: 14px;

            border: none;

            background: #4a352b;
            color: white;

            cursor: pointer;

            font-size: 14px;
        }


        button:hover {
            background: #382920;
        }


        .message {
            min-height: 20px;

            margin-top: 16px;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }


        .switch {
            margin-top: 22px;

            text-align: center;

            font-size: 13px;

            color: #756960;
        }


        .switch a {
            color: #68745d;

            cursor: pointer;

            text-decoration: underline;
        }


        .back {
            display: block;

            margin-top: 22px;

            text-align: center;

            font-size: 12px;

            color: #85786e;

            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="login-box">


        <h1>HED</h1>


        <p class="subtitle">
            Reader Login
        </p>


        <form id="loginForm">


            <label
                class="field-label"
                for="email"
            >
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Your email"
                autocomplete="email"
                required
            >


            <label
                class="field-label"
                for="password"
            >
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >


            <button type="submit">
                Log in
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="switch">

            Don't have an account?

            <a
                href="#"
                id="signupLink"
            >
                Create one
            </a>

        </div>


        <a
            href="hed.html"
            class="back"
        >
            ← Back to HED
        </a>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>


        const loginForm =
            document.getElementById("loginForm");


        const message =
            document.getElementById("message");


        const signupLink =
            document.getElementById("signupLink");


        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");


        /*
         * LOGIN
         */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                if (!email || !password) {

                    message.textContent =
                        "Please enter your email and password.";

                    return;
                }


                message.textContent =
                    "Logging in...";


                const result =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if (result.error) {

                    message.textContent =
                        result.error.message;

                    return;
                }


                message.textContent =
                    "Login successful. Opening HED...";


                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const returnTo =
                    params.get("return");


                setTimeout(
                    function() {

                        if (
                            returnTo &&
                            !returnTo.startsWith("http") &&
                            !returnTo.startsWith("//")
                        ) {

                            window.location.href =
                                returnTo;

                        } else {

                            window.location.href =
                                "hed.html";

                        }

                    },
                    500
                );

            }
        );


        /*
         * CREATE ACCOUNT
         */

        signupLink.addEventListener(
            "click",
            async function(event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                if (!email || !password) {

                    message.textContent =
                        "Enter your email and password first.";

                    return;
                }


                if (password.length < 6) {

                    message.textContent =
                        "Your password must be at least 6 characters.";

                    return;
                }


                const nickname =
                    prompt(
                        "What name or nickname would you like readers to see?"
                    );


                if (!nickname || !nickname.trim()) {

                    message.textContent =
                        "Account creation cancelled.";

                    return;
                }


                message.textContent =
                    "Creating your account...";


                const result =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                nickname:
                                    nickname.trim()

                            }

                        }

                    });


                if (result.error) {

                    message.textContent =
                        result.error.message;

                    return;
                }


                message.textContent =
                    "Account created! Check your email if confirmation is required.";

            }
        );


    </script>


</body>

</html>
