<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reader Login | HED</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5efe6;
            color: #342b26;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: min(90%, 400px);
            padding: 40px;
            box-sizing: border-box;
            background: #fbf8f3;
            border: 1px solid #d8cec2;
        }

        h1 {
            margin: 0 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 38px;
            font-weight: 400;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #85786e;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-bottom: 12px;
            border: 1px solid #d8cec2;
            background: white;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #4a352b;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #382920;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }

        .switch {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .switch a {
            color: #68745d;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>HED</h1>

        <p class="subtitle">Reader Login</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="switch">
            Don't have an account?
            <a id="signupLink">Create one</a>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const signupLink =
            document.getElementById("signupLink");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;
                <input
    type="text"
    id="nickname"
    placeholder="Name or nickname"
    required
>


                message.textContent =
                    "Logging in...";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }


                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const returnTo =
                    params.get("return");


                if (
                    returnTo &&
                    !returnTo.startsWith("http") &&
                    !returnTo.startsWith("//")
                ) {

                    window.location.href =
                        returnTo;

                } else {

                    window.location.href = "index.html.html";

                }

            }
        );


        signupLink.addEventListener(
            "click",
            async function() {

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                if (!email || !password) {

                    message.textContent =
                        "Enter your email and password first.";

                    return;
                }


                message.textContent =
                    "Creating account...";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({
                        email: email,
                        password: password
                    });


                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }


                message.textContent =
                    "Account created. Check your email if confirmation is required.";

            }
        );

    </script>

</body>
</html>
