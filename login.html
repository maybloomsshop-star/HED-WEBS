<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reader Login · HED</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f3ed;
            color: #4b4038;
            font-family: Georgia, serif;
        }

        .login-box {
            width: min(420px, 90%);
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #75685f;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d8cec5;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #4b4038;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .switch {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .switch a {
            color: #4b4038;
            text-decoration: underline;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #75685f;
            text-decoration: none;
            font-size: 14px;
        }

        #nicknameField {
            display: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1 id="loginTitle">Welcome to HED</h1>

    <div class="subtitle" id="loginSubtitle">
        Log in to read.
    </div>

    <form id="loginForm">

        <div id="nicknameField">

            <label for="nickname">
                Name or nickname
            </label>

            <input
                type="text"
                id="nickname"
                placeholder="What should we call you?"
            >

        </div>

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit" id="submitButton">
            Log in
        </button>

    </form>

    <div class="switch">
        <span id="switchText">
            Don't have an account?
        </span>

        <a id="switchLink">
            Create one
        </a>
    </div>

    <div id="message"></div>

    <a href="hed.html" class="back">
        ← Back to HED
    </a>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const nicknameField =
        document.getElementById("nicknameField");

    const nickname =
        document.getElementById("nickname");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const submitButton =
        document.getElementById("submitButton");

    const switchLink =
        document.getElementById("switchLink");

    const switchText =
        document.getElementById("switchText");

    const message =
        document.getElementById("message");

    const loginTitle =
        document.getElementById("loginTitle");

    const loginSubtitle =
        document.getElementById("loginSubtitle");

    let signupMode = false;
    let existingUserNeedsNickname = false;


    function getReturnPage() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const returnTo =
            params.get("return");

        if (
            returnTo &&
            !returnTo.startsWith("http") &&
            !returnTo.startsWith("//")
        ) {
            return returnTo;
        }

        return "hed.html";
    }


    function showNicknameForExistingUser() {

        existingUserNeedsNickname = true;

        signupMode = false;

        loginTitle.textContent =
            "Welcome to HED";

        loginSubtitle.textContent =
            "Choose a name or nickname to continue.";

        nicknameField.style.display =
            "block";

        nickname.required = true;

        email.style.display =
            "none";

        password.style.display =
            "none";

        document.querySelector(
            'label[for="email"]'
        ).style.display = "none";

        document.querySelector(
            'label[for="password"]'
        ).style.display = "none";

        submitButton.textContent =
            "Save nickname";

        switchText.style.display =
            "none";

        switchLink.style.display =
            "none";

        email.required = false;
        password.required = false;
    }


    switchLink.addEventListener(
        "click",
        function() {

            signupMode = !signupMode;

            message.textContent = "";

            if (signupMode) {

                loginTitle.textContent =
                    "Create your HED account";

                loginSubtitle.textContent =
                    "Choose a name and create your account.";

                nicknameField.style.display =
                    "block";

                nickname.required = true;

                submitButton.textContent =
                    "Create account";

                switchText.textContent =
                    "Already have an account?";

                switchLink.textContent =
                    "Log in";

            } else {

                loginTitle.textContent =
                    "Welcome to HED";

                loginSubtitle.textContent =
                    "Log in to read.";

                nicknameField.style.display =
                    "none";

                nickname.required = false;

                submitButton.textContent =
                    "Log in";

                switchText.textContent =
                    "Don't have an account?";

                switchLink.textContent =
                    "Create one";
            }

        }
    );


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            /*
             * EXISTING USER:
             * Save nickname after logging in.
             */

            if (existingUserNeedsNickname) {

                const name =
                    nickname.value.trim();

                if (!name) {

                    message.textContent =
                        "Please enter a name or nickname.";

                    return;
                }

                message.textContent =
                    "Saving your nickname...";

                const {
                    data: userData,
                    error: userError
                } =
                await supabaseClient.auth.getUser();

                if (userError) {

                    message.textContent =
                        userError.message;

                    return;
                }

                const {
                    error
                } =
                await supabaseClient.auth.updateUser({

                    data: {
                        nickname: name
                    }

                });

                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }

                window.location.href =
                    getReturnPage();

                return;
            }


            /*
             * CREATE NEW ACCOUNT
             */

            if (signupMode) {

                const name =
                    nickname.value.trim();

                if (!name) {

                    message.textContent =
                        "Please enter a name or nickname.";

                    return;
                }

                message.textContent =
                    "Creating your account...";

                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signUp({

                    email:
                        email.value.trim(),

                    password:
                        password.value,

                    options: {

                        data: {
                            nickname: name
                        }

                    }

                });

                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }

                if (
                    data.user &&
                    !data.session
                ) {

                    message.textContent =
                        "Account created! Check your email to confirm your account.";

                    return;
                }

                window.location.href =
                    getReturnPage();

                return;
            }


            /*
             * LOG IN
             */

            message.textContent =
                "Logging in...";

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email:
                    email.value.trim(),

                password:
                    password.value

            });

            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            /*
             * CHECK IF THIS OLD ACCOUNT
             * ALREADY HAS A NICKNAME
             */

            const user =
                data.user;

            const savedNickname =
                user.user_metadata?.nickname;


            if (!savedNickname) {

                showNicknameForExistingUser();

                return;
            }


            /*
             * NICKNAME ALREADY EXISTS
             */

            window.location.href =
                getReturnPage();

        }

    );

</script>

</body>
</html>
