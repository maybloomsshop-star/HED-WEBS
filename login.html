<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reader Login · HED</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f3ed;
            color: #4b4038;
            font-family: Georgia, serif;
        }

        .login-box {
            width: min(420px, 90%);
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: #75685f;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d8cec5;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #4b4038;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .signup {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .signup a {
            color: #4b4038;
            text-decoration: underline;
            cursor: pointer;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #75685f;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome to HED</h1>

        <div class="subtitle">
            Log in to read.
        </div>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a id="signupLink">Create one</a>
        </div>

        <div id="message"></div>

        <a href="hed.html" class="back">
            ← Back to HED
        </a>

    </div>

    <script>

        const loginForm = document.getElementById("loginForm");
        const signupLink = document.getElementById("signupLink");
        const message = document.getElementById("message");

        function getReturnPage() {

            const params =
                new URLSearchParams(window.location.search);

            const returnTo =
                params.get("return");

            if (
                returnTo &&
                !returnTo.startsWith("http") &&
                !returnTo.startsWith("//")
            ) {
                return returnTo;
            }

            return "hed.html";
        }

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            message.textContent = "Logging in...";

            const { error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {

                message.textContent =
                    error.message;

                return;
            }

            window.location.href =
                getReturnPage();

        });

        signupLink.addEventListener("click", async function() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            if (!email || !password) {

                message.textContent =
                    "Enter your email and password first.";

                return;
            }

            message.textContent =
                "Creating your account...";

            const { error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

            if (error) {

                message.textContent =
                    error.message;

                return;
            }

            message.textContent =
                "Account created! Check your email to confirm your account.";

        });

    </script>

</body>
</html>
