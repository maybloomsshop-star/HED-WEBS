<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Journal — HED</title>

  <style>

    :root {
      --hed-brown: #4a352b;
      --hed-brown-dark: #382920;
      --hed-cream: #f5efe6;
      --hed-paper: #fbf8f3;
      --hed-green: #68745d;
      --hed-pink: #c58f91;
      --hed-text: #342b26;
      --hed-muted: #85786e;
      --hed-line: #d8cec2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--hed-paper);
      color: var(--hed-text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ================================
       READING PROGRESS
    ================================ */

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--hed-brown);
      z-index: 9999;
    }

    /* ================================
       HEADER
    ================================ */

    header {
      height: 78px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--hed-line);

      background: rgba(251, 248, 243, 0.96);

      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(8px);
    }

    .brand {
      text-decoration: none;
      color: var(--hed-brown-dark);

      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;

      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--hed-brown);
    }

    /* ================================
       PAGE
    ================================ */

    main {
      width: min(1080px, 90%);
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      text-decoration: none;
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-bottom: 45px;
    }

    .back-link:hover {
      color: var(--hed-brown);
    }

    /* ================================
       JOURNAL HEADER
    ================================ */

    .journal-label {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .entry-title {
      max-width: 850px;

      margin: 0;

      color: var(--hed-brown-dark);

      font-size: clamp(40px, 6vw, 68px);
      line-height: 1.06;
      font-weight: normal;
      letter-spacing: -1.5px;
    }

    .entry-subtitle {
      max-width: 720px;

      margin: 25px 0 25px;

      color: var(--hed-muted);

      font-size: 21px;
      line-height: 1.6;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;

      margin-top: 25px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .meta-dot {
      color: var(--hed-pink);
    }

    .ornament {
      margin: 35px 0;

      color: var(--hed-pink);

      font-size: 17px;
      letter-spacing: 7px;
    }

    /* ================================
       HERO IMAGE
    ================================ */

    .hero-image-wrap {
      width: 100%;
      margin: 30px 0 55px;
    }

    .hero-image {
      width: 100%;
      max-height: 650px;

      object-fit: cover;
      display: block;

      background: var(--hed-cream);

      cursor: zoom-in;
    }

    .image-caption {
      margin-top: 12px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.8px;
      line-height: 1.5;
    }

    /* ================================
       READING CONTROLS
    ================================ */

    .reading-controls {
      width: min(760px, 100%);

      margin: 0 auto 38px;

      padding: 18px 0;

      border-top: 1px solid var(--hed-line);
      border-bottom: 1px solid var(--hed-line);
    }

    .controls-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 16px;
    }

    .controls-label {
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .size-value {
      color: var(--hed-brown);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
    }

    /* TEXT SIZE SLIDER */

    .size-control {
      display: grid;

      grid-template-columns: 18px 1fr 28px;

      align-items: center;

      gap: 10px;

      margin-bottom: 18px;
    }

    .size-small,
    .size-large {
      color: var(--hed-muted);

      font-family: Georgia, serif;
      text-align: center;
    }

    .size-small {
      font-size: 12px;
    }

    .size-large {
      font-size: 21px;
    }

    #fontSizeSlider {
      width: 100%;

      appearance: none;

      height: 4px;

      background: var(--hed-line);

      border-radius: 10px;

      outline: none;

      cursor: pointer;
    }

    #fontSizeSlider::-webkit-slider-thumb {
      appearance: none;

      width: 16px;
      height: 16px;

      border-radius: 50%;

      background: var(--hed-brown);

      cursor: pointer;

      border: 2px solid var(--hed-paper);
      box-shadow: 0 0 0 1px var(--hed-brown);
    }

    #fontSizeSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;

      border-radius: 50%;

      background: var(--hed-brown);

      cursor: pointer;

      border: 2px solid var(--hed-paper);
    }

    /* FONT CHOICES */

    .font-row {
      display: flex;

      align-items: center;

      gap: 7px;

      flex-wrap: wrap;
    }

    .font-row-label {
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: bold;

      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-right: 5px;
    }

    .font-choice {
      border: 1px solid var(--hed-line);

      background: transparent;

      color: var(--hed-muted);

      padding: 7px 11px;

      border-radius: 3px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
    }

    .font-choice:hover {
      background: var(--hed-cream);

      color: var(--hed-brown);
    }

    .font-choice.active {
      background: var(--hed-brown);

      border-color: var(--hed-brown);

      color: white;
    }

    .font-choice[data-font="serif"] {
      font-family: Georgia, "Times New Roman", serif;
    }

    .font-choice[data-font="garamond"] {
      font-family: Garamond, "Times New Roman", serif;
    }

    .font-choice[data-font="palatino"] {
      font-family: Palatino, "Book Antiqua", serif;
    }

    .font-choice[data-font="sans"] {
      font-family: Arial, Helvetica, sans-serif;
    }

    .font-choice[data-font="verdana"] {
      font-family: Verdana, Geneva, sans-serif;
    }

    .font-choice[data-font="mono"] {
      font-family: "Courier New", monospace;
    }

    /* ================================
       ARTICLE
    ================================ */

    .article-area {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .article-content {
      --reader-size: 19px;
      --reader-font: Georgia, "Times New Roman", serif;

      font-family: var(--reader-font) !important;

      font-size: var(--reader-size);

      line-height: 1.9;

      color: var(--hed-text);

      transition: font-size 0.12s ease;
    }

    /*
      Force generated Supabase HTML
      to follow the reader font.
    */

    .article-content,
    .article-content * {
      font-family: var(--reader-font) !important;
    }

    .article-content p,
    .article-content li {
      font-size: var(--reader-size);
    }

    .article-content p {
      margin: 0 0 1.45em;
    }

    .article-content h2 {
      margin: 2.2em 0 0.8em;

      color: var(--hed-brown-dark);

      font-size: 30px;
      line-height: 1.25;
      font-weight: normal;
    }

    .article-content h3 {
      margin: 2em 0 0.7em;

      color: var(--hed-brown-dark);

      font-size: 23px;
      line-height: 1.3;
      font-weight: normal;
    }

    .article-content strong {
      color: var(--hed-brown-dark);
    }

    .article-content em {
      color: #574a42;
    }

    .article-content a {
      color: var(--hed-green);

      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .article-content blockquote {
      margin: 45px 0;

      padding: 5px 0 5px 28px;

      border-left: 3px solid var(--hed-pink);

      color: var(--hed-brown);

      font-size: calc(var(--reader-size) * 1.25);

      line-height: 1.55;

      font-style: italic;
    }

    .article-content ul,
    .article-content ol {
      margin: 0 0 1.5em;

      padding-left: 30px;
    }

    .article-content li {
      margin-bottom: 8px;
    }

    .article-content img {
      width: 100%;
      height: auto;

      display: block;

      margin: 40px 0;

      cursor: zoom-in;
    }

    .article-content hr {
      border: 0;

      border-top: 1px solid var(--hed-line);

      margin: 50px 0;
    }

    /* ================================
       HED NOTE
    ================================ */

    .hed-note {
      margin-top: 60px;

      padding: 28px;

      background: var(--hed-cream);

      border: 1px solid var(--hed-line);
    }

    .hed-note-label {
      margin-bottom: 10px;

      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hed-note-content {
      color: var(--hed-brown);

      font-family: var(--reader-font, Georgia, serif) !important;

      font-size: var(--reader-size, 19px);

      line-height: 1.8;
    }

    /* ================================
       RESPONSES
    ================================ */

    .responses {
      width: min(680px, 100%);

      margin: 65px auto 0;

      padding-top: 30px;

      border-top: 1px solid var(--hed-line);
    }

    .responses .section-label {
      margin-bottom: 5px;

      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: bold;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;

      color: var(--hed-brown-dark);

      font-size: 28px;

      line-height: 1.2;

      font-weight: normal;
    }

    .response-count {
      margin-top: 4px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;
    }

    /* ================================
       COMMENT FORM
    ================================ */

    .response-form {
      margin-top: 18px;

      padding: 14px;

      background: var(--hed-cream);

      border: 1px solid var(--hed-line);
    }

    .response-form input,
    .response-form textarea {
      display: block;

      width: 100%;

      border: 1px solid var(--hed-line);

      background: var(--hed-paper);

      color: var(--hed-text);

      padding: 9px 11px;

      margin: 0 0 7px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 14px;

      outline: none;

      border-radius: 0;
    }

    .response-form input:focus,
    .response-form textarea:focus {
      border-color: var(--hed-green);
    }

    .response-form textarea {
      min-height: 78px;

      resize: vertical;
    }

    .response-form button {
      border: 0;

      background: var(--hed-brown);

      color: white;

      padding: 9px 15px;

      cursor: pointer;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 9px;

      font-weight: bold;

      letter-spacing: 1.4px;

      text-transform: uppercase;
    }

    .response-form button:hover {
      background: var(--hed-brown-dark);
    }

    .response-message {
      margin-top: 7px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;
    }

    /* ================================
       COMMENTS LIST
    ================================ */

    .comment-list {
      margin-top: 15px;
    }

    .comment {
      display: block;

      padding: 10px 0 11px;

      border-bottom: 1px solid var(--hed-line);
    }

    .comment:first-child {
      padding-top: 2px;
    }

    .comment:last-child {
      border-bottom: 0;

      padding-bottom: 2px;
    }

    .comment-top {
      display: flex;

      align-items: baseline;

      justify-content: flex-start;

      gap: 9px;

      margin: 0 0 2px;
    }

    .comment-name {
      color: var(--hed-brown-dark);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 11px;

      font-weight: bold;
    }

    .comment-date {
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 9px;

      white-space: nowrap;
    }

    .comment-content {
      color: var(--hed-text);

      font-size: 14px;

      line-height: 1.45;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

      margin: 0;
    }

    /* ================================
       KEEP READING
    ================================ */

    .keep-reading {
      width: min(760px, 100%);

      margin: 80px auto 0;

      padding-top: 35px;

      border-top: 1px solid var(--hed-line);
    }

    .reading-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 15px;

      margin-top: 20px;
    }

    .reading-card {
      min-height: 150px;

      padding: 24px;

      background: var(--hed-cream);

      border: 1px solid var(--hed-line);

      text-decoration: none;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .reading-card:hover {
      transform: translateY(-3px);

      background: #f1e9df;
    }

    .reading-direction {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 9px;

      font-weight: bold;

      letter-spacing: 1.8px;

      text-transform: uppercase;
    }

    .reading-title {
      margin-top: 20px;

      color: var(--hed-brown-dark);

      font-size: 21px;

      line-height: 1.3;
    }

    .all-journal {
      display: block;

      width: fit-content;

      margin: 28px auto 0;

      color: var(--hed-brown);

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      font-weight: bold;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .all-journal:hover {
      color: var(--hed-green);
    }

    /* ================================
       LIGHTBOX
    ================================ */

    .image-lightbox {
      position: fixed;

      inset: 0;

      background: rgba(35, 27, 23, 0.92);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px;

      z-index: 99999;

      cursor: zoom-out;
    }

    .image-lightbox img {
      max-width: 95vw;

      max-height: 90vh;

      object-fit: contain;

      display: block;
    }

    .image-lightbox.hidden {
      display: none;
    }

    /* ================================
       FOOTER
    ================================ */

    footer {
      margin-top: 100px;

      padding: 55px 6%;

      background: var(--hed-brown-dark);

      color: var(--hed-cream);

      text-align: center;
    }

    .footer-brand {
      font-size: 24px;

      letter-spacing: 4px;

      font-weight: bold;
    }

    .footer-tagline {
      margin-top: 12px;

      color: #cfc3b8;

      font-size: 14px;

      font-style: italic;
    }

    .footer-nav {
      margin-top: 25px;

      display: flex;

      justify-content: center;

      gap: 25px;

      flex-wrap: wrap;
    }

    .footer-nav a {
      color: #cfc3b8;

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .footer-nav a:hover {
      color: white;
    }

    /* ================================
       LOADING / ERROR
    ================================ */

    .status {
      min-height: 300px;

      display: flex;

      justify-content: center;

      align-items: center;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      letter-spacing: 1px;

      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* ================================
       MOBILE
    ================================ */

    @media (max-width: 700px) {

      header {
        height: 68px;

        padding: 0 5%;
      }

      .brand {
        font-size: 21px;
      }

      nav {
        gap: 16px;
      }

      nav a {
        font-size: 9px;

        letter-spacing: 1.3px;
      }

      main {
        width: 90%;

        padding-top: 45px;
      }

      .back-link {
        margin-bottom: 35px;
      }

      .entry-title {
        font-size: 36px;

        letter-spacing: -0.8px;
      }

      .entry-subtitle {
        font-size: 18px;
      }

      .entry-meta {
        line-height: 1.7;
      }

      .hero-image-wrap {
        margin-bottom: 40px;
      }

      .reading-controls {
        padding: 15px 0;

        margin-bottom: 30px;
      }

      .controls-top {
        margin-bottom: 13px;
      }

      .font-row {
        gap: 5px;
      }

      .font-choice {
        padding: 6px 8px;

        font-size: 11px;
      }

      .article-content {
        line-height: 1.8;
      }

      .article-content h2 {
        font-size: 27px;
      }

      .article-content h3 {
        font-size: 21px;
      }

      .article-content blockquote {
        padding-left: 20px;
      }

      .hed-note {
        padding: 22px;
      }

      .responses {
        width: 100%;

        margin-top: 55px;

        padding-top: 25px;
      }

      .section-title {
        font-size: 25px;
      }

      .response-form {
        padding: 11px;
      }

      .comment {
        padding: 9px 0 10px;
      }

      .comment-content {
        font-size: 14px;

        line-height: 1.45;
      }

      .reading-grid {
        grid-template-columns: 1fr;
      }

      .reading-card {
        min-height: 130px;
      }

      footer {
        margin-top: 70px;
      }

    }

  </style>

</head>


<body>


  <div
    class="reading-progress"
    id="readingProgress"
  ></div>


  <header>

    <a
      href="hed.html"
      class="brand"
    >
      HED
    </a>

    <nav>

      <a href="journal.html">
        Journal
      </a>

      <a href="about.html">
        About
      </a>

    </nav>

  </header>


  <main>


    <div
      id="loading"
      class="status"
    >
      Loading journal entry...
    </div>


    <article
      id="entryPage"
      class="hidden"
    >


      <a
        href="journal.html"
        class="back-link"
      >
        ← Back to Journal
      </a>


      <div class="journal-label">
        Journal
      </div>


      <h1
        class="entry-title"
        id="entryTitle"
      ></h1>


      <div
        class="entry-subtitle hidden"
        id="entrySubtitle"
      ></div>


      <div class="entry-meta">

        <span id="entryDate"></span>

        <span class="meta-dot">
          •
        </span>

        <span id="readTime"></span>

        <span class="meta-dot">
          •
        </span>

        <span>
          Written by HED
        </span>

      </div>


      <div class="ornament">
        ✦
      </div>


      <div
        class="hero-image-wrap hidden"
        id="heroWrap"
      >

        <img
          id="heroImage"
          class="hero-image"
          alt=""
        >

        <div
          id="imageCaption"
          class="image-caption hidden"
        ></div>

      </div>


      <!-- ================================
           READING CONTROLS
      ================================= -->

      <div class="reading-controls">


        <div class="controls-top">

          <div class="controls-label">
            Reading
          </div>

          <div
            class="size-value"
            id="sizeValue"
          >
            19px
          </div>

        </div>


        <div class="size-control">

          <span class="size-small">
            A
          </span>

          <input
            type="range"
            id="fontSizeSlider"
            min="14"
            max="30"
            step="1"
            value="19"
            aria-label="Text size"
          >

          <span class="size-large">
            A
          </span>

        </div>


        <div class="font-row">

          <span class="font-row-label">
            Font
          </span>


          <button
            type="button"
            class="font-choice"
            data-font="serif"
          >
            Serif
          </button>


          <button
            type="button"
            class="font-choice"
            data-font="garamond"
          >
            Garamond
          </button>


          <button
            type="button"
            class="font-choice"
            data-font="palatino"
          >
            Palatino
          </button>


          <button
            type="button"
            class="font-choice"
            data-font="sans"
          >
            Sans
          </button>


          <button
            type="button"
            class="font-choice"
            data-font="verdana"
          >
            Verdana
          </button>


          <button
            type="button"
            class="font-choice"

      <section class="responses">

        <h2 class="section-title">

        <div

        >
          0 responses
        </div>


        <form

        >


          <input
            type="text"
            id="commentName"
            placeholder="Your name"
            readonly
          >


          <textarea
            id="commentContent"
            placeholder="Leave a thought..."
            required
          ></textarea>


          <button type="submit">
            Post Response
          </button>


          <div
            id="responseMessage"
            class="response-message"

        <div
          id="commentList"
          class="comment-list"
        ></div>

      <!-- ================================
           KEEP READING
      ================================= -->

      <section class="keep-reading">


        <div class="section-label">
          Keep Reading
        </div>


        <div class="reading-grid">


          <a
            id="previousEntry"
            class="reading-card hidden"
          >

            <div class="reading-direction">
              ← Previous Entry
            </div>

            <div
              id="previousTitle"
              class="reading-title"
            ></div>

          </a>


          <a
            id="nextEntry"
            class="reading-card hidden"
          >

            <div class="reading-direction">
              Next Entry →
            </div>

            <div
              id="nextTitle"
              class="reading-title"
            ></div>

    <div class="footer-brand">

      <a href="journal.html">

      </a>

      <a href="about.html">

      </a>

  <!-- IMAGE LIGHTBOX -->

  <div
    id="imageLightbox"
    class="image-lightbox hidden"
  >

    <img
      id="lightboxImage"
      alt=""
    >

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script src="reader-auth.js"></script>


  <script>


    const db = supabaseClient;


    const entryId =
      new URLSearchParams(
        window.location.search
      ).get("id");


    /* ================================
       HELPERS
    ================================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(date) {

      if (!date) {
        return "";
      }

      return new Date(date)
        .toLocaleDateString(
          "en-US",
          {
            month: "long",
            day: "numeric",
            year: "numeric"
          }
        );

    }


    function calculateReadTime(content) {

      if (!content) {
        return "1 min read";
      }

      const words =
        String(content)
          .replace(/<[^>]*>/g, " ")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .length;

      const minutes =
        Math.max(
          1,
          Math.ceil(words / 220)
        );

      return `${minutes} min read`;

    }


    /* ================================
       READING PREFERENCES
    ================================= */

    const articleContent =
      document.getElementById(
        "articleContent"
      );


    const hedNoteContent =
      document.getElementById(
        "hedNoteContent"
      );


    const slider =
      document.getElementById(
        "fontSizeSlider"
      );


    const sizeValue =
      document.getElementById(
        "sizeValue"
      );


    /*
      Backwards compatible with the
      old small / normal / large values.
    */

    let storedSize =
      localStorage.getItem(
        "hedReadingSize"
      );


    let currentSize = 19;


    if (storedSize === "small") {
      currentSize = 16;
    }

    else if (storedSize === "normal") {
      currentSize = 19;
    }

    else if (storedSize === "large") {
      currentSize = 23;
    }

    else if (
      storedSize &&
      !isNaN(Number(storedSize))
    ) {
      currentSize =
        Number(storedSize);
    }


    currentSize =
      Math.min(
        30,
        Math.max(
          14,
          currentSize
        )
      );


    let currentFont =
      localStorage.getItem(
        "hedReadingFont"
      ) || "serif";


    const fontMap = {

      serif:
        'Georgia, "Times New Roman", serif',

      garamond:
        'Garamond, "Times New Roman", serif',

      palatino:
        'Palatino, "Book Antiqua", serif',

      sans:
        'Arial, Helvetica, sans-serif',

      verdana:
        'Verdana, Geneva, sans-serif',

      mono:
        '"Courier New", Courier, monospace'

    };


    if (!fontMap[currentFont]) {
      currentFont = "serif";
    }


    function applyReaderSettings() {

      const size =
        `${currentSize}px`;

      const font =
        fontMap[currentFont];


      /*
        CSS variables control the whole
        reader, including generated HTML.
      */

      articleContent.style.setProperty(
        "--reader-size",
        size
      );

      articleContent.style.setProperty(
        "--reader-font",
        font
      );


      articleContent.style.setProperty(
        "font-family",
        font,
        "important"
      );


      articleContent.style.setProperty(
        "font-size",
        size,
        "important"
      );


      /*
        Generated content can contain
        inline styles, so force the
        reader preference onto it.
      */

      document
        .querySelectorAll(
          "#articleContent, #articleContent *"
        )
        .forEach(element => {

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

        });


      if (hedNoteContent) {

        hedNoteContent.style.setProperty(
          "--reader-size",
          size
        );

        hedNoteContent.style.setProperty(
          "--reader-font",
          font
        );

        hedNoteContent.style.setProperty(
          "font-family",
          font,
          "important"
        );

        hedNoteContent.style.setProperty(
          "font-size",
          size,
          "important"
        );

      }


      slider.value =
        currentSize;


      sizeValue.textContent =
        `${currentSize}px`;


      document
        .querySelectorAll(
          ".font-choice"
        )
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.font ===
              currentFont
          );

        });


      localStorage.setItem(
        "hedReadingSize",
        currentSize
      );


      localStorage.setItem(
        "hedReadingFont",
        currentFont
      );

    }


    slider.addEventListener(
      "input",
      () => {

        currentSize =
          Number(
            slider.value
          );

        applyReaderSettings();

      }
    );


    document
      .querySelectorAll(
        ".font-choice"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentFont =
              button.dataset.font;

            applyReaderSettings();

          }
        );

      });


    applyReaderSettings();


    /* ================================
       IMAGE LIGHTBOX
    ================================= */

    const imageLightbox =
      document.getElementById(
        "imageLightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );


    function openLightbox(src, alt) {

      if (!src) {
        return;
      }

      lightboxImage.src = src;

      lightboxImage.alt =
        alt || "";

      imageLightbox.classList.remove(
        "hidden"
      );

      document.body.style.overflow =
        "hidden";

    }


    function closeLightbox() {

      imageLightbox.classList.add(
        "hidden"
      );

      lightboxImage.src = "";

      document.body.style.overflow =
        "";

    }


    imageLightbox.addEventListener(
      "click",
      closeLightbox
    );


    lightboxImage.addEventListener(
      "click",
      event => {
        event.stopPropagation();
      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {
          closeLightbox();
        }

      }
    );


    document
      .getElementById(
        "heroImage"
      )
      .addEventListener(
        "click",
        event => {

          openLightbox(
            event.currentTarget.src,
            event.currentTarget.alt
          );

        }
      );


    /* ================================
       LOAD JOURNAL ENTRY
    ================================= */

    async function loadEntry() {

      if (!entryId) {

        document
          .getElementById("loading")
          .textContent =
          "No journal entry was selected.";

        return;

      }


      const {
        data,
        error
      } = await db
        .from("journal_entries")
        .select("*")
        .order(
          "published_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(error);

        document
          .getElementById("loading")
          .textContent =
          "Unable to load this journal entry.";

        return;

      }


      const entries =
        data || [];


      const currentIndex =
        entries.findIndex(
          entry =>
            String(entry.id) ===
            String(entryId)
        );


      if (currentIndex === -1) {

        document
          .getElementById("loading")
          .textContent =
          "Journal entry unavailable.";

        return;

      }


      const entry =
        entries[currentIndex];


      /* TITLE */

      document
        .getElementById(
          "entryTitle"
        )
        .textContent =
        entry.title ||
        "Untitled Journal Entry";


      /* SUBTITLE */

      const subtitle =
        entry.subtitle ||
        entry.description ||
        entry.dek;


      if (subtitle) {

        const subtitleElement =
          document.getElementById(
            "entrySubtitle"
          );

        subtitleElement.textContent =
          subtitle;

        subtitleElement.classList.remove(
          "hidden"
        );

      }


      /* META */

      document
        .getElementById(
          "entryDate"
        )
        .textContent =
        formatDate(
          entry.published_at
        );


      document
        .getElementById(
          "readTime"
        )
        .textContent =
        calculateReadTime(
          entry.content
        );


      /* IMAGE */

      if (entry.image_url) {

        const heroWrap =
          document.getElementById(
            "heroWrap"
          );


        const heroImage =
          document.getElementById(
            "heroImage"
          );


        heroImage.src =
          entry.image_url;


        heroImage.alt =
          entry.title ||
          "Journal image";


        heroWrap.classList.remove(
          "hidden"
        );


        const caption =
          entry.image_caption ||
          entry.caption;


        if (caption) {

          const captionElement =
            document.getElementById(
              "imageCaption"
            );


          captionElement.textContent =
            caption;


          captionElement.classList.remove(
            "hidden"
          );

        }

      }


      /* CONTENT */

      articleContent.innerHTML =
        entry.content ||
        "<p>This entry has no content yet.</p>";


      /*
        Reapply reader settings AFTER
        Supabase content is inserted.
      */

      applyReaderSettings();


      /* ARTICLE IMAGES */

      articleContent
        .querySelectorAll("img")
        .forEach(image => {

          image.addEventListener(
            "click",
            () => {

              openLightbox(
                image.src,
                image.alt
              );

            }
          );

        });


      /* NOTE */

      const note =
        entry.author_reflection ||
        entry.reflection;


      if (note) {

        document
          .getElementById(
            "hedNote"
          )
          .classList.remove(
            "hidden"
          );


        hedNoteContent.textContent =
          note;

      }


      /* PREVIOUS */

      const previous =
        entries[
          currentIndex + 1
        ];


      if (previous) {

        const previousCard =
          document.getElementById(
            "previousEntry"
          );


        previousCard.href =
          `journal-entry.html?id=${previous.id}`;


        document
          .getElementById(
            "previousTitle"
          )
          .textContent =
          previous.title ||
          "Previous Entry";


        previousCard.classList.remove(
          "hidden"
        );

      }


      /* NEXT */

      const next =
        entries[
          currentIndex - 1
        ];


      if (next) {

        const nextCard =
          document.getElementById(
            "nextEntry"
          );


        nextCard.href =
          `journal-entry.html?id=${next.id}`;


        document
          .getElementById(
            "nextTitle"
          )
          .textContent =
          next.title ||
          "Next Entry";


        nextCard.classList.remove(
          "hidden"
        );

      }


      document
        .getElementById(
          "loading"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "entryPage"
        )
        .classList.remove(
          "hidden"
        );


      applyReaderSettings();


      loadComments(
        entry.id
      );

    }


    /* ================================
       COMMENTS
    ================================= */

    async function loadComments(id) {

      const {
        data,
        error
      } = await db
        .from("comments")
        .select(
          "id,name,content,created_at"
        )
        .eq(
          "target_type",
          "journal"
        )
        .eq(
          "target_id",
          id
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


      if (error) {

        console.error(error);

        return;

      }


      const comments =
        data || [];


      const responseCount =
        document.getElementById(
          "responseCount"
        );


      responseCount.textContent =
        `${comments.length} ${
          comments.length === 1
            ? "response"
            : "responses"
        }`;


      const list =
        document.getElementById(
          "commentList"
        );


      list.innerHTML = "";


      comments.forEach(
        comment => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "comment";


          item.innerHTML = `

            <div class="comment-top">

              <div class="comment-name">
                ${escapeHtml(
                  comment.name
                )}
              </div>

              <div class="comment-date">
                ${formatDate(
                  comment.created_at
                )}
              </div>

            </div>

            <div class="comment-content">
              ${escapeHtml(
                comment.content
              )}
            </div>

          `;


          list.appendChild(
            item
          );

        }
      );

    }


    /* ================================
       COMMENT FORM
    ================================= */

    const commentName =
      document.getElementById(
        "commentName"
      );


    if (
      window.readerNickname
    ) {

      commentName.value =
        window.readerNickname;

    }

    else {

      commentName.value =
        "Reader";

    }


    document
      .getElementById(
        "responseForm"
      )
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const name =
            commentName.value.trim();


          const content =
            document
              .getElementById(
                "commentContent"
              )
              .value.trim();


          const message =
            document.getElementById(
              "responseMessage"
            );


          if (!content) {

            message.textContent =
              "Please write something first.";

            return;

          }


          message.textContent =
            "Posting...";


          const {
            error
          } = await db
            .from("comments")
            .insert({

              target_type:
                "journal",

              target_id:
                entryId,

              name:
                name ||
                "Reader",

              content:
                content

            });


          if (error) {

            console.error(
              error
            );

            message.textContent =
              "Something went wrong. Please try again.";

            return;

          }


          document
            .getElementById(
              "commentContent"
            )
            .value = "";


          message.textContent =
            "Your response has been posted.";


          loadComments(
            entryId
          );

        }
      );


    /* ================================
       READING PROGRESS
    ================================= */

    window.addEventListener(
      "scroll",
      () => {

        const scrollTop =
          window.scrollY;


        const documentHeight =
          document.documentElement
            .scrollHeight -
          window.innerHeight;


        const progress =
          documentHeight > 0
            ? (
                scrollTop /
                documentHeight
              ) * 100
            : 0;


        document
          .getElementById(
            "readingProgress"
          )
          .style.width =
          `${progress}%`;

      }
    );


    /* ================================
       START
    ================================= */

    loadEntry();


  </script>
