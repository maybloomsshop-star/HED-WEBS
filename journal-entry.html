<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Journals · May Blooms</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: #f3efe9;
            color: #29221e;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font: inherit;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .journal-page {
            min-height: 100vh;
            background: #f3efe9;
        }


        /* =====================================================
           READING PROGRESS
        ===================================================== */

        .reading-progress {
            position: fixed;

            top: 0;
            left: 0;

            width: 0;
            height: 3px;

            background: #5f4a3f;

            z-index: 9999;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .journal-header {
            width: 100%;

            padding: 22px 5vw;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(73, 59, 51, 0.14);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
            font-weight: 400;

            letter-spacing: 0.035em;
        }

        .brand-subtitle {
            font-size: 8px;

            letter-spacing: 0.18em;

            color: #8c7b70;

            text-transform: uppercase;
        }

        .back-link {
            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #75645a;

            text-transform: uppercase;
        }

        .back-link:hover {
            color: #29221e;
        }


        /* =====================================================
           INDEX
        ===================================================== */

        .journal-index {
            width: 100%;
        }

        .journal-intro {
            width:
                min(
                    calc(100% - 10vw),
                    920px
                );

            margin: 0 auto;

            padding:
                82px
                0
                65px;
        }

        .journal-kicker {
            margin: 0 0 16px;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 0.20em;

            color: #8d7a6e;

            text-transform: uppercase;
        }

        .journal-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    50px,
                    8vw,
                    88px
                );

            line-height: 0.92;

            font-weight: 400;

            letter-spacing: -0.04em;
        }

        .journal-description {
            max-width: 540px;

            margin: 25px 0 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

            line-height: 1.7;

            color: #776960;
        }

        .journal-mark {
            width: 42px;
            height: 1px;

            margin-top: 35px;

            background: #907c70;
        }


        /* =====================================================
           JOURNAL LIST
        ===================================================== */

        .journal-list {
            width:
                min(
                    calc(100% - 10vw),
                    920px
                );

            margin:
                0 auto
                90px;
        }

        .journal-preview {
            display: grid;

            grid-template-columns:
                125px
                minmax(0, 1fr);

            gap: 38px;

            width: 100%;

            padding:
                34px
                0
                38px;

            border-top:
                1px solid
                rgba(73, 59, 51, 0.17);

            transition:
                padding 0.2s ease;
        }

        .journal-preview:last-child {
            border-bottom:
                1px solid
                rgba(73, 59, 51, 0.17);
        }

        .journal-preview:hover {
            padding-left: 7px;
            padding-right: 7px;
        }

        .preview-meta {
            padding-top: 4px;
        }

        .preview-date {
            margin: 0;

            font-size: 8px;
            font-weight: 700;

            line-height: 1.5;

            letter-spacing: 0.15em;

            color: #927f73;

            text-transform: uppercase;
        }

        .preview-number {
            display: block;

            margin-top: 12px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 13px;

            color: #a6968b;
        }

        .preview-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    27px,
                    3.5vw,
                    39px
                );

            line-height: 1.12;

            font-weight: 400;

            letter-spacing: -0.02em;
        }

        .preview-excerpt {
            max-width: 670px;

            margin: 14px 0 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            line-height: 1.75;

            color: #756961;
        }

        .preview-read {
            display: inline-block;

            margin-top: 18px;

            font-size: 8px;
            font-weight: 700;

            letter-spacing: 0.15em;

            color: #78665b;

            text-transform: uppercase;
        }

        .journal-status {
            padding: 38px 0;

            border-top:
                1px solid
                rgba(73,59,51,0.17);

            border-bottom:
                1px solid
                rgba(73,59,51,0.17);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            line-height: 1.7;

            color: #8c7d74;
        }


        /* =====================================================
           READER
        ===================================================== */

        .reader {
            display: none;
        }

        .reader.active {
            display: block;
        }

        .reader-shell {
            width:
                min(
                    calc(100% - 10vw),
                    850px
                );

            margin: 0 auto;

            padding:
                48px
                0
                70px;
        }


        /* =====================================================
           READER TOP
        ===================================================== */

        .reader-top {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 45px;
        }

        .reader-back {
            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #847269;

            text-transform: uppercase;
        }

        .reader-back:hover {
            color: #29221e;
        }

        .reader-label {
            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.10em;

            color: #9b897d;

            text-transform: uppercase;
        }


        /* =====================================================
           READER HEADER
        ===================================================== */

        .reader-header {
            max-width: 720px;

            margin-bottom: 28px;
        }

        .reader-date {
            margin: 0 0 10px;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.12em;

            color: #907d71;

            text-transform: uppercase;
        }

        .reader-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    32px,
                    4vw,
                    42px
                );

            line-height: 1.08;

            font-weight: 400;

            letter-spacing: -0.025em;
        }

        .reader-meta {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-top: 13px;

            font-size: 13px;

            color: #756961;
        }

        .reader-rule {
            width: 32px;
            height: 1px;

            margin-top: 20px;

            background: #917d70;
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .reader-image {
            display: block;

            width: auto;
            max-width: 100%;
            height: auto;

            margin:
                30px
                auto
                38px;
        }


        /* =====================================================
           READING PREFERENCES
        ===================================================== */

        .reading-preferences {
            width: 100%;

            margin:
                0
                auto
                28px;

            padding:
                8px
                10px;

            display: flex;
            align-items: center;
            gap: 7px;

            flex-wrap: wrap;

            border:
                1px solid
                rgba(73,59,51,0.12);

            background:
                rgba(255,255,255,0.18);

            box-shadow:
                0 1px 4px
                rgba(73,59,51,0.05);
        }

        .reading-preferences-label {
            margin-right: 4px;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #78665b;

            text-transform: uppercase;
        }

        .reading-button {
            min-width: 38px;
            min-height: 29px;

            padding:
                5px
                9px;

            border:
                1px solid
                rgba(73,59,51,0.18);

            background: transparent;

            color: #5f5149;

            cursor: pointer;

            font-size: 11px;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .reading-button:hover,
        .reading-button.active {
            background: #e7ded5;

            border-color: #9b897d;
        }


        /* =====================================================
           ARTICLE
        ===================================================== */

        .reader-content {
            width: 100%;
            max-width: 680px;

            margin: 0 auto;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 22px;

            line-height: 1.82;

            color: #403731;

            overflow-wrap: break-word;
        }


        /* IMPORTANT:
           These apply the selected font to the actual
           article elements too.
        */

        .reader-content.serif,
        .reader-content.serif * {
            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        .reader-content.sans,
        .reader-content.sans * {
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .reader-content.lora,
        .reader-content.lora * {
            font-family:
                "Lora",
                Georgia,
                serif;
        }

        .reader-content.cormorant,
        .reader-content.cormorant * {
            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;
        }


        /* =====================================================
           ARTICLE ELEMENTS
        ===================================================== */

        .reader-content,
        .reader-content * {
            -webkit-user-select: none;
            user-select: none;
        }

        .reader-content p {
            margin:
                0
                0
                1.45em;
        }

        .reader-content div {
            margin: 0;
        }

        .reader-content h1,
        .reader-content h2,
        .reader-content h3,
        .reader-content h4 {
            color: #29221e;

            line-height: 1.25;

            font-weight: 400;
        }

        .reader-content h1 {
            font-size: 34px;

            margin:
                1.55em
                0
                0.65em;
        }

        .reader-content h2 {
            font-size: 29px;

            margin:
                1.55em
                0
                0.65em;
        }

        .reader-content h3 {
            font-size: 25px;

            margin:
                1.5em
                0
                0.6em;
        }

        .reader-content h4 {
            font-size: 21px;

            margin:
                1.5em
                0
                0.6em;
        }

        .reader-content strong,
        .reader-content b {
            color: #29221e;
        }

        .reader-content blockquote {
            margin:
                1.9em
                0;

            padding:
                4px
                0
                4px
                24px;

            border-left:
                1px solid
                #8f7b6e;

            color: #71625a;
        }

        .reader-content ul,
        .reader-content ol {
            margin: 1.4em 0;

            padding-left: 1.45em;
        }

        .reader-content li {
            margin-bottom: 0.6em;
        }

        .reader-content img {
            display: block;

            width: auto;
            max-width: 100%;
            height: auto;

            margin:
                2.2em
                auto;
        }

        .reader-content a {
            color: #6f5b50;

            text-decoration: underline;

            text-underline-offset: 3px;
        }


        /* =====================================================
           END OF ENTRY
        ===================================================== */

        .end-of-entry {
            width: 100%;
            max-width: 680px;

            margin:
                45px
                auto
                32px;

            text-align: center;
        }

        .end-of-entry-line {
            width: 42px;
            height: 1px;

            margin:
                0
                auto
                15px;

            background: #a18e82;
        }

        .end-of-entry-text {
            margin: 0;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 0.16em;

            color: #a18e82;

            text-transform: uppercase;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .reader-navigation {
            width: 100%;
            max-width: 680px;

            margin:
                0
                auto
                65px;

            display: flex;

            justify-content: space-between;

            gap: 20px;
        }

        .reader-navigation a {
            flex: 1;

            padding:
                18px
                0;

            border-top:
                1px solid
                rgba(73,59,51,0.17);

            border-bottom:
                1px solid
                rgba(73,59,51,0.17);
        }

        .reader-navigation a:hover {
            background:
                rgba(255,255,255,0.20);
        }

        .reader-nav-label {
            display: block;

            margin-bottom: 7px;

            font-size: 8px;
            font-weight: 700;

            letter-spacing: 0.15em;

            color: #9a887c;

            text-transform: uppercase;
        }

        .reader-nav-title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;

            line-height: 1.35;
        }


        /* =====================================================
           COMMENTS
        ===================================================== */

        .comments-section {
            width:
                min(
                    calc(100% - 10vw),
                    680px
                );

            margin:
                0
                auto
                80px;
        }

        .comments-heading {
            margin:
                0
                0
                25px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;

            font-weight: 400;
        }

        .comment-count {
            margin-left: 7px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.08em;

            color: #a18e82;

            text-transform: uppercase;
        }

        .comment-form {
            padding:
                0
                0
                30px;

            border-bottom:
                1px solid
                rgba(73,59,51,0.14);
        }

        .comment-input,
        .comment-textarea {
            width: 100%;

            border:
                1px solid
                rgba(73,59,51,0.17);

            background:
                rgba(255,255,255,0.22);

            color: #29221e;

            outline: none;
        }

        .comment-input {
            height: 43px;

            padding:
                0
                13px;

            margin-bottom: 12px;
        }

        .comment-textarea {
            min-height: 125px;

            padding: 13px;

            resize: vertical;

            line-height: 1.6;
        }

        .comment-input:focus,
        .comment-textarea:focus {
            border-color: #9b897d;
        }

        .comment-submit {
            margin-top: 12px;

            padding:
                9px
                0;

            border: 0;

            background: none;

            cursor: pointer;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.10em;

            color: #78665b;

            text-transform: uppercase;
        }

        .comment-submit:hover {
            color: #29221e;
        }

        .comment-status {
            margin-top: 13px;

            font-size: 12px;

            color: #8c7d74;
        }

        .comment-actions {
            margin-top: 7px;
        }

        .comment-delete {
            padding: 0;

            border: 0;

            background: none;

            color: #a6968b;

            cursor: pointer;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 0.08em;

            text-transform: uppercase;
        }

        .comment-delete:hover {
            color: #29221e;
        }

        .comment-delete:disabled {
            opacity: .5;

            cursor: wait;
        }

        .comment-list {
            display: flex;

            flex-direction: column;
        }

        .comment {
            padding:
                24px
                0
                26px;

            border-bottom:
                1px solid
                rgba(73,59,51,0.12);
        }

        .comment-meta {
            display: flex;

            align-items: baseline;

            gap: 12px;

            margin-bottom: 9px;
        }

        .comment-name {
            margin: 0;

            font-size: 13px;

            font-weight: 700;

            color: #4f4037;
        }

        .comment-date {
            margin: 0;

            font-size: 10px;

            color: #a18e82;
        }

        .comment-body {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;

            line-height: 1.75;

            color: #65574f;

            white-space: pre-wrap;

            overflow-wrap: break-word;
        }


        /* =====================================================
           MORE JOURNAL
        ===================================================== */

        .more-journal {
            width:
                min(
                    calc(100% - 10vw),
                    850px
                );

            margin:
                0
                auto
                75px;
        }

        .more-journal-title {
            margin:
                0
                0
                22px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 26px;

            font-weight: 400;
        }

        .more-journal-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 18px;
        }

        .more-journal-card {
            padding:
                21px
                0
                25px;

            border-top:
                1px solid
                rgba(73,59,51,0.17);

            border-bottom:
                1px solid
                rgba(73,59,51,0.17);

            transition:
                padding 0.2s ease;
        }

        .more-journal-card:hover {
            padding-left: 6px;
            padding-right: 6px;
        }

        .more-journal-card-date {
            margin:
                0
                0
                9px;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 0.14em;

            color: #9a887c;

            text-transform: uppercase;
        }

        .more-journal-card-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 20px;

            line-height: 1.25;

            font-weight: 400;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .site-footer {
            width: 100%;

            padding:
                25px
                5vw
                35px;

            border-top:
                1px solid
                rgba(73,59,51,0.14);

            text-align: center;
        }

        .site-footer p {
            margin: 0;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.14em;

            color: #9a887c;

            text-transform: uppercase;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .journal-header {
                padding:
                    19px
                    5vw;
            }

            .back-link {
                font-size: 11px;
            }


            /* INDEX */

            .journal-intro {
                padding:
                    60px
                    0
                    50px;
            }

            .journal-title {
                font-size: 55px;
            }

            .journal-list {
                margin-bottom: 60px;
            }

            .journal-preview {
                display: block;

                padding:
                    28px
                    0
                    33px;
            }

            .journal-preview:hover {
                padding-left: 0;
                padding-right: 0;
            }

            .preview-meta {
                padding: 0;

                margin-bottom: 12px;
            }

            .preview-number {
                display: none;
            }

            .preview-title {
                font-size: 29px;
            }

            .preview-excerpt {
                font-size: 15px;
            }


            /* READER */

            .reader-shell {
                padding:
                    40px
                    0
                    60px;
            }

            .reader-top {
                margin-bottom: 40px;
            }

            .reader-title {
                font-size: 34px;
            }

            .reader-header {
                margin-bottom: 24px;
            }

            .reader-content {
                font-size: 19px;

                line-height: 1.85;
            }


            /* PREFERENCES */

            .reading-preferences {
                gap: 6px;

                margin-bottom: 24px;
            }

            .reading-preferences-label {
                width: 100%;

                margin-bottom: 2px;
            }


            /* NAVIGATION */

            .reader-navigation {
                display: block;
            }

            .reader-navigation a {
                display: block;

                margin-bottom: 13px;
            }


            /* COMMENTS */

            .comments-section {
                width:
                    calc(100% - 10vw);
            }


            /* MORE JOURNAL */

            .more-journal-grid {
                grid-template-columns: 1fr;
            }

            .more-journal {
                width:
                    calc(100% - 10vw);
            }

        }

    </style>

</head>


<body>

<div class="journal-page">


    <!-- =====================================================
         READING PROGRESS
    ===================================================== -->

    <div
        id="readingProgress"
        class="reading-progress"
    ></div>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="journal-header">

        <div class="brand">

            <div class="brand-name">
                HED
            </div>

            <div class="brand-subtitle">
                Her Existential Thoughts
            </div>

        </div>


        <a
            href="index.html"
            class="back-link"
        >
            Home
        </a>

    </header>


    <!-- =====================================================
         JOURNAL INDEX
    ===================================================== -->

    <section
        id="journalIndex"
        class="journal-index"
    >

        <div class="journal-intro">

            <p class="journal-kicker">
                Journal
            </p>

            <h1 class="journal-title">
                Things I wrote
            </h1>

            <p class="journal-description">
                Journals, because apparently I had things to say.
            </p>

            <div class="journal-mark"></div>

        </div>


        <div
            id="journalList"
            class="journal-list"
        >

            <div class="journal-status">
                Loading journal...
            </div>

        </div>

    </section>


    <!-- =====================================================
         READER
    ===================================================== -->

    <section
        id="reader"
        class="reader"
    >

        <article class="reader-shell">


            <!-- READER TOP -->

            <div class="reader-top">

                <a

<script src="reader-auth.js"></script>


<script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const journalIndex =
        document.getElementById(
            "journalIndex"
        );

    const journalList =
        document.getElementById(
            "journalList"
        );

    const reader =
        document.getElementById(
            "reader"
        );

    const readerBack =
        document.getElementById(
            "readerBack"
        );

    const readerDate =
        document.getElementById(
            "readerDate"
        );

    const readerTitle =
        document.getElementById(
            "readerTitle"
        );

    const readerMeta =
        document.getElementById(
            "readerMeta"
        );

    const readerImage =
        document.getElementById(
            "readerImage"
        );

    const readerContent =
        document.getElementById(
            "readerContent"
        );

    const readerNavigation =
        document.getElementById(
            "readerNavigation"
        );

    const readingProgress =
        document.getElementById(
            "readingProgress"
        );

    const commentForm =
        document.getElementById(
            "commentForm"
        );

    const commentName =
        document.getElementById(
            "commentName"
        );

    const commentContent =
        document.getElementById(
            "commentContent"
        );

    const commentStatus =
        document.getElementById(
            "commentStatus"
        );

    const commentList =
        document.getElementById(
            "commentList"
        );

    const commentCount =
        document.getElementById(
            "commentCount"
        );

    const moreJournalGrid =
        document.getElementById(
            "moreJournalGrid"
        );


    /* =========================================================
       CURRENT USER
    ========================================================= */

    let currentUser = null;


    async function refreshCurrentUser() {

        const {
            data
        } =
            await supabaseClient.auth.getUser();

        currentUser =
            data?.user || null;

        return currentUser;

    }


    /* =========================================================
       COMMENT NAME
    ========================================================= */

    async function prefillCommentName() {

        if (!commentName) {
            return;
        }


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();


            if (error) {

                console.warn(
                    "Could not load the signed-in profile:",
                    error
                );

                return;

            }


            const user =
                data?.user;


            const nickname =
                String(
                    user?.user_metadata?.nickname ||
                    user?.user_metadata?.display_name ||
                    user?.user_metadata?.name ||
                    ""
                ).trim();


            if (nickname) {

                commentName.value =
                    nickname;

                commentName.dataset.profileName =
                    nickname;

                commentName.readOnly =
                    true;

            }


        } catch (error) {

            console.warn(
                "Could not load the signed-in profile name:",
                error
            );

        }

    }


    /* =========================================================
       DATA
    ========================================================= */

    let journalEntries = [];

    let currentEntryId = null;


    /* =========================================================
       DATE
    ========================================================= */

    function formatDate(
        dateString
    ) {

        if (!dateString) {
            return "";
        }


        const date =
            new Date(
                dateString
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return date.toLocaleDateString(
            undefined,
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );

    }


    /* =========================================================
       READING TIME
    ========================================================= */

    function calculateReadingTime(
        content
    ) {

        const temporary =
            document.createElement(
                "div"
            );


        temporary.innerHTML =
            content || "";


        const text =
            temporary.textContent ||
            temporary.innerText ||
            "";


        const words =
            text
                .trim()
                .split(/\s+/)
                .filter(Boolean)
                .length;


        return Math.max(
            1,
            Math.ceil(
                words / 200
            )
        );

    }


    /* =========================================================
       JOURNAL INDEX
    ========================================================= */

    function renderJournalIndex() {

        journalList.innerHTML =
            "";


        if (
            !journalEntries.length
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "journal-status";


            empty.textContent =
                "No journal entries yet.";


            journalList.appendChild(
                empty
            );


            return;

        }


        journalEntries.forEach(
            function(
                entry,
                index
            ) {

                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    "#";


                link.className =
                    "journal-preview";


                link.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        openReader(
                            entry
                        );

                    }
                );


                const meta =
                    document.createElement(
                        "div"
                    );


                meta.className =
                    "preview-meta";


                const date =
                    document.createElement(
                        "p"
                    );


                date.className =
                    "preview-date";


                date.textContent =
                    formatDate(
                        entry.published_at
                    );


                const number =
                    document.createElement(
                        "span"
                    );


                number.className =
                    "preview-number";


                number.textContent =
                    String(
                        journalEntries.length -
                        index
                    );


                meta.appendChild(
                    date
                );

                meta.appendChild(
                    number
                );


                const content =
                    document.createElement(
                        "div"
                    );


                const title =
                    document.createElement(
                        "h2"
                    );


                title.className =
                    "preview-title";


                title.textContent =
                    entry.title ||
                    "Untitled";


                const excerpt =
                    document.createElement(
                        "p"
                    );


                excerpt.className =
                    "preview-excerpt";


                const temporary =
                    document.createElement(
                        "div"
                    );


                temporary.innerHTML =
                    entry.content || "";


                const plainText =
                    temporary.textContent ||
                    temporary.innerText ||
                    "";


                excerpt.textContent =
                    plainText
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim()
                        .slice(
                            0,
                            220
                        );


                const read =
                    document.createElement(
                        "span"
                    );


                read.className =
                    "preview-read";


                read.textContent =
                    "Read entry →";


                content.appendChild(
                    title
                );

                content.appendChild(
                    excerpt
                );

                content.appendChild(
                    read
                );


                link.appendChild(
                    meta
                );

                link.appendChild(
                    content
                );


                journalList.appendChild(
                    link
                );

            }
        );

    }


    /* =========================================================
       READER NAVIGATION
    ========================================================= */

    function renderReaderNavigation(
        currentIndex
    ) {

        readerNavigation.innerHTML =
            "";


        const older =
            journalEntries[
                currentIndex + 1
            ];


        const newer =
            journalEntries[
                currentIndex - 1
            ];


        if (newer) {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                "#";


            link.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    openReader(
                        newer
                    );

                }
            );


            const label =
                document.createElement(
                    "span"
                );


            label.className =
                "reader-nav-label";


            label.textContent =
                "Newer entry";


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "reader-nav-title";


            title.textContent =
                newer.title ||
                "Untitled";


            link.appendChild(
                label
            );

            link.appendChild(
                title
            );


            readerNavigation.appendChild(
                link
            );

        }


        if (older) {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                "#";


            link.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    openReader(
                        older
                    );

                }
            );


            const label =
                document.createElement(
                    "span"
                );


            label.className =
                "reader-nav-label";


            label.textContent =
                "Older entry";


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "reader-nav-title";


            title.textContent =
                older.title ||
                "Untitled";


            link.appendChild(
                label
            );

            link.appendChild(
                title
            );


            readerNavigation.appendChild(
                link
            );

        }

    }


    /* =========================================================
       MORE JOURNAL
    ========================================================= */

    function renderMoreJournal(
        currentIndex
    ) {

        moreJournalGrid.innerHTML =
            "";


        const others =
            journalEntries
                .filter(
                    function(
                        entry
                    ) {

                        return String(
                            entry.id
                        ) !==
                        String(
                            currentEntryId
                        );

                    }
                )
                .slice(
                    0,
                    3
                );


        others.forEach(
            function(
                entry
            ) {

                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    "#";


                link.className =
                    "more-journal-card";


                link.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        openReader(
                            entry
                        );

                    }
                );


                const date =
                    document.createElement(
                        "p"
                    );


                date.className =
                    "more-journal-card-date";


                date.textContent =
                    formatDate(
                        entry.published_at
                    );


                const title =
                    document.createElement(
                        "h3"
                    );


                title.className =
                    "more-journal-card-title";


                title.textContent =
                    entry.title ||
                    "Untitled";


                link.appendChild(
                    date
                );

                link.appendChild(
                    title
                );


                moreJournalGrid.appendChild(
                    link
                );

            }
        );

    }


    /* =========================================================
       COMMENTS
    ========================================================= */

    async function loadComments(
        entryId
    ) {

        commentList.innerHTML =
            "";


        commentCount.textContent =
            "0 comments";


        const {
            data,
            error
        } =
            await supabaseClient
                .from("comments")
                .select("*")
                .eq(
                    "target_type",
                    "journal"
                )
                .eq(
                    "target_id",
                    entryId
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Could not load comments:",
                error
            );

            return;

        }


        const comments =
            data || [];


        commentCount.textContent =
            comments.length +
            (
                comments.length === 1
                    ? " comment"
                    : " comments"
            );


        comments.forEach(
            function(
                comment
            ) {

                const article =
                    document.createElement(
                        "article"
                    );


                article.className =
                    "comment";


                const meta =
                    document.createElement(
                        "div"
                    );


                meta.className =
                    "comment-meta";


                const name =
                    document.createElement(
                        "p"
                    );


                name.className =
                    "comment-name";


                name.textContent =
                    comment.name ||
                    "Anonymous";


                const date =
                    document.createElement(
                        "p"
                    );


                date.className =
                    "comment-date";


                date.textContent =
                    formatDate(
                        comment.created_at
                    );


                meta.appendChild(
                    name
                );

                meta.appendChild(
                    date
                );


                const body =
                    document.createElement(
                        "p"
                    );


                body.className =
                    "comment-body";


                body.textContent =
                    comment.content ||
                    "";


                article.appendChild(
                    meta
                );

                article.appendChild(
                    body
                );


                /*
                 * DELETE IS SHOWN ONLY WHEN
                 * THIS COMMENT BELONGS TO
                 * THE CURRENT AUTHENTICATED USER.
                 */

                if (
                    currentUser &&
                    comment.user_id &&
                    String(
                        comment.user_id
                    ) ===
                    String(
                        currentUser.id
                    )
                ) {

                    const actions =
                        document.createElement(
                            "div"
                        );


                    actions.className =
                        "comment-actions";


                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.type =
                        "button";


                    deleteButton.className =
                        "comment-delete";


                    deleteButton.textContent =
                        "Delete";


                    deleteButton.addEventListener(
                        "click",
                        async function() {

                            if (
                                !confirm(
                                    "Delete your comment?"
                                )
                            ) {

                                return;

                            }


                            deleteButton.disabled =
                                true;


                            const {
                                error:
                                    deleteError
                            } =
                                await supabaseClient
                                    .from("comments")
                                    .delete()
                                    .eq(
                                        "id",
                                        comment.id
                                    )
                                    .eq(
                                        "user_id",
                                        currentUser.id
                                    );


                            if (
                                deleteError
                            ) {

                                console.error(
                                    "Could not delete comment:",
                                    deleteError
                                );


                                deleteButton.disabled =
                                    false;


                                return;

                            }


                            await loadComments(
                                entryId
                            );

                        }
                    );


                    actions.appendChild(
                        deleteButton
                    );


                    article.appendChild(
                        actions
                    );

                }


                commentList.appendChild(
                    article
                );

            }
        );

    }


    /* =========================================================
       OPEN READER
    ========================================================= */

    function openReader(
        entry
    ) {

        const index =
            journalEntries.findIndex(
                function(
                    item
                ) {

                    return String(
                        item.id
                    ) ===
                    String(
                        entry.id
                    );

                }
            );


        currentEntryId =
            entry.id;


        journalIndex.style.display =
            "none";


        reader.classList.add(
            "active"
        );


        readerDate.textContent =
            formatDate(
                entry.published_at
            );


        readerTitle.textContent =
            entry.title ||
            "Untitled";


        const minutes =
            calculateReadingTime(
                entry.content
            );


        readerMeta.textContent =
            minutes +
            (
                minutes === 1
                    ? " minute read"
                    : " minutes read"
            );


        if (
            entry.image_url
        ) {

            readerImage.src =
                entry.image_url;


            readerImage.alt =
                entry.title ||
                "Journal image";


            readerImage.style.display =
                "block";

        } else {

            readerImage.removeAttribute(
                "src"
            );


            readerImage.style.display =
                "none";

        }


        readerContent.innerHTML =
            entry.content ||
            "";


        /*
         * Re-apply the current reading preference
         * after loading a new article.
         */

        updateReadingStyle();


        renderReaderNavigation(
            index
        );


        renderMoreJournal(
            index
        );


        loadComments(
            entry.id
        );


        window.scrollTo(
            0,
            0
        );

    }


    /* =========================================================
       URL
    ========================================================= */

    function getRequestedId() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        return params.get(
            "id"
        );

    }


    /* =========================================================
       LOAD JOURNAL
    ========================================================= */

    async function loadJournal() {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("journal_entries")
                .select("*")
                .order(
                    "published_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "Error loading journal:",
                error
            );


            journalList.innerHTML =
                "";


            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "journal-status";


            message.textContent =
                "Unable to load the journal.";


            journalList.appendChild(
                message
            );


            return;

        }


        journalEntries =
            data || [];


        const requestedId =
            getRequestedId();


        if (
            requestedId
        ) {

            const entry =
                journalEntries.find(
                    function(
                        item
                    ) {

                        return String(
                            item.id
                        ) ===
                        String(
                            requestedId
                        );

                    }
                );


            if (
                entry
            ) {

                openReader(
                    entry
                );

                return;

            }

        }


        renderJournalIndex();

    }


    /* =========================================================
       BACK TO JOURNAL
    ========================================================= */

    readerBack.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            window.location.href =
                "journal.html";

        }
    );


    /* =========================================================
       COMMENTS SUBMIT
    ========================================================= */

    commentForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (
                !currentEntryId
            ) {

                return;

            }


            await refreshCurrentUser();


            const profileName =
                String(
                    commentName.dataset.profileName ||
                    ""
                ).trim();


            const name =
                profileName ||
                commentName.value.trim();


            const content =
                commentContent.value.trim();


            if (
                !name ||
                !content
            ) {

                return;

            }


            commentStatus.textContent =
                "Posting...";


            const payload = {

                target_type:
                    "journal",

                target_id:
                    currentEntryId,

                name:
                    name,

                content:
                    content

            };


            /*
             * Attach the authenticated user's ID.
             */

            if (
                currentUser
            ) {

                payload.user_id =
                    currentUser.id;

            }


            let result =
                await supabaseClient
                    .from("comments")
                    .insert(
                        payload
                    );


            /*
             * Compatibility fallback:
             * if the existing comments table does not
             * yet have user_id, the comment can still post.
             */

            if (
                result.error &&
                currentUser &&
                /user_id|column/i.test(
                    result.error.message || ""
                )
            ) {

                result =
                    await supabaseClient
                        .from("comments")
                        .insert({

                            target_type:
                                "journal",

                            target_id:
                                currentEntryId,

                            name:
                                name,

                            content:
                                content

                        });

            }


            if (
                result.error
            ) {

                console.error(
                    "Could not post comment:",
                    result.error
                );


                commentStatus.textContent =
                    "Could not post comment.";


                return;

            }


            commentName.value =
                commentName.dataset.profileName ||
                "";


            commentContent.value =
                "";


            commentStatus.textContent =
                "Comment posted.";


            await loadComments(
                currentEntryId
            );

        }
    );


    /* =========================================================
       READING PREFERENCES
       SESSION ONLY — NO LOCALSTORAGE
    ========================================================= */

    const fontDecrease =
        document.getElementById(
            "fontDecrease"
        );

    const fontNormal =
        document.getElementById(
            "fontNormal"
        );

    const fontIncrease =
        document.getElementById(
            "fontIncrease"
        );

    const fontSerif =
        document.getElementById(
            "fontSerif"
        );

    const fontSans =
        document.getElementById(
            "fontSans"
        );

    const fontLora =
        document.getElementById(
            "fontLora"
        );

    const fontCormorant =
        document.getElementById(
            "fontCormorant"
        );


    /*
     * Normal article size.
     *
     * Desktop = 22px
     * Mobile = 19px
     */

    const normalFontSize =
        window.innerWidth <= 700
            ? 19
            : 22;


    let readerFontSize =
        normalFontSize;


    let readerFont =
        "serif";


    function updateReadingStyle() {

        /*
         * Apply the size directly to the
         * actual article container.
         */

        readerContent.style.fontSize =
            readerFontSize +
            "px";


        /*
         * Remove all old font classes.
         */

        readerContent.classList.remove(
            "serif",
            "sans",
            "lora",
            "cormorant"
        );


        /*
         * Add the selected font.
         */

        readerContent.classList.add(
            readerFont
        );


        /*
         * Remove active state from
         * every font button.
         */

        [
            fontSerif,
            fontSans,
            fontLora,
            fontCormorant
        ].forEach(
            function(button) {

                button.classList.remove(
                    "active"
                );

            }
        );


        /*
         * Find the currently selected
         * font button.
         */

        const activeFontButton = {

            serif:
                fontSerif,

            sans:
                fontSans,

            lora:
                fontLora,

            cormorant:
                fontCormorant

        }[
            readerFont
        ];


        if (
            activeFontButton
        ) {

            activeFontButton.classList.add(
                "active"
            );

        }


        /*
         * Update size button states.
         */

        fontDecrease.classList.toggle(
            "active",
            readerFontSize <
            normalFontSize
        );


        fontNormal.classList.toggle(
            "active",
            readerFontSize ===
            normalFontSize
        );


        fontIncrease.classList.toggle(
            "active",
            readerFontSize >
            normalFontSize
        );

    }


    /* =========================================================
       FONT SIZE — DECREASE
    ========================================================= */

    fontDecrease.addEventListener(
        "click",
        function() {

            readerFontSize =
                Math.max(
                    17,
                    readerFontSize - 2
                );


            updateReadingStyle();

        }
    );


    /* =========================================================
       FONT SIZE — NORMAL
    ========================================================= */

    fontNormal.addEventListener(
        "click",
        function() {

            readerFontSize =
                normalFontSize;


            updateReadingStyle();

        }
    );


    /* =========================================================
       FONT SIZE — INCREASE
    ========================================================= */

    fontIncrease.addEventListener(
        "click",
        function() {

            readerFontSize =
                Math.min(
                    30,
                    readerFontSize + 2
                );


            updateReadingStyle();

        }
    );


    /* =========================================================
       FONT — SERIF
    ========================================================= */

    fontSerif.addEventListener(
        "click",
        function() {

            readerFont =
                "serif";


            updateReadingStyle();

        }
    );


    /* =========================================================
       FONT — SANS
    ========================================================= */

    fontSans.addEventListener(
        "click",
        function() {

            readerFont =
                "sans";


            updateReadingStyle();

        }
    );


    /* =========================================================
       FONT — LORA
    ========================================================= */

    fontLora.addEventListener(
        "click",
        function() {

            readerFont =
                "lora";


            updateReadingStyle();

        }
    );


    /* =========================================================
       FONT — CORMORANT
    ========================================================= */

    fontCormorant.addEventListener(
        "click",
        function() {

            readerFont =
                "cormorant";


            updateReadingStyle();

        }
    );


    /* =========================================================
       COPY PROTECTION — ARTICLE ONLY
    ========================================================= */

    [
        "contextmenu",
        "copy",
        "cut",
        "selectstart",
        "dragstart"
    ].forEach(
        function(eventName) {

            readerContent.addEventListener(
                eventName,
                function(event) {

                    event.preventDefault();

                }
            );

        }
    );


    document.addEventListener(
        "keydown",
        function(event) {

            const key =
                event.key.toLowerCase();


            if (
                !(
                    event.ctrlKey ||
                    event.metaKey
                )
            ) {

                return;

            }


            if (
                ![
                    "c",
                    "x",
                    "a"
                ].includes(
                    key
                )
            ) {

                return;

            }


            const selection =
                window.getSelection();


            const anchorNode =
                selection &&
                selection.anchorNode;


            if (
                !anchorNode
            ) {

                return;

            }


            const node =
                anchorNode.nodeType ===
                Node.TEXT_NODE
                    ? anchorNode.parentNode
                    : anchorNode;


            if (
                readerContent.contains(
                    node
                )
            ) {

                event.preventDefault();

            }

        }
    );


    /* =========================================================
       READING PROGRESS
    ========================================================= */

    window.addEventListener(
        "scroll",
        function() {

            if (
                !reader.classList.contains(
                    "active"
                )
            ) {

                readingProgress.style.width =
                    "0%";

                return;

            }


            const scrollTop =
                window.scrollY ||
                document.documentElement.scrollTop;


            const documentHeight =
                document.documentElement.scrollHeight -
                window.innerHeight;


            if (
                documentHeight <= 0
            ) {

                readingProgress.style.width =
                    "100%";

                return;

            }


            const progress =
                Math.min(
                    100,
                    Math.max(
                        0,
                        (
                            scrollTop /
                            documentHeight
                        ) *
                        100
                    )
                );


            readingProgress.style.width =
                progress +
                "%";

        }
    );


    /* =========================================================
       START
    ========================================================= */

    updateReadingStyle();


    window.readerAuthReady.then(
        async function() {

            const nicknameElement =
                document.getElementById(
                    "readerNickname"
                );


            if (
                nicknameElement &&
                window.readerNickname
            ) {

                nicknameElement.textContent =
                    window.readerNickname;

            }


            await refreshCurrentUser();

            await prefillCommentName();

            loadJournal();

        }
    );

</script>


</body>

</html>
