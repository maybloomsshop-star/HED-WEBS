<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Journal — HED</title>

  <style>
    :root {
      --hed-brown: #4a352b;
      --hed-brown-dark: #382920;
      --hed-cream: #f5efe6;
      --hed-paper: #fbf8f3;
      --hed-green: #68745d;
      --hed-pink: #c58f91;
      --hed-text: #342b26;
      --hed-muted: #85786e;
      --hed-line: #d8cec2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--hed-paper);
      color: var(--hed-text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* READING PROGRESS */

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--hed-brown);
      z-index: 9999;
    }

    /* HEADER */

    header {
      height: 78px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--hed-line);
      background: rgba(251, 248, 243, 0.96);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .brand {
      text-decoration: none;
      color: var(--hed-brown-dark);
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--hed-brown);
    }

    /* PAGE */

    main {
      width: min(1080px, 90%);
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 45px;
    }

    .back-link:hover {
      color: var(--hed-brown);
    }

    /* JOURNAL HEADER */

    .journal-label {
      color: var(--hed-green);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .entry-title {
      max-width: 850px;
      margin: 0;
      color: var(--hed-brown-dark);
      font-size: clamp(40px, 6vw, 68px);
      line-height: 1.06;
      font-weight: normal;
      letter-spacing: -1.5px;
    }

    .entry-subtitle {
      max-width: 720px;
      margin: 25px 0 25px;
      color: var(--hed-muted);
      font-size: 21px;
      line-height: 1.6;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-top: 25px;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .meta-dot {
      color: var(--hed-pink);
    }

    .ornament {
      margin: 35px 0;
      color: var(--hed-pink);
      font-size: 17px;
      letter-spacing: 7px;
    }

    /* HERO IMAGE */

    .hero-image-wrap {
      width: 100%;
      margin: 30px 0 55px;
    }

    .hero-image {
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      display: block;
      background: var(--hed-cream);
    }

    .image-caption {
      margin-top: 12px;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.8px;
      line-height: 1.5;
    }

    /* READING PREFERENCES */

    .reading-preferences {
      width: min(760px, 100%);
      margin: 0 auto 35px;
      padding: 14px 0;
      border-top: 1px solid var(--hed-line);
      border-bottom: 1px solid var(--hed-line);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .preference-label {
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .preference-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .preference-group-title {
      margin-right: 7px;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .preference-button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--hed-muted);
      padding: 6px 9px;
      border-radius: 4px;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      transition: all 0.2s ease;
    }

    .preference-button:hover {
      color: var(--hed-brown);
      background: var(--hed-cream);
    }

    .preference-button.active {
      color: var(--hed-brown-dark);
      border-color: var(--hed-line);
      background: var(--hed-cream);
      font-weight: bold;
    }

    .font-serif {
      font-family: Georgia, "Times New Roman", serif;
    }

    .font-sans {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ARTICLE */

    .article-area {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .article-content {
      --reader-size: 19px;
      --reader-font: Georgia, "Times New Roman", serif;

      font-family: var(--reader-font);
      font-size: var(--reader-size);
      line-height: 1.9;
      color: var(--hed-text);
      transition: font-size 0.2s ease, font-family 0.2s ease;
    }

    .article-content p {
      margin: 0 0 1.45em;
    }

    .article-content h2 {
      margin: 2.2em 0 0.8em;
      color: var(--hed-brown-dark);
      font-size: 30px;
      line-height: 1.25;
      font-weight: normal;
    }

    .article-content h3 {
      margin: 2em 0 0.7em;
      color: var(--hed-brown-dark);
      font-size: 23px;
      line-height: 1.3;
      font-weight: normal;
    }

    .article-content strong {
      color: var(--hed-brown-dark);
    }

    .article-content em {
      color: #574a42;
    }

    .article-content a {
      color: var(--hed-green);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .article-content blockquote {
      margin: 45px 0;
      padding: 5px 0 5px 28px;
      border-left: 3px solid var(--hed-pink);
      color: var(--hed-brown);
      font-size: 25px;
      line-height: 1.55;
      font-style: italic;
    }

    .article-content ul,
    .article-content ol {
      margin: 0 0 1.5em;
      padding-left: 30px;
    }

    .article-content li {
      margin-bottom: 8px;
    }

    .article-content img {
      width: 100%;
      height: auto;
      display: block;
      margin: 40px 0;
    }

    .article-content hr {
      border: 0;
      border-top: 1px solid var(--hed-line);
      margin: 50px 0;
    }

    /* NOTE */

    .hed-note {
      margin-top: 65px;
      padding: 35px;
      background: var(--hed-cream);
      border: 1px solid var(--hed-line);
    }

    .hed-note-label {
      margin-bottom: 15px;
      color: var(--hed-green);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hed-note-content {
      color: var(--hed-brown);
      font-family: var(--reader-font, Georgia, "Times New Roman", serif);
      font-size: var(--reader-size, 19px);
      line-height: 1.8;
    }

    /* RESPONSES */

    .responses {
      width: min(760px, 100%);
      margin: 90px auto 0;
      padding-top: 45px;
      border-top: 1px solid var(--hed-line);
    }

    .section-label {
      color: var(--hed-green);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0;
      color: var(--hed-brown-dark);
      font-size: 32px;
      font-weight: normal;
    }

    .response-count {
      margin-top: 8px;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
    }

    .response-form {
      margin-top: 30px;
      padding: 25px;
      background: var(--hed-cream);
      border: 1px solid var(--hed-line);
    }

    .response-form input,
    .response-form textarea {
      width: 100%;
      border: 1px solid var(--hed-line);
      background: var(--hed-paper);
      color: var(--hed-text);
      padding: 13px 14px;
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      outline: none;
    }

    .response-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    .response-form input:focus,
    .response-form textarea:focus {
      border-color: var(--hed-green);
    }

    .response-form button {
      border: 0;
      background: var(--hed-brown);
      color: white;
      padding: 12px 20px;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .response-form button:hover {
      background: var(--hed-brown-dark);
    }

    .response-message {
      margin-top: 12px;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }

    .comment-list {
      margin-top: 35px;
    }

    .comment {
      padding: 24px 0;
      border-bottom: 1px solid var(--hed-line);
    }

    .comment-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 9px;
    }

    .comment-name {
      color: var(--hed-brown-dark);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: bold;
    }

    .comment-date {
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
    }

    .comment-content {
      color: var(--hed-text);
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* KEEP READING */

    .keep-reading {
      margin: 100px auto 0;
      padding-top: 45px;
      border-top: 1px solid var(--hed-line);
    }

    .reading-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
    }

    .reading-card {
      min-height: 170px;
      padding: 28px;
      background: var(--hed-cream);
      border: 1px solid var(--hed-line);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .reading-card:hover {
      transform: translateY(-3px);
      background: #f1e9df;
    }

    .reading-direction {
      color: var(--hed-green);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .reading-title {
      margin-top: 25px;
      color: var(--hed-brown-dark);
      font-size: 22px;
      line-height: 1.3;
    }

    .all-journal {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      color: var(--hed-brown);
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .all-journal:hover {
      color: var(--hed-green);
    }

    /* FOOTER */

    footer {
      margin-top: 100px;
      padding: 55px 6%;
      background: var(--hed-brown-dark);
      color: var(--hed-cream);
      text-align: center;
    }

    .footer-brand {
      font-size: 24px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .footer-tagline {
      margin-top: 12px;
      color: #cfc3b8;
      font-size: 14px;
      font-style: italic;
    }

    .footer-nav {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .footer-nav a {
      color: #cfc3b8;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .footer-nav a:hover {
      color: white;
    }

    /* LOADING / ERROR */

    .status {
      min-height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--hed-muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .brand {
        font-size: 21px;
      }

      nav {
        gap: 16px;
      }

      nav a {
        font-size: 9px;
        letter-spacing: 1.3px;
      }

      main {
        width: 90%;
        padding-top: 45px;
      }

      .back-link {
        margin-bottom: 35px;
      }

      .entry-title {
        font-size: 36px;
        letter-spacing: -0.8px;
      }

      .entry-subtitle {
        font-size: 18px;
      }

      .entry-meta {
        line-height: 1.7;
      }

      .hero-image-wrap {
        margin-bottom: 40px;
      }

      .reading-preferences {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .preference-group {
        flex-wrap: wrap;
      }

      .article-content {
        --reader-size: 18px;
      }

      .article-content h2 {
        font-size: 27px;
      }

      .article-content h3 {
        font-size: 21px;
      }

      .article-content blockquote {
        font-size: 21px;
        padding-left: 20px;
      }

      .hed-note {
        padding: 25px;
      }

      .responses {
        margin-top: 70px;
      }

      .reading-grid {
        grid-template-columns: 1fr;
      }

      .reading-card {
        min-height: 145px;
      }
    }
  </style>
</head>

  </main>

  <footer>

    <div class="footer-brand">
      HED
    </div>

    <div class="footer-tagline">
      Her Existential Thoughts
    </div>

    <div class="footer-nav">
      <a href="journal.html">Journal</a>
      <a href="about.html">About</a>
    </div>

  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reader-auth.js"></script>


  <script>

    const db = supabaseClient;

    const entryId =
      new URLSearchParams(window.location.search).get("id");


    /* --------------------------------
       HELPERS
    -------------------------------- */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(date) {

      if (!date) return "";

      return new Date(date).toLocaleDateString(
        "en-US",
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );
    }


    function calculateReadTime(content) {

      if (!content) return "1 min read";

      const words =
        String(content)
          .replace(/<[^>]*>/g, " ")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .length;

      const minutes =
        Math.max(1, Math.ceil(words / 220));

      return `${minutes} min read`;
    }


    /* --------------------------------
       READING PREFERENCES
    -------------------------------- */

    const articleContent =
      document.getElementById("articleContent");

    const hedNoteContent =
      document.getElementById("hedNoteContent");


    const savedSize =
      localStorage.getItem("hedReadingSize") || "normal";

    const savedFont =
      localStorage.getItem("hedReadingFont") || "serif";


    function applyReadingPreferences() {

      let sizeValue = "19px";

      if (savedSize === "small") {
        sizeValue = "17px";
      }

      if (savedSize === "large") {
        sizeValue = "21px";
      }


      let fontValue =
        'Georgia, "Times New Roman", serif';

      if (savedFont === "sans") {
        fontValue =
          'Arial, Helvetica, sans-serif';
      }


      articleContent.style.setProperty(
        "--reader-size",
        sizeValue
      );

      articleContent.style.setProperty(
        "--reader-font",
        fontValue
      );


      if (hedNoteContent) {

        hedNoteContent.style.setProperty(
          "--reader-size",
          sizeValue
        );

        hedNoteContent.style.setProperty(
          "--reader-font",
          fontValue
        );

      }


      document
        .querySelectorAll("[data-size]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.size === savedSize
          );

        });


      document
        .querySelectorAll("[data-font]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.font === savedFont
          );

        });

    }


    /*
      We use these as mutable values so the
      current preference can be changed
      without changing the saved settings.
    */

    let currentSize = savedSize;
    let currentFont = savedFont;


    function updateReadingPreferences() {

      let sizeValue = "19px";

      if (currentSize === "small") {
        sizeValue = "17px";
      }

      if (currentSize === "large") {
        sizeValue = "21px";
      }


      let fontValue =
        'Georgia, "Times New Roman", serif';

      if (currentFont === "sans") {
        fontValue =
          'Arial, Helvetica, sans-serif';
      }


      articleContent.style.setProperty(
        "--reader-size",
        sizeValue
      );

      articleContent.style.setProperty(
        "--reader-font",
        fontValue
      );


      if (hedNoteContent) {

        hedNoteContent.style.setProperty(
          "--reader-size",
          sizeValue
        );

        hedNoteContent.style.setProperty(
          "--reader-font",
          fontValue
        );

      }


      document
        .querySelectorAll("[data-size]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.size === currentSize
          );

        });


      document
        .querySelectorAll("[data-font]")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.font === currentFont
          );

        });


      localStorage.setItem(
        "hedReadingSize",
        currentSize
      );

      localStorage.setItem(
        "hedReadingFont",
        currentFont
      );

    }


    document
      .querySelectorAll("[data-size]")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentSize =
              button.dataset.size;

            updateReadingPreferences();

          }
        );

      });


    document
      .querySelectorAll("[data-font]")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentFont =
              button.dataset.font;

            updateReadingPreferences();

          }
        );

      });


    applyReadingPreferences();


    /* --------------------------------
       LOAD JOURNAL ENTRY
    -------------------------------- */

    async function loadEntry() {

      if (!entryId) {

        document.getElementById("loading").textContent =
          "No journal entry was selected.";

        return;

      }


      const {
        data,
        error
      } = await db
        .from("journal_entries")
        .select("*")
        .order("published_at", {
          ascending: false
        });


      if (error) {

        console.error(error);

        document.getElementById("loading").textContent =
          "Unable to load this journal entry.";

        return;

      }


      const entries = data || [];


      const currentIndex =
        entries.findIndex(
          entry => String(entry.id) === String(entryId)
        );


      if (currentIndex === -1) {

        document.getElementById("loading").textContent =
          "Journal entry unavailable.";

        return;

      }


      const entry =
        entries[currentIndex];


      /* TITLE */

      document.getElementById("entryTitle")
        .textContent =
        entry.title || "Untitled Journal Entry";


      /* SUBTITLE */

      const subtitle =
        entry.subtitle ||
        entry.description ||
        entry.dek;


      if (subtitle) {

        const subtitleElement =
          document.getElementById("entrySubtitle");

        subtitleElement.textContent =
          subtitle;

        subtitleElement.classList.remove(
          "hidden"
        );

      }


      /* META */

      document.getElementById("entryDate")
        .textContent =
        formatDate(entry.published_at);


      document.getElementById("readTime")
        .textContent =
        calculateReadTime(entry.content);


      /* IMAGE */

      if (entry.image_url) {

        const heroWrap =
          document.getElementById("heroWrap");

        const heroImage =
          document.getElementById("heroImage");

        heroImage.src =
          entry.image_url;

        heroImage.alt =
          entry.title || "Journal image";

        heroWrap.classList.remove(
          "hidden"
        );


        const caption =
          entry.image_caption ||
          entry.caption;


        if (caption) {

          const captionElement =
            document.getElementById("imageCaption");

          captionElement.textContent =
            caption;

          captionElement.classList.remove(
            "hidden"
          );

        }

      }


      /* CONTENT */

      articleContent.innerHTML =
        entry.content || "<p>This entry has no content yet.</p>";


      /* NOTE */

      const note =
        entry.author_reflection ||
        entry.reflection;


      if (note) {

        document.getElementById("hedNote")
          .classList.remove("hidden");

        hedNoteContent.textContent =
          note;

      }


      /* PREVIOUS */

      const previous =
        entries[currentIndex + 1];


      if (previous) {

        const previousCard =
          document.getElementById(
            "previousEntry"
          );

        previousCard.href =
          `journal-entry.html?id=${previous.id}`;

        document.getElementById(
          "previousTitle"
        ).textContent =
          previous.title || "Previous Entry";

        previousCard.classList.remove(
          "hidden"
        );

      }


      /* NEXT */

      const next =
        entries[currentIndex - 1];


      if (next) {

        const nextCard =
          document.getElementById(
            "nextEntry"
          );

        nextCard.href =
          `journal-entry.html?id=${next.id}`;

        document.getElementById(
          "nextTitle"
        ).textContent =
          next.title || "Next Entry";

        nextCard.classList.remove(
          "hidden"
        );

      }


      document.getElementById("loading")
        .classList.add("hidden");

      document.getElementById("entryPage")
        .classList.remove("hidden");


      updateReadingPreferences();


      loadComments(entry.id);

    }


    /* --------------------------------
       COMMENTS
    -------------------------------- */

    async function loadComments(id) {

      const {
        data,
        error
      } = await db
        .from("comments")
        .select(
          "id,name,content,created_at"
        )
        .eq("target_type", "journal")
        .eq("target_id", id)
        .order("created_at", {
          ascending: true
        });


      if (error) {

        console.error(error);

        return;

      }


      const comments =
        data || [];


      document.getElementById(
        "responseCount"
      ).textContent =
        `${comments.length} ${
          comments.length === 1
            ? "response"
            : "responses"
        }`;


      const list =
        document.getElementById(
          "commentList"
        );


      list.innerHTML = "";


      comments.forEach(comment => {

        const item =
          document.createElement("div");

        item.className =
          "comment";


        item.innerHTML = `
          <div class="comment-top">

            <div class="comment-name">
              ${escapeHtml(comment.name)}
            </div>

            <div class="comment-date">
              ${formatDate(comment.created_at)}
            </div>

          </div>

          <div class="comment-content">
            ${escapeHtml(comment.content)}
          </div>
        `;


        list.appendChild(item);

      });

    }


    /* --------------------------------
       COMMENT FORM
    -------------------------------- */

    const commentName =
      document.getElementById(
        "commentName"
      );


    if (window.readerNickname) {

      commentName.value =
        window.readerNickname;

    } else {

      commentName.value =
        "Reader";

    }


    document
      .getElementById("responseForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const name =
            commentName.value.trim();

          const content =
            document
              .getElementById(
                "commentContent"
              )
              .value.trim();


          const message =
            document.getElementById(
              "responseMessage"
            );


          if (!content) {

            message.textContent =
              "Please write something first.";

            return;

          }


          message.textContent =
            "Posting...";


          const {
            error
          } = await db
            .from("comments")
            .insert({
              target_type: "journal",
              target_id: entryId,
              name: name || "Reader",
              content: content
            });


          if (error) {

            console.error(error);

            message.textContent =
              "Something went wrong. Please try again.";

            return;

          }


          document.getElementById(
            "commentContent"
          ).value = "";


          message.textContent =
            "Your response has been posted.";


          loadComments(entryId);

        }
      );


    /* --------------------------------
       READING PROGRESS
    -------------------------------- */

    window.addEventListener(
      "scroll",
      () => {

        const scrollTop =
          window.scrollY;

        const documentHeight =
          document.documentElement.scrollHeight -
          window.innerHeight;


        const progress =
          documentHeight > 0
            ? (scrollTop / documentHeight) * 100
            : 0;


        document.getElementById(
          "readingProgress"
        ).style.width =
          `${progress}%`;

      }
    );


    /* --------------------------------
       START
    -------------------------------- */

    loadEntry();

  </script>
