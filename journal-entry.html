<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Journal — HED</title>

  <style>
    :root {
      --hed-brown: #4a352b;
      --hed-brown-dark: #382920;
      --hed-cream: #f5efe6;
      --hed-paper: #fbf8f3;
      --hed-green: #68745d;
      --hed-pink: #c58f91;
      --hed-text: #342b26;
      --hed-muted: #85786e;
      --hed-line: #d8cec2;

      --reader-size: 19px;
      --reader-font: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--hed-paper);
      color: var(--hed-text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ==============================
       READING PROGRESS
    ============================== */

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--hed-brown);
      z-index: 9999;
    }

    /* ==============================
       HEADER
    ============================== */

    header {
      height: 78px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--hed-line);
      background: rgba(251, 248, 243, 0.96);

      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(8px);
    }

    .brand {
      text-decoration: none;
      color: var(--hed-brown-dark);

      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;

      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--hed-brown);
    }

    /* ==============================
       PAGE
    ============================== */

    main {
      width: min(1080px, 90%);
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      text-decoration: none;
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-bottom: 45px;
    }

    .back-link:hover {
      color: var(--hed-brown);
    }

    /* ==============================
       JOURNAL HEADER
    ============================== */

    .journal-label {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .entry-title {
      max-width: 850px;
      margin: 0;

      color: var(--hed-brown-dark);

      font-size: clamp(40px, 6vw, 68px);
      line-height: 1.06;
      font-weight: normal;
      letter-spacing: -1.5px;
    }

    .entry-subtitle {
      max-width: 720px;

      margin: 25px 0;

      color: var(--hed-muted);

      font-size: 21px;
      line-height: 1.5;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;

      margin-top: 25px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .meta-dot {
      color: var(--hed-pink);
    }

    .ornament {
      margin: 35px 0;

      color: var(--hed-pink);

      font-size: 17px;
      letter-spacing: 7px;
    }

    /* ==============================
       HERO
    ============================== */

    .hero-image-wrap {
      width: 100%;
      margin: 30px 0 55px;
    }

    .hero-image {
      width: 100%;
      max-height: 650px;

      object-fit: cover;
      display: block;

      background: var(--hed-cream);

      cursor: zoom-in;
    }

    .image-caption {
      margin-top: 12px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.8px;
      line-height: 1.5;
    }

    /* ==============================
       READING CONTROLS
    ============================== */

    .reading-preferences {
      width: min(760px, 100%);
      margin: 0 auto 38px;

      padding: 15px 0;

      border-top: 1px solid var(--hed-line);
      border-bottom: 1px solid var(--hed-line);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 18px;
      flex-wrap: wrap;
    }

    .preference-label {
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .preference-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .preference-group-title {
      margin-right: 4px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* SIZE SLIDER */

    .size-control {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .size-preview-small {
      color: var(--hed-muted);
      font-size: 12px;
      line-height: 1;
    }

    .size-preview-large {
      color: var(--hed-brown);
      font-size: 20px;
      line-height: 1;
    }

    #textSizeSlider {
      width: 145px;
      height: 4px;

      appearance: none;
      -webkit-appearance: none;

      background: var(--hed-line);
      border-radius: 10px;

      cursor: pointer;
    }

    #textSizeSlider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 16px;
      height: 16px;

      border-radius: 50%;
      border: 2px solid var(--hed-paper);

      background: var(--hed-brown);

      box-shadow: 0 0 0 1px var(--hed-brown);

      cursor: grab;
    }

    #textSizeSlider::-moz-range-thumb {
      width: 14px;
      height: 14px;

      border-radius: 50%;
      border: 2px solid var(--hed-paper);

      background: var(--hed-brown);

      box-shadow: 0 0 0 1px var(--hed-brown);

      cursor: grab;
    }

    .size-number {
      min-width: 38px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      text-align: right;
    }

    /* FONT BUTTONS */

    .font-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .preference-button {
      border: 1px solid transparent;

      background: transparent;
      color: var(--hed-muted);

      padding: 6px 8px;
      border-radius: 4px;

      cursor: pointer;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;

      transition:
        color 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .preference-button:hover {
      color: var(--hed-brown);
      background: var(--hed-cream);
    }

    .preference-button.active {
      color: var(--hed-brown-dark);

      border-color: var(--hed-line);
      background: var(--hed-cream);

      font-weight: bold;
    }

    /* FONT PREVIEWS */

    .font-georgia {
      font-family: Georgia, "Times New Roman", serif;
    }

    .font-baskerville {
      font-family: Baskerville, "Palatino Linotype", Palatino, serif;
    }

    .font-garamond {
      font-family: Garamond, "Times New Roman", serif;
    }

    .font-times {
      font-family: "Times New Roman", Times, serif;
    }

    .font-arial {
      font-family: Arial, Helvetica, sans-serif;
    }

    .font-verdana {
      font-family: Verdana, Geneva, sans-serif;
    }

    .font-trebuchet {
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .font-courier {
      font-family: "Courier New", Courier, monospace;
    }

    /* ==============================
       ARTICLE
    ============================== */

    .article-area {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    /*
      IMPORTANT:
      The reader-size ONLY controls font-size.

      Paragraph margins use PX, not EM.
      Line-height is NORMAL instead of 1.7/1.9.

      This prevents increasing the font size from
      automatically multiplying all the spacing.
    */

    .article-content {
      font-family: var(--reader-font) !important;
      font-size: var(--reader-size) !important;

      color: var(--hed-text);

      line-height: normal !important;

      transition:
        font-size 0.12s ease,
        font-family 0.12s ease;
    }

    .article-content p {
      margin: 0 0 18px !important;

      font-family: var(--reader-font) !important;
      font-size: var(--reader-size) !important;

      line-height: normal !important;
    }

    .article-content div {
      font-family: var(--reader-font) !important;
      font-size: var(--reader-size) !important;
      line-height: normal !important;
    }

    .article-content span {
      font-family: var(--reader-font) !important;
      font-size: inherit !important;
    }

    .article-content li {
      font-family: var(--reader-font) !important;
      font-size: var(--reader-size) !important;

      line-height: normal !important;

      margin-bottom: 7px !important;
    }

    .article-content ul,
    .article-content ol {
      margin: 0 0 18px !important;
      padding-left: 30px;
    }

    .article-content h2 {
      margin: 42px 0 14px !important;

      color: var(--hed-brown-dark);

      font-family: var(--reader-font) !important;

      font-size: clamp(
        25px,
        calc(var(--reader-size) * 1.55),
        47px
      ) !important;

      line-height: 1.15 !important;
      font-weight: normal;
    }

    .article-content h3 {
      margin: 34px 0 12px !important;

      color: var(--hed-brown-dark);

      font-family: var(--reader-font) !important;

      font-size: clamp(
        21px,
        calc(var(--reader-size) * 1.3),
        39px
      ) !important;

      line-height: 1.2 !important;
      font-weight: normal;
    }

    .article-content h4 {
      margin: 28px 0 10px !important;

      color: var(--hed-brown-dark);

      font-family: var(--reader-font) !important;

      font-size: clamp(
        19px,
        calc(var(--reader-size) * 1.15),
        34px
      ) !important;

      line-height: 1.2 !important;
    }

    .article-content strong {
      color: var(--hed-brown-dark);
    }

    .article-content em {
      color: #574a42;
    }

    .article-content a {
      color: var(--hed-green);

      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .article-content blockquote {
      margin: 28px 0 !important;
      padding: 3px 0 3px 24px;

      border-left: 3px solid var(--hed-pink);

      color: var(--hed-brown);

      font-family: var(--reader-font) !important;
      font-size: var(--reader-size) !important;

      line-height: normal !important;
      font-style: italic;
    }

    .article-content blockquote p {
      margin-bottom: 8px !important;
    }

    .article-content img {
      width: 100%;
      height: auto;

      display: block;

      margin: 32px 0;

      cursor: zoom-in;
    }

    .article-content figure {
      margin: 30px 0;
    }

    .article-content figcaption {
      margin-top: 9px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 10px !important;
      line-height: 1.4 !important;
    }

    .article-content hr {
      border: 0;
      border-top: 1px solid var(--hed-line);

      margin: 38px 0;
    }

    /* ==============================
       HED NOTE
    ============================== */

    .hed-note {
      margin-top: 55px;

      padding: 28px;

      background: var(--hed-cream);
      border: 1px solid var(--hed-line);
    }

    .hed-note-label {
      margin-bottom: 12px;

      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hed-note-content {
      color: var(--hed-brown);

      font-family: var(--reader-font) !important;
      font-size: var(--reader-size) !important;

      line-height: normal !important;
    }

    /* ==============================
       RESPONSES
    ============================== */

    .responses {
      width: min(760px, 100%);
      margin: 70px auto 0;

      padding-top: 35px;

      border-top: 1px solid var(--hed-line);
    }

    .section-label {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;

      margin-bottom: 9px;
    }

    .section-title {
      margin: 0;

      color: var(--hed-brown-dark);

      font-size: 30px;
      font-weight: normal;
    }

    .response-count {
      margin-top: 6px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
    }

    /* FORM */

    .response-form {
      margin-top: 22px;

      padding: 18px;

      background: var(--hed-cream);
      border: 1px solid var(--hed-line);
    }

    .response-form input,
    .response-form textarea {
      width: 100%;

      border: 1px solid var(--hed-line);

      background: var(--hed-paper);
      color: var(--hed-text);

      padding: 11px 12px;
      margin-bottom: 8px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;

      outline: none;
    }

    .response-form textarea {
      min-height: 85px;
      resize: vertical;
    }

    .response-form input:focus,
    .response-form textarea:focus {
      border-color: var(--hed-green);
    }

    .response-form button {
      border: 0;

      background: var(--hed-brown);
      color: white;

      padding: 10px 17px;

      cursor: pointer;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .response-form button:hover {
      background: var(--hed-brown-dark);
    }

    .response-message {
      margin-top: 9px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
    }

    /* COMPACT COMMENTS */

    .comment-list {
      margin-top: 20px;
    }

    .comment {
      padding: 14px 0;

      border-bottom: 1px solid var(--hed-line);
    }

    .comment:first-child {
      border-top: 1px solid var(--hed-line);
    }

    .comment-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 4px;
    }

    .comment-name {
      color: var(--hed-brown-dark);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
    }

    .comment-date {
      flex-shrink: 0;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
    }

    .comment-content {
      color: var(--hed-text);

      font-family: Georgia, "Times New Roman", serif;

      font-size: 14px;
      line-height: 1.4;

      white-space: pre-wrap;

      margin: 0;
    }

    /* ==============================
       KEEP READING
    ============================== */

    .keep-reading {
      margin: 80px auto 0;

      padding-top: 35px;

      border-top: 1px solid var(--hed-line);
    }

    .reading-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 16px;

      margin-top: 22px;
    }

    .reading-card {
      min-height: 145px;

      padding: 23px;

      background: var(--hed-cream);
      border: 1px solid var(--hed-line);

      text-decoration: none;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .reading-card:hover {
      transform: translateY(-3px);
      background: #f1e9df;
    }

    .reading-direction {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .reading-title {
      margin-top: 20px;

      color: var(--hed-brown-dark);

      font-size: 21px;
      line-height: 1.25;
    }

    .all-journal {
      display: block;
      width: fit-content;

      margin: 28px auto 0;

      color: var(--hed-brown);

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .all-journal:hover {
      color: var(--hed-green);
    }

    /* ==============================
       FOOTER
    ============================== */

    footer {
      margin-top: 80px;

      padding: 50px 6%;

      background: var(--hed-brown-dark);
      color: var(--hed-cream);

      text-align: center;
    }

    .footer-brand {
      font-size: 24px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .footer-tagline {
      margin-top: 10px;

      color: #cfc3b8;

      font-size: 14px;
      font-style: italic;
    }

    .footer-nav {
      margin-top: 22px;

      display: flex;
      justify-content: center;

      gap: 25px;
      flex-wrap: wrap;
    }

    .footer-nav a {
      color: #cfc3b8;

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .footer-nav a:hover {
      color: white;
    }

    /* ==============================
       LOADING
    ============================== */

    .status {
      min-height: 300px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }

    /* ==============================
       LIGHTBOX
    ============================== */

    .image-lightbox {
      position: fixed;

      inset: 0;

      background: rgba(25, 19, 15, 0.92);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      z-index: 10000;

      cursor: zoom-out;
    }

    .image-lightbox.open {
      display: flex;
    }

    .image-lightbox img {
      max-width: 95vw;
      max-height: 90vh;

      object-fit: contain;

      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    .lightbox-close {
      position: absolute;

      top: 20px;
      right: 25px;

      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 28px;

      cursor: pointer;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 700px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .brand {
        font-size: 21px;
      }

      nav {
        gap: 16px;
      }

      nav a {
        font-size: 9px;
        letter-spacing: 1.3px;
      }

      main {
        width: 90%;
        padding-top: 45px;
      }

      .back-link {
        margin-bottom: 35px;
      }

      .entry-title {
        font-size: 36px;
        letter-spacing: -0.8px;
      }

      .entry-subtitle {
        font-size: 18px;
      }

      .hero-image-wrap {
        margin-bottom: 35px;
      }

      .reading-preferences {
        align-items: flex-start;
        flex-direction: column;
        gap: 13px;
      }

      .size-control {
        width: 100%;
      }

      #textSizeSlider {
        flex: 1;
      }

      .font-buttons {
        width: 100%;
      }

      .preference-button {
        padding: 6px 7px;
      }

      .article-area {
        width: 100%;
      }

      .article-content {
        line-height: normal !important;
      }

      .article-content h2 {
        margin-top: 34px !important;
      }

      .article-content h3 {
        margin-top: 28px !important;
      }

      .article-content blockquote {
        padding-left: 17px;
      }

      .hed-note {
        padding: 22px;
      }

      .responses {
        margin-top: 60px;
      }

      .response-form {
        padding: 15px;
      }

      .comment {
        padding: 12px 0;
      }

      .comment-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .reading-grid {
        grid-template-columns: 1fr;
      }

      .reading-card {
        min-height: 125px;
      }
    }
  </style>
</head>

<body>

  <div
    class="reading-progress"
    id="readingProgress"
  ></div>


  <!-- HEADER -->

  <header>

    <a
      href="hed.html"
      class="brand"
    >
      HED
    </a>

    <nav>
      <a href="journal.html">
        Journal
      </a>

      <a href="about.html">
        About
      </a>
    </nav>

  </header>


  <!-- MAIN -->

  <main>

    <div
      id="loading"
      class="status"
    >
      Loading journal entry...
    </div>


    <article
      id="entryPage"
      class="hidden"
    >

      <a
        href="journal.html"
        class="back-link"
      >
        ← Back to Journal
      </a>


      <div class="journal-label">
        Journal
      </div>


      <h1
        id="entryTitle"
        class="entry-title"
      ></h1>


      <div
        id="entrySubtitle"
        class="entry-subtitle hidden"
      ></div>


      <div class="entry-meta">

        <span id="entryDate"></span>

        <span class="meta-dot">
          •
        </span>

        <span id="readTime"></span>

        <span class="meta-dot">
          •
        </span>

        <span>
          Written by HED
        </span>

      </div>


      <div class="ornament">

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reader-auth.js"></script>


  <script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const db = supabaseClient;


    /* ==========================================
       ENTRY IDENTIFIER
    ========================================== */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const requestedEntry =
      urlParams.get("id") ||
      urlParams.get("entry") ||
      urlParams.get("entry_id") ||
      urlParams.get("entryId") ||
      urlParams.get("slug") ||
      window.location.hash.replace(/^#/, "");


    let currentEntryId = null;


    /* ==========================================
       HELPERS
    ========================================== */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(date) {

      if (!date) {
        return "";
      }

      const parsed =
        new Date(date);

      if (
        Number.isNaN(
          parsed.getTime()
        )
      ) {
        return "";
      }

      return parsed.toLocaleDateString(
        "en-US",
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

    }


    function calculateReadTime(content) {

      if (!content) {
        return "1 min read";
      }

      const words =
        String(content)
          .replace(/<[^>]*>/g, " ")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .length;

      const minutes =
        Math.max(
          1,
          Math.ceil(words / 220)
        );

      return `${minutes} min read`;

    }


    function makeSlug(value) {

      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/['"]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

    }


    function findEntry(entries) {

      if (!requestedEntry) {
        return -1;
      }

      const wanted =
        String(requestedEntry)
          .trim()
          .toLowerCase();


      return entries.findIndex(
        entry => {

          const possibleValues = [

            entry.id,

            entry.slug,

            entry.entry_slug,

            entry.entrySlug,

            entry.title,

            makeSlug(entry.title)

          ];


          return possibleValues.some(
            value => {

              if (
                value === null ||
                value === undefined
              ) {
                return false;
              }

              const candidate =
                String(value)
                  .trim()
                  .toLowerCase();

              return (
                candidate === wanted ||
                makeSlug(candidate) ===
                  makeSlug(wanted)
              );

            }
          );

        }
      );

    }


    /* ==========================================
       READING PREFERENCES
    ========================================== */

    const articleContent =
      document.getElementById(
        "articleContent"
      );


    const hedNoteContent =
      document.getElementById(
        "hedNoteContent"
      );


    const slider =
      document.getElementById(
        "textSizeSlider"
      );


    const sizeNumber =
      document.getElementById(
        "sizeNumber"
      );


    const savedSize =
      localStorage.getItem(
        "hedReadingSizePx"
      ) || "19";


    const savedFont =
      localStorage.getItem(
        "hedReadingFont"
      ) || "georgia";


    let currentSize =
      Math.min(
        30,
        Math.max(
          15,
          Number(savedSize)
        )
      );


    let currentFont =
      savedFont;


    const fontMap = {

      georgia:
        'Georgia, "Times New Roman", serif',

      baskerville:
        'Baskerville, "Palatino Linotype", Palatino, serif',

      garamond:
        'Garamond, "Times New Roman", serif',

      times:
        '"Times New Roman", Times, serif',

      arial:
        'Arial, Helvetica, sans-serif',

      verdana:
        'Verdana, Geneva, sans-serif',

      trebuchet:
        '"Trebuchet MS", Arial, sans-serif',

      courier:
        '"Courier New", Courier, monospace'

    };


    function forceArticleFont() {

      const font =
        fontMap[currentFont] ||
        fontMap.georgia;


      articleContent.style.setProperty(
        "--reader-size",
        `${currentSize}px`
      );


      articleContent.style.setProperty(
        "--reader-font",
        font
      );


      if (hedNoteContent) {

        hedNoteContent.style.setProperty(
          "--reader-size",
          `${currentSize}px`
        );

        hedNoteContent.style.setProperty(
          "--reader-font",
          font
        );

      }


      /*
        Force the actual readable text.

        This is deliberately separate from
        spacing. Changing the slider changes
        font-size, not margins.
      */

      articleContent
        .querySelectorAll(
          "p, li, blockquote, blockquote p, div"
        )
        .forEach(element => {

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

          element.style.setProperty(
            "font-size",
            `${currentSize}px`,
            "important"
          );

          element.style.setProperty(
            "line-height",
            "normal",
            "important"
          );

        });


      articleContent
        .querySelectorAll("span")
        .forEach(element => {

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

        });


      /*
        Restore heading sizing separately.
      */

      articleContent
        .querySelectorAll("h2")
        .forEach(element => {

          const headingSize =
            Math.min(
              47,
              Math.max(
                25,
                currentSize * 1.55
              )
            );

          element.style.setProperty(
            "font-size",
            `${headingSize}px`,
            "important"
          );

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

          element.style.setProperty(
            "line-height",
            "1.15",
            "important"
          );

        });


      articleContent
        .querySelectorAll("h3")
        .forEach(element => {

          const headingSize =
            Math.min(
              39,
              Math.max(
                21,
                currentSize * 1.3
              )
            );

          element.style.setProperty(
            "font-size",
            `${headingSize}px`,
            "important"
          );

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

          element.style.setProperty(
            "line-height",
            "1.2",
            "important"
          );

        });


      articleContent
        .querySelectorAll("h4")
        .forEach(element => {

          const headingSize =
            Math.min(
              34,
              Math.max(
                19,
                currentSize * 1.15
              )
            );

          element.style.setProperty(
            "font-size",
            `${headingSize}px`,
            "important"
          );

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

        });


      slider.value =
        currentSize;

      sizeNumber.textContent =
        `${currentSize}px`;


      document
        .querySelectorAll(
          "[data-font]"
        )
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.font ===
              currentFont
          );

        });


      localStorage.setItem(
        "hedReadingSizePx",
        String(currentSize)
      );


      localStorage.setItem(
        "hedReadingFont",
        currentFont
      );

    }


    /* SLIDER */

    slider.addEventListener(
      "input",
      () => {

        currentSize =
          Number(slider.value);

        forceArticleFont();

      }
    );


    /* FONT BUTTONS */

    document
      .querySelectorAll(
        "[data-font]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentFont =
              button.dataset.font;

            forceArticleFont();

          }
        );

      });


    /* ==========================================
       LOAD ENTRY
    ========================================== */

    async function loadEntry() {

      if (!requestedEntry) {

        document.getElementById(
          "loading"
        ).textContent =
          "No journal entry was selected.";

        return;

      }


      const {
        data,
        error
      } = await db
        .from("journal_entries")
        .select("*")
        .order(
          "published_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(error);

        document.getElementById(
          "loading"
        ).textContent =
          "Unable to load this journal entry.";

        return;

      }


      const entries =
        data || [];


      const currentIndex =
        findEntry(entries);


      if (currentIndex === -1) {

        console.error(
          "Entry not found:",
          requestedEntry,
          entries
        );

        document.getElementById(
          "loading"
        ).textContent =
          "Journal entry unavailable.";

        return;

      }


      const entry =
        entries[currentIndex];


      currentEntryId =
        entry.id;


      /* TITLE */

      document.getElementById(
        "entryTitle"
      ).textContent =
        entry.title ||
        "Untitled Journal Entry";


      /* SUBTITLE */

      const subtitle =
        entry.subtitle ||
        entry.description ||
        entry.dek;


      if (subtitle) {

        const subtitleElement =
          document.getElementById(
            "entrySubtitle"
          );

        subtitleElement.textContent =
          subtitle;

        subtitleElement.classList.remove(
          "hidden"
        );

      }


      /* META */

      document.getElementById(
        "entryDate"
      ).textContent =
        formatDate(
          entry.published_at ||
          entry.created_at
        );


      document.getElementById(
        "readTime"
      ).textContent =
        calculateReadTime(
          entry.content
        );


      /* HERO */

      if (entry.image_url) {

        const heroWrap =
          document.getElementById(
            "heroWrap"
          );

        const heroImage =
          document.getElementById(
            "heroImage"
          );


        heroImage.src =
          entry.image_url;

        heroImage.alt =
          entry.title ||
          "Journal image";


        heroWrap.classList.remove(
          "hidden"
        );


        const caption =
          entry.image_caption ||
          entry.caption;


        if (caption) {

          const captionElement =
            document.getElementById(
              "imageCaption"
            );

          captionElement.textContent =
            caption;

          captionElement.classList.remove(
            "hidden"
          );

        }

      }


      /* ARTICLE CONTENT */

      articleContent.innerHTML =
        entry.content ||
        "<p>This entry has no content yet.</p>";


      /*
        Apply preferences AFTER
        innerHTML is inserted.
      */

      forceArticleFont();


      /* HED NOTE */

      const note =
        entry.author_reflection ||
        entry.reflection;


      if (note) {

        document.getElementById(
          "hedNote"
        ).classList.remove(
          "hidden"
        );

        hedNoteContent.textContent =
          note;

      }


      /* PREVIOUS */

      const previous =
        entries[currentIndex + 1];


      if (previous) {

        const previousCard =
          document.getElementById(
            "previousEntry"
          );


        previousCard.href =
          `journal-entry.html?id=${encodeURIComponent(
            previous.id
          )}`;


        document.getElementById(
          "previousTitle"
        ).textContent =
          previous.title ||
          "Previous Entry";


        previousCard.classList.remove(
          "hidden"
        );

      }


      /* NEXT */

      const next =
        entries[currentIndex - 1];


      if (next) {

        const nextCard =
          document.getElementById(
            "nextEntry"
          );


        nextCard.href =
          `journal-entry.html?id=${encodeURIComponent(
            next.id
          )}`;


        document.getElementById(
          "nextTitle"
        ).textContent =
          next.title ||
          "Next Entry";


        nextCard.classList.remove(
          "hidden"
        );

      }


      /* SHOW PAGE */

      document.getElementById(
        "loading"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "entryPage"
      ).classList.remove(
        "hidden"
      );


      /*
        Make sure fonts remain applied
        after everything is visible.
      */

      forceArticleFont();


      /* COMMENTS */

      loadComments(
        currentEntryId
      );

    }


    /* ==========================================
       COMMENTS
    ========================================== */

    async function loadComments(id) {

      if (!id) {
        return;
      }


      const {
        data,
        error
      } = await db
        .from("comments")
        .select(
          "id,name,content,created_at"
        )
        .eq(
          "target_type",
          "journal"
        )
        .eq(
          "target_id",
          id
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


      if (error) {

        console.error(
          "Comments error:",
          error
        );

        return;

      }


      const comments =
        data || [];


      document.getElementById(
        "responseCount"
      ).textContent =
        `${comments.length} ${
          comments.length === 1
            ? "response"
            : "responses"
        }`;


      const list =
        document.getElementById(
          "commentList"
        );


      list.innerHTML = "";


      comments.forEach(
        comment => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "comment";


          item.innerHTML = `

            <div class="comment-top">

              <div class="comment-name">
                ${escapeHtml(
                  comment.name ||
                  "Reader"
                )}
              </div>

              <div class="comment-date">
                ${formatDate(
                  comment.created_at
                )}
              </div>

            </div>

            <div class="comment-content">
              ${escapeHtml(
                comment.content
              )}
            </div>

          `;


          list.appendChild(
            item
          );

        }
      );

    }


    /* ==========================================
       COMMENT FORM
    ========================================== */

    const commentName =
      document.getElementById(
        "commentName"
      );


    function getReaderName() {

      if (
        window.readerNickname
      ) {

        return window.readerNickname;

      }


      return "Reader";

    }


    commentName.value =
      getReaderName();


    document
      .getElementById(
        "responseForm"
      )
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const name =
            commentName.value.trim() ||
            "Reader";


          const content =
            document
              .getElementById(
                "commentContent"
              )
              .value
              .trim();


          const message =
            document.getElementById(
              "responseMessage"
            );


          if (!currentEntryId) {

            message.textContent =
              "The journal entry is not ready yet.";

            return;

          }


          if (!content) {

            message.textContent =
              "Please write something first.";

            return;

          }


          message.textContent =
            "Posting...";


          const {
            error
          } = await db
            .from("comments")
            .insert({

              target_type:
                "journal",

              target_id:
                currentEntryId,

              name:
                name,

              content:
                content

            });


          if (error) {

            console.error(error);

            message.textContent =
              "Something went wrong. Please try again.";

            return;

          }


          document.getElementById(
            "commentContent"
          ).value = "";


          message.textContent =
            "Your response has been posted.";


          await loadComments(
            currentEntryId
          );

        }
      );


    /* ==========================================
       READING PROGRESS
    ========================================== */

    window.addEventListener(
      "scroll",
      () => {

        const scrollTop =
          window.scrollY;


        const documentHeight =
          document.documentElement
            .scrollHeight -
          window.innerHeight;


        const progress =
          documentHeight > 0
            ? (
                scrollTop /
                documentHeight
              ) * 100
            : 0;


        document.getElementById(
          "readingProgress"
        ).style.width =
          `${progress}%`;

      }
    );


    /* ==========================================
       IMAGE LIGHTBOX
    ========================================== */

    const lightbox =
      document.getElementById(
        "imageLightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );


    function openLightbox(src) {

      if (!src) {
        return;
      }

      lightboxImage.src =
        src;

      lightbox.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

    }


    function closeLightbox() {

      lightbox.classList.remove(
        "open"
      );

      lightboxImage.src =
        "";

      document.body.style.overflow =
        "";

    }


    document
      .getElementById(
        "heroImage"
      )
      .addEventListener(
        "click",
        event => {

          openLightbox(
            event.currentTarget.src
          );

        }
      );


    articleContent.addEventListener(
      "click",
      event => {

        const image =
          event.target.closest(
            "img"
          );


        if (!image) {
          return;
        }


        openLightbox(
          image.src
        );

      }
    );


    lightbox.addEventListener(
      "click",
      event => {

        if (
          event.target ===
            lightbox ||
          event.target.id ===
            "lightboxClose"
        ) {

          closeLightbox();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }

      }
    );


    /* ==========================================
       COPY / SELECTION PROTECTION
    ========================================== */

    document.addEventListener(
      "contextmenu",
      event => {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "copy",
      event => {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "cut",
      event => {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "dragstart",
      event => {

        if (
          event.target.tagName ===
            "IMG"
        ) {

          event.preventDefault();

        }

      }
    );


    document.addEventListener(
      "selectstart",
      event => {

        /*
          Keep forms selectable/writable,
          but prevent selecting article text.
        */

        if (
          event.target.closest(
            "#articleContent"
          ) ||
          event.target.closest(
            ".entry-title"
          ) ||
          event.target.closest(
            ".entry-subtitle"
          )
        ) {

          event.preventDefault();

        }

      }
    );


    /* ==========================================
       START
    ========================================== */

    forceArticleFont();

    loadEntry();

  </script>
