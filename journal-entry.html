<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Journal — HED</title>

  <style>
    :root {
      --hed-brown: #4a352b;
      --hed-brown-dark: #382920;
      --hed-cream: #f5efe6;
      --hed-paper: #fbf8f3;
      --hed-green: #68745d;
      --hed-pink: #c58f91;
      --hed-text: #342b26;
      --hed-muted: #85786e;
      --hed-line: #d8cec2;

      /* DEFAULT READER SIZE */
      --reader-size: 22px;
      --reader-font: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--hed-paper);
      color: var(--hed-text);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ========================================
       COPY PROTECTION
    ======================================== */

    body.copy-protected {
      -webkit-user-select: none;
      user-select: none;
    }

    input,
    textarea,
    button {
      -webkit-user-select: auto;
      user-select: auto;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
    }

    /* ========================================
       READING PROGRESS
    ======================================== */

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--hed-brown);
      z-index: 9999;
    }

    /* ========================================
       HEADER
    ======================================== */

    header {
      height: 78px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--hed-line);

      background: rgba(251, 248, 243, 0.96);

      position: sticky;
      top: 0;
      z-index: 100;

      backdrop-filter: blur(8px);
    }

    .brand {
      text-decoration: none;
      color: var(--hed-brown-dark);

      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    nav {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    nav a:hover {
      color: var(--hed-brown);
    }

    /* ========================================
       PAGE
    ======================================== */

    main {
      width: min(1080px, 90%);
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      text-decoration: none;
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      margin-bottom: 45px;
    }

    .back-link:hover {
      color: var(--hed-brown);
    }

    /* ========================================
       JOURNAL HEADER
    ======================================== */

    .journal-label {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;

      margin-bottom: 18px;
    }

    .entry-title {
      max-width: 850px;
      margin: 0;

      color: var(--hed-brown-dark);

      font-size: clamp(40px, 6vw, 68px);
      line-height: 1.06;
      font-weight: normal;
      letter-spacing: -1.5px;
    }

    .entry-subtitle {
      max-width: 720px;

      margin: 25px 0;

      color: var(--hed-muted);

      font-size: 21px;
      line-height: 1.6;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;

      margin-top: 25px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .meta-dot {
      color: var(--hed-pink);
    }

    .ornament {
      margin: 35px 0;

      color: var(--hed-pink);

      font-size: 17px;
      letter-spacing: 7px;
    }

    /* ========================================
       HERO IMAGE
    ======================================== */

    .hero-image-wrap {
      width: 100%;
      margin: 30px 0 55px;
    }

    .hero-image {
      width: 100%;
      max-height: 650px;

      object-fit: cover;
      display: block;

      background: var(--hed-cream);

      cursor: zoom-in;
    }

    .image-caption {
      margin-top: 12px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      letter-spacing: 0.8px;
      line-height: 1.5;
    }

    /* ========================================
       READING PREFERENCES
    ======================================== */

    .reading-preferences {
      width: min(760px, 100%);
      margin: 0 auto 35px;

      padding: 14px 0;

      border-top: 1px solid var(--hed-line);
      border-bottom: 1px solid var(--hed-line);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
      flex-wrap: wrap;
    }

    .preference-label {
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .preference-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .preference-group-title {
      margin-right: 7px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .preference-button {
      border: 1px solid transparent;

      background: transparent;

      color: var(--hed-muted);

      padding: 6px 9px;

      border-radius: 4px;

      cursor: pointer;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;

      transition: all 0.2s ease;
    }

    .preference-button:hover {
      color: var(--hed-brown);

      background: var(--hed-cream);
    }

    .preference-button.active {
      color: var(--hed-brown-dark);

      border-color: var(--hed-line);

      background: var(--hed-cream);

      font-weight: bold;
    }

    .font-serif {
      font-family: Georgia, "Times New Roman", serif;
    }

    .font-sans {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ========================================
       ARTICLE
    ======================================== */

    .article-area {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .article-content {
      font-family: var(--reader-font);
      font-size: var(--reader-size);

      line-height: 1.9;

      color: var(--hed-text);

      transition:
        font-size 0.15s ease,
        font-family 0.15s ease;
    }

    /*
      IMPORTANT:
      These !important rules make the reader
      controls override formatting saved inside
      the Supabase article HTML.
    */

    #articleContent,
    #articleContent * {
      font-family: var(--reader-font) !important;
    }

    #articleContent p,
    #articleContent li {
      font-size: var(--reader-size) !important;
    }

    #articleContent blockquote {
      font-size: calc(var(--reader-size) + 3px) !important;
    }

    .article-content p {
      margin: 0 0 1.45em;
    }

    .article-content h2 {
      margin: 2.2em 0 0.8em;

      color: var(--hed-brown-dark);

      font-size: 30px !important;
      line-height: 1.25;

      font-weight: normal;
    }

    .article-content h3 {
      margin: 2em 0 0.7em;

      color: var(--hed-brown-dark);

      font-size: 23px !important;
      line-height: 1.3;

      font-weight: normal;
    }

    .article-content strong {
      color: var(--hed-brown-dark);
    }

    .article-content em {
      color: #574a42;
    }

    .article-content a {
      color: var(--hed-green);

      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .article-content blockquote {
      margin: 45px 0;

      padding: 5px 0 5px 28px;

      border-left: 3px solid var(--hed-pink);

      color: var(--hed-brown);

      line-height: 1.55;

      font-style: italic;
    }

    .article-content ul,
    .article-content ol {
      margin: 0 0 1.5em;

      padding-left: 30px;
    }

    .article-content li {
      margin-bottom: 8px;
    }

    .article-content img {
      width: 100%;
      height: auto;

      display: block;

      margin: 40px 0;

      cursor: zoom-in;
    }

    .article-content hr {
      border: 0;

      border-top: 1px solid var(--hed-line);

      margin: 50px 0;
    }

    /* ========================================
       HED NOTE
    ======================================== */

    .hed-note {
      margin-top: 65px;

      padding: 35px;

      background: var(--hed-cream);

      border: 1px solid var(--hed-line);
    }

    .hed-note-label {
      margin-bottom: 15px;

      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hed-note-content {
      color: var(--hed-brown);

      font-family: var(--reader-font);

      font-size: var(--reader-size);

      line-height: 1.8;
    }

    /* ========================================
       RESPONSES
    ======================================== */

    .responses {
      width: min(760px, 100%);

      margin: 75px auto 0;

      padding-top: 40px;

      border-top: 1px solid var(--hed-line);
    }

    .section-label {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .section-title {
      margin: 0;

      color: var(--hed-brown-dark);

      font-size: 32px;

      font-weight: normal;
    }

    .response-count {
      margin-top: 8px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
    }

    .response-form {
      margin-top: 22px;

      padding: 18px;

      background: var(--hed-cream);

      border: 1px solid var(--hed-line);
    }

    .response-form input,
    .response-form textarea {
      width: 100%;

      border: 1px solid var(--hed-line);

      background: var(--hed-paper);
      color: var(--hed-text);

      padding: 10px 12px;

      margin-bottom: 9px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;

      outline: none;
    }

    .response-form textarea {
      min-height: 90px;

      resize: vertical;
    }

    .response-form input:focus,
    .response-form textarea:focus {
      border-color: var(--hed-green);
    }

    .response-form button {
      border: 0;

      background: var(--hed-brown);

      color: white;

      padding: 10px 17px;

      cursor: pointer;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .response-form button:hover {
      background: var(--hed-brown-dark);
    }

    .response-message {
      margin-top: 9px;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
    }

    /* ========================================
       COMMENTS
    ======================================== */

    .comment-list {
      margin-top: 20px;
    }

    .comment {
      padding: 15px 0;

      border-bottom: 1px solid var(--hed-line);
    }

    .comment-top {
      display: flex;

      justify-content: space-between;
      align-items: baseline;

      gap: 15px;

      margin-bottom: 4px;
    }

    .comment-name {
      color: var(--hed-brown-dark);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      font-weight: bold;
    }

    .comment-date {
      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 9px;
    }

    .comment-content {
      color: var(--hed-text);

      font-size: 15px;

      line-height: 1.5;

      white-space: pre-wrap;
    }

    /* ========================================
       KEEP READING
    ======================================== */

    .keep-reading {
      margin: 90px auto 0;

      padding-top: 40px;

      border-top: 1px solid var(--hed-line);
    }

    .reading-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 20px;

      margin-top: 25px;
    }

    .reading-card {
      min-height: 170px;

      padding: 28px;

      background: var(--hed-cream);

      border: 1px solid var(--hed-line);

      text-decoration: none;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .reading-card:hover {
      transform: translateY(-3px);

      background: #f1e9df;
    }

    .reading-direction {
      color: var(--hed-green);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 9px;

      font-weight: bold;

      letter-spacing: 1.8px;

      text-transform: uppercase;
    }

    .reading-title {
      margin-top: 25px;

      color: var(--hed-brown-dark);

      font-size: 22px;

      line-height: 1.3;
    }

    .all-journal {
      display: block;

      width: fit-content;

      margin: 35px auto 0;

      color: var(--hed-brown);

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      font-weight: bold;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .all-journal:hover {
      color: var(--hed-green);
    }

    /* ========================================
       FOOTER
    ======================================== */

    footer {
      margin-top: 100px;

      padding: 55px 6%;

      background: var(--hed-brown-dark);

      color: var(--hed-cream);

      text-align: center;
    }

    .footer-brand {
      font-size: 24px;

      letter-spacing: 4px;

      font-weight: bold;
    }

    .footer-tagline {
      margin-top: 12px;

      color: #cfc3b8;

      font-size: 14px;

      font-style: italic;
    }

    .footer-nav {
      margin-top: 25px;

      display: flex;

      justify-content: center;

      gap: 25px;

      flex-wrap: wrap;
    }

    .footer-nav a {
      color: #cfc3b8;

      text-decoration: none;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 10px;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .footer-nav a:hover {
      color: white;
    }

    /* ========================================
       LOADING
    ======================================== */

    .status {
      min-height: 300px;

      display: flex;

      justify-content: center;

      align-items: center;

      color: var(--hed-muted);

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }

    /* ========================================
       LIGHTBOX
    ======================================== */

    .image-lightbox {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px;

      background: rgba(40, 31, 26, 0.92);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
    }

    .image-lightbox.open {
      opacity: 1;

      visibility: visible;
    }

    .image-lightbox img {
      max-width: 95vw;

      max-height: 90vh;

      object-fit: contain;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.3);
    }

    .lightbox-close {
      position: absolute;

      top: 18px;

      right: 24px;

      border: 0;

      background: transparent;

      color: white;

      font-size: 30px;

      cursor: pointer;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .brand {
        font-size: 21px;
      }

      nav {
        gap: 16px;
      }

      nav a {
        font-size: 9px;
        letter-spacing: 1.3px;
      }

      main {
        width: 90%;
        padding-top: 45px;
      }

      .back-link {
        margin-bottom: 35px;
      }

      .entry-title {
        font-size: 36px;
        letter-spacing: -0.8px;
      }

      .entry-subtitle {
        font-size: 18px;
      }

      .entry-meta {
        line-height: 1.7;
      }

      .hero-image-wrap {
        margin-bottom: 40px;
      }

      .reading-preferences {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .preference-group {
        flex-wrap: wrap;
      }

      /*
        MOBILE DEFAULT = 21px
      */

      .article-content {
        --reader-size: 21px;
      }

      #articleContent p,
      #articleContent li {
        font-size: var(--reader-size) !important;
      }

      #articleContent blockquote {
        font-size: calc(var(--reader-size) + 2px) !important;
      }

      .article-content h2 {
        font-size: 27px !important;
      }

      .article-content h3 {
        font-size: 21px !important;
      }

      .hed-note {
        padding: 25px;
      }

      .responses {
        margin-top: 65px;
      }

      .reading-grid {
        grid-template-columns: 1fr;
      }

      .reading-card {
        min-height: 145px;
      }

      .comment-top {
        align-items: flex-start;

        flex-direction: column;

        gap: 3px;
      }
    }
  </style>
</head>

<body class="copy-protected">

  <!-- READING PROGRESS -->
  <div
    class="reading-progress"
    id="readingProgress"
  ></div>


  <!-- HEADER -->

  <header>

    <a
      href="hed.html"
      class="brand"
    >
      HED
    </a>

    <nav>
      <a href="journal.html">Journal</a>
      <a href="about.html">About</a>
    </nav>

  </header>


  <!-- MAIN -->

  <main>

    <div
      id="loading"
      class="status"
    >
      Loading journal entry...
    </div>


    <article
      id="entryPage"
      class="hidden"
    >

      <a
        href="journal.html"
        class="back-link"
      >
        ← Back to Journal
      </a>


      <div class="journal-label">
        Journal
      </div>


      <h1
        class="entry-title"
        id="entryTitle"
      ></h1>


      <div
        class="entry-subtitle hidden"
        id="entrySubtitle"
      ></div>


      <div class="entry-meta">

        <span id="entryDate"></span>

        <span class="meta-dot">•</span>

        <span id="readTime"></span>

        <span class="meta-dot">•</span>

        <span>Written by HED</span>

      </div>


      <div class="ornament">
        ✦
      </div>


      <!-- HERO IMAGE -->

      <div
        class="hero-image-wrap hidden"
        id="heroWrap"
      >

        <img
          id="heroImage"
          class="hero-image"
          alt=""
        >

        <div
          id="imageCaption"
          class="image-caption hidden"
        ></div>

      </div>


      <!-- READING PREFERENCES -->

      <div class="reading-preferences">

        <div class="preference-label">
          Reading
        </div>


        <div class="preference-group">

          <span class="preference-group-title">
            Size
          </span>

          <button
            type="button"
            class="preference-button"
            data-size="small"
          >
            A−
          </button>

          <button
            type="button"
            class="preference-button"
            data-size="normal"
          >
            A
          </button>

          <button
            type="button"
            class="preference-button"
            data-size="large"
          >
            A+
          </button>

        </div>


        <div class="preference-group">

          <span class="preference-group-title">
            Font
          </span>

          <button
            type="button"
            class="preference-button font-serif"
            data-font="serif"
          >
            Serif
          </button>

          <button
            type="button"
            class="preference-button font-sans"
            data-font="sans"
          >
            Sans
          </button>

        </div>

      </div>


      <!-- ARTICLE -->

      <div class="article-area">

        <div
          id="articleContent"
          class="article-content"
        ></div>


        <!-- HED NOTE -->

        <div
          id="hedNote"
          class="hed-note hidden"
        >

          <div class="hed-note-label">
            A Note From HED
          </div>

          <div
            id="hedNoteContent"
            class="hed-note-content"
          ></div>

        </div>

      </div>


      <!-- RESPONSES -->

      <section class="responses">

        <div class="section-label">
          Responses
        </div>

        <h2 class="section-title">
          Reader Responses
        </h2>

        <div
          class="response-count"
          id="responseCount"
        >
          0 responses
        </div>


        <form
          id="responseForm"
          class="response-form"
        >

          <input
            type="text"
            id="commentName"
            placeholder="Your name"
            readonly
          >

          <textarea
            id="commentContent"
            placeholder="Leave a thought..."
            required
          ></textarea>

          <button type="submit">
            Post Response
          </button>

          <div
            id="responseMessage"
            class="response-message"
          ></div>

        </form>


        <div
          id="commentList"
          class="comment-list"
        ></div>

      </section>


      <!-- KEEP READING -->

      <section class="keep-reading">

        <div class="section-label">
          Keep Reading
        </div>

        <div class="reading-grid">

          <a
            id="previousEntry"
            class="reading-card hidden"
          >

            <div class="reading-direction">
              ← Previous Entry
            </div>

            <div
              id="previousTitle"
              class="reading-title"
            ></div>

          </a>


          <a
            id="nextEntry"
            class="reading-card hidden"
          >

            <div class="reading-direction">
              Next Entry →
            </div>

            <div
              id="nextTitle"
              class="reading-title"
            ></div>

          </a>

        </div>


        <a
          href="journal.html"
          class="all-journal"
        >
          View All Journal Entries →
        </a>

      </section>

    </article>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="footer-brand">
      HED
    </div>

    <div class="footer-tagline">
      Her Existential Thoughts
    </div>

    <div class="footer-nav">

      <a href="journal.html">
        Journal
      </a>

      <a href="about.html">
        About
      </a>

    </div>

  </footer>


  <!-- IMAGE LIGHTBOX -->

  <div
    id="imageLightbox"
    class="image-lightbox"
  >

    <button
      type="button"
      id="lightboxClose"
      class="lightbox-close"
      aria-label="Close image"
    >
      ×
    </button>

    <img
      id="lightboxImage"
      src=""
      alt=""
    >

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reader-auth.js"></script>


  <script>

    /* ========================================
       SUPABASE
    ======================================== */

    const db = supabaseClient;


    /* ========================================
       ENTRY IDENTIFIER
    ======================================== */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const requestedEntry =
      urlParams.get("id") ||
      urlParams.get("entry") ||
      urlParams.get("entry_id") ||
      urlParams.get("entryId") ||
      urlParams.get("slug") ||
      window.location.hash.replace(
        /^#/,
        ""
      );


    let currentEntryId = null;


    /* ========================================
       HELPERS
    ======================================== */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function slugify(value) {

      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(
          /[^a-z0-9\s-]/g,
          ""
        )
        .replace(
          /\s+/g,
          "-"
        )
        .replace(
          /-+/g,
          "-"
        );

    }


    function formatDate(date) {

      if (!date) {
        return "";
      }

      const parsed =
        new Date(date);

      if (
        Number.isNaN(
          parsed.getTime()
        )
      ) {
        return "";
      }

      return parsed.toLocaleDateString(
        "en-US",
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

    }


    function calculateReadTime(content) {

      if (!content) {
        return "1 min read";
      }

      const words =
        String(content)
          .replace(
            /<[^>]*>/g,
            " "
          )
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .length;

      return `${Math.max(
        1,
        Math.ceil(words / 220)
      )} min read`;

    }


    /* ========================================
       READING PREFERENCES
    ======================================== */

    const articleContent =
      document.getElementById(
        "articleContent"
      );


    const hedNoteContent =
      document.getElementById(
        "hedNoteContent"
      );


    /*
      IMPORTANT:

      Size is NOT saved.

      Every new journal entry starts
      at the normal/default size.
    */

    let currentSize = "normal";


    /*
      Font can still be remembered.
    */

    let currentFont =
      localStorage.getItem(
        "hedReadingFont"
      ) || "serif";


    function getReaderSize() {

      if (
        currentSize === "small"
      ) {
        return window.innerWidth <= 700
          ? 19
          : 20;
      }

      if (
        currentSize === "large"
      ) {
        return window.innerWidth <= 700
          ? 24
          : 25;
      }

      return window.innerWidth <= 700
        ? 21
        : 22;

    }


    function getReaderFont() {

      if (
        currentFont === "sans"
      ) {
        return "Arial, Helvetica, sans-serif";
      }

      return 'Georgia, "Times New Roman", serif';

    }


    function applyReadingPreferences() {

      const size =
        getReaderSize();


      const font =
        getReaderFont();


      /*
        CSS variables on article.
      */

      articleContent.style.setProperty(
        "--reader-size",
        `${size}px`
      );


      articleContent.style.setProperty(
        "--reader-font",
        font
      );


      /*
        HED note.
      */

      hedNoteContent.style.setProperty(
        "--reader-size",
        `${size}px`
      );


      hedNoteContent.style.setProperty(
        "--reader-font",
        font
      );


      /*
        DIRECTLY apply the size and font
        to the generated Supabase content.

        This is the important part that
        the previous version was missing.
      */

      articleContent
        .querySelectorAll(
          "p, li"
        )
        .forEach(element => {

          element.style.setProperty(
            "font-size",
            `${size}px`,
            "important"
          );

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

        });


      articleContent
        .querySelectorAll(
          "blockquote"
        )
        .forEach(element => {

          element.style.setProperty(
            "font-size",
            `${size + 3}px`,
            "important"
          );

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

        });


      articleContent
        .querySelectorAll(
          "h2, h3, strong, em, a"
        )
        .forEach(element => {

          element.style.setProperty(
            "font-family",
            font,
            "important"
          );

        });


      /*
        Active size button.
      */

      document
        .querySelectorAll(
          "[data-size]"
        )
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.size ===
              currentSize
          );

        });


      /*
        Active font button.
      */

      document
        .querySelectorAll(
          "[data-font]"
        )
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.font ===
              currentFont
          );

        });

    }


    /* ========================================
       SIZE BUTTONS
    ======================================== */

    document
      .querySelectorAll(
        "[data-size]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentSize =
              button.dataset.size;

            applyReadingPreferences();

          }
        );

      });


    /* ========================================
       FONT BUTTONS
    ======================================== */

    document
      .querySelectorAll(
        "[data-font]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            currentFont =
              button.dataset.font;


            localStorage.setItem(
              "hedReadingFont",
              currentFont
            );


            applyReadingPreferences();

          }
        );

      });


    window.addEventListener(
      "resize",
      applyReadingPreferences
    );


    /* ========================================
       COPY PROTECTION
    ======================================== */

    /*
      Right click.
    */

    document.addEventListener(
      "contextmenu",
      event => {

        event.preventDefault();

      }
    );


    /*
      Copy.
    */

    document.addEventListener(
      "copy",
      event => {

        const tag =
          event.target.tagName;


        if (
          tag === "INPUT" ||
          tag === "TEXTAREA"
        ) {
          return;
        }


        event.preventDefault();

      }
    );


    /*
      Cut.
    */

    document.addEventListener(
      "cut",
      event => {

        const tag =
          event.target.tagName;


        if (
          tag === "INPUT" ||
          tag === "TEXTAREA"
        ) {
          return;
        }


        event.preventDefault();

      }
    );


    /*
      Keyboard shortcuts.
    */

    document.addEventListener(
      "keydown",
      event => {

        const tag =
          event.target.tagName;


        if (
          tag === "INPUT" ||
          tag === "TEXTAREA"
        ) {
          return;
        }


        const modifier =
          event.ctrlKey ||
          event.metaKey;


        if (
          modifier &&
          [
            "c",
            "x",
            "a"
          ].includes(
            event.key.toLowerCase()
          )
        ) {

          event.preventDefault();

        }

      }
    );


    /*
      Prevent dragging article text/images.
    */

    document.addEventListener(
      "dragstart",
      event => {

        if (
          event.target.closest(
            "#articleContent"
          )
        ) {

          event.preventDefault();

        }

      }
    );


    /* ========================================
       IMAGE LIGHTBOX
    ======================================== */

    const imageLightbox =
      document.getElementById(
        "imageLightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightboxImage"
      );


    const lightboxClose =
      document.getElementById(
        "lightboxClose"
      );


    function openLightbox(image) {

      if (!image) {
        return;
      }

      lightboxImage.src =
        image.src;

      lightboxImage.alt =
        image.alt || "";

      imageLightbox.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";

    }


    function closeLightbox() {

      imageLightbox.classList.remove(
        "open"
      );

      document.body.style.overflow =
        "";

      lightboxImage.src =
        "";

    }


    lightboxClose.addEventListener(
      "click",
      closeLightbox
    );


    imageLightbox.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          imageLightbox
        ) {

          closeLightbox();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }

      }
    );


    document
      .getElementById(
        "heroImage"
      )
      .addEventListener(
        "click",
        event => {

          openLightbox(
            event.currentTarget
          );

        }
      );


    articleContent.addEventListener(
      "click",
      event => {

        const image =
          event.target.closest(
            "img"
          );


        if (!image) {
          return;
        }


        openLightbox(
          image
        );

      }
    );


    /* ========================================
       LOAD ENTRY
    ======================================== */

    async function loadEntry() {

      /*
        Every new entry starts normal.
      */

      currentSize =
        "normal";


      if (!requestedEntry) {

        document.getElementById(
          "loading"
        ).textContent =
          "No journal entry was selected.";

        return;

      }


      const {
        data,
        error
      } = await db
        .from("journal_entries")
        .select("*")
        .order(
          "published_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(
          "Journal loading error:",
          error
        );


        document.getElementById(
          "loading"
        ).textContent =
          "Unable to load this journal entry.";

        return;

      }


      const entries =
        data || [];


      const requested =
        String(
          requestedEntry
        ).trim();


      const requestedSlug =
        slugify(
          requested
        );


      /*
        Find by ID, slug, or title.
      */

      const currentIndex =
        entries.findIndex(
          entry => {

            const idMatch =
              entry.id !== undefined &&
              String(entry.id) ===
                requested;


            const slugMatch =
              entry.slug &&
              String(entry.slug)
                .toLowerCase() ===
                requested.toLowerCase();


            const entrySlugMatch =
              entry.entry_slug &&
              String(entry.entry_slug)
                .toLowerCase() ===
                requested.toLowerCase();


            const camelSlugMatch =
              entry.entrySlug &&
              String(entry.entrySlug)
                .toLowerCase() ===
                requested.toLowerCase();


            const titleMatch =
              entry.title &&
              String(entry.title)
                .toLowerCase() ===
                requested.toLowerCase();


            const titleSlugMatch =
              entry.title &&
              slugify(entry.title) ===
                requestedSlug;


            return (
              idMatch ||
              slugMatch ||
              entrySlugMatch ||
              camelSlugMatch ||
              titleMatch ||
              titleSlugMatch
            );

          }
        );


      if (
        currentIndex === -1
      ) {

        console.error(
          "Entry not found:",
          requestedEntry
        );


        document.getElementById(
          "loading"
        ).textContent =
          "Journal entry unavailable.";

        return;

      }


      const entry =
        entries[currentIndex];


      currentEntryId =
        entry.id;


      /* ========================================
         TITLE
      ======================================== */

      document.getElementById(
        "entryTitle"
      ).textContent =
        entry.title ||
        "Untitled Journal Entry";


      /* ========================================
         SUBTITLE
      ======================================== */

      const subtitle =
        entry.subtitle ||
        entry.description ||
        entry.dek;


      const subtitleElement =
        document.getElementById(
          "entrySubtitle"
        );


      if (subtitle) {

        subtitleElement.textContent =
          subtitle;

        subtitleElement.classList.remove(
          "hidden"
        );

      } else {

        subtitleElement.classList.add(
          "hidden"
        );

      }


      /* ========================================
         META
      ======================================== */

      document.getElementById(
        "entryDate"
      ).textContent =
        formatDate(
          entry.published_at
        );


      document.getElementById(
        "readTime"
      ).textContent =
        calculateReadTime(
          entry.content
        );


      /* ========================================
         HERO IMAGE
      ======================================== */

      const heroWrap =
        document.getElementById(
          "heroWrap"
        );


      const heroImage =
        document.getElementById(
          "heroImage"
        );


      const imageCaption =
        document.getElementById(
          "imageCaption"
        );


      if (entry.image_url) {

        heroImage.src =
          entry.image_url;

        heroImage.alt =
          entry.title ||
          "Journal image";


        heroWrap.classList.remove(
          "hidden"
        );


        const caption =
          entry.image_caption ||
          entry.caption;


        if (caption) {

          imageCaption.textContent =
            caption;

          imageCaption.classList.remove(
            "hidden"
          );

        } else {

          imageCaption.classList.add(
            "hidden"
          );

        }

      } else {

        heroWrap.classList.add(
          "hidden"
        );

        heroImage.removeAttribute(
          "src"
        );

      }


      /* ========================================
         ARTICLE CONTENT
      ======================================== */

      articleContent.innerHTML =
        entry.content ||
        "<p>This entry has no content yet.</p>";


      /*
        Apply AFTER inserting Supabase HTML.
      */

      applyReadingPreferences();


      /* ========================================
         HED NOTE
      ======================================== */

      const hedNote =
        document.getElementById(
          "hedNote"
        );


      const note =
        entry.author_reflection ||
        entry.reflection;


      if (note) {

        hedNote.classList.remove(
          "hidden"
        );

        hedNoteContent.textContent =
          note;

      } else {

        hedNote.classList.add(
          "hidden"
        );

        hedNoteContent.textContent =
          "";

      }


      /* ========================================
         PREVIOUS
      ======================================== */

      const previous =
        entries[
          currentIndex + 1
        ];


      const previousCard =
        document.getElementById(
          "previousEntry"
        );


      if (previous) {

        previousCard.href =
          `journal-entry.html?id=${encodeURIComponent(
            previous.id
          )}`;


        document.getElementById(
          "previousTitle"
        ).textContent =
          previous.title ||
          "Previous Entry";


        previousCard.classList.remove(
          "hidden"
        );

      } else {

        previousCard.classList.add(
          "hidden"
        );

      }


      /* ========================================
         NEXT
      ======================================== */

      const next =
        entries[
          currentIndex - 1
        ];


      const nextCard =
        document.getElementById(
          "nextEntry"
        );


      if (next) {

        nextCard.href =
          `journal-entry.html?id=${encodeURIComponent(
            next.id
          )}`;


        document.getElementById(
          "nextTitle"
        ).textContent =
          next.title ||
          "Next Entry";


        nextCard.classList.remove(
          "hidden"
        );

      } else {

        nextCard.classList.add(
          "hidden"
        );

      }


      /* ========================================
         SHOW PAGE
      ======================================== */

      document.getElementById(
        "loading"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "entryPage"
      ).classList.remove(
        "hidden"
      );


      /*
        Final preference application.
      */

      currentSize =
        "normal";

      applyReadingPreferences();


      /* ========================================
         COMMENTS
      ======================================== */

      loadComments(
        currentEntryId
      );

    }


    /* ========================================
       COMMENTS
    ======================================== */

    async function loadComments(id) {

      if (!id) {
        return;
      }


      const {
        data,
        error
      } = await db
        .from("comments")
        .select(
          "id,name,content,created_at"
        )
        .eq(
          "target_type",
          "journal"
        )
        .eq(
          "target_id",
          id
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


      if (error) {

        console.error(
          "Comments error:",
          error
        );

        return;

      }


      const comments =
        data || [];


      document.getElementById(
        "responseCount"
      ).textContent =
        `${comments.length} ${
          comments.length === 1
            ? "response"
            : "responses"
        }`;


      const list =
        document.getElementById(
          "commentList"
        );


      list.innerHTML =
        "";


      comments.forEach(
        comment => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "comment";


          item.innerHTML = `
            <div class="comment-top">

              <div class="comment-name">
                ${escapeHtml(
                  comment.name ||
                  "Reader"
                )}
              </div>

              <div class="comment-date">
                ${formatDate(
                  comment.created_at
                )}
              </div>

            </div>

            <div class="comment-content">
              ${escapeHtml(
                comment.content
              )}
            </div>
          `;


          list.appendChild(
            item
          );

        }
      );

    }


    /* ========================================
       COMMENT FORM
    ======================================== */

    const commentName =
      document.getElementById(
        "commentName"
      );


    commentName.value =
      window.readerNickname ||
      "Reader";


    document
      .getElementById(
        "responseForm"
      )
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const name =
            commentName.value.trim();


          const content =
            document
              .getElementById(
                "commentContent"
              )
              .value.trim();


          const message =
            document.getElementById(
              "responseMessage"
            );


          if (!content) {

            message.textContent =
              "Please write something first.";

            return;

          }


          if (!currentEntryId) {

            message.textContent =
              "This entry is not ready yet.";

            return;

          }


          message.textContent =
            "Posting...";


          const {
            error
          } = await db
            .from("comments")
            .insert({

              target_type:
                "journal",

              target_id:
                currentEntryId,

              name:
                name ||
                "Reader",

              content:
                content

            });


          if (error) {

            console.error(
              "Comment error:",
              error
            );


            message.textContent =
              "Something went wrong. Please try again.";

            return;

          }


          document.getElementById(
            "commentContent"
          ).value =
            "";


          message.textContent =
            "Your response has been posted.";


          loadComments(
            currentEntryId
          );

        }
      );


    /* ========================================
       READING PROGRESS
    ======================================== */

    function updateReadingProgress() {

      const scrollTop =
        window.scrollY;


      const documentHeight =
        document.documentElement
          .scrollHeight -
        window.innerHeight;


      const progress =
        documentHeight > 0
          ? (
              scrollTop /
              documentHeight
            ) * 100
          : 0;


      document.getElementById(
        "readingProgress"
      ).style.width =
        `${Math.min(
          100,
          Math.max(
            0,
            progress
          )
        )}%`;

    }


    window.addEventListener(
      "scroll",
      updateReadingProgress,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      updateReadingProgress
    );


    /* ========================================
       START
    ======================================== */

    applyReadingPreferences();

    loadEntry();

  </script>
