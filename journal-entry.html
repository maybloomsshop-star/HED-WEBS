<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Journal — HED</title>

<!-- ARTICLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --hed-brown:#4a352b;
    --hed-brown-dark:#382920;
    --hed-cream:#f5efe6;
    --hed-paper:#fbf8f3;
    --hed-green:#68745d;
    --hed-pink:#c58f91;
    --hed-text:#342b26;
    --hed-muted:#85786e;
    --hed-line:#d8cec2;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--hed-paper);
    color:var(--hed-text);
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   COPY PROTECTION
========================= */

.article-content,
.article-content *{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

img{
    -webkit-user-drag:none;
    user-drag:none;
}

/* =========================
   PROGRESS
========================= */

.reading-progress{
    position:fixed;
    top:0;
    left:0;
    width:0;
    height:3px;
    background:var(--hed-brown);
    z-index:9999;
}

/* =========================
   HEADER
========================= */

header{
    height:78px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--hed-line);
    background:rgba(251,248,243,.96);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(8px);
}

.brand{
    text-decoration:none;
    color:var(--hed-brown-dark);
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
}

nav{
    display:flex;
    gap:30px;
    align-items:center;
}

nav a{
    text-decoration:none;
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
}

nav a:hover{
    color:var(--hed-brown);
}

/* =========================
   MAIN
========================= */

main{
    width:min(1080px,90%);
    margin:0 auto;
    padding:70px 0 100px;
}

.back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:45px;
}

.back-link:hover{
    color:var(--hed-brown);
}

.journal-label{
    color:var(--hed-green);
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.entry-title{
    max-width:760px;
    margin:0;
    color:var(--hed-brown-dark);
    font-size:clamp(30px,3vw,38px);
    line-height:1.1;
    font-weight:normal;
    letter-spacing:-1px;
}

.entry-subtitle{
    max-width:700px;
    margin:22px 0;
    color:var(--hed-muted);
    font-size:19px;
    line-height:1.6;
}

.entry-meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:9px;
    margin-top:22px;
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.meta-dot{
    color:var(--hed-pink);
}

.ornament{
    margin:35px 0;
    color:var(--hed-pink);
    font-size:17px;
    letter-spacing:7px;
}

/* =========================
   HERO
========================= */

.hero-image-wrap{
    width:100%;
    margin:30px 0 55px;
}

.hero-image{
    width:100%;
    max-height:650px;
    object-fit:cover;
    display:block;
    background:var(--hed-cream);
    cursor:zoom-in;
}

.image-caption{
    margin-top:12px;
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    letter-spacing:.8px;
    line-height:1.5;
}

/* =========================
   READING PREFERENCES
========================= */

.reading-preferences{
    width:min(700px,100%);
    margin:0 auto 40px;
    padding:14px 0;
    border-top:1px solid var(--hed-line);
    border-bottom:1px solid var(--hed-line);

    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:18px;
    flex-wrap:wrap;
}

.preference-label,
.preference-group-title{
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1.7px;
    text-transform:uppercase;
}

.preference-group{
    display:flex;
    align-items:center;
    gap:4px;
}

.preference-group-title{
    margin-right:4px;
    font-weight:normal;
    letter-spacing:1px;
}

.preference-button{
    border:1px solid transparent;
    background:transparent;
    color:var(--hed-muted);
    padding:6px 9px;
    border-radius:4px;
    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;

    transition:
        color .15s ease,
        border-color .15s ease,
        background .15s ease;
}

.preference-button:hover,
.preference-button.active{
    color:var(--hed-brown-dark);
    border-color:var(--hed-line);
    background:var(--hed-cream);
    font-weight:bold;
}

.font-serif{
    font-family:Georgia,"Times New Roman",serif;
}

.font-sans{
    font-family:Arial,Helvetica,sans-serif;
}

.font-lora{
    font-family:"Lora",Georgia,serif;
}

.font-cormorant{
    font-family:"Cormorant Garamond",Georgia,serif;
}

/* =========================
   ARTICLE
========================= */

.article-area{
    width:min(700px,100%);
    margin:0 auto;
}

.article-content{
    width:100%;

    --article-size:24px;
    --article-font:Georgia,"Times New Roman",serif;

    font-family:var(--article-font);
    font-size:var(--article-size);
    line-height:1.82;

    color:var(--hed-text);

    overflow-wrap:break-word;

    transition:
        font-size .15s ease,
        font-family .15s ease;
}

/*
   Everything inside the article inherits
   the currently selected font.
*/

.article-content,
.article-content p,
.article-content li,
.article-content blockquote,
.article-content h1,
.article-content h2,
.article-content h3,
.article-content h4,
.article-content h5,
.article-content h6,
.article-content strong,
.article-content b,
.article-content em,
.article-content i,
.article-content a{
    font-family:var(--article-font)!important;
}

.article-content p,
.article-content li,
.article-content blockquote{
    font-size:var(--article-size)!important;
    line-height:1.82!important;
}

.article-content p{
    margin:0 0 1.5em;
}

.article-content h1,
.article-content h2,
.article-content h3,
.article-content h4,
.article-content h5,
.article-content h6{
    color:var(--hed-brown-dark)!important;
    font-weight:500;
    line-height:1.25!important;
}

.article-content h1{
    font-size:calc(var(--article-size) + 12px)!important;
    margin:1.8em 0 .8em;
}

.article-content h2{
    font-size:calc(var(--article-size) + 7px)!important;
    margin:2.1em 0 .8em;
}

.article-content h3{
    font-size:calc(var(--article-size) + 3px)!important;
    margin:2em 0 .7em;
}

.article-content h4,
.article-content h5,
.article-content h6{
    font-size:calc(var(--article-size) + 1px)!important;
    margin:1.7em 0 .7em;
}

.article-content strong,
.article-content b{
    color:var(--hed-brown-dark)!important;
}

.article-content em,
.article-content i{
    color:#574a42!important;
}

.article-content a{
    color:var(--hed-green)!important;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
}

.article-content blockquote{
    margin:2em 0;
    padding:7px 0 7px 28px;
    border-left:3px solid var(--hed-pink);
    font-style:italic;
}

.article-content ul,
.article-content ol{
    margin:0 0 1.5em;
    padding-left:30px;
}

.article-content li{
    margin-bottom:9px;
}

.article-content img{
    width:100%;
    height:auto;
    display:block;
    margin:40px 0;
    cursor:zoom-in;
}

.article-content hr{
    border:0;
    border-top:1px solid var(--hed-line);
    margin:50px 0;
}

/* =========================
   HED NOTE
========================= */

.hed-note{
    margin-top:55px;
    padding:28px;
    background:var(--hed-cream);
    border:1px solid var(--hed-line);
}

.hed-note-label{
    margin-bottom:10px;
    color:var(--hed-green);
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
}

.hed-note-content{
    color:var(--hed-brown);
    font-family:Georgia,"Times New Roman",serif;
    font-size:24px;
    line-height:1.82;
}

/* =========================
   RESPONSES
========================= */

.responses{
    width:min(700px,100%);
    margin:60px auto 0;
    padding-top:28px;
    border-top:1px solid var(--hed-line);
}

.section-label{
    color:var(--hed-green);
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2.5px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.section-title{
    margin:0;
    color:var(--hed-brown-dark);
    font-size:27px;
    font-weight:normal;
}

.response-count{
    margin-top:5px;
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
}

.response-form{
    margin-top:15px;
    padding:14px;
    background:var(--hed-cream);
    border:1px solid var(--hed-line);
}

.response-form input,
.response-form textarea{
    width:100%;
    border:1px solid var(--hed-line);
    background:var(--hed-paper);
    color:var(--hed-text);
    padding:9px 11px;
    margin-bottom:7px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    outline:none;
}

.response-form textarea{
    min-height:65px;
    resize:vertical;
}

.response-form input:focus,
.response-form textarea:focus{
    border-color:var(--hed-green);
}

.response-form button{
    border:0;
    background:var(--hed-brown);
    color:white;
    padding:9px 15px;
    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.response-form button:hover{
    background:var(--hed-brown-dark);
}

.response-message{
    margin-top:7px;
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
}

/* =========================
   COMMENTS
========================= */

.comment-list{
    margin-top:12px;
    display:flex;
    flex-direction:column;
}

.comment{
    padding:13px 0;
    border-bottom:1px solid var(--hed-line);
}

.comment-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
}

.comment-name{
    color:var(--hed-brown-dark);
    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
    font-weight:bold;
}

.comment-date{
    color:var(--hed-muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:9px;
}

.comment-content{
    color:var(--hed-text);
    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:break-word;
}

.comment-actions{
    margin-top:7px;
}

.comment-delete{
    display:inline-block;
    padding:0;
    border:0;
    background:none;
    color:var(--hed-muted);
    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
}

.comment-delete:hover{
    color:var(--hed-brown-dark);
    text-decoration:underline;
}

.comment-delete:disabled{
    opacity:.5;
    cursor:wait;
}

/* =========================
   KEEP READING
========================= */

.keep-reading{
    margin:75px auto 0;
    padding-top:30px;
    border-top:1px solid var(--hed-line);
}

.reading-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.reading-card{
    min-height:140px;
    padding:23px;
    background:var(--hed-cream);
    border:1px solid var(--hed-line);
    text-decoration:none;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    transition:
        transform .2s ease,
        background .2s ease;
}

.reading-card:hover{
    transform:translateY(-2px);
    background:#f1e9df;
}

.reading-direction{
    color:var(--hed-green);
    font-family:Arial,Helvetica,sans-serif;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1.8px;
    text-transform:uppercase;
}

.reading-title{
    margin-top:18px;
    color:var(--hed-brown-dark);
    font-size:20px;
    line-height:1.3;
}

.all-journal{
    display:block;
    width:fit-content;
    margin:25px auto 0;
    color:var(--hed-brown);
    text-decoration:none;
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.all-journal:hover{
    color:var(--hed-green);
}

/* =========================
   FOOTER
========================= */

footer{
    margin-top:80px;
    padding:50px 6%;
    background:var(--hed-brown-dark);
    color:var(--hed-cream);
    text-align:center;
}

.footer-brand{
    font-size:24px;
    letter-spacing:4px;
    font-weight:bold;
}

.footer-tagline{
    margin-top:10px;
    color:#cfc3b8;
    font-size:14px;
    font-style:italic;
}

.footer-nav{
    margin-top:22px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.footer-nav a{
    color:#cfc3b8;
    text-decoration:none;
    font-family:Arial,Helvetica,sans-serif;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

/* =========================
   STATUS
========================= */

.status{
    min-height:300px;
    display:flex;
    justify-content:center;
    align-items:center;

    color:var(--hed-muted);

    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
    letter-spacing:1px;
}

.hidden{
    display:none!important;
}

/* =========================
   LIGHTBOX
========================= */

.image-lightbox{
    position:fixed;
    inset:0;
    z-index:10000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    background:rgba(40,31,26,.92);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .2s ease,
        visibility .2s ease;
}

.image-lightbox.open{
    opacity:1;
    visibility:visible;
}

.image-lightbox img{
    max-width:95vw;
    max-height:90vh;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.lightbox-close{
    position:absolute;
    top:18px;
    right:24px;

    border:0;
    background:transparent;
    color:white;

    font-size:30px;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        height:68px;
        padding:0 5%;
    }

    .brand{
        font-size:21px;
    }

    nav{
        gap:16px;
    }

    nav a{
        font-size:9px;
        letter-spacing:1.3px;
    }

    main{
        width:90%;
        padding-top:45px;
    }

    .back-link{
        margin-bottom:35px;
    }

    .entry-title{
        font-size:28px;
        letter-spacing:-.6px;
    }

    .entry-subtitle{
        font-size:18px;
    }

    .hero-image-wrap{
        margin-bottom:40px;
    }

    .reading-preferences{
        align-items:flex-start;
        flex-direction:column;
        gap:10px;
    }

    .article-area{
        width:100%;
    }

    .article-content{
        --article-size:21px;
        line-height:1.8;
    }

    .article-content p,
    .article-content li,
    .article-content blockquote{
        line-height:1.8!important;
    }

    .article-content h1{
        font-size:33px!important;
    }

    .article-content h2{
        font-size:29px!important;
    }

    .article-content h3{
        font-size:25px!important;
    }

    .hed-note{
        padding:22px;
    }

    .responses{
        margin-top:50px;
    }

    .reading-grid{
        grid-template-columns:1fr;
    }

    .reading-card{
        min-height:125px;
    }

    .comment-top{
        align-items:flex-start;
    }

}

</style>
</head>

<body>

<div class="reading-progress" id="readingProgress"></div>

<header>

    <a href="hed.html" class="brand">
        HED
    </a>

    <nav>
        <a href="journal.html">Journal</a>
        <a href="about.html">About</a>
    </nav>

</header>


<main>

<div id="loading" class="status">
    Loading journal entry...
</div>


<article id="entryPage" class="hidden">

<a href="journal.html" class="back-link">
    ← Back to Journal
</a>

<div class="journal-label">
    Journal
</div>

<h1 class="entry-title" id="entryTitle"></h1>

<div
    class="entry-subtitle hidden"
    id="entrySubtitle"
></div>

<div class="entry-meta">

    <span id="entryDate"></span>

    <span class="meta-dot">•</span>

    <span id="readTime"></span>

    <span class="meta-dot">•</span>

    <span>Written by HED</span>

</div>

<div class="ornament">
    ✦
</div>


<div
    class="hero-image-wrap hidden"
    id="heroWrap"
>

    <img
        id="heroImage"
        class="hero-image"
        alt=""
    >

    <div
        id="imageCaption"
        class="image-caption hidden"
    ></div>

</div>


<!-- =========================
     READING PREFERENCES
========================= -->

<div class="reading-preferences">

    <div class="preference-label">
        Reading
    </div>


    <div class="preference-group">

        <span class="preference-group-title">
            Size
        </span>

        <button
            type="button"
            class="preference-button"
            data-size="small"
        >
            A−
        </button>

        <button
            type="button"
            class="preference-button"
            data-size="normal"
        >
            A
        </button>

        <button
            type="button"
            class="preference-button"
            data-size="large"
        >
            A+
        </button>

    </div>


    <div class="preference-group">

        <span class="preference-group-title">
            Font
        </span>

        <button
            type="button"
            class="preference-button font-serif"
            data-font="serif"
        >
            Serif
        </button>

        <button
            type="button"
            class="preference-button font-sans"
            data-font="sans"
        >
            Sans
        </button>

        <button
            type="button"
            class="preference-button font-lora"
            data-font="lora"
        >
            Lora
        </button>

        <button
            type="button"
            class="preference-button font-cormorant"
            data-font="cormorant"
        >
            Cormorant
        </button>

    </div>

</div>


<div class="article-area">

    <div
        id="articleContent"
        class="article-content"
    ></div>


    <div
        id="hedNote"
        class="hed-note hidden"
    >

        <div class="hed-note-label">
            A Note From HED
        </div>

        <div
            id="hedNoteContent"
            class="hed-note-content"
        ></div>

    </div>

</div>


<!-- =========================
     RESPONSES
========================= -->

<section class="responses">

    <div class="section-label">
        Responses
    </div>

    <h2 class="section-title">
        Reader Responses
    </h2>

    <div
        class="response-count"
        id="responseCount"
    >
        0 responses
    </div>


    <form
        id="responseForm"
        class="response-form"
    >

        <input
            type="text"
            id="commentName"
            placeholder="Your name"
            readonly
        >

        <textarea
            id="commentContent"
            placeholder="Leave a thought..."
            required
        ></textarea>

        <button type="submit">
            Post Response
        </button>

        <div
            id="responseMessage"
            class="response-message"
        ></div>

    </form>


    <div
        id="commentList"
        class="comment-list"
    ></div>

</section>


<!-- =========================
     KEEP READING
========================= -->

<section class="keep-reading">

    <div class="section-label">
        Keep Reading
    </div>


    <div class="reading-grid">

        <a
            id="previousEntry"

/* =========================================================
   HELPERS
========================================================= */

function slugify(value){

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9\s-]/g,
            ""
        )
        .replace(
            /\s+/g,
            "-"
        )
        .replace(
            /-+/g,
            "-"
        );

}


function formatDate(date){

    if(!date){
        return "";
    }

    const d =
        new Date(date);

    if(
        Number.isNaN(
            d.getTime()
        )
    ){
        return "";
    }

    return d.toLocaleDateString(
        "en-US",
        {
            month:"long",
            day:"numeric",
            year:"numeric"
        }
    );

}


function calculateReadTime(content){

    const words =
        String(content || "")
            .replace(
                /<[^>]*>/g,
                " "
            )
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;

    return `${Math.max(
        1,
        Math.ceil(words / 220)
    )} min read`;

}


/* =========================================================
   READING SIZE
========================================================= */

function getReaderSize(){

    if(currentSize === "small"){

        return window.innerWidth <= 700
            ? 19
            : 21;

    }

    if(currentSize === "large"){

        return window.innerWidth <= 700
            ? 25
            : 28;

    }

    return window.innerWidth <= 700
        ? 22
        : 24;

}


/* =========================================================
   READING FONT
========================================================= */

function getReaderFont(){

    if(currentFont === "sans"){

        return "Arial, Helvetica, sans-serif";

    }

    if(currentFont === "lora"){

        return '"Lora", Georgia, serif';

    }

    if(currentFont === "cormorant"){

        return '"Cormorant Garamond", Georgia, serif';

    }

    return 'Georgia, "Times New Roman", serif';

}


/* =========================================================
   APPLY READING PREFERENCES
========================================================= */

function applyReadingPreferences(){

    const size =
        getReaderSize();

    const font =
        getReaderFont();


    /*
       IMPORTANT:
       We directly change the article container
       and every article child.

       No localStorage.
       No saved setting.
       No page reload.
    */

    articleContent.style.setProperty(
        "--article-size",
        `${size}px`
    );

    articleContent.style.setProperty(
        "--article-font",
        font
    );

    articleContent.style.setProperty(
        "font-size",
        `${size}px`,
        "important"
    );

    articleContent.style.setProperty(
        "font-family",
        font,
        "important"
    );


    articleContent
        .querySelectorAll("*")
        .forEach(function(el){

            el.style.setProperty(
                "font-family",
                font,
                "important"
            );

            if(
                el.matches(
                    "h1"
                )
            ){

                el.style.setProperty(
                    "font-size",
                    `${size + 12}px`,
                    "important"
                );

            }

            else if(
                el.matches(
                    "h2"
                )
            ){

                el.style.setProperty(
                    "font-size",
                    `${size + 7}px`,
                    "important"
                );

            }

            else if(
                el.matches(
                    "h3"
                )
            ){

                el.style.setProperty(
                    "font-size",
                    `${size + 3}px`,
                    "important"
                );

            }

            else if(
                el.matches(
                    "h4,h5,h6"
                )
            ){

                el.style.setProperty(
                    "font-size",
                    `${size + 1}px`,
                    "important"
                );

            }

            else{

                el.style.setProperty(
                    "font-size",
                    `${size}px`,
                    "important"
                );

            }

            el.style.setProperty(
                "line-height",
                "1.82",
                "important"
            );

        });


    /*
       HED note follows the same font/size.
    */

    hedNoteContent.style.setProperty(
        "font-family",
        font,
        "important"
    );

    hedNoteContent.style.setProperty(
        "font-size",
        `${size}px`,
        "important"
    );


    /*
       Active button.
    */

    document
        .querySelectorAll(
            "[data-size]"
        )
        .forEach(function(button){

            button.classList.toggle(
                "active",
                button.dataset.size ===
                currentSize
            );

        });


    document
        .querySelectorAll(
            "[data-font]"
        )
        .forEach(function(button){

            button.classList.toggle(
                "active",
                button.dataset.font ===
                currentFont
            );

        });

}


/* =========================================================
   SIZE BUTTONS
========================================================= */

function setReaderSize(value){

    currentSize =
        value;

    applyReadingPreferences();

}


/* =========================================================
   FONT BUTTONS
========================================================= */

function setReaderFont(value){

    currentFont =

    /*

}


/* =========================================================

document

document

/* =========================================================
   LOAD ENTRY
========================================================= */

async function loadEntry(){

    if(!requestedEntry){

        document.getElementById(
            "loading"
        ).textContent =
            "No journal entry was selected.";

        return;

    }


    const {
        data,
        error
    } =
        await db
            .from(
                "journal_entries"
            )
            .select("*")
            .order(
                "published_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            error
        );

        document.getElementById(
            "loading"
        ).textContent =
            "Unable to load this journal entry.";

        return;

    }


    const entries =
        data || [];

    const requested =
        String(
            requestedEntry
        ).trim();

    const requestedSlug =
        slugify(
            requested
        );


    const currentIndex =
        entries.findIndex(
            function(entry){

                const idMatch =
                    entry.id !== undefined &&
                    String(entry.id) ===
                    requested;

                const matches =
                    function(key){

                        return (
                            entry[key] &&
                            String(entry[key])
                                .toLowerCase() ===
                            requested.toLowerCase()
                        );

                    };


                const titleMatch =
                    entry.title &&
                    String(entry.title)
                        .toLowerCase() ===
                    requested.toLowerCase();


                const titleSlugMatch =
                    entry.title &&
                    slugify(
                        entry.title
                    ) ===
                    requestedSlug;


                return (
                    idMatch ||
                    matches("slug") ||
                    matches("entry_slug") ||
                    matches("entrySlug") ||
                    titleMatch ||
                    titleSlugMatch
                );

            }
        );


    if(currentIndex === -1){

        document.getElementById(
            "loading"
        ).textContent =
            "Journal entry unavailable.";

        return;

    }


    const entry =
        entries[currentIndex];

    currentEntryId =
        entry.id;


    /*
       Header.
    */

    document.getElementById(
        "entryTitle"
    ).textContent =
        entry.title ||
        "Untitled Journal Entry";


    const subtitle =
        entry.subtitle ||
        entry.description ||
        entry.dek;


    const subtitleEl =
        document.getElementById(
            "entrySubtitle"
        );


    if(subtitle){

        subtitleEl.textContent =
            subtitle;

        subtitleEl.classList.remove(
            "hidden"
        );

    }

    else{

        subtitleEl.classList.add(
            "hidden"
        );

    }


    document.getElementById(
        "entryDate"
    ).textContent =
        formatDate(
            entry.published_at
        );


    document.getElementById(
        "readTime"
    ).textContent =
        calculateReadTime(
            entry.content
        );


    /*
       Hero.
    */

    const heroWrap =
        document.getElementById(
            "heroWrap"
        );

    const heroImage =
        document.getElementById(
            "heroImage"
        );

    const captionEl =
        document.getElementById(
            "imageCaption"
        );


    if(entry.image_url){

        heroImage.src =
            entry.image_url;

        heroImage.alt =
            entry.title ||
            "Journal image";

        heroWrap.classList.remove(
            "hidden"
        );


        const caption =
            entry.image_caption ||
            entry.caption;


        if(caption){

            captionEl.textContent =
                caption;

            captionEl.classList.remove(
                "hidden"
            );

        }

        else{

            captionEl.classList.add(
                "hidden"
            );

        }

    }

    else{

        heroWrap.classList.add(
            "hidden"
        );

        heroImage.removeAttribute(
            "src"
        );

    }


    /*
       Article.
    */

    articleContent.innerHTML =
        entry.content ||
        "<p>This entry has no content yet.</p>";


    /*
       Apply current settings AFTER
       inserting the article HTML.
    */

    applyReadingPreferences();


    /*
       HED note.
    */

    const note =
        entry.author_reflection ||
        entry.reflection;


    const hedNote =
        document.getElementById(
            "hedNote"
        );


    if(note){

        hedNote.classList.remove(
            "hidden"
        );

        hedNoteContent.textContent =
            note;

    }

    else{

        hedNote.classList.add(
            "hidden"
        );

        hedNoteContent.textContent =
            "";

    }


    /*
       Previous / next.
    */

    const previous =
        entries[currentIndex + 1];

    const next =
        entries[currentIndex - 1];


    const previousCard =
        document.getElementById(
            "previousEntry"
        );

    const nextCard =
        document.getElementById(
            "nextEntry"
        );


    if(previous){

        previousCard.href =
            `journal-entry.html?id=${encodeURIComponent(
                previous.id
            )}`;

        document.getElementById(
            "previousTitle"
        ).textContent =
            previous.title ||
            "Previous Entry";

        previousCard.classList.remove(
            "hidden"
        );

    }

    else{

        previousCard.classList.add(
            "hidden"
        );

    }


    if(next){

        nextCard.href =
            `journal-entry.html?id=${encodeURIComponent(
                next.id
            )}`;

        document.getElementById(
            "nextTitle"
        ).textContent =
            next.title ||
            "Next Entry";

        nextCard.classList.remove(
            "hidden"
        );

    }

    else{

        nextCard.classList.add(
            "hidden"
        );

    }


    document.getElementById(
        "loading"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "entryPage"
    ).classList.remove(
        "hidden"
    );


    applyReadingPreferences();


    await loadComments(
        currentEntryId
    );

}


/* =========================================================
   AUTH USER
========================================================= */

async function getCurrentUser(){

    try{

        const {
            data,
            error
        } =
            await db.auth.getUser();


        if(error){

            console.warn(
                "Could not get current user:",
                error
            );

            return null;

        }

        return data?.user || null;

    }

    catch(error){

        console.warn(
            "Auth lookup failed:",
            error
        );

        return null;

    }

}


/* =========================================================
   COMMENT NAME
========================================================= */

async function setCommentName(){

    const nickname =
        window.readerNickname;


    if(
        nickname &&
        String(nickname).trim()
    ){

        commentName.value =
            String(
                nickname
            ).trim();

        return;

    }


    try{

        const user =
            await getCurrentUser();


        const metadata =
            user?.user_metadata || {};


        const fallback =
            metadata.nickname ||
            metadata.display_name ||
            metadata.name ||
            "";


        if(
            String(fallback).trim()
        ){

            commentName.value =
                String(
                    fallback
                ).trim();

        }

        else{

            commentName.value =
                "Reader";

        }

    }

    catch(error){

        commentName.value =
            "Reader";

    }

}


/* =========================================================
   COMMENTS
========================================================= */

async function loadComments(id){

    if(!id){
        return;
    }


    commentList.innerHTML =
        "";

    responseCount.textContent =
        "0 responses";


    /*
       First try loading user_id too.

       If the column doesn't exist in the current
       table, fall back to the existing comment structure
       so the comments themselves do not stop working.
    */

    let result =
        await db
            .from("comments")
            .select(
                "id,name,content,created_at,user_id"
            )
            .eq(
                "target_type",
                "journal"
            )
            .eq(
                "target_id",
                id
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    let hasUserIdColumn =
        !result.error;


    if(result.error){

        console.warn(
            "user_id was not available on comments; loading legacy comments instead.",
            result.error
        );


        result =
            await db
                .from("comments")
                .select(
                    "id,name,content,created_at"
                )
                .eq(
                    "target_type",
                    "journal"
                )
                .eq(
                    "target_id",
                    id
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );

    }


    if(result.error){

        console.error(
            "Comments error:",
            result.error
        );

        responseMessage.textContent =
            "Could not load responses.";

        return;

    }


    const comments =
        result.data || [];


    responseCount.textContent =
        `${comments.length} ${
            comments.length === 1
                ? "response"
                : "responses"
        }`;


    const currentUser =
        await getCurrentUser();


    const currentUserId =
        currentUser?.id || null;


    comments.forEach(
        function(comment){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "comment";


            const top =
                document.createElement(
                    "div"
                );

            top.className =
                "comment-top";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "comment-name";

            name.textContent =
                comment.name ||
                "Reader";


            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "comment-date";

            date.textContent =
                formatDate(
                    comment.created_at
                );


            top.append(
                name,
                date
            );


            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "comment-content";

            body.textContent =
                comment.content ||
                "";


            item.append(
                top,
                body
            );


            /*
               ONLY show Delete when there is a real
               authenticated owner ID and it matches
               the current user.

               We deliberately do NOT compare nicknames.
            */

            const ownsComment =
                hasUserIdColumn &&
                currentUserId &&
                comment.user_id &&
                String(
                    comment.user_id
                ) === String(
                    currentUserId
                );


            if(ownsComment){

                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "comment-actions";


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.type =
                    "button";

                deleteButton.className =
                    "comment-delete";

                deleteButton.textContent =
                    "Delete";


                deleteButton.addEventListener(
                    "click",
                    async function(){

                        const confirmed =
                            confirm(
                                "Delete this comment?"
                            );


                        if(!confirmed){
                            return;
                        }


                        deleteButton.disabled =
                            true;

                        deleteButton.textContent =
                            "Deleting...";


                        /*
                           The DELETE query includes BOTH
                           the comment ID and the current
                           authenticated user ID.
                        */

                        const {
                            error:deleteError
                        } =
                            await db
                                .from("comments")
                                .delete()
                                .eq(
                                    "id",
                                    comment.id
                                )
                                .eq(
                                    "user_id",
                                    currentUserId
                                );


                        if(deleteError){

                            console.error(
                                "Delete comment error:",
                                deleteError
                            );

                            deleteButton.disabled =
                                false;

                            deleteButton.textContent =
                                "Delete";

                            responseMessage.textContent =
                                "Could not delete this comment. Check the Supabase delete policy.";

                            return;

                        }


                        responseMessage.textContent =
                            "Comment deleted.";

                        await loadComments(
                            currentEntryId
                        );

                    }
                );


                actions.appendChild(
                    deleteButton
                );

                item.appendChild(
                    actions
                );

            }


            commentList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   POST COMMENT
========================================================= */

document
    .getElementById(
        "responseForm"
    )
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const name =
                commentName.value.trim();

            const content =
                document
                    .getElementById(
                        "commentContent"
                    )
                    .value
                    .trim();


            if(!content){

                responseMessage.textContent =
                    "Please write something first.";

                return;

            }


            if(!currentEntryId){

                responseMessage.textContent =
                    "This entry is not ready yet.";

                return;

            }


            responseMessage.textContent =
                "Posting...";


            const currentUser =
                await getCurrentUser();


            /*
               New comments try to save the authenticated
               user's ID.

               This is what makes ownership possible.
            */

            let insertResult;


            if(currentUser?.id){

                insertResult =
                    await db
                        .from("comments")
                        .insert({

                            target_type:"journal",

                            target_id:currentEntryId,

                            name:name || "Reader",

                            content,

                            user_id:currentUser.id

                        });

            }

            else{

                insertResult =
                    await db
                        .from("comments")
                        .insert({

                            target_type:"journal",

                            target_id:currentEntryId,

                            name:name || "Reader",

                            content

                        });

            }


            /*
               If the existing table doesn't have user_id,
               tell the user exactly what's missing instead
               of silently pretending ownership works.
            */

            if(insertResult.error){

                console.error(
                    "Comment insert error:",
                    insertResult.error
                );


                responseMessage.textContent =
                    "Could not post the response. Your comments table needs a user_id column for comment ownership.";

                return;

            }


            document
                .getElementById(
                    "commentContent"
                )
                .value =
                "";


            responseMessage.textContent =
                "Your response has been posted.";


            await loadComments(
                currentEntryId
            );

        }
    );


/* =========================================================
   READING PROGRESS
========================================================= */

function updateReadingProgress(){

    const max =
        document.documentElement.scrollHeight -
        window.innerHeight;


    const progress =
        max > 0
            ? (
                window.scrollY /
                max
            ) * 100
            : 0;


    document.getElementById(
        "readingProgress"
    ).style.width =
        `${Math.min(
            100,
            Math.max(
                0,
                progress
            )
        )}%`;

}


window.addEventListener(
    "scroll",
    updateReadingProgress,
    {
        passive:true
    }
);


/* =========================================================
   START
========================================================= */

setCommentName();

applyReadingPreferences();

loadEntry();

updateReadingProgress();

</script>
