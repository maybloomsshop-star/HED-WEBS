<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May Blooms — Author Dashboard</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f4ec;
    color:#3f4a3c
}

button,input,textarea,select{
    font-family:inherit
}

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f8f4ec;
    padding:30px
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.08)
}

.login-box h1{
    margin-top:0;
    color:#377a35
}

.login-box p{
    color:#777
}

.login-box input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#377a35;
    color:white;
    cursor:pointer
}

#loginMessage{
    margin-top:15px;
    color:#d33
}

.dashboard{
    display:none;
    min-height:100vh
}

.dashboard-header{
    background:#377a35;
    color:white;
    padding:22px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.dashboard-header h1{
    margin:0
}

.logout-btn{
    background:#e45796;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:7px;
    cursor:pointer
}

.dashboard-content{
    max-width:1200px;
    margin:auto;
    padding:30px
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:25px;
    flex-wrap:wrap
}

.tab-btn{
    border:0;
    background:#eee5d8;
    color:#3f4a3c;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer
}

.tab-btn.active{
    background:#377a35;
    color:white
}

.panel{
    display:none
}

.panel.active{
    display:block
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px
}

.panel-header h2{
    margin:0
}

.primary-btn{
    background:#e45796;
    color:white;
    border:0;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer
}

.secondary-btn{
    background:#eee5d8;
    color:#3f4a3c;
    border:0;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer
}

.content-list{
    display:grid;
    gap:15px
}

.content-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.05)
}

.content-card h3{
    margin-top:0;
    color:#377a35
}

.content-card p{
    color:#777
}

.card-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap
}

.card-actions button{
    border:0;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer
}

.edit-btn{
    background:#eee5d8
}

.delete-btn{
    background:#e45796;
    color:white
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px
}

.modal.active{
    display:flex
}

.modal-box{
    background:white;
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:15px;
    padding:25px
}

.modal-box h2{
    margin-top:0
}

.modal-box label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold
}

.modal-box input,
.modal-box textarea,
.modal-box select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px
}

.studio{
    display:none;
    position:fixed;
    inset:0;
    background:#f8f4ec;
    z-index:2000;
    flex-direction:column
}

.studio.active{
    display:flex
}

.studio-header{
    height:64px;
    flex-shrink:0;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    gap:15px
}

.studio-title{
    font-weight:bold;
    color:#377a35;
    font-size:18px
}

.studio-header-actions{
    display:flex;
    gap:8px;
    align-items:center
}

.studio-body,
.writing-studio-body{
    flex:1;
    display:flex;
    min-height:0
}

.chapter-sidebar{
    width:250px;
    background:#fffdf8;
    border-right:1px solid #ddd;
    overflow-y:auto;
    padding:15px
}

.chapter-sidebar h3{
    margin-top:0
}

.chapter-item{
    padding:12px;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:5px
}

.chapter-item:hover{
    background:#eee5d8
}

.chapter-item.active{
    background:#377a35;
    color:white
}

.add-chapter-btn{
    width:100%;
    padding:10px;
    border:1px dashed #aaa;
    background:transparent;
    border-radius:7px;
    cursor:pointer;
    margin-bottom:12px
}

.editor-main,
.writing-editor-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow:hidden
}

.editor-top{
    background:white;
    border-bottom:1px solid #ddd
}

.chapter-title-input{
    width:100%;
    border:0;
    padding:15px 25px;
    font-size:22px;
    font-weight:bold;
    outline:none
}

.editor-toolbar{
    display:flex;
    align-items:center;
    gap:4px;
    padding:8px 15px;
    border-top:1px solid #eee;
    flex-wrap:wrap;
    background:white
}

.editor-toolbar button,
.editor-toolbar select{
    min-height:34px;
    border:1px solid #ddd;
    background:white;
    border-radius:5px;
    padding:5px 8px;
    cursor:pointer;
    color:#3f4a3c
}

.editor-toolbar button:hover,
.editor-toolbar select:hover{
    background:#f3eee5
}

.toolbar-divider{
    width:1px;
    height:25px;
    background:#ddd;
    margin:0 4px
}

.editor-area{
    flex:1;
    overflow-y:auto;
    padding:35px
}

.paper{
    max-width:850px;
    min-height:700px;
    margin:auto;
    background:white;
    padding:55px;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
    outline:none;
    line-height:1.75;
    font-size:16px
}

.editor-bottom{
    background:white;
    border-top:1px solid #ddd;
    padding:10px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center
}

.word-count{
    color:#777;
    font-size:14px
}

.outline-sidebar{
    width:230px;
    background:#fffdf8;
    border-left:1px solid #ddd;
    padding:15px;
    overflow-y:auto
}

.outline-sidebar h3{
    margin-top:0
}

.outline-item{
    font-size:14px;
    margin:7px 0;
    color:#666
}

.outline-item.h1{
    font-weight:bold;
    color:#377a35
}

.outline-item.h2{
    padding-left:12px
}

.outline-item.h3{
    padding-left:24px
}

.writing-meta{
    background:white;
    padding:12px 25px;
    border-bottom:1px solid #ddd;
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap
}

.writing-meta input,
.writing-meta select{
    border:1px solid #ddd;
    border-radius:7px;
    padding:9px 11px
}

.writing-meta .writing-title{
    flex:1;
    min-width:220px;
    font-size:20px;
    font-weight:bold
}

.writing-meta label{
    font-size:13px;
    color:#777
}

.writing-image-label{
    border:1px solid #ddd;
    border-radius:7px;
    padding:8px 11px;
    background:white;
    cursor:pointer;
    font-size:13px
}

.writing-image-label input{
    display:none
}

.writing-paper{
    min-height:700px
}

.writing-paper img{
    max-width:100%;
    height:auto
}

.save-status{
    color:#777;
    font-size:13px
}

@media(max-width:900px){
    .chapter-sidebar,
    .outline-sidebar{
        display:none
    }

    .editor-area{
        padding:15px
    }

    .paper{
        padding:30px
    }
}

@media(max-width:600px){
    .dashboard-content{
        padding:18px
    }

    .panel-header{
        align-items:flex-start;
        flex-direction:column
    }

    .studio-header{
        padding:0 10px
    }

    .editor-area{
        padding:8px
    }

    .paper{
        padding:22px;
        min-height:600px
    }

    .writing-meta{
        padding:10px
    }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">

        <h1>May Blooms</h1>
        <p>Author Dashboard</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log In
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>
</div>


<div id="dashboard" class="dashboard">

    <header class="dashboard-header">

        <h1>May Blooms</h1>

        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Log Out
        </button>

    </header>


    <main class="dashboard-content">

        <div class="tabs">

            <button
                class="tab-btn active"
                data-panel="journalPanel"
            >
                Journal
            </button>

            <button
                class="tab-btn"
                data-panel="storiesPanel"
            >
                Stories
            </button>

            <button
                class="tab-btn"
                data-panel="otherPanel"
            >
                Other Writings
            </button>

        </div>


        <section
            id="journalPanel"
            class="panel active"
        >

            <div class="panel-header">

                <h2>Journal</h2>

                <button
                    id="newJournalBtn"
                    class="primary-btn"
                >
                    + New Journal Entry
                </button>

            </div>

            <div
                id="journalList"
                class="content-list"
            ></div>

        </section>


        <section
            id="storiesPanel"
            class="panel"
        >

            <div class="panel-header">

                <h2>Stories</h2>

                <button
                    id="newStoryBtn"
                    class="primary-btn"
                >
                    + New Book
                </button>

            </div>

            <div
                id="storyList"
                class="content-list"
            ></div>

        </section>


        <section
            id="otherPanel"
            class="panel"
        >

            <div class="panel-header">

                <h2>Other Writings</h2>

                <button
                    id="newOtherBtn"
                    class="primary-btn"
                >
                    + New Writing
                </button>

            </div>

            <div
                id="otherList"
                class="content-list"
            ></div>

        </section>

    </main>

</div>


<!-- NEW STORY -->

<div
    id="storyModal"
    class="modal"
>

    <div class="modal-box">

        <h2>New Book</h2>

        <form id="storyForm">

            <label>Book Title</label>

            <input
                type="text"
                id="storyTitle"
                required
            >

            <label>Author</label>

            <input
                type="text"
                id="storyAuthor"
                required
            >

            <label>Description</label>

            <textarea
                id="storyDescription"
                rows="5"
            ></textarea>

            <label>Cover Image</label>

            <input
                type="file"
                id="storyCover"
                accept="image/*"
            >

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="closeStoryModal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Book
                </button>

            </div>

        </form>

    </div>

</div>


<!-- JOURNAL STUDIO -->

<div
    id="journalStudio"
    class="studio"
>

    <header class="studio-header">

        <div class="studio-title">
            Journal
        </div>

        <div class="studio-header-actions">

            <button
                id="backJournalBtn"
                class="secondary-btn"
            >
                ← Back
            </button>

            <button
                id="deleteJournalStudioBtn"
                class="delete-btn"
            >
                Delete
            </button>

        </div>

    </header>


    <div class="writing-studio-body">

        <main class="writing-editor-main">

            <div class="writing-meta">

                <input
                    id="journalStudioTitle"
                    class="writing-title"
                    type="text"
                    placeholder="Journal title..."
                >

                <label class="writing-image-label">

                    Add Image

                    <input
                        type="file"
                        id="journalStudioImage"
                        accept="image/*"
                    >

                </label>

            </div>


            <div class="editor-toolbar">

                <select id="journalBlockFormat">
                    <option value="p">Normal</option>
                    <option value="h1">Title</option>
                    <option value="h2">Heading 1</option>
                    <option value="h3">Heading 2</option>
                    <option value="blockquote">Quote</option>
                </select>

                <select id="journalFontFamily">
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Trebuchet MS">Trebuchet</option>
                    <option value="Courier New">Courier New</option>
                </select>

                <select id="journalFontSize">
                    <option value="3">Normal</option>
                    <option value="2">Small</option>
                    <option value="4">Large</option>
                    <option value="5">Very Large</option>
                    <option value="6">Huge</option>
                </select>

                <span class="toolbar-divider"></span>

                <button type="button" data-journal-command="bold"><b>B</b></button>
                <button type="button" data-journal-command="italic"><i>I</i></button>
                <button type="button" data-journal-command="underline"><u>U</u></button>

                <span class="toolbar-divider"></span>

                <button type="button" data-journal-command="justifyLeft">⬅</button>
                <button type="button" data-journal-command="justifyCenter">☰</button>
                <button type="button" data-journal-command="justifyRight">➡</button>

                <span class="toolbar-divider"></span>

                <button type="button" data-journal-command="insertUnorderedList">• List</button>
                <button type="button" data-journal-command="insertOrderedList">1. List</button>

                <span class="toolbar-divider"></span>

                <button type="button" data-journal-command="undo">↶</button>
                <button type="button" data-journal-command="redo">↷</button>
                <button type="button" data-journal-command="removeFormat">Clear</button>

            </div>


            <div class="editor-area">

                <div
                    id="journalStudioContent"
                    class="paper writing-paper"
                    contenteditable="true"
                    spellcheck="true"
                ></div>

            </div>


            <div class="editor-bottom">

                <span
                    id="journalWordCount"
                    class="word-count"
                >
                    0 words
                </span>

                <span
                    id="journalSaveStatus"
                    class="save-status"
                ></span>

                <button
                    id="saveJournalBtn"
                    class="primary-btn"
                >
                    Save Journal
                </button>

            </div>

        </main>


        <aside class="outline-sidebar">

            <h3>Document Outline</h3>

            <div id="journalDocumentOutline">
                No headings yet.
            </div>

        </aside>

    </div>

</div>


<!-- OTHER WRITINGS STUDIO -->

<div
    id="otherStudio"
    class="studio"
>

    <header class="studio-header">

        <div class="studio-title">
            Other Writings
        </div>

        <div class="studio-header-actions">

            <button
                id="backOtherBtn"
                class="secondary-btn"
            >
                ← Back
            </button>

            <button
                id="deleteOtherStudioBtn"
                class="delete-btn"
            >
                Delete
            </button>

        </div>

    </header>


    <div class="writing-studio-body">

        <main class="writing-editor-main">

            <div class="writing-meta">

                <input
                    id="otherStudioTitle"
                    class="writing-title"
                    type="text"
                    placeholder="Writing title..."
                >

                <select id="otherStudioType">
                    <option value="Poem">Poem</option>
                    <option value="Essay">Essay</option>
                    <option value="Reflection">Reflection</option>
                    <option value="Short Piece">Short Piece</option>
                    <option value="Letter">Letter</option>
                    <option value="Other">Other</option>
                </select>

            </div>


            <div class="editor-toolbar">

                <select id="otherBlockFormat">
                    <option value="p">Normal</option>
                    <option value="h1">Title</option>
                    <option value="h2">Heading 1</option>
                    <option value="h3">Heading 2</option>
                    <option value="blockquote">Quote</option>
                </select>

                <select id="otherFontFamily">
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Trebuchet MS">Trebuchet</option>
                    <option value="Courier New">Courier New</option>
                </select>

                <select id="otherFontSize">
                    <option value="3">Normal</option>
                    <option value="2">Small</option>
                    <option value="4">Large</option>
                    <option value="5">Very Large</option>
                    <option value="6">Huge</option>
                </select>

                <span class="toolbar-divider"></span>

                <button type="button" data-other-command="bold"><b>B</b></button>
                <button type="button" data-other-command="italic"><i>I</i></button>
                <button type="button" data-other-command="underline"><u>U</u></button>

                <span class="toolbar-divider"></span>

                <button type="button" data-other-command="justifyLeft">⬅</button>
                <button type="button" data-other-command="justifyCenter">☰</button>
                <button type="button" data-other-command="justifyRight">➡</button>

                <span class="toolbar-divider"></span>

                <button type="button" data-other-command="insertUnorderedList">• List</button>
                <button type="button" data-other-command="insertOrderedList">1. List</button>

                <span class="toolbar-divider"></span>

                <button type="button" data-other-command="undo">↶</button>
                <button type="button" data-other-command="redo">↷</button>
                <button type="button" data-other-command="removeFormat">Clear</button>

            </div>


            <div class="editor-area">

                <div
                    id="otherStudioContent"
                    class="paper writing-paper"
                    contenteditable="true"
                    spellcheck="true"
                ></div>

            </div>


            <div class="editor-bottom">

                <span
                    id="otherWordCount"
                    class="word-count"
                >
                    0 words
                </span>

                <span
                    id="otherSaveStatus"
                    class="save-status"
                ></span>

                <button
                    id="saveOtherBtn"
                    class="primary-btn"
                >
                    Save Writing
                </button>

            </div>

        </main>


        <aside class="outline-sidebar">

            <h3>Document Outline</h3>

            <div id="otherDocumentOutline">
                No headings yet.
            </div>

        </aside>

    </div>

</div>


<!-- STORY STUDIO -->

<div
    id="storyStudio"
    class="studio"
>

    <header class="studio-header">

        <div class="studio-title">
            Story Studio
        </div>

        <div class="studio-header-actions">

            <button
                id="backToStoriesBtn"
                class="secondary-btn"
            >
                ← Back
            </button>

            <button
                id="deleteBookBtn"
                class="delete-btn"
            >
                Delete Book
            </button>

        </div>

    </header>


    <div class="studio-body">

        <aside class="chapter-sidebar">

            <h3>Chapters</h3>

            <button
                id="addChapterBtn"
                class="add-chapter-btn"
            >
                + Add Chapter
            </button>

            <div id="chapterList"></div>

        </aside>


        <main class="editor-main">

            <div class="editor-top">

                <input
                    id="chapterTitle"
                    class="chapter-title-input"
                    placeholder="Chapter title..."
                >

                <div class="editor-toolbar">

                    <select id="blockFormat">
                        <option value="p">Normal</option>
                        <option value="h1">Title</option>
                        <option value="h2">Heading 1</option>
                        <option value="h3">Heading 2</option>
                        <option value="blockquote">Quote</option>
                    </select>

                    <select id="fontFamily">
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Trebuchet MS">Trebuchet</option>
                        <option value="Courier New">Courier New</option>
                    </select>

                    <select id="fontSize">
                        <option value="3">Normal</option>
                        <option value="2">Small</option>
                        <option value="4">Large</option>
                        <option value="5">Very Large</option>
                        <option value="6">Huge</option>
                    </select>

                    <span class="toolbar-divider"></span>

                    <button type="button" data-command="bold"><b>B</b></button>
                    <button type="button" data-command="italic"><i>I</i></button>
                    <button type="button" data-command="underline"><u>U</u></button>

                    <span class="toolbar-divider"></span>

                    <button type="button" data-command="justifyLeft">⬅</button>
                    <button type="button" data-command="justifyCenter">☰</button>
                    <button type="button" data-command="justifyRight">➡</button>

                    <span class="toolbar-divider"></span>

                    <button type="button" data-command="insertUnorderedList">• List</button>
                    <button type="button" data-command="insertOrderedList">1. List</button>

                    <span class="toolbar-divider"></span>

                    <button type="button" data-command="undo">↶</button>
                    <button type="button" data-command="redo">↷</button>

                    <button
                        type="button"
                        id="clearFormatting"
                    >
                        Clear
                    </button>

                </div>

            </div>


            <div class="editor-area">

                <div

/* ==================================================

================================================== */

function escapeHtml(text){

    return String(text || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function getWordCount(text){

    const clean =
        String(text || "").trim();

    if(!clean) return 0;

    return clean.split(/\s+/).length;

}


function updateOutline(editor,outline){

    const headings =
        editor.querySelectorAll("h1,h2,h3");

    if(!headings.length){

        outline.innerHTML =

        return;

    }

    outline.innerHTML = "";

    headings.forEach(heading => {

        const item =
            document.createElement("div");

        item.className =
            "outline-item " +
            heading.tagName.toLowerCase();

        item.textContent =
            heading.textContent || "Untitled heading";

        outline.appendChild(item);

    });

}

/* ==================================================

function saveJournalSelection(){

    const selection =
        window.getSelection();

    const editor =
        $("journalStudioContent");

    if(
        selection &&
        selection.rangeCount &&
        editor &&
        editor.contains(selection.anchorNode)
    ){

        savedJournalRange =
            selection.getRangeAt(0).cloneRange();

    }

}


function restoreJournalSelection(){

    const editor =
        $("journalStudioContent");

    editor.focus();

    if(!savedJournalRange) return;

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedJournalRange
    );

}


function journalCommand(
    command,
    value=null
){

    restoreJournalSelection();

    document.execCommand(
        command,
        false,
        value
    );

    updateJournalEditor();

}

================================================== */

async function saveJournal(){

    const title =
        $("journalStudioTitle")
        .value
        .trim();

    const content =
        $("journalStudioContent")
        .innerHTML;

    if(!title){

        alert("Please enter a journal title.");
        return;

    }

    $("journalSaveStatus")
        .textContent =
        "Saving...";


    let imageUrl =
        currentJournalImageUrl;


    const imageFile =
        $("journalStudioImage")
        .files[0];


    if(imageFile){

        const extension =
            imageFile.name
            .split(".")
            .pop();

        const path =
            `journal/${currentUser.id}/${crypto.randomUUID()}.${extension}`;

        const {error:uploadError} =
            await supabaseClient
            .storage
            .from("hed-journal")
            .upload(
                path,
                imageFile,
                {
                    upsert:false
                }
            );

        if(uploadError){

            alert(uploadError.message);

            $("journalSaveStatus")
                .textContent = "";

            return;

        }

        const {data:urlData} =
            supabaseClient
            .storage
            .from("hed-journal")
            .getPublicUrl(path);

        imageUrl =
            urlData.publicUrl;

    }


    const payload = {

        title,

        content,

        image_url:
            imageUrl,

        published_at:
            currentJournalId
                ? undefined
                : new Date().toISOString()

    };


    let result;


    if(currentJournalId){

        result =
            await supabaseClient
            .from("journal_entries")
            .update({
                title,
                content,
                image_url:imageUrl
            })
            .eq(
                "id",
                currentJournalId
            );

    }else{

        result =
            await supabaseClient
            .from("journal_entries")
            .insert({
                owner_id:
                    currentUser.id,
                title,
                content,
                image_url:imageUrl,
                published_at:
                    new Date().toISOString()
            });

    }


    if(result.error){

        alert(result.error.message);

        $("journalSaveStatus")
            .textContent = "";

        return;

    }


    $("journalSaveStatus")
        .textContent =
        "Saved!";

    $("journalStudioImage")
        .value = "";

    await loadJournal();

}

    await loadJournal();

};

/* ==================================================

================================================== */

window.deleteStory = async function(storyId){

    const {
        data:story,
        error:storyError
    } =
        await supabaseClient
        .from("stories")
        .select("title")
        .eq("id",storyId)
        .single();


    if(storyError){

        alert(storyError.message);
        return;

    }


    const title =
        story?.title ||
        "this story";


    const confirmed =
        confirm(
            `Delete "${title}" and all its chapters?`
        );


    if(!confirmed) return;


    const {
        error:chapterError
    } =
        await supabaseClient
        .from("chapters")
        .delete()
        .eq(
            "story_id",
            storyId
        );


    if(chapterError){

        alert(
            "Could not delete the chapters:\n\n" +
            chapterError.message
        );

        return;

    }


    const {
        error:deleteError
    } =
        await supabaseClient
        .from("stories")
        .delete()
        .eq(
            "id",
            storyId
        );


    if(deleteError){

        alert(
            "Could not delete the story:\n\n" +
            deleteError.message
        );

        return;

    }


    if(
        currentStory &&
        currentStory.id === storyId
    ){

        currentStory = null;
        currentChapter = null;

        $("storyStudio")
            .classList.remove("active");

    }


    await loadStories();

};

        ){

        item.textContent =
            chapter.title ||
            "Untitled Chapter";


        item.addEventListener(
            "click",
            () =>
                selectChapter(chapter.id)
        );


        list.appendChild(item);

    });


    if(
        currentChapter &&
        data.some(
            c =>
                c.id === currentChapter.id

    if(data.length){

        await selectChapter(

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);
        return;

    }


    const list =
        $("otherList");

    list.innerHTML = "";


    if(!data || !data.length){

        list.innerHTML = `
            <div class="content-card">
                <p>No other writings yet.</p>
            </div>
        `;

        return;

    }


    data.forEach(entry => {

        const card =
            document.createElement("div");

        card.className =
            "content-card";


        card.innerHTML = `

            <h3>
                ${escapeHtml(
                    entry.title ||
                    "Untitled"
                )}
            </h3>

            <p>
                ${escapeHtml(
                    entry.type ||
                    "Other"
                )}
            </p>

            <div class="card-actions">

                <button
                    class="edit-btn"
                    type="button"
                    onclick="editOther('${entry.id}')"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    type="button"
                    onclick="deleteOther('${entry.id}')"
                >
                    Delete
                </button>

            </div>

        `;


        list.appendChild(card);

    });

}


/* ==================================================
   NEW OTHER WRITING
================================================== */

$("newOtherBtn")
.addEventListener(
    "click",
    () => {

        currentOtherId = null;

        $("otherStudioTitle")
            .value = "";

        $("otherStudioType")
            .value = "Poem";

        $("otherStudioContent")
            .innerHTML = "";

        $("otherSaveStatus")
            .textContent =
            "New writing";

        $("otherStudio")
            .classList.add("active");

        updateOtherEditor();

    }
);


/* ==================================================
   EDIT OTHER
================================================== */

window.editOther = async function(id){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("other_writings")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        alert(error.message);
        return;

    }


    currentOtherId =
        id;


    $("otherStudioTitle")
        .value =
        data.title || "";


    $("otherStudioType")
        .value =
        data.type || "Other";


    $("otherStudioContent")
        .innerHTML =
        data.content || "";


    $("otherSaveStatus")
        .textContent =
        "Editing writing";


    $("otherStudio")
        .classList.add("active");


    updateOtherEditor();

};


/* ==================================================
   OTHER EDITOR
================================================== */

function saveOtherSelection(){

    const selection =
        window.getSelection();

    const editor =
        $("otherStudioContent");


    if(
        selection &&
        selection.rangeCount &&
        editor &&
        editor.contains(
            selection.anchorNode
        )
    ){

        savedOtherRange =
            selection
            .getRangeAt(0)
            .cloneRange();

    }

}


function restoreOtherSelection(){

    const editor =
        $("otherStudioContent");

    editor.focus();


    if(!savedOtherRange)
        return;


    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedOtherRange
    );

}


document.addEventListener(
    "selectionchange",
    saveOtherSelection
);


function otherCommand(
    command,
    value=null
){

    restoreOtherSelection();

    document.execCommand(
        command,
        false,
        value
    );

    updateOtherEditor();

}


document
.querySelectorAll("[data-other-command]")
.forEach(button => {

    button.addEventListener(
        "mousedown",
        event => {

            event.preventDefault();

        }
    );


    button.addEventListener(
        "click",
        () => {

            otherCommand(
                button.dataset.otherCommand
            );

        }
    );

});


$("otherBlockFormat")
.addEventListener(
    "change",
    function(){

        restoreOtherSelection();

        document.execCommand(
            "formatBlock",
            false,
            this.value
        );

        updateOtherEditor();

    }
);


$("otherFontFamily")
.addEventListener(
    "change",
    function(){

        restoreOtherSelection();

        document.execCommand(
            "fontName",
            false,
            this.value
        );

        updateOtherEditor();

    }
);


$("otherFontSize")
.addEventListener(
    "change",
    function(){

        restoreOtherSelection();

        document.execCommand(
            "fontSize",
            false,
            this.value
        );

        updateOtherEditor();

    }
);


function updateOtherEditor(){

    const editor =
        $("otherStudioContent");


    $("otherWordCount")
        .textContent =
        `${getWordCount(editor.innerText)} words`;


    updateOutline(
        editor,
        $("otherDocumentOutline")
    );

}


/* ==================================================
   SAVE OTHER WRITING
================================================== */

$("saveOtherBtn")
.addEventListener(
    "click",
    saveOther
);


async function saveOther(){

    const title =
        $("otherStudioTitle")
        .value
        .trim();


    const type =
        $("otherStudioType")
        .value;


    const content =
        $("otherStudioContent")
        .innerHTML;


    if(!title){

        alert(
            "Please enter a title."
        );

        return;

    }


    $("otherSaveStatus")
        .textContent =
        "Saving...";


    let result;


    if(currentOtherId){

        result =
            await supabaseClient
            .from("other_writings")
            .update({

                title,
                type,
                content

            })
            .eq(
                "id",
                currentOtherId
            );

    }else{

        result =
            await supabaseClient
            .from("other_writings")
            .insert({

                owner_id:
                    currentUser.id,

                title,
                type,
                content

            });

    }


    if(result.error){

        alert(result.error.message);

        $("otherSaveStatus")
            .textContent = "";

        return;

    }


    $("otherSaveStatus")
        .textContent =
        "Saved!";


    await loadOtherWritings();

}


/* ==================================================
   DELETE OTHER
================================================== */

window.deleteOther = async function(id){

    const confirmed =
        confirm(
            "Delete this writing?"
        );


    if(!confirmed) return;


    const {
        error
    } =
        await supabaseClient
        .from("other_writings")
        .delete()
        .eq("id",id);


    if(error){

        alert(error.message);
        return;

    }


    if(currentOtherId === id){

        currentOtherId = null;

        $("otherStudio")
            .classList.remove("active");

    }


    await loadOtherWritings();

};


$("deleteOtherStudioBtn")
.addEventListener(
    "click",
    async () => {

        if(!currentOtherId) return;

        await deleteOther(
            currentOtherId
        );

    }
);


$("backOtherBtn")
.addEventListener(
    "click",
    () => {

        $("otherStudio")
            .classList.remove("active");

        currentOtherId = null;

    }
);


/* ==================================================
   START
================================================== */

checkSession();

</script>
