<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HED · Journal</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root {
      --brown: #4a352b;
      --brown-dark: #382920;

      --cream: #f5efe6;
      --paper: #fbf8f3;

      --green: #68745d;
      --pink: #c58f91;

      --text: #342b26;
      --muted: #85786e;
      --line: #d8cec2;

      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      height: 72px;
      background: var(--brown);
      color: #fffaf4;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6vw;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 29px;
      letter-spacing: 0.08em;
      font-weight: normal;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 42px;

      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .nav a {
      opacity: 0.9;
      position: relative;
      padding: 25px 0;
    }

    .nav a:hover {
      opacity: 1;
    }

    .nav .active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 17px;

      height: 1px;
      background: #fffaf4;
    }

    .star {
      font-size: 22px;
      margin-left: 4px;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(var(--max-width), 88%);
      margin: 0 auto;
      padding-bottom: 100px;
    }

    /* =========================
       JOURNAL HERO
    ========================= */

    .journal-hero {
      text-align: center;
      padding: 75px 20px 62px;
    }

    .journal-hero h1 {
      margin: 0;

      font-size: clamp(58px, 8vw, 92px);
      font-weight: normal;
      line-height: 0.95;
      letter-spacing: -0.035em;

      color: var(--brown-dark);
    }

    .journal-subtitle {
      margin: 20px 0 0;

      font-size: 25px;
      font-style: italic;
      color: var(--brown);
    }

    .ornament {
      width: 290px;
      margin: 27px auto 28px;

      display: flex;
      align-items: center;
      gap: 12px;

      color: var(--brown);
    }

    .ornament::before,
    .ornament::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #b9aa9b;
    }

    .ornament span {
      font-size: 18px;
      transform: rotate(45deg);
      display: inline-block;
    }

    .journal-description {
      margin: 0;

      font-size: 18px;
      font-style: italic;
      color: var(--muted);
    }

    /* =========================
       SECTION LABEL
    ========================= */

    .section-label {
      margin-bottom: 20px;

      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--brown);

      text-transform: uppercase;
    }

    /* =========================
       LATEST ENTRY
    ========================= */

    .latest-entry {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 54px;

      align-items: center;

      padding-bottom: 62px;
      border-bottom: 1px solid var(--line);
    }

    .latest-image {
      width: 100%;
      aspect-ratio: 1.48 / 1;

      background: #e4d9cc;
      overflow: hidden;
    }

    .latest-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition: transform 0.6s ease;
    }

    .latest-entry:hover .latest-image img {
      transform: scale(1.025);
    }

    .latest-info {
      padding-right: 25px;
    }

    .entry-date {
      margin-bottom: 17px;

      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;

      color: var(--muted);
      text-transform: uppercase;
    }

    .latest-title {
      margin: 0 0 20px;

      font-size: clamp(32px, 4vw, 48px);
      font-weight: normal;
      line-height: 1.08;

      color: var(--brown-dark);
    }

    .entry-preview {
      margin: 0;

      font-size: 18px;
      line-height: 1.75;
      font-style: italic;

      color: #665950;
    }

    .read-entry {
      display: inline-block;

      margin-top: 27px;

      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      color: var(--brown);

      border-bottom: 1px solid var(--brown);
      padding-bottom: 5px;

      transition: 0.2s ease;
    }

    .read-entry:hover {
      color: var(--pink);
      border-color: var(--pink);
      transform: translateX(3px);
    }

    /* =========================
       ARCHIVE
    ========================= */

    .archive {
      padding-top: 38px;
    }

    .archive-list {
      border-top: 1px solid var(--line);
    }

    .archive-entry {
      display: grid;
      grid-template-columns: 145px 1fr 35px;
      gap: 28px;

      align-items: center;

      padding: 24px 0;

      border-bottom: 1px solid var(--line);

      transition: background 0.2s ease;
    }

    .archive-entry:hover {
      background: rgba(255,255,255,0.28);
    }

    .archive-image {
      width: 145px;
      height: 125px;

      background: #e4d9cc;
      overflow: hidden;
    }

    .archive-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      display: block;

      transition: transform 0.5s ease;
    }

    .archive-entry:hover .archive-image img {
      transform: scale(1.04);
    }

    .archive-content {
      padding-right: 15px;
    }

    .archive-title {
      margin: 7px 0 8px;

      font-size: 25px;
      font-weight: normal;

      color: var(--brown-dark);
    }

    .archive-preview {
      margin: 0;

      max-width: 680px;

      font-size: 16px;
      line-height: 1.6;
      font-style: italic;

      color: var(--muted);
    }

    .archive-arrow {
      font-size: 24px;
      color: var(--brown);

      transition: transform 0.2s ease;
    }

    .archive-entry:hover .archive-arrow {
      transform: translateX(5px);
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .loading,
    .empty {
      padding: 70px 20px;

      text-align: center;

      color: var(--muted);
      font-style: italic;
      font-size: 18px;
    }

    .error {
      padding: 60px 20px;

      text-align: center;

      color: var(--pink);
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .site-header {
        padding: 0 22px;
      }

      .nav {
        gap: 18px;
        font-size: 10px;
      }

      .star {
        display: none;
      }

      main {
        width: 90%;
      }

      .journal-hero {
        padding: 58px 10px 48px;
      }

      .journal-hero h1 {
        font-size: 58px;
      }

      .journal-subtitle {
        font-size: 21px;
      }

      .journal-description {
        font-size: 16px;
      }

      .latest-entry {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .latest-info {
        padding-right: 0;
      }

      .latest-title {
        font-size: 36px;
      }

      .archive-entry {
        grid-template-columns: 95px 1fr 20px;
        gap: 17px;
      }

      .archive-image {
        width: 95px;
        height: 95px;
      }

      .archive-title {
        font-size: 20px;
      }

      .archive-preview {
        font-size: 14px;
      }

      .archive-arrow {
        font-size: 19px;
      }
    }

    @media (max-width: 520px) {

      .site-header {
        height: 62px;
      }

      .brand {
        font-size: 24px;
      }

      .nav {
        gap: 13px;
      }

      .nav a {
        padding: 20px 0;
      }

      .nav .active::after {
        bottom: 13px;
      }

      .journal-hero h1 {
        font-size: 48px;
      }

      .ornament {
        width: 220px;
      }

      .latest-image {
        aspect-ratio: 1.2 / 1;
      }

      .archive-entry {
        grid-template-columns: 1fr 20px;
      }

      .archive-image {
        display: none;
      }

      .archive-content {
        padding-left: 3px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="site-header">

    <a href="hed.html" class="brand">HED</a>

    <nav class="nav">
      <a href="hed.html">HOME</a>
      <a href="journal.html" class="active">JOURNAL</a>
      <a href="about.html">ABOUT</a>
      <span class="star">✦</span>
    </nav>

  </header>


  <!-- =========================
       JOURNAL
  ========================= -->

  <main>

    <section class="journal-hero">

      <h1>JOURNAL</h1>

      <div class="journal-subtitle">
        Her Existential Thoughts
      </div>

      <div class="ornament">
        <span>✦</span>
      </div>

      <p class="journal-description">
        a collection of thoughts, moments, and things I write
      </p>

    </section>


    <!-- Latest entry will be inserted here -->
    <section id="latestSection"></section>


    <!-- Archive -->
    <section class="archive">

      <div class="section-label">
        Archive
      </div>

      <div id="archiveList" class="archive-list">
        <div class="loading">
          Loading journal entries...
        </div>
      </div>

    </section>

  </main>


  <script>


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHTML(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function getText(entry) {

      const text =
        entry.author_reflection ||
        entry.reflection ||
        entry.content ||
        "";

      /*
        Remove HTML if the journal content is stored as HTML.
      */

      const temp = document.createElement("div");
      temp.innerHTML = text;

      return temp.textContent
        .replace(/\s+/g, " ")
        .trim();
    }


    function getPreview(entry, length = 190) {

      const text = getText(entry);

      if (!text) {
        return "A journal entry waiting to be read...";
      }

      if (text.length <= length) {
        return text;
      }

      return text.substring(0, length).trim() + "...";
    }


    function formatDate(dateValue) {

      if (!dateValue) {
        return "";
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }


    function getImage(entry) {

      if (entry.image_url) {
        return entry.image_url;
      }

      /*
        Soft fallback image.
        This keeps the dashboard visually balanced
        even when an entry has no image.
      */

      return "";
    }


    /* =========================================================
       IMAGE HTML
    ========================================================= */

    function imageHTML(entry, className) {

      const image = getImage(entry);

      if (!image) {

        return `
          <div class="${className}"
               style="
                 background:
                 linear-gradient(
                   135deg,
                   #d9cbbd,
                   #eee5da
                 );
               ">
          </div>
        `;
      }

      return `
        <div class="${className}">
          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(entry.title || "Journal entry")}"
            loading="lazy"
          >
        </div>
      `;
    }


    /* =========================================================
       LATEST ENTRY
    ========================================================= */

    function renderLatest(entry) {

      const latestSection = document.getElementById("latestSection");

      latestSection.innerHTML = `

        <div class="section-label">
          Latest Entry
        </div>

        <a
          class="latest-entry"
          href="journal-entry.html?id=${encodeURIComponent(entry.id)}"
        >

          ${imageHTML(entry, "latest-image")}

          <div class="latest-info">

            <div class="entry-date">
              ${escapeHTML(formatDate(entry.published_at))}
            </div>

            <h2 class="latest-title">
              ${escapeHTML(entry.title || "Untitled Journal Entry")}
            </h2>

            <p class="entry-preview">
              ${escapeHTML(getPreview(entry, 230))}
            </p>

            <span class="read-entry">
              Read Entry →
            </span>

          </div>

        </a>
      `;
    }


    /* =========================================================
       ARCHIVE
    ========================================================= */

    function renderArchive(entries) {

      const archiveList = document.getElementById("archiveList");

      if (!entries.length) {

        archiveList.innerHTML = `
          <div class="empty">
            No journal entries yet.
          </div>
        `;

        return;
      }

      archiveList.innerHTML = entries.map(entry => {

        return `

          <a
            class="archive-entry"
            href="journal-entry.html?id=${encodeURIComponent(entry.id)}"
          >

            ${imageHTML(entry, "archive-image")}

            <div class="archive-content">

              <div class="entry-date">
                ${escapeHTML(formatDate(entry.published_at))}
              </div>

              <h3 class="archive-title">
                ${escapeHTML(entry.title || "Untitled Journal Entry")}
              </h3>

              <p class="archive-preview">
                ${escapeHTML(getPreview(entry, 170))}
              </p>

            </div>

            <div class="archive-arrow">
              →
            </div>

          </a>

        `;

      }).join("");
    }


    /* =========================================================
       LOAD JOURNAL ENTRIES
    ========================================================= */

    const db = supabaseClient;
    async function loadJournal() {

      const latestSection = document.getElementById("latestSection");
      const archiveList = document.getElementById("archiveList");

      if (!db) {

        latestSection.innerHTML = `
          <div class="error">
            Journal could not be loaded.
          </div>
        `;

        archiveList.innerHTML = "";

        console.error(
          "Supabase is not initialized. Check supabase-config.js."
        );

        return;
      }


      try {

        const { data, error } = await db
          .from("journal_entries")
          .select("*")
          .order("published_at", {
            ascending: false
          });


        if (error) {
          throw error;
        }


        const entries = data || [];


        if (!entries.length) {

          latestSection.innerHTML = `
            <div class="empty">
              No journal entries yet.
            </div>
          `;

          archiveList.innerHTML = "";

          return;
        }


        /*
          First entry = featured/latest.
          Remaining entries = archive.
        */

        const latest = entries[0];
        const archive = entries.slice(1);


        renderLatest(latest);
        renderArchive(archive);


      } catch (error) {

        console.error("Journal loading error:", error);

        latestSection.innerHTML = `
          <div class="error">
            Something went wrong while loading the journal.
          </div>
        `;

        archiveList.innerHTML = "";

      }
    }


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      loadJournal
    );

  </script>

</body>
</html>
