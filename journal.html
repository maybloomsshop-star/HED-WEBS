<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Journals · May Blooms</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f3efe9;
            color: #29221e;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font: inherit;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .journal-page {
            min-height: 100vh;
            background: #f3efe9;
        }


        /* =====================================================
           READING PROGRESS
        ===================================================== */

        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;

            width: 0;
            height: 3px;

            background: #5f4a3f;

            z-index: 9999;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .journal-header {
            width: 100%;

            padding: 25px 5vw;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(73, 59, 51, 0.14);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
            font-weight: 400;

            letter-spacing: 0.035em;
        }

        .brand-subtitle {
            font-size: 8px;
            letter-spacing: 0.18em;

            color: #8c7b70;

            text-transform: uppercase;
        }

        .back-link {
            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #75645a;

            text-transform: uppercase;
        }

        .back-link:hover {
            color: #29221e;
        }


        /* =====================================================
           INDEX
        ===================================================== */

        .journal-index {
            width: 100%;
        }

        .journal-intro {
            width:
                min(
                    calc(100% - 10vw),
                    920px
                );

            margin: 0 auto;

            padding:
                105px
                0
                88px;
        }

        .journal-kicker {
            margin: 0 0 20px;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 0.20em;

            color: #8d7a6e;

            text-transform: uppercase;
        }

        .journal-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    58px,
                    9vw,
                    105px
                );

            line-height: 0.88;

            font-weight: 400;

            letter-spacing: -0.045em;
        }

        .journal-description {
            max-width: 540px;

            margin: 31px 0 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;
            line-height: 1.75;

            color: #776960;
        }

        .journal-mark {
            width: 46px;
            height: 1px;

            margin-top: 45px;

            background: #907c70;
        }


        /* =====================================================
           JOURNAL LIST
        ===================================================== */

        .journal-list {
            width:
                min(
                    calc(100% - 10vw),
                    920px
                );

            margin:
                0 auto
                120px;
        }

        .journal-preview {
            display: grid;

            grid-template-columns:
                145px
                minmax(0, 1fr);

            gap: 45px;

            width: 100%;

            padding:
                43px
                0
                48px;

            border-top:
                1px solid
                rgba(73, 59, 51, 0.17);
        }

        .journal-preview:last-child {
            border-bottom:
                1px solid
                rgba(73, 59, 51, 0.17);
        }

        .journal-preview:hover {
            padding-left: 10px;
            padding-right: 10px;
        }

        .preview-meta {
            padding-top: 5px;
        }

        .preview-date {
            margin: 0;

            font-size: 8px;
            font-weight: 700;

            line-height: 1.5;

            letter-spacing: 0.15em;

            color: #927f73;

            text-transform: uppercase;
        }

        .preview-number {
            display: block;

            margin-top: 14px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 13px;

            color: #a6968b;
        }

        .preview-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    28px,
                    4vw,
                    43px
                );

            line-height: 1.10;

            font-weight: 400;

            letter-spacing: -0.025em;
        }

        .preview-excerpt {
            max-width: 670px;

            margin: 17px 0 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;
            line-height: 1.8;

            color: #756961;
        }

        .preview-read {
            display: inline-block;

            margin-top: 22px;

            font-size: 8px;
            font-weight: 700;

            letter-spacing: 0.15em;

            color: #78665b;

            text-transform: uppercase;
        }

        .journal-status {
            padding: 45px 0;

            border-top:
                1px solid
                rgba(73,59,51,0.17);

            border-bottom:
                1px solid
                rgba(73,59,51,0.17);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;
            line-height: 1.7;

            color: #8c7d74;
        }


        /* =====================================================
           READER
        ===================================================== */

        .reader {
            display: none;
        }

        .reader.active {
            display: block;
        }

        .reader-shell {
            width:
                min(
                    calc(100% - 10vw),
                    920px
                );

            margin: 0 auto;

            padding:
                75px
                0
                100px;
        }

        .reader-top {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 80px;
        }

        .reader-back {
            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #847269;

            text-transform: uppercase;
        }

        .reader-label {
            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.10em;

            color: #9b897d;

            text-transform: uppercase;
        }


        /* =====================================================
           READER HEADER
        ===================================================== */

        .reader-header {
            max-width: 850px;

            margin-bottom: 45px;
        }

        .reader-date {
            margin: 0 0 14px;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.12em;

            color: #907d71;

            text-transform: uppercase;
        }

        .reader-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(
                    45px,
                    7vw,
                    82px
                );

            line-height: 1.02;

            font-weight: 400;

            letter-spacing: -0.042em;
        }

        .reader-meta {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-top: 18px;

            font-size: 14px;

            color: #756961;
        }

        .reader-rule {
            width: 38px;
            height: 1px;

            margin-top: 30px;

            background: #917d70;
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .reader-image {
            display: block;

            width: 100%;
            max-height: 610px;

            margin:
                0
                0
                60px;

            object-fit: cover;
        }


        /* =====================================================
           READING PREFERENCES
        ===================================================== */

        .reading-preferences {
            width: 100%;
            max-width: 700px;

            margin:
                0
                auto
                40px;

            padding:
                14px
                0;

            border-top:
                1px solid
                rgba(73,59,51,0.12);

            border-bottom:
                1px solid
                rgba(73,59,51,0.12);

            display: flex;
            align-items: center;
            gap: 9px;

            flex-wrap: wrap;
        }

        .reading-preferences-label {
            margin-right: 5px;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #78665b;

            text-transform: uppercase;
        }

        .reading-button {
            min-width: 40px;
            min-height: 32px;

            padding:
                6px
                10px;

            border:
                1px solid
                rgba(73,59,51,0.18);

            background: transparent;

            color: #5f5149;

            cursor: pointer;

            font-size: 12px;
        }

        .reading-button:hover,
        .reading-button.active {
            background: #e7ded5;
            border-color: #9b897d;
        }


        /* =====================================================
           ARTICLE
        ===================================================== */

        .reader-content {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 19px;

            line-height: 1.92;

            color: #403731;

            overflow-wrap: break-word;
        }

        .reader-content.sans {
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .reader-content p {
            margin:
                0
                0
                1.55em;
        }

        .reader-content div {
            margin: 0;
        }

        .reader-content h1,
        .reader-content h2,
        .reader-content h3,
        .reader-content h4 {
            color: #29221e;
            line-height: 1.25;
            font-weight: 400;
        }

        .reader-content h1 {
            font-size: 36px;
            margin: 1.8em 0 0.75em;
        }

        .reader-content h2 {
            font-size: 31px;
            margin: 1.8em 0 0.75em;
        }

        .reader-content h3 {
            font-size: 26px;
            margin: 1.7em 0 0.7em;
        }

        .reader-content h4 {
            font-size: 21px;
            margin: 1.7em 0 0.7em;
        }

        .reader-content strong,
        .reader-content b {
            color: #29221e;
        }

        .reader-content blockquote {
            margin: 2.2em 0;

            padding:
                5px
                0
                5px
                27px;

            border-left:
                1px solid
                #8f7b6e;

            color: #71625a;
        }

        .reader-content ul,
        .reader-content ol {
            margin: 1.5em 0;
            padding-left: 1.5em;
        }

        .reader-content li {
            margin-bottom: 0.65em;
        }

        .reader-content img {
            display: block;

            width: auto;
            max-width: 100%;
            height: auto;

            margin:
                2.7em
                auto;
        }

        .reader-content a {
            color: #6f5b50;

            text-decoration: underline;

            text-underline-offset: 3px;
        }


        /* =====================================================
           END OF ENTRY
        ===================================================== */

        .end-of-entry {
            width: 100%;
            max-width: 700px;

            margin:
                65px
                auto
                0;

            text-align: center;
        }

        .end-of-entry-line {
            width: 34px;
            height: 1px;

            margin:
                0
                auto
                18px;

            background: #9b897d;
        }

        .end-of-entry-text {
            margin: 0;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.12em;

            color: #927f73;

            text-transform: uppercase;
        }


        /* =====================================================
           NEWER ENTRY
           THIS IS BEFORE COMMENTS
        ===================================================== */

        .reader-navigation {
            width: 100%;
            max-width: 700px;

            margin:
                45px
                auto
                0;

            padding-top: 30px;

            border-top:
                1px solid
                rgba(73,59,51,0.17);
        }

        .reader-nav-link {
            display: flex;
            flex-direction: column;

            gap: 8px;

            width: 100%;

            color: #5b4d45;
        }

        .reader-nav-link small {
            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.12em;

            color: #97867c;

            text-transform: uppercase;
        }

        .reader-nav-link span {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
            line-height: 1.4;
        }

        .reader-nav-link:hover {
            color: #29221e;
        }


        /* =====================================================
           COMMENTS
        ===================================================== */

        .comments-section {
            width: 100%;
            max-width: 700px;

            margin:
                60px
                auto
                0;

            padding-top: 35px;

            border-top:
                1px solid
                rgba(73,59,51,0.17);
        }

        .comments-heading {
            display: flex;
            align-items: baseline;
            gap: 8px;

            margin:
                0
                0
                35px;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.10em;

            color: #78665b;

            text-transform: uppercase;
        }

        .comment-count {
            color: #a6968b;
        }

        .comment-form {
            margin-bottom: 55px;
        }

        .comment-input,
        .comment-textarea {
            display: block;

            width: 100%;

            padding: 14px 0;

            border: none;

            border-bottom:
                1px solid
                rgba(73,59,51,0.22);

            outline: none;

            background: transparent;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 16px;

            color: #403731;
        }

        .comment-input {
            margin-bottom: 25px;
        }

        .comment-textarea {
            min-height: 120px;

            resize: vertical;

            line-height: 1.7;
        }

        .comment-input::placeholder,
        .comment-textarea::placeholder {
            color: #a6968b;
        }

        .comment-input:focus,
        .comment-textarea:focus {
            border-bottom-color: #6f5b50;
        }

        .comment-submit {
            margin-top: 25px;

            padding: 8px 0;

            border: none;

            background: none;

            cursor: pointer;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.12em;

            color: #78665b;

            text-transform: uppercase;
        }

        .comment-submit:hover {
            color: #29221e;
        }

        .comment-status {
            margin-top: 15px;

            font-size: 12px;

            color: #8c7d74;
        }

        .comment-list {
            display: flex;
            flex-direction: column;

            gap: 38px;
        }

        .comment {
            padding-top: 28px;

            border-top:
                1px solid
                rgba(73,59,51,0.12);
        }

        .comment-meta {
            display: flex;
            align-items: baseline;

            gap: 14px;

            margin-bottom: 10px;
        }

        .comment-name {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

            color: #29221e;
        }

        .comment-date {
            margin: 0;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #a6968b;

            text-transform: uppercase;
        }

        .comment-body {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            line-height: 1.75;

            color: #756961;

            white-space: pre-wrap;

            overflow-wrap: break-word;
        }


        /* =====================================================
           MORE FROM JOURNAL
        ===================================================== */

        .more-journal {
            width: 100%;
            max-width: 920px;

            margin:
                100px
                auto
                0;

            padding-top: 45px;

            border-top:
                1px solid
                rgba(73,59,51,0.17);
        }

        .more-journal-title {
            margin: 0 0 30px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 29px;

            font-weight: 400;

            color: #29221e;
        }

        .more-journal-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 35px;
        }

        .suggested-entry {
            display: block;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(73,59,51,0.14);
        }

        .suggested-date {
            margin: 0 0 9px;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.08em;

            color: #9b897d;

            text-transform: uppercase;
        }

        .suggested-title {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 19px;

            line-height: 1.35;

            font-weight: 400;

            color: #403731;
        }

        .suggested-read {
            display: block;

            margin-top: 10px;

            font-size: 12px;

            color: #8c7d74;
        }

        .suggested-entry:hover .suggested-title {
            color: #29221e;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .site-footer {
            width: 100%;

            margin-top: 100px;

            padding:
                30px
                5vw;

            border-top:
                1px solid
                rgba(73,59,51,0.12);
        }

        .site-footer p {
            margin: 0;

            font-size: 11px;

            letter-spacing: 0.10em;

            color: #978980;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .journal-header {
                padding:
                    22px
                    6vw;
            }

            .journal-intro,
            .journal-list,
            .reader-shell {
                width: 88%;
            }

            .journal-intro {
                padding:
                    72px
                    0
                    62px;
            }

            .journal-title {
                font-size: 58px;
            }

            .journal-description {
                font-size: 16px;
            }

            .journal-list {
                margin-bottom: 75px;
            }

            .journal-preview {
                display: block;

                padding:
                    31px
                    0
                    36px;
            }

            .journal-preview:hover {
                padding-left: 0;
                padding-right: 0;
            }

            .preview-meta {
                padding: 0;
                margin-bottom: 14px;
            }

            .preview-number {
                display: none;
            }

            .preview-title {
                font-size: 30px;
            }

            .preview-excerpt {
                font-size: 15px;
            }

            .reader-shell {
                padding:
                    58px
                    0
                    80px;
            }

            .reader-top {
                margin-bottom: 65px;
            }

            .reader-title {
                font-size: 45px;
            }

            .reader-header {
                margin-bottom: 40px;
            }

            .reader-content {
                font-size: 17px;
                line-height: 1.85;
            }

            .reading-preferences {
                gap: 7px;
            }

            .reading-preferences-label {
                width: 100%;
            }

            .more-journal-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .comments-section {
                margin-top: 50px;
            }

            .comment-meta {
                flex-direction: column;
                gap: 4px;
            }

        }

    </style>

</head>


<body>


<div
    class="reading-progress"
    id="readingProgress"
></div>


<div class="journal-page">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="journal-header">

        <a
            href="hed.html"
            class="brand"
        >

            <span class="brand-name">
                May Blooms
            </span>

            <span class="brand-subtitle">
                Her Existential Drama
            </span>

        </a>


        <a
            href="hed.html"
            class="back-link"
        >
            ← HED
        </a>

    </header>


    <!-- =====================================================
         JOURNAL INDEX
    ===================================================== -->

    <section
        id="journalIndex"
        class="journal-index"
    >

        <div class="journal-intro">

            <p class="journal-kicker">
                MAY BLOOMS
            </p>

            <h1 class="journal-title">
                Journal
            </h1>

            <p class="journal-description">
                Journals, because apparently I had things to say.
            </p>

            <div class="journal-mark"></div>

        </div>


        <div
            id="journalList"
            class="journal-list"
        >

            <div class="journal-status">
                Loading journal...
            </div>

        </div>

    </section>


    <!-- =====================================================
         READER
    ===================================================== -->

    <section
        id="reader"
        class="reader"
    >

        <article class="reader-shell">


            <div class="reader-top">

                <a
                    href="#"
                    id="readerBack"
                    class="reader-back"
                >
                    ← Journal
                </a>


                <span class="reader-label">
                    May Blooms
                </span>

            </div>


            <header class="reader-header">

                <p
                    id="readerDate"
                    class="reader-date"
                ></p>


                <h1
                    id="readerTitle"
                    class="reader-title"
                ></h1>


                <div
                    class="reader-meta"
                    id="readerMeta"
                ></div>


                <div class="reader-rule"></div>

            </header>


            <img
                id="readerImage"
                class="reader-image"
                style="display:none;"
                alt=""
            >


            <!-- =================================================
                 READING PREFERENCES
            ================================================= -->

            <div class="reading-preferences">

                <span class="reading-preferences-label">
                    Reading Preferences
                </span>

                <button
                    type="button"
                    class="reading-button"
                    id="fontDecrease"
                >
                    A−
                </button>

                <button
                    type="button"
                    class="reading-button"
                    id="fontIncrease"
                >
                    A+
                </button>

                <button
                    type="button"
                    class="reading-button"
                    id="fontSerif"
                >
                    Serif
                </button>

                <button
                    type="button"
                    class="reading-button"
                    id="fontSans"
                >
                    Sans
                </button>

            </div>


            <!-- =================================================
                 ARTICLE
            ================================================= -->

            <div
                id="readerContent"
                class="reader-content"
            ></div>


            <!-- =================================================
                 END OF ENTRY
            ================================================= -->

            <div class="end-of-entry">

                <div class="end-of-entry-line"></div>

                <p class="end-of-entry-text">
                    End of entry
                </p>

            </div>


            <!-- =================================================
                 NEWER ENTRY
                 ONLY BEFORE COMMENTS
            ================================================= -->

            <nav
                id="readerNavigation"
                class="reader-navigation"
            ></nav>


            <!-- =================================================
                 COMMENTS
            ================================================= -->

            <section
                class="comments-section"
                id="commentsSection"
            >

                <h2 class="comments-heading">

                    Comments

                    <span
                        class="comment-count"
                        id="commentCount"
                    >
                        0 comments
                    </span>

                </h2>


                <form
                    class="comment-form"
                    id="commentForm"
                >

                    <input
                        type="text"
                        id="commentName"
                        class="comment-input"
                        placeholder="Your name"
                        maxlength="80"
                        required
                    >


                    <textarea
                        id="commentContent"
                        class="comment-textarea"
                        placeholder="Write a comment..."
                        maxlength="2000"
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="comment-submit"
                    >
                        Post comment →
                    </button>


                    <div
                        id="commentStatus"
                        class="comment-status"
                    ></div>

                </form>


                <div
                    id="commentList"
                    class="comment-list"
                ></div>

            </section>


            <!-- =================================================
                 MORE FROM JOURNAL
            ================================================= -->

            <section
                class="more-journal"
                id="moreJournal"
            >

                <h2 class="more-journal-title">
                    More from the Journal
                </h2>


                <div
                    class="more-journal-grid"
                    id="moreJournalGrid"
                ></div>

            </section>


        </article>

    </section>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer class="site-footer">

        <p>
            © 2026 May Blooms · HED
        </p>

    </footer>


</div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>
<script src="reader-auth.js"></script>


<script>

    /* =========================================================
       ELEMENTS
    ========================================================= */

    const journalIndex =
        document.getElementById(
            "journalIndex"
        );

    const journalList =
        document.getElementById(
            "journalList"
        );

    const reader =
        document.getElementById(
            "reader"
        );

    const readerBack =
        document.getElementById(
            "readerBack"
        );

    const readerDate =
        document.getElementById(
            "readerDate"
        );

    const readerTitle =
        document.getElementById(
            "readerTitle"
        );

    const readerMeta =
        document.getElementById(
            "readerMeta"
        );

    const readerImage =
        document.getElementById(
            "readerImage"
        );

    const readerContent =
        document.getElementById(
            "readerContent"
        );

    const readerNavigation =
        document.getElementById(
            "readerNavigation"
        );

    const readingProgress =
        document.getElementById(
            "readingProgress"
        );

    const commentForm =
        document.getElementById(
            "commentForm"
        );

    const commentName =
        document.getElementById(
            "commentName"
        );

    const commentContent =
        document.getElementById(
            "commentContent"
        );

    const commentStatus =
        document.getElementById(
            "commentStatus"
        );

    const commentList =
        document.getElementById(
            "commentList"
        );

    const commentCount =
        document.getElementById(
            "commentCount"
        );

    const moreJournalGrid =
        document.getElementById(
            "moreJournalGrid"
        );


    /* =========================================================
       DATA
    ========================================================= */

    let journalEntries = [];

    let currentEntryId = null;


    /* =========================================================
       DATE
    ========================================================= */

    function formatDate(
        dateString
    ) {

        if (!dateString) {
            return "";
        }

        const date =
            new Date(dateString);

        return date.toLocaleDateString(
            "en-US",
            {
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );
    }


    /* =========================================================
       READING TIME
    ========================================================= */

    function calculateReadingTime(
        html
    ) {

        if (!html) {
            return 1;
        }

        const temporary =
            document.createElement("div");

        temporary.innerHTML =
            html;

        const text =
            (
                temporary.textContent ||
                temporary.innerText ||
                ""
            )
            .replace(/\s+/g, " ")
            .trim();

        const words =
            text
                ? text.split(" ").length
                : 0;

        return Math.max(
            1,
            Math.ceil(
                words / 220
            )
        );
    }


    /* =========================================================
       EXCERPT
    ========================================================= */

    function createExcerpt(
        html
    ) {

        if (!html) {
            return "";
        }

        const temporary =
            document.createElement("div");

        temporary.innerHTML =
            html;

        const text =
            temporary.textContent ||
            temporary.innerText ||
            "";

        const cleaned =
            text
                .replace(/\s+/g, " ")
                .trim();

        if (
            cleaned.length <= 220
        ) {
            return cleaned;
        }

        return (
            cleaned
                .substring(0, 220)
                .trim() +
            "…"
        );
    }


    /* =========================================================
       RENDER INDEX
    ========================================================= */

    function renderJournalIndex() {

        journalList.innerHTML =
            "";

        if (
            !journalEntries ||
            journalEntries.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "journal-status";

            empty.textContent =
                "Nothing here yet.";

            journalList.appendChild(
                empty
            );

            return;
        }


        journalEntries.forEach(
            function(
                entry,
                index
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "journal-preview";

                link.href =
                    "journal.html?id=" +
                    encodeURIComponent(
                        entry.id
                    );


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "preview-meta";


                const date =
                    document.createElement(
                        "p"
                    );

                date.className =
                    "preview-date";

                date.textContent =
                    formatDate(
                        entry.published_at
                    );

                meta.appendChild(
                    date
                );


                const number =
                    document.createElement(
                        "span"
                    );

                number.className =
                    "preview-number";

                number.textContent =
                    String(
                        index + 1
                    ).padStart(
                        2,
                        "0"
                    );

                meta.appendChild(
                    number
                );


                const body =
                    document.createElement(
                        "div"
                    );

                body.className =
                    "preview-body";


                const title =
                    document.createElement(
                        "h2"
                    );

                title.className =
                    "preview-title";

                title.textContent =
                    entry.title ||
                    "Untitled";


                const excerpt =
                    document.createElement(
                        "p"
                    );

                excerpt.className =
                    "preview-excerpt";

                excerpt.textContent =
                    createExcerpt(
                        entry.content
                    );


                const read =
                    document.createElement(
                        "span"
                    );

                read.className =
                    "preview-read";

                read.textContent =
                    "Read entry →";


                body.appendChild(
                    title
                );

                body.appendChild(
                    excerpt
                );

                body.appendChild(
                    read
                );


                link.appendChild(
                    meta
                );

                link.appendChild(
                    body
                );


                journalList.appendChild(
                    link
                );

            }
        );
    }


    /* =========================================================
       NEWER ENTRY ONLY
    ========================================================= */

    function renderReaderNavigation(
        index
    ) {

        readerNavigation.innerHTML =
            "";


        const newer =
            journalEntries[
                index - 1
            ];


        if (!newer) {
            return;
        }


        const link =
            document.createElement(
                "a"
            );

        link.className =
            "reader-nav-link";

        link.href =
            "journal.html?id=" +
            encodeURIComponent(
                newer.id
            );


        const label =
            document.createElement(
                "small"
            );

        label.textContent =
            "Newer entry";


        const title =
            document.createElement(
                "span"
            );

        title.textContent =
            newer.title ||
            "Untitled";


        link.appendChild(
            label
        );

        link.appendChild(
            title
        );


        readerNavigation.appendChild(
            link
        );
    }


    /* =========================================================
       MORE FROM JOURNAL
    ========================================================= */

    function renderMoreJournal(
        currentIndex
    ) {

        moreJournalGrid.innerHTML =
            "";


        const suggestions =
            journalEntries
                .filter(
                    function(
                        entry
                    ) {
                        return String(
                            entry.id
                        ) !==
                        String(
                            journalEntries[
                                currentIndex
                            ]?.id
                        );
                    }
                )
                .slice(
                    0,
                    3
                );


        suggestions.forEach(
            function(
                entry
            ) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "suggested-entry";

                link.href =
                    "journal.html?id=" +
                    encodeURIComponent(
                        entry.id
                    );


                const date =
                    document.createElement(
                        "p"
                    );

                date.className =
                    "suggested-date";

                date.textContent =
                    formatDate(
                        entry.published_at
                    );


                const title =
                    document.createElement(
                        "h3"
                    );

                title.className =
                    "suggested-title";

                title.textContent =
                    entry.title ||
                    "Untitled";


                const read =
                    document.createElement(
                        "span"
                    );

                read.className =
                    "suggested-read";

                read.textContent =
                    calculateReadingTime(
                        entry.content
                    ) +
                    " minute read";


                link.appendChild(
                    date
                );

                link.appendChild(
                    title
                );

                link.appendChild(
                    read
                );


                moreJournalGrid.appendChild(
                    link
                );

            }
        );
    }


    /* =========================================================
       COMMENTS
    ========================================================= */

    async function loadComments(
        entryId
    ) {

        commentList.innerHTML =
            "";

        commentCount.textContent =
            "0 comments";


        const {
            data,
            error
        } =
            await supabaseClient
                .from("comments")
                .select(
                    "id,name,content,created_at"
                )
                .eq(
                    "target_type",
                    "journal"
                )
                .eq(
                    "target_id",
                    entryId
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Could not load comments:",
                error
            );

            return;
        }


        const comments =
            data || [];


        commentCount.textContent =
            comments.length +
            (
                comments.length === 1
                    ? " comment"
                    : " comments"
            );


        comments.forEach(
            function(
                comment
            ) {

                const article =
                    document.createElement(
                        "article"
                    );

                article.className =
                    "comment";


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "comment-meta";


                const name =
                    document.createElement(
                        "p"
                    );

                name.className =
                    "comment-name";

                name.textContent =
                    comment.name ||
                    "Anonymous";


                const date =
                    document.createElement(
                        "p"
                    );

                date.className =
                    "comment-date";

                date.textContent =
                    formatDate(
                        comment.created_at
                    );


                meta.appendChild(
                    name
                );

                meta.appendChild(
                    date
                );


                const body =
                    document.createElement(
                        "p"
                    );

                body.className =
                    "comment-body";

                body.textContent =
                    comment.content ||
                    "";


                article.appendChild(
                    meta
                );

                article.appendChild(
                    body
                );


                commentList.appendChild(
                    article
                );

            }
        );
    }


    /* =========================================================
       OPEN READER
    ========================================================= */

    function openReader(
        entry
    ) {

        const index =
            journalEntries.findIndex(
                function(
                    item
                ) {

                    return String(
                        item.id
                    ) ===
                    String(
                        entry.id
                    );

                }
            );


        currentEntryId =
            entry.id;


        journalIndex.style.display =
            "none";

        reader.classList.add(
            "active"
        );


        readerDate.textContent =
            formatDate(
                entry.published_at
            );


        readerTitle.textContent =
            entry.title ||
            "Untitled";


        const minutes =
            calculateReadingTime(
                entry.content
            );


        readerMeta.textContent =
            minutes +
            (
                minutes === 1
                    ? " minute read"
                    : " minutes read"
            );


        if (entry.image_url) {

            readerImage.src =
                entry.image_url;

            readerImage.alt =
                entry.title ||
                "Journal image";

            readerImage.style.display =
                "block";

        } else {

            readerImage.removeAttribute(
                "src"
            );

            readerImage.style.display =
                "none";
        }


        readerContent.innerHTML =
            entry.content ||
            "";


        renderReaderNavigation(
            index
        );


        renderMoreJournal(
            index
        );


        loadComments(
            entry.id
        );


        window.scrollTo(
            0,
            0
        );

    }


    /* =========================================================
       URL
    ========================================================= */

    function getRequestedId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get(
            "id"
        );
    }


    /* =========================================================
       LOAD JOURNAL
    ========================================================= */

    async function loadJournal() {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("journal_entries")
                .select("*")
                .order(
                    "published_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "Error loading journal:",
                error
            );

            journalList.innerHTML =
                "";

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "journal-status";

            message.textContent =
                "Unable to load the journal.";

            journalList.appendChild(
                message
            );

            return;
        }


        journalEntries =
            data || [];


        const requestedId =
            getRequestedId();


        if (requestedId) {

            const entry =
                journalEntries.find(
                    function(
                        item
                    ) {

                        return String(
                            item.id
                        ) ===
                        String(
                            requestedId
                        );

                    }
                );


            if (entry) {

                openReader(
                    entry
                );

                return;
            }
        }


        renderJournalIndex();
    }


    /* =========================================================
       BACK TO JOURNAL
    ========================================================= */

    readerBack.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            window.location.href =
                "journal.html";

        }
    );


    /* =========================================================
       COMMENTS SUBMIT
    ========================================================= */

    commentForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!currentEntryId) {
                return;
            }


            const name =
                commentName.value.trim();

            const content =
                commentContent.value.trim();


            if (!name || !content) {
                return;
            }


            commentStatus.textContent =
                "Posting...";


            const {
                error
            } =
                await supabaseClient
                    .from("comments")
                    .insert({
                        target_type:
                            "journal",

                        target_id:
                            currentEntryId,

                        name,

                        content
                    });


            if (error) {

                console.error(
                    "Could not post comment:",
                    error
                );

                commentStatus.textContent =
                    "Could not post comment.";

                return;
            }


            commentName.value =
                "";

            commentContent.value =
                "";

            commentStatus.textContent =
                "Comment posted.";


            await loadComments(
                currentEntryId
            );

        }
    );


    /* =========================================================
       READING PREFERENCES
    ========================================================= */

    const fontDecrease =
        document.getElementById(
            "fontDecrease"
        );

    const fontIncrease =
        document.getElementById(
            "fontIncrease"
        );

    const fontSerif =
        document.getElementById(
            "fontSerif"
        );

    const fontSans =
        document.getElementById(
            "fontSans"
        );


    let savedFontSize =
        parseInt(
            localStorage.getItem(
                "maybloomsJournalFontSize"
            ),
            10
        );


    if (
        Number.isNaN(
            savedFontSize
        )
    ) {

        savedFontSize = 19;

    }


    savedFontSize =
        Math.max(
            16,
            Math.min(
                24,
                savedFontSize
            )
        );


    let savedFont =
        localStorage.getItem(
            "maybloomsJournalFont"
        ) ||
        "serif";


    function updateReadingStyle() {

        readerContent.style.fontSize =
            savedFontSize +
            "px";


        if (
            savedFont ===
            "sans"
        ) {

            readerContent.classList.add(
                "sans"
            );

            fontSans.classList.add(
                "active"
            );

            fontSerif.classList.remove(
                "active"
            );

        } else {

            readerContent.classList.remove(
                "sans"
            );

            fontSerif.classList.add(
                "active"
            );

            fontSans.classList.remove(
                "active"
            );
        }


        localStorage.setItem(
            "maybloomsJournalFontSize",
            savedFontSize
        );

        localStorage.setItem(
            "maybloomsJournalFont",
            savedFont
        );
    }


    fontDecrease.addEventListener(
        "click",
        function() {

            savedFontSize =
                Math.max(
                    16,
                    savedFontSize - 1
                );

            updateReadingStyle();

        }
    );


    fontIncrease.addEventListener(
        "click",
        function() {

            savedFontSize =
                Math.min(
                    24,
                    savedFontSize + 1
                );

            updateReadingStyle();

        }
    );


    fontSerif.addEventListener(
        "click",
        function() {

            savedFont =
                "serif";

            updateReadingStyle();

        }
    );


    fontSans.addEventListener(
        "click",
        function() {

            savedFont =
                "sans";

            updateReadingStyle();

        }
    );


    /* =========================================================
       READING PROGRESS
    ========================================================= */

    window.addEventListener(
        "scroll",
        function() {

            if (
                !reader.classList.contains(
                    "active"
                )
            ) {
                readingProgress.style.width =
                    "0%";

                return;
            }


            const scrollTop =
                window.scrollY ||
                document.documentElement.scrollTop;


            const documentHeight =
                document.documentElement.scrollHeight -
                window.innerHeight;


            if (
                documentHeight <= 0
            ) {

                readingProgress.style.width =
                    "100%";

                return;
            }


            const progress =
                Math.min(
                    100,
                    Math.max(
                        0,
                        (
                            scrollTop /
                            documentHeight
                        ) *
                        100
                    )
                );


            readingProgress.style.width =
                progress +
                "%";

        }
    );


    /* =========================================================
       START
    ========================================================= */

    updateReadingStyle();

    loadJournal();

</script>


</body>

</html>
