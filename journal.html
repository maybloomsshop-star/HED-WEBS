<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal · HED</title>

<style>
*{box-sizing:border-box}

:root{
    --brown:#4a352b;
    --brown-dark:#382920;
    --cream:#f5efe6;
    --paper:#fbf8f3;
    --green:#68745d;
    --pink:#c58f91;
    --text:#342b26;
    --muted:#85786e;
    --line:#d8cec2;
    --white:#fffdf9;
}

html{scroll-behavior:smooth}

body{
    margin:0;
    background:var(--cream);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
}

a{
    color:inherit;
    text-decoration:none;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.reading-progress{
    position:fixed;
    top:0;
    left:0;
    width:0;
    height:3px;
    background:var(--green);
    z-index:9999;
}

.journal-page{
    min-height:100vh;
    background:var(--cream);
}

/* HEADER */

.journal-header{
    width:min(1180px,90vw);
    margin:auto;
    padding:27px 0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    border-bottom:1px solid var(--line);
}

.hed-link{
    justify-self:start;
    color:var(--brown);
    font-size:14px;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
    transition:opacity .2s ease;
}

.hed-link:hover{
    opacity:.6;
}

.header-journal-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    color:var(--text);
}

/* INDEX */

.journal-index{
    width:min(1180px,90vw);
    margin:auto;
}

.journal-hero{
    min-height:480px;
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(300px,.65fr);
    gap:80px;
    align-items:end;
    padding:105px 0 82px;
    border-bottom:1px solid var(--line);
}

.journal-kicker{
    margin:0 0 24px;
    color:var(--green);
    font-size:10px;
    font-weight:800;
    letter-spacing:.19em;
    text-transform:uppercase;
}

.journal-title{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(76px,11vw,142px);
    line-height:.82;
    font-weight:400;
    letter-spacing:-.065em;
    color:var(--brown-dark);
}

.journal-description{
    max-width:560px;
    margin:38px 0 0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    line-height:1.65;
    color:var(--muted);
}

/* SEARCH */

.journal-search-wrap{
    align-self:end;
}

.search-label{
    display:block;
    margin-bottom:11px;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:.15em;
    text-transform:uppercase;
}

.journal-search{
    display:flex;
    align-items:center;
    min-height:58px;
    border:1px solid #cfc3b7;
    background:rgba(255,253,249,.72);
    transition:.2s ease;
}

.journal-search:focus-within{
    border-color:var(--green);
    box-shadow:0 8px 25px rgba(56,41,32,.07);
}

.search-icon{
    padding-left:17px;
    color:var(--muted);
    font-size:23px;
}

.journal-search input{
    width:100%;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    padding:16px 17px;
    color:var(--text);
    font-size:14px;
}

/*
   Keep the search input clean.
   Browsers can add their own X to type="search",
   so this version uses type="text" instead.
*/

.journal-search input::placeholder{
    color:#9b8d82;
}

/* TOPICS / SECTIONS */

.topic-section,
.featured-section,
.latest-section{
    padding-top:74px;
}

.section-heading-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    margin-bottom:23px;
}

.section-heading-row h2{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:23px;
    font-weight:400;
    color:var(--brown-dark);
}

.result-count{
    color:var(--muted);
    font-size:11px;
}

.topic-list{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.topic-button{
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    padding:9px 15px;
    border-radius:999px;
    font-size:12px;
    transition:.2s ease;
}

.topic-button:hover,
.topic-button.active{
    background:var(--brown);
    border-color:var(--brown);
    color:var(--white);
}

/* FEATURED */

.featured-entry{
    display:grid;
    grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);
    min-height:340px;
    background:var(--brown-dark);
    color:var(--white);
    overflow:hidden;
}

.featured-copy{
    padding:45px 48px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.featured-label{
    color:#d9c9bd;
    font-size:10px;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
}

.featured-title{
    max-width:720px;
    margin:30px 0 17px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(34px,4vw,57px);
    line-height:1.02;
    font-weight:400;
    letter-spacing:-.035em;
}

.featured-excerpt{
    max-width:650px;
    margin:0;
    color:#dfd4cc;
    font-size:14px;
    line-height:1.75;
}

.featured-meta{
    display:flex;
    flex-wrap:wrap;
    gap:12px 22px;
    margin-top:34px;
    color:#bfaea2;
    font-size:11px;
}

.featured-image{
    min-height:340px;
    background:#5b4940;
    overflow:hidden;
}

.featured-image img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    opacity:.94;
    transition:transform .5s ease;
}

.featured-entry:hover .featured-image img{
    transform:scale(1.035);
}

/* LATEST */

.journal-list{
    margin-bottom:110px;
    border-top:1px solid var(--line);
}

.journal-preview{
    display:grid;
    grid-template-columns:150px minmax(0,1fr) 110px;
    gap:42px;
    align-items:start;
    width:100%;
    padding:33px 0 38px;
    border-bottom:1px solid var(--line);
    transition:.2s ease;
}

.journal-preview:hover{
    padding-left:12px;
    padding-right:12px;
    background:rgba(255,253,249,.35);
}

.preview-meta{
    padding-top:5px;
}

.preview-date{
    margin:0;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
}

.preview-number{
    display:block;
    margin-top:17px;
    color:#b4a59b;
    font-size:10px;
    letter-spacing:.13em;
}

.preview-title{
    margin:0 0 11px;
    color:var(--brown-dark);
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(27px,3vw,39px);
    line-height:1.05;
    font-weight:400;
    letter-spacing:-.03em;
}

.preview-excerpt{
    max-width:700px;
    margin:0;
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

.preview-read{
    padding-top:5px;
    text-align:right;
    color:var(--green);
    font-size:10px;
    font-weight:800;
    letter-spacing:.1em;
    text-transform:uppercase;
}

.preview-topic{
    display:inline-block;
    margin-top:15px;
    color:var(--pink);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
}

/* STATUS */

.journal-status{
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
}

.empty-search{
    padding:70px 20px;
    border-bottom:1px solid var(--line);
    text-align:center;
}

.empty-search h3{
    margin:0 0 10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:27px;
    font-weight:400;
}

.empty-search p{
    margin:0;
    color:var(--muted);
    font-size:13px;
}

/* READER */

.reader{
    display:none;
}

.reader.active{
    display:block;
}

.index.hidden{
    display:none;
}

.reader-shell{
    width:min(900px,90vw);
    margin:auto;
    padding:75px 0 100px;
}

.reader-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:70px;
}

.reader-back{
    border:0;
    padding:0;
    background:transparent;
    color:var(--muted);
    font-size:12px;
}

.reader-back:hover{
    color:var(--brown);
}

.reader-preferences{
    display:flex;
    align-items:center;
    gap:5px;
}

.reader-preferences button{
    min-width:34px;
    height:32px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-size:11px;
}

.reader-preferences button.active,
.reader-preferences button:hover{
    border-color:var(--brown);
    color:var(--brown);
}

.reader-header{
    max-width:800px;
    margin:0 auto 65px;
}

.reader-kicker{
    margin:0 0 20px;
    color:var(--green);
    font-size:10px;
    font-weight:800;
    letter-spacing:.15em;
    text-transform:uppercase;
}

.reader-title{
    margin:0;
    color:var(--brown-dark);
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(45px,7vw,76px);
    line-height:1;
    font-weight:400;
    letter-spacing:-.045em;
}

.reader-meta{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-top:25px;
    color:var(--muted);
    font-size:11px;
}

.reader-image{
    width:100%;
    max-height:560px;
    margin:0 auto 65px;
    object-fit:cover;
    display:none;
}

.reader-content{
    max-width:700px;
    margin:auto;
    color:#403731;
    font-family:Georgia,"Times New Roman",serif;
    font-size:19px;
    line-height:1.85;
    overflow-wrap:break-word;
}

.reader-content.sans{
    font-family:Arial,Helvetica,sans-serif;
}

.reader-content p{
    margin:0 0 1.55em;
}

.reader-content h1,
.reader-content h2,
.reader-content h3,
.reader-content h4{
    color:var(--brown-dark);
    line-height:1.25;
    font-weight:400;
}

.reader-content h1{
    font-size:36px;
    margin:1.8em 0 .75em;
}

.reader-content h2{
    font-size:31px;
    margin:1.8em 0 .75em;
}

.reader-content h3{
    font-size:26px;
    margin:1.7em 0 .7em;
}

.reader-content h4{
    font-size:21px;
    margin:1.7em 0 .7em;
}

.reader-content strong,
.reader-content b{
    color:var(--brown-dark);
}

.reader-content blockquote{
    margin:2.2em 0;
    padding:5px 0 5px 27px;
    border-left:1px solid #8f7b6e;
    color:#71625a;
}

.reader-content ul,
.reader-content ol{
    margin:1.5em 0;
    padding-left:1.5em;
}

.reader-content li{
    margin-bottom:.65em;
}

.reader-content img{
    max-width:100%;
    height:auto;
}

/* READER NAVIGATION */

.reader-navigation{
    max-width:700px;
    margin:65px auto 0;
    padding-top:30px;
    border-top:1px solid var(--line);
}

.reader-navigation a{
    display:block;
    color:var(--brown);
}

.reader-navigation small{
    display:block;
    margin-bottom:8px;
    color:var(--muted);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
}

.reader-navigation strong{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    font-weight:400;
}

/* MORE */

.more-journal{
    max-width:900px;
    margin:85px auto 0;
    padding-top:40px;
    border-top:1px solid var(--line);
}

.more-journal h2{
    margin:0 0 25px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    font-weight:400;
}

.more-journal-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:0 45px;
}

.more-journal-item{
    padding:20px 0;
    border-bottom:1px solid var(--line);
}

.more-journal-item small{
    color:var(--muted);
    font-size:10px;
}

.more-journal-item h3{
    margin:8px 0 0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
    font-weight:400;
}

/* COMMENTS */

.comments-section{
    max-width:700px;
    margin:70px auto 0;
    padding-top:35px;
    border-top:1px solid var(--line);
}

.comments-heading{
    margin:0 0 30px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px;
    font-weight:400;
}

.comment-count{
    color:var(--muted);
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
}

.comment-form{
    display:grid;
    gap:10px;
    margin-bottom:35px;
}

.comment-form input,
.comment-form textarea{
    width:100%;
    border:1px solid var(--line);
    outline:0;
    background:rgba(255,253,249,.7);
    color:var(--text);
    padding:13px 14px;
}

.comment-form textarea{
    min-height:120px;
    resize:vertical;
}

.comment-form input:focus,
.comment-form textarea:focus{
    border-color:var(--green);
}

.comment-form button{
    justify-self:start;
    border:0;
    background:var(--brown);
    color:var(--white);
    padding:12px 18px;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.comment-status{
    color:var(--muted);
    font-size:12px;
}

.comment-list{
    display:grid;
}

.comment{
    padding:20px 0;
    border-top:1px solid var(--line);
}

.comment-meta{
    display:flex;
    gap:10px;
    align-items:baseline;
}

.comment-name{
    font-size:13px;
    font-weight:700;
}

.comment-date{
    color:var(--muted);
    font-size:10px;
}

.comment-content{
    margin:10px 0 0;
    color:#665a52;
    font-size:13px;
    line-height:1.7;
}

/* RESPONSIVE */

@media(max-width:850px){

    .journal-hero{
        grid-template-columns:1fr;
        gap:55px;
        min-height:auto;
        padding:75px 0 60px;
    }

    .journal-search-wrap{
        max-width:600px;
    }

    .featured-entry{
        grid-template-columns:1fr;
    }

    .featured-image{
        min-height:280px;
        order:-1;
    }

    .journal-preview{
        grid-template-columns:110px minmax(0,1fr);
        gap:25px;
    }

    .preview-read{
        display:none;
    }
}

@media(max-width:600px){

    .journal-header{
        width:calc(100% - 36px);
        padding:22px 0;
    }

    .journal-index{
        width:calc(100% - 36px);
    }

    .journal-title{
        font-size:clamp(64px,20vw,100px);
    }

    .journal-description{
        font-size:17px;
    }

    .topic-section,
    .featured-section,
    .latest-section{
        padding-top:55px;
    }

    .featured-copy{
        padding:32px 26px;
    }

    .featured-title{
        font-size:37px;
    }

    .featured-image{
        min-height:230px;
    }

    .journal-preview{
        grid-template-columns:1fr;
        gap:10px;
        padding:27px 0 30px;
    }

    .preview-meta{
        display:flex;
        gap:12px;
        align-items:center;
    }

    .preview-number{
        margin:0;
    }

    .preview-title{
        font-size:30px;
    }

    .reader-shell{
        width:calc(100% - 36px);
        padding-top:45px;
    }

    .reader-top{
        margin-bottom:50px;
    }

    .reader-title{
        font-size:46px;
    }

    .reader-content{
        font-size:18px;
    }

    .more-journal-grid{
        grid-template-columns:1fr;
    }

    .comments-section{
        margin-top:55px;
    }
}
</style>
</head>

<body>

<div class="journal-page">

<div class="reading-progress" id="readingProgress"></div>

<header class="journal-header">

    <a href="hed.html" class="hed-link">
        HED
    </a>

    <span class="header-journal-title">
        Journal
    </span>

    <span aria-hidden="true"></span>

</header>


<main class="journal-index index" id="journalIndex">

<section class="journal-hero">

    <div>

        <p class="journal-kicker">
            HED Journal
        </p>

        <h1 class="journal-title">
            Journal
        </h1>

        <p class="journal-description">
            A collection of long-form thoughts, stories,
            reflections, ideas, and pieces worth spending
            a little time with.
        </p>

    </div>


    <div class="journal-search-wrap">

        <label class="search-label" for="journalSearch">
            Search the journal
        </label>

        <div class="journal-search">

            <span class="search-icon" aria-hidden="true">
                ⌕
            </span>

            <input
                id="journalSearch"
                type="text"
                placeholder="Search titles, writing, topics..."
                autocomplete="off"
            >

        </div>

    </div>

</section>


<section
    class="topic-section"
    id="topicSection"
    hidden
>

    <div class="section-heading-row">

        <h2>
            Explore Topics
        </h2>

    </div>

    <div
        class="topic-list"
        id="topicList"
    ></div>

</section>


<section
    class="featured-section"
    id="featuredSection"
>

    <div class="section-heading-row">

        <h2>
            Featured
        </h2>

    </div>

    <div id="featuredEntry"></div>

</section>


<section class="latest-section">

    <div class="section-heading-row">

        <h2>
            Latest
        </h2>

        <span
            class="result-count"
            id="resultCount"
        ></span>

    </div>

    <div
        class="journal-list"
        id="journalList"
    ></div>

</section>

</main>


<main
    class="reader"
    id="reader"
>

<div class="reader-shell">

<div class="reader-top">

    <button
        class="reader-back"
        id="readerBack"
        type="button"
    >
        ← Journal
    </button>

    <div class="reader-preferences">

        <button
            id="fontDecrease"
            type="button"
        >
            A−
        </button>

        <button
            id="fontIncrease"
            type="button"
        >
            A+
        </button>

        <button
            id="fontSerif"
            type="button"
        >
            Serif
        </button>

        <button
            id="fontSans"
            type="button"
        >
            Sans
        </button>

    </div>

</div>


<article>

<header class="reader-header">

    <p
        class="reader-kicker"
        id="readerKicker"
    >
        Journal
    </p>

    <h1
        class="reader-title"
        id="readerTitle"
    ></h1>

    <div
        class="reader-meta"
        id="readerMeta"
    ></div>

</header>


<img
    class="reader-image"
    id="readerImage"
    alt=""
>


<div
    class="reader-content"
    id="readerContent"
></div>


<nav
    class="reader-navigation"
    id="readerNavigation"
></nav>


<section
    class="comments-section"
    id="commentsSection"
>

    <h2 class="comments-heading">

        Comments

        <span
            class="comment-count"
            id="commentCount"
        >
            0 comments
        </span>

    </h2>


    <form
        class="comment-form"
        id="commentForm"
    >

        <input
            id="commentName"
            type="text"
            placeholder="Your name"
            maxlength="80"
            required
        >

        <textarea
            id="commentContent"
            placeholder="Write a comment..."
            maxlength="2000"
            required
        ></textarea>

        <button type="submit">
            Post comment →
        </button>

        <div
            class="comment-status"
            id="commentStatus"
        ></div>

    </form>


    <div
        class="comment-list"
        id="commentList"
    ></div>

</section>


<section
    class="more-journal"
    id="moreJournal"
>

    <h2>
        More from the Journal
    </h2>

    <div
        class="more-journal-grid"
        id="moreJournalGrid"
    ></div>

</section>

</article>

</div>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const journalIndex =
    document.getElementById("journalIndex");

const reader =
    document.getElementById("reader");

const journalList =
    document.getElementById("journalList");

const journalSearch =
    document.getElementById("journalSearch");

const topicSection =
    document.getElementById("topicSection");

const topicList =
    document.getElementById("topicList");

const featuredSection =
    document.getElementById("featuredSection");

const featuredEntry =
    document.getElementById("featuredEntry");

const resultCount =
    document.getElementById("resultCount");

const readerBack =
    document.getElementById("readerBack");

const readerTitle =
    document.getElementById("readerTitle");

const readerKicker =
    document.getElementById("readerKicker");

const readerMeta =
    document.getElementById("readerMeta");

const readerImage =
    document.getElementById("readerImage");

const readerContent =
    document.getElementById("readerContent");

const readerNavigation =
    document.getElementById("readerNavigation");

const moreJournalGrid =
    document.getElementById("moreJournalGrid");

const commentForm =
    document.getElementById("commentForm");

const commentName =
    document.getElementById("commentName");

const commentContent =
    document.getElementById("commentContent");

const commentStatus =
    document.getElementById("commentStatus");

const commentList =
    document.getElementById("commentList");

const commentCount =
    document.getElementById("commentCount");

const readingProgress =
    document.getElementById("readingProgress");


let journalEntries = [];
let currentEntryId = null;


/* DATE */

function formatDate(dateString){

    if(!dateString){
        return "";
    }

    const date = new Date(dateString);

    return date.toLocaleDateString(
        "en-US",
        {
            month:"long",
            day:"numeric",
            year:"numeric"
        }
    );
}


/* READING TIME */

function calculateReadingTime(html){

    if(!html){
        return 1;
    }

    const temporary =
        document.createElement("div");

    temporary.innerHTML = html;

    const text =
        temporary.textContent ||
        temporary.innerText ||
        "";

    const words =
        text.trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;

    return Math.max(
        1,
        Math.ceil(words / 220)
    );
}


/* EXCERPT */

function createExcerpt(html){

    if(!html){
        return "";
    }

    const temporary =
        document.createElement("div");

    temporary.innerHTML = html;

    const text =
        (
            temporary.textContent ||
            temporary.innerText ||
            ""
        )
        .replace(/\s+/g," ")
        .trim();

    if(text.length <= 190){
        return text;
    }

    return text.slice(0,187) + "...";
}


/* TOPICS */

function getEntryTopics(entry){

    const raw =
        entry.topic ||
        entry.category ||
        entry.topics ||
        entry.tags;

    if(Array.isArray(raw)){

        return raw
            .map(String)
            .map(x => x.trim())
            .filter(Boolean);

    }

    if(typeof raw === "string"){

        return raw
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

    }

    return [];
}


function renderTopics(){

    const topics =
        [
            ...new Set(
                journalEntries.flatMap(
                    getEntryTopics
                )
            )
        ];

    topicList.innerHTML = "";

    if(!topics.length){

        topicSection.hidden = true;

        return;
    }

    topicSection.hidden = false;

    topics.forEach(function(topic){

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "topic-button";

        button.dataset.topic =
            topic;

        button.textContent =
            topic;

        topicList.appendChild(button);

    });

}


/* FEATURED */

function renderFeatured(entry){

    featuredEntry.innerHTML = "";

    if(!entry){

        featuredSection.style.display =
            "none";

        return;
    }

    featuredSection.style.display =
        "block";

    const link =
        document.createElement("a");

    link.href =
        "?id=" + encodeURIComponent(entry.id);

    link.className =
        "featured-entry";

    link.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            openReader(entry);

        }
    );


    const copy =
        document.createElement("div");

    copy.className =
        "featured-copy";


    const top =
        document.createElement("div");


    const label =
        document.createElement("div");

    label.className =
        "featured-label";

    label.textContent =
        "Latest journal";


    const title =
        document.createElement("h3");

    title.className =
        "featured-title";

    title.textContent =
        entry.title ||
        "Untitled";


    const excerpt =
        document.createElement("p");

    excerpt.className =
        "featured-excerpt";

    excerpt.textContent =
        createExcerpt(entry.content);


    top.append(
        label,
        title,
        excerpt
    );


    const meta =
        document.createElement("div");

    meta.className =
        "featured-meta";


    const date =
        document.createElement("span");

    date.textContent =
        formatDate(
            entry.published_at ||
            entry.created_at
        );


    const time =
        document.createElement("span");

    const minutes =
        calculateReadingTime(
            entry.content
        );

    time.textContent =
        minutes +
        " minute" +
        (minutes === 1 ? "" : "s") +
        " read";


    meta.append(
        date,
        time
    );


    copy.append(
        top,
        meta
    );


    const image =
        document.createElement("div");

    image.className =
        "featured-image";


    /*
       THIS IS THE IMPORTANT PART:

       The image saved by the Author page as
       entry.image_url is used here.

       If there is no image, the brown
       background remains as a fallback.
    */

    if(entry.image_url){

        const img =
            document.createElement("img");

        img.src =
            entry.image_url;

        img.alt =
            entry.title ||
            "Journal image";

        img.loading =
            "eager";

        image.appendChild(img);

    }


    link.append(
        copy,
        image
    );

    featuredEntry.appendChild(
        link
    );
}


/* FILTER */

function getFilteredEntries(){

    const query =
        journalSearch.value
            .trim()
            .toLowerCase();


    const activeTopic =
        topicList
            .querySelector(
                ".topic-button.active"
            )
            ?.dataset.topic ||
        "";


    return journalEntries.filter(
        function(entry){

            const title =
                String(
                    entry.title || ""
                ).toLowerCase();

            const content =
                String(
                    entry.content || ""
                ).toLowerCase();

            const topics =
                getEntryTopics(entry)
                    .join(" ")
                    .toLowerCase();

            const searchText =
                title +
                " " +
                content +
                " " +
                topics;


            const matchesSearch =
                !query ||
                searchText.includes(query);


            const matchesTopic =
                !activeTopic ||
                getEntryTopics(entry)
                    .some(
                        topic =>
                            topic.toLowerCase() ===
                            activeTopic.toLowerCase()
                    );


            return (
                matchesSearch &&
                matchesTopic
            );

        }
    );
}


/* RENDER JOURNAL */

function renderJournalIndex(){

    const entries =
        getFilteredEntries();

    journalList.innerHTML = "";


    resultCount.textContent =
        entries.length +
        (
            entries.length === 1
                ? " entry"
                : " entries"
        );


    if(!entries.length){

        const empty =
            document.createElement("div");

        empty.className =
            "empty-search";


        const heading =
            document.createElement("h3");

        heading.textContent =
            "Nothing found";


        const message =
            document.createElement("p");

        message.textContent =
            "Try another word or explore a different topic.";


        empty.append(
            heading,
            message
        );

        journalList.appendChild(
            empty
        );

        return;
    }


    entries.forEach(
        function(entry){

            const link =
                document.createElement("a");

            link.href =
                "?id=" +
                encodeURIComponent(
                    entry.id
                );

            link.className =
                "journal-preview";


            link.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    openReader(entry);

                }
            );


            const meta =
                document.createElement("div");

            meta.className =
                "preview-meta";


            const date =
                document.createElement("p");

            date.className =
                "preview-date";

            date.textContent =
                formatDate(
                    entry.published_at ||
                    entry.created_at
                );


            const number =
                document.createElement("span");

            number.className =
                "preview-number";

            number.textContent =
                String(
                    journalEntries.indexOf(entry) + 1
                ).padStart(
                    2,
                    "0"
                );


            meta.append(
                date,
                number
            );


            const body =
                document.createElement("div");


            const title =
                document.createElement("h3");

            title.className =
                "preview-title";

            title.textContent =
                entry.title ||
                "Untitled";


            const excerpt =
                document.createElement("p");

            excerpt.className =
                "preview-excerpt";

            excerpt.textContent =
                createExcerpt(
                    entry.content
                );


            body.append(
                title,
                excerpt
            );


            const topics =
                getEntryTopics(entry);

            if(topics.length){

                const topic =
                    document.createElement("span");

                topic.className =
                    "preview-topic";

                topic.textContent =
                    topics.join(" · ");

                body.appendChild(
                    topic
                );

            }


            const read =
                document.createElement("div");

            read.className =
                "preview-read";

            const minutes =
                calculateReadingTime(
                    entry.content
                );

            read.textContent =
                minutes +
                " min read";


            link.append(
                meta,
                body,
                read
            );

            journalList.appendChild(
                link
            );

        }
    );
}


/* READER NAVIGATION */

function renderReaderNavigation(index){

    readerNavigation.innerHTML = "";

    const newer =
        journalEntries[index - 1];

    if(!newer){
        return;
    }


    const link =
        document.createElement("a");

    link.href =
        "?id=" +
        encodeURIComponent(
            newer.id
        );


    link.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            openReader(newer);

        }
    );


    const label =
        document.createElement("small");

    label.textContent =
        "Newer entry";


    const title =
        document.createElement("strong");

    title.textContent =
        newer.title ||
        "Untitled";


    link.append(
        label,
        title
    );

    readerNavigation.appendChild(
        link
    );
}


/* MORE JOURNAL */

function renderMoreJournal(currentIndex){

    moreJournalGrid.innerHTML = "";


    const suggestions =
        journalEntries
            .filter(
                (_,index) =>
                    index !== currentIndex
            )
            .slice(0,4);


    suggestions.forEach(
        function(entry){

            const link =
                document.createElement("a");

            link.className =
                "more-journal-item";

            link.href =
                "?id=" +
                encodeURIComponent(
                    entry.id
                );


            link.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    openReader(entry);

                }
            );


            const date =
                document.createElement("small");

            date.textContent =
                formatDate(
                    entry.published_at ||
                    entry.created_at
                );


            const title =
                document.createElement("h3");

            title.textContent =
                entry.title ||
                "Untitled";


            link.append(
                date,
                title
            );

            moreJournalGrid.appendChild(
                link
            );

        }
    );
}


/* COMMENTS */

async function loadComments(entryId){

    commentList.innerHTML = "";

    commentCount.textContent =
        "0 comments";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("comments")
            .select(
                "id,name,content,created_at"
            )
            .eq(
                "target_type",
                "journal"
            )
            .eq(
                "target_id",
                entryId
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            "Could not load comments:",
            error
        );

        return;
    }


    const comments =
        data || [];


    commentCount.textContent =
        comments.length +
        (
            comments.length === 1
                ? " comment"
                : " comments"
        );


    comments.forEach(
        function(item){

            const comment =
                document.createElement("div");

            comment.className =
                "comment";


            const meta =
                document.createElement("div");

            meta.className =
                "comment-meta";


            const name =
                document.createElement("span");

            name.className =
                "comment-name";

            name.textContent =
                item.name ||
                "Anonymous";


            const date =
                document.createElement("span");

            date.className =
                "comment-date";

            date.textContent =
                formatDate(
                    item.created_at
                );


            meta.append(
                name,
                date
            );


            const content =
                document.createElement("p");

            content.className =
                "comment-content";

            content.textContent =
                item.content ||
                "";


            comment.append(
                meta,
                content
            );

            commentList.appendChild(
                comment
            );

        }
    );
}


/* OPEN READER */

function openReader(entry){

    const index =
        journalEntries.findIndex(
            item =>
                String(item.id) ===
                String(entry.id)
        );


    if(index === -1){
        return;
    }


    currentEntryId =
        entry.id;


    journalIndex.classList.add(
        "hidden"
    );

    reader.classList.add(
        "active"
    );


    readerTitle.textContent =
        entry.title ||
        "Untitled";


    const topics =
        getEntryTopics(entry);


    readerKicker.textContent =
        topics.length
            ? topics.join(" · ")
            : "Journal";


    readerMeta.innerHTML = "";


    const date =
        document.createElement("span");

    date.textContent =
        formatDate(
            entry.published_at ||
            entry.created_at
        );


    const time =
        document.createElement("span");

    const minutes =
        calculateReadingTime(
            entry.content
        );

    time.textContent =
        minutes +
        (
            minutes === 1
                ? " minute read"
                : " minutes read"
        );


    readerMeta.append(
        date,
        time
    );


    if(entry.image_url){

        readerImage.src =
            entry.image_url;

        readerImage.alt =
            entry.title ||
            "Journal image";

        readerImage.style.display =
            "block";

    }else{

        readerImage.removeAttribute(
            "src"
        );

        readerImage.style.display =
            "none";

    }


    readerContent.innerHTML =
        entry.content ||
        "";


    renderReaderNavigation(
        index
    );


    renderMoreJournal(
        index
    );


    loadComments(
        entry.id
    );


    history.replaceState(
        null,
        "",
        "?id=" +
        encodeURIComponent(
            entry.id
        )
    );


    window.scrollTo(
        0,
        0
    );
}


/* CLOSE READER */

readerBack.addEventListener(
    "click",
    function(){

        reader.classList.remove(
            "active"
        );

        journalIndex.classList.remove(
            "hidden"
        );

        history.replaceState(
            null,
            "",
            "journal.html"
        );

        window.scrollTo(
            0,
            0
        );

    }
);


/* URL */

function getRequestedId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");
}


/* LOAD JOURNAL */

async function loadJournal(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("journal_entries")
            .select("*")
            .not(
                "published_at",
                "is",
                null
            )
            .order(
                "published_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "Error loading journal:",
            error
        );

        journalList.innerHTML = "";

        const message =
            document.createElement("div");

        message.className =
            "journal-status";

        message.textContent =
            "Unable to load the journal.";

        journalList.appendChild(
            message
        );

        return;
    }


    journalEntries =
        data || [];


    renderTopics();


    renderFeatured(
        journalEntries[0]
    );


    const requestedId =
        getRequestedId();


    if(requestedId){

        const entry =
            journalEntries.find(
                item =>
                    String(item.id) ===
                    String(requestedId)
            );


        if(entry){

            openReader(entry);

            return;
        }
    }


    renderJournalIndex();
}


/* SEARCH */

journalSearch.addEventListener(
    "input",
    function(){

        renderJournalIndex();

    }
);


/* TOPIC FILTER */

topicList.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                ".topic-button"
            );

        if(!button){
            return;
        }


        topicList
            .querySelectorAll(
                ".topic-button"
            )
            .forEach(
                item =>
                    item.classList.remove(
                        "active"
                    )
            );


        button.classList.add(
            "active"
        );


        renderJournalIndex();

    }
);


/* READING PREFERENCES */

const fontDecrease =
    document.getElementById(
        "fontDecrease"
    );

const fontIncrease =
    document.getElementById(
        "fontIncrease"
    );

const fontSerif =
    document.getElementById(
        "fontSerif"
    );

const fontSans =
    document.getElementById(
        "fontSans"
    );


let savedFontSize =
    parseInt(
        localStorage.getItem(
            "maybloomsJournalFontSize"
        ),
        10
    );


if(Number.isNaN(savedFontSize)){
    savedFontSize = 19;
}


savedFontSize =
    Math.max(
        16,
        Math.min(
            24,
            savedFontSize
        )
    );


let savedFont =
    localStorage.getItem(
        "maybloomsJournalFont"
    ) ||
    "serif";


function updateReadingStyle(){

    readerContent.style.fontSize =
        savedFontSize +
        "px";


    if(savedFont === "sans"){

        readerContent.classList.add(
            "sans"
        );

        fontSans.classList.add(
            "active"
        );

        fontSerif.classList.remove(
            "active"
        );

    }else{

        readerContent.classList.remove(
            "sans"
        );

        fontSerif.classList.add(
            "active"
        );

        fontSans.classList.remove(
            "active"
        );

    }


    localStorage.setItem(
        "maybloomsJournalFontSize",
        savedFontSize
    );

    localStorage.setItem(
        "maybloomsJournalFont",
        savedFont
    );
}


fontDecrease.addEventListener(
    "click",
    function(){

        savedFontSize =
            Math.max(
                16,
                savedFontSize - 1
            );

        updateReadingStyle();

    }
);


fontIncrease.addEventListener(
    "click",
    function(){

        savedFontSize =
            Math.min(
                24,
                savedFontSize + 1
            );

        updateReadingStyle();

    }
);


fontSerif.addEventListener(
    "click",
    function(){

        savedFont =
            "serif";

        updateReadingStyle();

    }
);


fontSans.addEventListener(
    "click",
    function(){

        savedFont =
            "sans";

        updateReadingStyle();

    }
);


/* READING PROGRESS */

window.addEventListener(
    "scroll",
    function(){

        if(
            !reader.classList.contains(
                "active"
            )
        ){

            readingProgress.style.width =
                "0%";

            return;
        }


        const scrollTop =
            window.scrollY ||
            document.documentElement.scrollTop;


        const documentHeight =
            document.documentElement.scrollHeight -
            window.innerHeight;


        if(documentHeight <= 0){

            readingProgress.style.width =
                "100%";

            return;
        }


        const progress =
            Math.min(
                100,
                Math.max(
                    0,
                    (
                        scrollTop /
                        documentHeight
                    ) *
                    100
                )
            );


        readingProgress.style.width =
            progress +
            "%";

    }
);


/* START */

updateReadingStyle();

loadJournal();

</script>
