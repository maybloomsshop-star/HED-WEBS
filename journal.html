<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Journals · May Blooms</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f3efe9;
            color: #29221e;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .journal-page {
            min-height: 100vh;
            background: #f3efe9;
        }

        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: #5f4a3f;
            z-index: 9999;
        }

        .journal-header {
            width: 100%;
            padding: 25px 5vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(73, 59, 51, 0.14);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.035em;
        }

        .brand-subtitle {
            font-size: 8px;
            letter-spacing: 0.18em;
            color: #8c7b70;
            text-transform: uppercase;
        }

        .back-link {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #75645a;
            text-transform: uppercase;
        }

        .back-link:hover {
            color: #29221e;
        }

        .journal-index {
            width: 100%;
        }

        .journal-intro {
            width: min(calc(100% - 10vw), 920px);
            margin: 0 auto;
            padding: 105px 0 88px;
        }

        .journal-kicker {
            margin: 0 0 20px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.20em;
            color: #8d7a6e;
            text-transform: uppercase;
        }

        .journal-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(58px, 9vw, 105px);
            line-height: 0.88;
            font-weight: 400;
            letter-spacing: -0.045em;
        }

        .journal-description {
            max-width: 540px;
            margin: 31px 0 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            line-height: 1.75;
            color: #776960;
        }

        .journal-mark {
            width: 46px;
            height: 1px;
            margin-top: 45px;
            background: #907c70;
        }

        .journal-list {
            width: min(calc(100% - 10vw), 920px);
            margin: 0 auto 120px;
        }

        .journal-preview {
            display: grid;
            grid-template-columns: 145px minmax(0, 1fr);
            gap: 45px;
            width: 100%;
            padding: 43px 0 48px;
            border-top: 1px solid rgba(73, 59, 51, 0.17);
            transition: padding 0.2s ease;
        }

        .journal-preview:last-child {
            border-bottom: 1px solid rgba(73, 59, 51, 0.17);
        }

        .journal-preview:hover {
            padding-left: 10px;
            padding-right: 10px;
        }

        .preview-meta {
            padding-top: 5px;
        }

        .preview-date {
            margin: 0;
            font-size: 8px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.15em;
            color: #927f73;
            text-transform: uppercase;
        }

        .preview-number {
            display: block;
            margin-top: 14px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 13px;
            color: #a6968b;
        }

        .preview-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(28px, 4vw, 43px);
            line-height: 1.10;
            font-weight: 400;
            letter-spacing: -0.025em;
        }

        .preview-excerpt {
            max-width: 670px;
            margin: 17px 0 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            line-height: 1.8;
            color: #756961;
        }

        .preview-read {
            display: inline-block;
            margin-top: 22px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #78665b;
            text-transform: uppercase;
        }

        .journal-status {
            padding: 45px 0;
            border-top: 1px solid rgba(73, 59, 51, 0.17);
            border-bottom: 1px solid rgba(73, 59, 51, 0.17);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;
            line-height: 1.7;
            color: #8c7d74;
        }

        .reader {
            display: none;
        }

        .reader.active {
            display: block;
        }

        .reader-shell {
            width: min(calc(100% - 10vw), 920px);
            margin: 0 auto;
            padding: 75px 0 100px;
        }

        .reader-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 80px;
        }

        .reader-back {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #847269;
            text-transform: uppercase;
        }

        .reader-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.10em;
            color: #9b897d;
            text-transform: uppercase;
        }

        .reader-header {
            max-width: 850px;
            margin-bottom: 45px;
        }

        .reader-date {
            margin: 0 0 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #907d71;
            text-transform: uppercase;
        }

        .reader-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(45px, 7vw, 82px);
            line-height: 1.02;
            font-weight: 400;
            letter-spacing: -0.042em;
        }

        .reader-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            font-size: 14px;
            color: #756961;
        }

        .reader-rule {
            width: 38px;
            height: 1px;
            margin-top: 30px;
            background: #917d70;
        }

        .reader-image {
            display: block;
            width: 100%;
            max-height: 610px;
            margin: 0 0 60px;
            object-fit: cover;
        }

        .reader-content {
            max-width: 780px;
            margin: 0 auto;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 19px;
            line-height: 1.95;
            color: #342a25;
        }

        .reader-content.sans {
            font-family: Arial, Helvetica, sans-serif;
        }

        .reader-content p {
            margin: 0 0 1.6em;
        }

        .reader-content h1,
        .reader-content h2,
        .reader-content h3 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 400;
            line-height: 1.2;
        }

        .reader-content img {
            max-width: 100%;
            height: auto;
        }

        .reader-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            margin: 0 0 55px;
        }

        .reader-control {
            min-width: 35px;
            height: 35px;
            border: 1px solid rgba(73, 59, 51, 0.18);
            background: transparent;
            color: #75645a;
            cursor: pointer;
        }

        .reader-control:hover,
        .reader-control.active {
            background: #e7dfd7;
        }

        .more-journal {
            margin-top: 100px;
            padding-top: 45px;
            border-top: 1px solid rgba(73, 59, 51, 0.17);
        }

        .more-journal-title {
            margin: 0 0 30px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: 400;
        }

        .more-journal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .more-journal-card {
            padding: 25px;
            border: 1px solid rgba(73, 59, 51, 0.15);
            background: rgba(255,255,255,0.18);
        }

        .more-journal-card:hover {
            background: #ebe4dd;
        }

        .more-journal-card-date {
            margin-bottom: 10px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #927f73;
            text-transform: uppercase;
        }

        .more-journal-card-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 23px;
            line-height: 1.2;
        }

        .comments {
            margin-top: 110px;
            padding-top: 50px;
            border-top: 1px solid rgba(73, 59, 51, 0.17);
        }

        .comments-title {
            margin: 0 0 35px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            font-weight: 400;
        }

        .comment-form {
            display: grid;
            gap: 13px;
            margin-bottom: 45px;
        }

        .comment-input,
        .comment-textarea {
            width: 100%;
            border: 1px solid rgba(73, 59, 51, 0.20);
            border-radius: 0;
            padding: 14px 15px;
            outline: none;
            background: rgba(255,255,255,0.35);
            color: #29221e;
        }

        .comment-input:focus,
        .comment-textarea:focus {
            border-color: #8f7b70;
        }

        .comment-textarea {
            min-height: 130px;
            resize: vertical;
        }

        .comment-submit {
            width: fit-content;
            padding: 13px 22px;
            border: 1px solid #5f4a3f;
            background: #5f4a3f;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .comment-submit:hover {
            opacity: 0.88;
        }

        .comment-status {
            min-height: 20px;
            font-size: 13px;
            color: #8a786e;
        }

        .comment-list {
            display: grid;
            gap: 25px;
        }

        .comment-item {
            padding: 25px 0;
            border-top: 1px solid rgba(73, 59, 51, 0.13);
        }

        .comment-author {
            margin-bottom: 7px;
            font-weight: 700;
            font-size: 14px;
        }

        .comment-date {
            margin-bottom: 13px;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: #a08f84;
        }

        .comment-body {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            line-height: 1.7;
            color: #5f534c;
            white-space: pre-wrap;
        }

        @media (max-width: 700px) {

            .journal-header {
                padding: 20px 5vw;
            }

            .journal-intro {
                padding: 75px 0 60px;
            }

            .journal-list {
                margin-bottom: 75px;
            }

            .journal-preview {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 30px 0 35px;
            }

            .preview-meta {
                padding-top: 0;
            }

            .preview-number {
                display: none;
            }

            .reader-shell {
                padding: 45px 0 75px;
            }

            .reader-top {
                margin-bottom: 55px;
            }

            .reader-image {
                margin-bottom: 40px;
            }

            .more-journal-grid {
                grid-template-columns: 1fr;
            }

            .comments {
                margin-top: 75px;
            }
        }

    </style>

</head>

<body>

    <div class="journal-page">

        <div
            id="readingProgress"
            class="reading-progress"
        ></div>

        <header class="journal-header">

            <a
                href="index.html"
                class="brand"
            >
                <span class="brand-name">
                    May Blooms
                </span>

                <span class="brand-subtitle">
                    A quiet corner of the internet
                </span>
            </a>

            <a
                href="index.html"
                class="back-link"
            >
                Home
            </a>

        </header>


        <main>

            <section
                id="journalIndex"
                class="journal-index"
            >

                <div class="journal-intro">

                    <p class="journal-kicker">
                        Personal writings
                    </p>

                    <h1 class="journal-title">
                        Journals
                    </h1>

                    <p class="journal-description">
                        Small thoughts, quiet observations,
                        and pieces of life worth keeping.
                    </p>

                    <div class="journal-mark"></div>

                </div>


                <div
                    id="journalList"
                    class="journal-list"
                >

                    <div class="journal-status">
                        Loading journals...
                    </div>

                </div>

            </section>


            <section
                id="reader"
                class="reader"
            >

                <div class="reader-shell">

                    <div class="reader-top">

                        <a
                            href="journal.html"
                            id="readerBack"
                            class="reader-back"
                        >
                            ← All journals
                        </a>

                        <div
                            id="readerLabel"
                            class="reader-label"
                        >
                            Journal
                        </div>

                    </div>


                    <header class="reader-header">

                        <p
                            id="readerDate"
                            class="reader-date"
                        ></p>

                        <h1
                            id="readerTitle"
                            class="reader-title"
                        ></h1>

                        <div class="reader-meta">

                            <span>
                                Written by
                            </span>

                            <span
                                id="readerNickname"
                            ></span>

                        </div>

                        <div class="reader-rule"></div>

                    </header>


                    <img
                        id="readerImage"
                        class="reader-image"
                        alt=""
                    >


                    <div class="reader-controls">

                        <button
                            id="fontDecrease"
                            class="reader-control"
                            type="button"
                            aria-label="Decrease text size"
                        >
                            A-
                        </button>

                        <button
                            id="fontIncrease"
                            class="reader-control"
                            type="button"
                            aria-label="Increase text size"
                        >
                            A+
                        </button>

                        <button
                            id="fontSerif"
                            class="reader-control active"
                            type="button"
                        >
                            Serif
                        </button>

                        <button
                            id="fontSans"
                            class="reader-control"
                            type="button"
                        >
                            Sans
                        </button>

                    </div>


                    <article
                        id="readerContent"
                        class="reader-content"
                    ></article>


                    <section
                        id="moreJournal"
                        class="more-journal"
                    ></section>


                    <section class="comments">

                        <h2 class="comments-title">
                            Comments
                        </h2>

                        <form
                            id="commentForm"
                            class="comment-form"
                        >

                            <input
                                id="commentName"
                                class="comment-input"
                                type="text"
                                placeholder="Your name"
                                autocomplete="name"
                                required
                            >

                            <textarea
                                id="commentContent"
                                class="comment-textarea"
                                placeholder="Write a comment..."
                                required
                            ></textarea>

                            <button
                                class="comment-submit"
                                type="submit"
                            >
                                Post comment
                            </button>

                            <div
                                id="commentStatus"
                                class="comment-status"
                                aria-live="polite"
                            ></div>

                        </form>


                        <div
                            id="commentList"
                            class="comment-list"
                        ></div>

                    </section>

                </div>

            </section>

        </main>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://YOUR-PROJECT.supabase.co";

        const SUPABASE_ANON_KEY =
            "YOUR-ANON-KEY";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        const journalIndex =
            document.getElementById(
                "journalIndex"
            );

        const journalList =
            document.getElementById(
                "journalList"
            );

        const reader =
            document.getElementById(
                "reader"
            );

        const readerDate =
            document.getElementById(
                "readerDate"
            );

        const readerTitle =
            document.getElementById(
                "readerTitle"
            );

        const readerNickname =
            document.getElementById(
                "readerNickname"
            );

        const readerImage =
            document.getElementById(
                "readerImage"
            );

        const readerContent =
            document.getElementById(
                "readerContent"
            );

        const readerLabel =
            document.getElementById(
                "readerLabel"
            );

        const readerBack =
            document.getElementById(
                "readerBack"
            );

        const moreJournal =
            document.getElementById(
                "moreJournal"
            );

        const commentForm =
            document.getElementById(
                "commentForm"
            );

        const commentName =
            document.getElementById(
                "commentName"
            );

        const commentContent =
            document.getElementById(
                "commentContent"
            );

        const commentStatus =
            document.getElementById(
                "commentStatus"
            );

        const commentList =
            document.getElementById(
                "commentList"
            );

        const readingProgress =
            document.getElementById(
                "readingProgress"
            );


        let journalEntries = [];

        let currentEntryId = null;


        /* =========================================================
           LOAD LOGGED-IN PROFILE NAME
           ========================================================= */

        async function prefillCommentName() {

            if (!commentName) {
                return;
            }

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.getUser();


                if (error) {

                    console.warn(
                        "Could not load the signed-in profile:",
                        error
                    );

                    return;
                }


                const user =
                    data?.user;


                const nickname =
                    String(
                        user?.user_metadata?.nickname ||
                        user?.user_metadata?.display_name ||
                        user?.user_metadata?.name ||
                        ""
                    ).trim();


                if (nickname) {

                    commentName.value =
                        nickname;

                    commentName.dataset.profileName =
                        nickname;

                }

            } catch (error) {

                console.warn(
                    "Could not load the signed-in profile name:",
                    error
                );

            }

        }


        /* =========================================================
           FORMAT DATE
           ========================================================= */

        function formatDate(
            value
        ) {

            if (!value) {
                return "";
            }

            const date =
                new Date(
                    value
                );

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return value;
            }

            return date.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );

        }


        /* =========================================================
           READING TIME
           ========================================================= */

        function calculateReadingTime(
            content
        ) {

            const text =
                String(
                    content || ""
                )
                    .replace(
                        /<[^>]*>/g,
                        " "
                    )
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .trim();


            const words =
                text
                    ? text.split(" ").length
                    : 0;


            const minutes =
                Math.max(
                    1,
                    Math.ceil(
                        words / 200
                    )
                );


            return (
                minutes === 1
                    ? "1 minute read"
                    : minutes + " minutes read"
            );

        }


        /* =========================================================
           RENDER JOURNAL INDEX
           ========================================================= */

        function renderJournalIndex() {

            journalList.innerHTML =
                "";


            if (
                !journalEntries.length
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "journal-status";

                empty.textContent =
                    "No journal entries yet.";

                journalList.appendChild(
                    empty
                );

                return;
            }


            journalEntries.forEach(
                function(
                    entry,
                    index
                ) {

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        "journal.html?id=" +
                        encodeURIComponent(
                            entry.id
                        );


                    link.className =
                        "journal-preview";


                    const meta =
                        document.createElement(
                            "div"
                        );

                    meta.className =
                        "preview-meta";


                    const date =
                        document.createElement(
                            "p"
                        );

                    date.className =
                        "preview-date";

                    date.textContent =
                        formatDate(
                            entry.published_at
                        );


                    const number =
                        document.createElement(
                            "span"
                        );

                    number.className =
                        "preview-number";

                    number.textContent =
                        String(
                            index + 1
                        ).padStart(
                            2,
                            "0"
                        );


                    meta.appendChild(
                        date
                    );

                    meta.appendChild(
                        number
                    );


                    const body =
                        document.createElement(
                            "div"
                        );


                    const title =
                        document.createElement(
                            "h2"
                        );

                    title.className =
                        "preview-title";

                    title.textContent =
                        entry.title ||
                        "Untitled";


                    const excerpt =
                        document.createElement(
                            "p"
                        );

                    excerpt.className =
                        "preview-excerpt";


                    const cleanContent =
                        String(
                            entry.content || ""
                        )
                            .replace(
                                /<[^>]*>/g,
                                " "
                            )
                            .replace(
                                /\s+/g,
                                " "
                            )
                            .trim();


                    excerpt.textContent =
                        cleanContent.length >
                        180
                            ? cleanContent.slice(
                                0,
                                180
                            ) + "…"
                            : cleanContent;


                    const read =
                        document.createElement(
                            "span"
                        );

                    read.className =
                        "preview-read";

                    read.textContent =
                        "Read journal →";


                    body.appendChild(
                        title
                    );

                    body.appendChild(
                        excerpt
                    );

                    body.appendChild(
                        read
                    );


                    link.appendChild(
                        meta
                    );

                    link.appendChild(
                        body
                    );


                    journalList.appendChild(
                        link
                    );

                }
            );

        }


        /* =========================================================
           COMMENTS
           ========================================================= */

        async function loadComments(
            entryId
        ) {

            commentList.innerHTML =
                "";


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("comments")
                    .select("*")
                    .eq(
                        "target_type",
                        "journal"
                    )
                    .eq(
                        "target_id",
                        entryId
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.error(
                    "Could not load comments:",
                    error
                );

                commentStatus.textContent =
                    "Could not load comments.";

                return;
            }


            commentStatus.textContent =
                "";


            if (
                !data ||
                !data.length
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "comment-item";

                empty.textContent =
                    "No comments yet.";

                commentList.appendChild(
                    empty
                );

                return;
            }


            data.forEach(
                function(
                    comment
                ) {

                    const item =
                        document.createElement(
                            "article"
                        );

                    item.className =
                        "comment-item";


                    const author =
                        document.createElement(
                            "div"
                        );

                    author.className =
                        "comment-author";

                    author.textContent =
                        comment.name ||
                        "Anonymous";


                    const date =
                        document.createElement(
                            "div"
                        );

                    date.className =
                        "comment-date";

                    date.textContent =
                        comment.created_at
                            ? formatDate(
                                comment.created_at
                            )
                            : "";


                    const body =
                        document.createElement(
                            "div"
                        );

                    body.className =
                        "comment-body";

                    body.textContent =
                        comment.content ||
                        "";


                    item.appendChild(
                        author
                    );

                    item.appendChild(
                        date
                    );

                    item.appendChild(
                        body
                    );


                    commentList.appendChild(
                        item
                    );

                }
            );

        }


        /* =========================================================
           MORE JOURNAL
           ========================================================= */

        function renderMoreJournal(
            currentIndex
        ) {

            moreJournal.innerHTML =
                "";


            const others =
                journalEntries.filter(
                    function(
                        item
                    ) {

                        return String(
                            item.id
                        ) !==
                        String(
                            journalEntries[
                                currentIndex
                            ]?.id
                        );

                    }
                ).slice(
                    0,
                    4
                );


            if (!others.length) {
                return;
            }


            const heading =
                document.createElement(
                    "h2"
                );

            heading.className =
                "more-journal-title";

            heading.textContent =
                "More journals";


            const grid =
                document.createElement(
                    "div"
                );

            grid.className =
                "more-journal-grid";


            others.forEach(
                function(
                    entry
                ) {

                    const link =
                        document.createElement(
                            "a"
                        );

                    link.className =
                        "more-journal-card";

                    link.href =
                        "journal.html?id=" +
                        encodeURIComponent(
                            entry.id
                        );


                    const date =
                        document.createElement(
                            "div"
                        );

                    date.className =
                        "more-journal-card-date";

                    date.textContent =
                        formatDate(
                            entry.published_at
                        );


                    const title =
                        document.createElement(
                            "div"
                        );

                    title.className =
                        "more-journal-card-title";

                    title.textContent =
                        entry.title ||
                        "Untitled";


                    link.appendChild(
                        date
                    );

                    link.appendChild(
                        title
                    );


                    grid.appendChild(
                        link
                    );

                }
            );


            moreJournal.appendChild(
                heading
            );

            moreJournal.appendChild(
                grid
            );

        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        function renderReaderNavigation(
            index
        ) {

            readerLabel.textContent =
                "Journal " +
                String(
                    index + 1
                ).padStart(
                    2,
                    "0"
                );

        }


        /* =========================================================
           OPEN READER
           ========================================================= */

        function openReader(
            entry
        ) {

            const index =
                journalEntries.findIndex(
                    function(
                        item
                    ) {

                        return String(
                            item.id
                        ) ===
                        String(
                            entry.id
                        );

                    }
                );


            currentEntryId =
                entry.id;


            journalIndex.style.display =
                "none";

            reader.classList.add(
                "active"
            );


            readerDate.textContent =
                formatDate(
                    entry.published_at
                );


            readerTitle.textContent =
                entry.title ||
                "Untitled";


            readerNickname.textContent =
                window.readerNickname ||
                "May Blooms";


            readerLabel.textContent =
                calculateReadingTime(
                    entry.content
                );


            if (entry.image_url) {

                readerImage.src =
                    entry.image_url;

                readerImage.alt =
                    entry.title ||
                    "Journal image";

                readerImage.style.display =
                    "block";

            } else {

                readerImage.removeAttribute(
                    "src"
                );

                readerImage.style.display =
                    "none";
            }


            readerContent.innerHTML =
                entry.content ||
                "";


            renderReaderNavigation(
                index
            );


            renderMoreJournal(
                index
            );


            loadComments(
                entry.id
            );


            window.scrollTo(
                0,
                0
            );

        }


        /* =========================================================
           URL
           ========================================================= */

        function getRequestedId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get(
                "id"
            );

        }


        /* =========================================================
           LOAD JOURNAL
           ========================================================= */

        async function loadJournal() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("journal_entries")
                    .select("*")
                    .order(
                        "published_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "Error loading journal:",
                    error
                );

                journalList.innerHTML =
                    "";


                const message =
                    document.createElement(
                        "div"
                    );

                message.className =
                    "journal-status";

                message.textContent =
                    "Unable to load the journal.";


                journalList.appendChild(
                    message
                );

                return;
            }


            journalEntries =
                data || [];


            const requestedId =
                getRequestedId();


            if (requestedId) {

                const entry =
                    journalEntries.find(
                        function(
                            item
                        ) {

                            return String(
                                item.id
                            ) ===
                            String(
                                requestedId
                            );

                        }
                    );


                if (entry) {

                    openReader(
                        entry
                    );

                    return;
                }

            }


            renderJournalIndex();

        }


        /* =========================================================
           BACK TO JOURNAL
           ========================================================= */

        readerBack.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                window.location.href =
                    "journal.html";

            }
        );


        /* =========================================================
           COMMENTS SUBMIT
           ========================================================= */

        commentForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (!currentEntryId) {
                    return;
                }


                const profileName =
                    String(
                        commentName.dataset.profileName ||
                        ""
                    ).trim();


                const name =
                    profileName ||
                    commentName.value.trim();


                const content =
                    commentContent.value.trim();


                if (
                    !name ||
                    !content
                ) {
                    return;
                }


                commentStatus.textContent =
                    "Posting...";


                const {
                    error
                } =
                    await supabaseClient
                        .from("comments")
                        .insert({

                            target_type:
                                "journal",

                            target_id:
                                currentEntryId,

                            name,

                            content

                        });


                if (error) {

                    console.error(
                        "Could not post comment:",
                        error
                    );

                    commentStatus.textContent =
                        "Could not post comment.";

                    return;
                }


                if (
                    commentName.dataset.profileName
                ) {

                    commentName.value =
                        commentName.dataset.profileName;

                } else {

                    commentName.value =
                        "";

                }


                commentContent.value =
                    "";


                commentStatus.textContent =
                    "Comment posted.";


                await loadComments(
                    currentEntryId
                );

            }
        );


        /* =========================================================
           READING PREFERENCES
           ========================================================= */

        const fontDecrease =
            document.getElementById(
                "fontDecrease"
            );

        const fontIncrease =
            document.getElementById(
                "fontIncrease"
            );

        const fontSerif =
            document.getElementById(
                "fontSerif"
            );

        const fontSans =
            document.getElementById(
                "fontSans"
            );


        let savedFontSize =
            parseInt(
                localStorage.getItem(
                    "maybloomsJournalFontSize"
                ),
                10
            );


        if (
            Number.isNaN(
                savedFontSize
            )
        ) {

            savedFontSize =
                19;

        }


        savedFontSize =
            Math.max(
                16,
                Math.min(
                    24,
                    savedFontSize
                )
            );


        let savedFont =
            localStorage.getItem(
                "maybloomsJournalFont"
            ) ||
            "serif";


        function updateReadingStyle() {

            readerContent.style.fontSize =
                savedFontSize +
                "px";


            if (
                savedFont ===
                "sans"
            ) {

                readerContent.classList.add(
                    "sans"
                );

                fontSans.classList.add(
                    "active"
                );

                fontSerif.classList.remove(
                    "active"
                );

            } else {

                readerContent.classList.remove(
                    "sans"
                );

                fontSerif.classList.add(
                    "active"
                );

                fontSans.classList.remove(
                    "active"
                );

            }


            localStorage.setItem(
                "maybloomsJournalFontSize",
                savedFontSize
            );


            localStorage.setItem(
                "maybloomsJournalFont",
                savedFont
            );

        }


        fontDecrease.addEventListener(
            "click",
            function() {

                savedFontSize =
                    Math.max(
                        16,
                        savedFontSize - 1
                    );

                updateReadingStyle();

            }
        );


        fontIncrease.addEventListener(
            "click",
            function() {

                savedFontSize =
                    Math.min(
                        24,
                        savedFontSize + 1
                    );

                updateReadingStyle();

            }
        );


        fontSerif.addEventListener(
            "click",
            function() {

                savedFont =
                    "serif";

                updateReadingStyle();

            }
        );


        fontSans.addEventListener(
            "click",
            function() {

                savedFont =
                    "sans";

                updateReadingStyle();

            }
        );


        /* =========================================================
           READING PROGRESS
           ========================================================= */

        window.addEventListener(
            "scroll",
            function() {

                if (
                    !reader.classList.contains(
                        "active"
                    )
                ) {

                    readingProgress.style.width =
                        "0%";

                    return;

                }


                const scrollTop =
                    window.scrollY ||
                    document.documentElement.scrollTop;


                const documentHeight =
                    document.documentElement.scrollHeight -
                    window.innerHeight;


                if (
                    documentHeight <= 0
                ) {

                    readingProgress.style.width =
                        "100%";

                    return;

                }


                const progress =
                    Math.min(
                        100,
                        Math.max(
                            0,
                            (
                                scrollTop /
                                documentHeight
                            ) *
                            100
                        )
                    );


                readingProgress.style.width =
                    progress +
                    "%";

            }
        );


        /* =========================================================
           START
           ========================================================= */

        updateReadingStyle();


        window.readerAuthReady.then(
            async function() {

                const nicknameElement =
                    document.getElementById(
                        "readerNickname"
                    );


                if (
                    nicknameElement &&
                    window.readerNickname
                ) {

                    nicknameElement.textContent =
                        window.readerNickname;

                }


                await prefillCommentName();


                loadJournal();

            }
        );

    </script>

</body>

</html>
